<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Francis CMS · The Francis Smokehouse</title>
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#090704;--deep:#120d07;--surface:#1a1108;--card:#22160a;--raised:#2b1c0e;
  --border:rgba(196,160,112,.11);
  --border2:rgba(196,160,112,.22);
  --ember:#c04800;--fire:#e06010;--flame:#f08820;--glow:#f5a830;
  --cream:#f5e8cc;--parch:#e8d4a8;--sand:#c4a070;--mid:#7a5830;--lo:#8a6840;
  --text:var(--cream);
  --text2:rgba(196,160,112,.72);
  --text3:rgba(196,160,112,.44);
  --ember-bg:rgba(192,72,0,.14);
  --flame-bg:rgba(240,136,32,.08);
  --danger:#ff6a3a;
  --success:#9ad060;
  --blue:#6a9fd0;
  --serif:'Playfair Display',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --rd:10px;--rd-sm:7px;--rd-xs:4px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.2);
  --shadow-md:0 6px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --shadow-flame:0 0 0 2px rgba(240,136,32,.2), 0 6px 20px rgba(192,72,0,.25);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--body);font-weight:400;-webkit-tap-highlight-color:transparent;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.025'/%3E%3C/svg%3E");}

/* ══════════════════════════════════
   TOAST
══════════════════════════════════ */
#toastBox{position:fixed;top:16px;right:16px;z-index:100000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{pointer-events:auto;padding:11px 18px;border-radius:var(--rd-sm);font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:tIn .3s ease, tOut .4s 2.6s ease forwards;box-shadow:var(--shadow-md);max-width:340px;}
.toast.ok{background:rgba(30,60,40,.92);border:1px solid rgba(154,208,96,.22);color:var(--success);}
.toast.err{background:rgba(60,20,10,.92);border:1px solid rgba(255,106,58,.25);color:var(--danger);}
.toast.info{background:rgba(30,20,10,.92);border:1px solid var(--border2);color:var(--cream);}
@keyframes tIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{to{opacity:0;transform:translateX(40px)}}

/* ══════════════════════════════════
   PIN
══════════════════════════════════ */
#pin-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,#1e1510,#0a0806 50%,#050404);transition:opacity .4s;}
#pin-screen.gone{opacity:0;pointer-events:none;}
.pin-box{max-width:420px;width:100%;text-align:center;}
.pin-brand{font-family:var(--serif);font-weight:700;font-size:clamp(22px,3vw,30px);color:var(--cream);margin-bottom:4px;letter-spacing:.01em;}
.pin-brand em{font-style:italic;color:var(--flame);font-weight:400;}
.pin-sub{font-family:var(--cond);font-weight:500;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(196,160,112,.38);margin-bottom:44px;}
.pin-title{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;color:var(--cream);line-height:1;margin-bottom:14px;}
.pin-title em{font-style:italic;font-weight:400;color:var(--flame);}
.pin-instruction{font-family:var(--body);font-weight:300;font-size:14px;color:rgba(196,160,112,.55);margin-bottom:32px;line-height:1.6;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(196,160,112,.3);transition:all .2s;}
.pin-dot.filled{background:var(--flame);border-color:var(--flame);box-shadow:0 0 12px rgba(240,136,32,.5);}
.pin-dot.error{background:var(--ember);border-color:var(--ember);animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;}
.pin-btn{aspect-ratio:1.2;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--cream);background:rgba(22,14,6,.75);border:1px solid rgba(196,160,112,.15);border-radius:8px;cursor:pointer;transition:all .2s;}
.pin-btn:hover,.pin-btn:active{border-color:rgba(240,136,32,.4);background:rgba(192,72,0,.12);color:var(--flame);transform:scale(1.03);}
.pin-btn.del{font-size:20px;color:rgba(196,160,112,.6);}
.pin-btn.submit{background:linear-gradient(135deg,var(--ember),var(--fire));border-color:var(--fire);color:#fff;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.15em;}
.pin-msg{font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-top:18px;height:16px;opacity:0;transition:opacity .25s;}
.pin-msg.show{opacity:1;}

/* ══════════════════════════════════
   APP SHELL
══════════════════════════════════ */
#app{display:none;position:fixed;inset:0;z-index:5;background:var(--void);flex-direction:column;}
#app.on{display:flex;}

/* ── TOP BAR ── */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(9,7,4,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20;position:relative;min-height:56px;}
.tb-brand{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--cream);white-space:nowrap;}
.tb-brand em{font-style:italic;color:var(--flame);font-weight:400;}
.tb-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;}

/* PAGE SWITCHER DROPDOWN */
.page-switcher{position:relative;flex-shrink:0;}
.ps-trigger{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:var(--rd-sm);border:1px solid var(--border2);background:var(--card);color:var(--cream);font-family:var(--body);font-weight:500;font-size:14px;cursor:pointer;transition:all .18s;}
.ps-trigger:hover{background:var(--raised);border-color:rgba(240,136,32,.4);}
.ps-trigger.open{background:var(--raised);border-color:var(--flame);}
.ps-icon{font-size:16px;filter:drop-shadow(0 0 4px rgba(240,136,32,.3));}
.ps-name{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
.ps-chev{font-size:9px;color:var(--text3);transition:transform .2s;margin-left:2px;}
.ps-trigger.open .ps-chev{transform:rotate(180deg);color:var(--flame);}

.ps-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--card);border:1px solid var(--border2);border-radius:var(--rd);box-shadow:var(--shadow-lg);overflow:hidden;z-index:40;opacity:0;pointer-events:none;transform:translateY(-4px);transition:all .18s;}
.ps-menu.show{opacity:1;pointer-events:all;transform:translateY(0);}
.ps-menu-inner{padding:6px;max-height:72vh;overflow-y:auto;}
.ps-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rd-xs);cursor:pointer;transition:background .12s;color:var(--text2);}
.ps-item:hover{background:rgba(255,255,255,.04);color:var(--cream);}
.ps-item.active{background:var(--ember-bg);color:var(--flame);}
.ps-item-icon{font-size:15px;flex-shrink:0;}
.ps-item-name{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;flex:1;}
.ps-item-count{font-size:10px;font-weight:600;color:var(--text3);font-family:var(--cond);letter-spacing:.08em;padding:2px 8px;border-radius:100px;background:rgba(0,0,0,.3);}
.ps-item.active .ps-item-count{background:rgba(240,136,32,.2);color:var(--flame);}

.tb-spacer{flex:1;}

.tb-save{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tb-save .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.tb-save.saving{color:var(--flame);}
.tb-save.saving .dot{animation:pulse 1s ease-in-out infinite;}
.tb-save.saved{color:var(--success);}
.tb-save.err{color:var(--danger);}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

.tb-kbd{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:var(--rd-xs);background:rgba(0,0,0,.35);border:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text3);font-weight:500;}

.tb-btn{padding:7px 12px;border-radius:var(--rd-sm);border:1px solid var(--border2);background:rgba(22,14,6,.65);color:var(--text2);font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .16s;display:inline-flex;align-items:center;gap:6px;}
.tb-btn:hover{background:rgba(192,72,0,.1);border-color:rgba(240,136,32,.4);color:var(--flame);}
.tb-btn.lock:hover{border-color:rgba(255,106,58,.4);color:var(--danger);}
.tb-btn.primary{background:linear-gradient(135deg,var(--ember),var(--fire));border:none;color:#fff;font-weight:800;box-shadow:0 3px 12px rgba(192,72,0,.3);}
.tb-btn.primary:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(192,72,0,.45);}

.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--lo);flex-shrink:0;}
.conn-dot.ok{background:var(--success);box-shadow:0 0 8px var(--success);}
.conn-dot.err{background:var(--danger);}

/* ══════════════════════════════════
   CANVAS (scrolling preview)
══════════════════════════════════ */
.canvas{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;}
.canvas::-webkit-scrollbar{width:10px;}
.canvas::-webkit-scrollbar-thumb{background:rgba(196,160,112,.13);border-radius:5px;}
.canvas::-webkit-scrollbar-thumb:hover{background:rgba(196,160,112,.22);}
.canvas::-webkit-scrollbar-track{background:transparent;}

.canvas-inner{max-width:960px;margin:0 auto;padding:clamp(24px,3vw,40px) clamp(16px,3vw,36px) 140px;}

/* PAGE HEADER */
.pg-head{margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--border);}
.pg-eyebrow{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--flame);opacity:.85;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.pg-eyebrow::before{content:'';width:16px;height:1px;background:currentColor;}
.pg-title{font-family:var(--serif);font-weight:900;font-size:clamp(32px,4.5vw,48px);letter-spacing:-.025em;line-height:1;color:var(--cream);}
.pg-title em{font-style:italic;color:var(--flame);font-weight:400;}
.pg-desc{font-family:var(--body);font-weight:300;font-size:14px;color:var(--text3);margin-top:10px;line-height:1.6;max-width:640px;}
.pg-meta{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:8px;}
.pg-meta code{color:var(--flame);}

/* "HERO / PAGE SETTINGS" ZONE — clickable region */
.zone{position:relative;margin-bottom:28px;padding:24px 26px;background:var(--card);border:1px solid var(--border);border-radius:var(--rd);transition:border-color .18s, box-shadow .18s;}
.zone:hover{border-color:var(--border2);}
.zone.editing{border-color:var(--flame);box-shadow:var(--shadow-flame);}
.zone-label{font-family:var(--cond);font-weight:700;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.zone-label-l{display:flex;align-items:center;gap:6px;}
.zone-label-l::before{content:'';width:12px;height:1px;background:currentColor;}
.zone-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s;}
.zone:hover .zone-actions, .zone.editing .zone-actions{opacity:1;}
.zone-act{width:26px;height:26px;border-radius:var(--rd-xs);border:1px solid transparent;background:transparent;color:var(--text3);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.zone-act:hover{background:rgba(196,160,112,.1);color:var(--flame);border-color:var(--border);}
.zone-act.danger:hover{color:var(--danger);border-color:rgba(255,106,58,.3);}

/* EDITABLE TEXT (inline) */
.edt{position:relative;cursor:text;transition:all .15s;border-radius:var(--rd-xs);outline:none;}
.edt:hover{background:var(--flame-bg);box-shadow:0 0 0 4px var(--flame-bg);}
.edt:focus,.edt.editing{background:rgba(240,136,32,.12);box-shadow:0 0 0 4px rgba(240,136,32,.12), inset 0 -2px 0 var(--flame);}
.edt[contenteditable]{cursor:text;-webkit-user-select:text;user-select:text;}
.edt[data-empty="1"]:not(:focus)::before{content:attr(data-placeholder);color:var(--text3);font-style:italic;opacity:.6;}
.edt.title-style{font-family:var(--serif);font-weight:900;}
.edt.title-style em{font-style:italic;color:var(--flame);font-weight:400;}

.edt-inline-hint{position:absolute;bottom:calc(100% + 4px);left:0;font-family:var(--mono);font-size:10px;color:var(--flame);background:var(--raised);border:1px solid var(--border2);padding:3px 8px;border-radius:var(--rd-xs);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .18s;}
.edt.editing .edt-inline-hint{opacity:1;}

/* SECTION CARD in the flow */
.sec{position:relative;margin-bottom:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--rd);overflow:hidden;transition:border-color .18s, box-shadow .18s;}
.sec:hover{border-color:var(--border2);}
.sec.editing{border-color:var(--flame);box-shadow:var(--shadow-flame);}

.sec-head{padding:20px 22px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(43,28,14,.6),transparent);}
.sec-eyebrow{font-family:var(--cond);font-weight:700;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--flame);opacity:.78;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.sec-eyebrow::before{content:'';width:12px;height:1px;background:currentColor;}
.sec-head-row{display:flex;align-items:center;gap:12px;}
.sec-icon{font-size:22px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(240,136,32,.25));}
.sec-icon.edt{cursor:text;display:inline-block;min-width:28px;text-align:center;padding:2px 4px;}
.sec-title{font-family:var(--serif);font-weight:800;font-size:clamp(20px,3vw,28px);letter-spacing:-.01em;color:var(--cream);flex:1;min-width:0;line-height:1.15;}
.sec-sub{font-family:var(--body);font-weight:300;font-size:13px;color:var(--text3);margin-top:4px;font-style:italic;}
.sec-acts{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.sec:hover .sec-acts, .sec.editing .sec-acts{opacity:1;}
.sec-act{width:30px;height:30px;border-radius:var(--rd-xs);border:1px solid transparent;background:transparent;color:var(--text3);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.sec-act:hover{background:rgba(196,160,112,.1);color:var(--flame);border-color:var(--border);}
.sec-act.danger:hover{color:var(--danger);border-color:rgba(255,106,58,.3);}

.sec-body{padding:4px 22px 18px;}

/* ITEM ROW */
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:4px;border-radius:var(--rd-sm);background:transparent;border:1px solid transparent;transition:all .18s;cursor:pointer;position:relative;}
.item:hover{background:rgba(43,28,14,.55);border-color:var(--border);}
.item.editing{background:rgba(43,28,14,.85);border-color:var(--flame);box-shadow:0 0 0 2px rgba(240,136,32,.12);}
.item.hidden-flag::after{content:'hidden';position:absolute;top:6px;right:56px;font-family:var(--cond);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--danger);background:rgba(255,106,58,.12);padding:2px 7px;border-radius:100px;}

.item-drag{width:16px;color:var(--text3);font-size:12px;cursor:grab;opacity:0;transition:opacity .15s;user-select:none;flex-shrink:0;text-align:center;}
.item:hover .item-drag{opacity:1;}
.item-drag:active{cursor:grabbing;}
.item-idx{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--text3);min-width:22px;text-align:right;flex-shrink:0;}
.item-thumb{width:48px;height:48px;border-radius:var(--rd-sm);background:rgba(9,7,4,.65);border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:border-color .18s;}
.item-thumb:hover{border-color:var(--flame);}
.item-thumb img{width:100%;height:100%;object-fit:cover;}
.item-thumb-ph{font-size:16px;opacity:.3;}
.item-thumb-overlay{position:absolute;inset:0;background:rgba(9,7,4,.75);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;opacity:0;transition:opacity .15s;letter-spacing:.08em;}
.item-thumb:hover .item-thumb-overlay{opacity:1;}
.item-body{flex:1;min-width:0;}
.item-name{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--cream);line-height:1.15;}
.item-desc{font-family:var(--body);font-weight:300;font-size:12px;color:var(--text3);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-price{font-family:var(--cond);font-weight:800;font-size:14px;color:var(--glow);letter-spacing:.02em;white-space:nowrap;flex-shrink:0;}
.item-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.item:hover .item-acts, .item.editing .item-acts{opacity:1;}
.item-act{width:26px;height:26px;border-radius:var(--rd-xs);border:1px solid transparent;background:transparent;color:var(--text3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.item-act:hover{background:rgba(196,160,112,.12);color:var(--flame);border-color:var(--border);}
.item-act.danger:hover{color:var(--danger);border-color:rgba(255,106,58,.3);}
.item-act:disabled{opacity:.3;cursor:not-allowed;}

/* INLINE ITEM EDITOR (expands below the row) */
.item-editor{display:none;margin:4px 0 12px;padding:16px 14px 14px;background:var(--raised);border:1px solid var(--border2);border-left:3px solid var(--flame);border-radius:var(--rd-sm);animation:slideDown .2s ease-out;}
.item.editing + .item-editor{display:block;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ADD ITEM / ADD SECTION BUTTONS */
.btn-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--flame);background:transparent;border:1px dashed rgba(240,136,32,.3);border-radius:var(--rd-sm);cursor:pointer;transition:all .18s;margin-top:8px;}
.btn-add:hover{background:var(--flame-bg);border-style:solid;border-color:var(--flame);}
.btn-add.inline{margin:6px 0 0;padding:8px;font-size:10px;}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-family:var(--body);font-weight:300;font-size:13px;}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.5;display:block;}

/* FIELD (used in item editor + page settings) */
.field{margin-bottom:10px;}
.fl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;}
.fl-l{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);}
.fl-l em{color:var(--glow);font-style:normal;font-weight:700;margin-left:6px;font-size:9px;}
.fl-meta{display:flex;gap:3px;opacity:0;transition:opacity .15s;}

<script>
/* ══════════════════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════════════════ */
const SB_URL = 'https://vncecutxggodthugxgeu.supabase.co';
const SB_KEY = 'sb_publishable_4cC-iVqs9qE3xmADrXnCNA_DChq4xBL';

const KINDS = {

const TEMPLATES = {
  home_nav:           { label:'Home / Landing' },
  hero_with_sections: { label:'Hero + Sections' },

  items_grid_page:    { label:'Items Grid Page' },
  story_chapters:     { label:'Story Chapters' },
};

/* ══════════════════════════════════════════════════════════════════
   SUPABASE HELPERS
══════════════════════════════════════════════════════════════════ */
const sbHeaders = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
};
async function sbSelect(table, qs='') {
  const r = await fetch(SB_URL + '/rest/v1/' + table + (qs || '?select=*'), { headers: sbHeaders });
  if (!r.ok) throw new Error(table + ' GET ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbInsert(table, row) {
  const r = await fetch(SB_URL + '/rest/v1/' + table, {
    method:'POST', headers:{...sbHeaders, 'Prefer':'return=representation'},
    body: JSON.stringify(Array.isArray(row) ? row : [row])
  });
  if (!r.ok) throw new Error(table + ' POST ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbUpdate(table, id, patch) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method:'PATCH', headers:{...sbHeaders, 'Prefer':'return=representation'},
    body: JSON.stringify(patch)
  });
  if (!r.ok) throw new Error(table + ' PATCH ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbDelete(table, id) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, { method:'DELETE', headers: sbHeaders });
  if (!r.ok) throw new Error(table + ' DELETE ' + r.status);
}

/* ══════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════ */
const S = {
  authed: false, pin: '',
  pages: [], sections: [], items: [], settings: {},
  activePageId: null,
  editingItemId: null,    // which item has its inline editor open
  editingZone: null,      // 'page' | 'section:<id>' | null — which zone is being edited inline
  dirty: new Set(),       // patch paths
  dirtySnapshot: {},      // for discard: {patchPath: originalValue}
  saveTimer: null,
  undoStack: [],          // {patchPath, before, after}
  redoStack: [],
  cmdkSel: 0,
};

/* UTILS */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slugify = s => (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50);
function cssEsc(s){return window.CSS?.escape ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g,'\\$&');}

function toast(msg, kind='info') {
  const tb = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  tb.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function setConn(state) {
  document.getElementById('conn-dot').className = 'conn-dot ' + (state||'');
}
function setSave(state, txt) {
  const e = document.getElementById('tb-save');
  e.className = 'tb-save ' + (state||'');
  document.getElementById('tb-save-txt').textContent = txt;
}


/* ══════════════════════════════════════════════════════════════════
   PIN
══════════════════════════════════════════════════════════════════ */
function buildPinPad() {
  const pad = document.getElementById('pin-pad');
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','submit'];
  pad.innerHTML = keys.map(k => {
    if (k === 'del') return '<button class="pin-btn del" data-v="del">⌫</button>';
    if (k === 'submit') return '<button class="pin-btn submit" data-v="submit">Enter</button>';
    return '<button class="pin-btn" data-v="'+k+'">'+k+'</button>';
  }).join('');
  pad.querySelectorAll('.pin-btn').forEach(b => { b.onclick = () => onPinKey(b.dataset.v); });
  document.addEventListener('keydown', e => {
    if (S.authed) return;
    if (/^[0-9]$/.test(e.key)) onPinKey(e.key);
    else if (e.key === 'Backspace') onPinKey('del');
    else if (e.key === 'Enter') onPinKey('submit');
  });
}
function onPinKey(k) {
  const dots = document.querySelectorAll('.pin-dot');
  if (k === 'del') S.pin = S.pin.slice(0,-1);
  else if (k === 'submit') { if (S.pin.length < 4) return flashPinErr(); return tryLogin(); }
  else if (S.pin.length < 6) S.pin += k;
  dots.forEach((d,i) => d.classList.toggle('filled', i < S.pin.length));
  if (S.pin.length === 6) setTimeout(tryLogin, 120);
}
function flashPinErr(msg) {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach(d => d.classList.add('error'));
  const m = document.getElementById('pin-msg');
  if (msg) m.textContent = msg;
  m.classList.add('show');
  setTimeout(() => { dots.forEach(d=>d.classList.remove('error','filled')); m.classList.remove('show'); S.pin=''; }, 900);
}
async function tryLogin() {
  try {
    const rows = await sbSelect('cms_settings', '?select=*&key=eq.editor_pin');
    if (!rows || !rows.length) return flashPinErr('No PIN set in DB.');
    let pinVal = rows[0].value;
    if (typeof pinVal === 'string') pinVal = pinVal.replace(/^"|"$/g,'');
    if (S.pin !== String(pinVal)) return flashPinErr();
    S.authed = true;
    sessionStorage.setItem('fs_cms_auth','1');
    await bootApp();
  } catch (err) {
    console.error(err);
    flashPinErr('Connection error.');
  }
}
function logout() {
  sessionStorage.removeItem('fs_cms_auth');
  location.reload();
}

/* ══════════════════════════════════════════════════════════════════
   BOOT + LOAD
══════════════════════════════════════════════════════════════════ */
async function bootApp() {
  try {
    setConn('');
    await reloadAll();
    document.getElementById('pin-screen').classList.add('gone');
    setTimeout(() => {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('app').classList.add('on');
    }, 380);
    // Restore last active page from sessionStorage
    const stored = sessionStorage.getItem('fs_cms_page');
    if (stored && S.pages.find(p => p.id === stored)) S.activePageId = stored;
    else if (S.pages.length) S.activePageId = S.pages[0].id;
    renderAll();
    setConn('ok');
  } catch (err) {
    console.error(err);
    setConn('err');
    toast('Failed to load: ' + err.message, 'err');
  }
}

async function reloadAll() {
  const [pages, sections, items, settings] = await Promise.all([
    sbSelect('pages', '?select=*&order=order_idx.asc'),
    sbSelect('sections', '?select=*&order=order_idx.asc'),
    sbSelect('items', '?select=*&order=order_idx.asc'),
    sbSelect('cms_settings'),
  ]);
  S.pages = pages;
  S.sections = sections;
  S.items = items;
  S.settings = {};
  settings.forEach(r => { S.settings[r.key] = r.value; });
}

function renderAll() {
  renderPageSwitcher();
  renderCanvas();
}

/* ══════════════════════════════════════════════════════════════════
   PAGE SWITCHER (dropdown)
══════════════════════════════════════════════════════════════════ */
function renderPageSwitcher() {
  const trigger = document.getElementById('ps-trigger');
  const active = S.pages.find(p => p.id === S.activePageId);
  if (!active) return;
  document.getElementById('ps-icon').textContent = active.icon || '📄';
  document.getElementById('ps-name').textContent = active.title;

  const menu = document.getElementById('ps-menu-inner');
  menu.innerHTML = S.pages.map(p => {
    const count = S.sections.filter(s => s.page_id === p.id).length;
    const isActive = p.id === S.activePageId;
    return '<div class="ps-item' + (isActive?' active':'') + '" data-page="' + p.id + '">' +
      '<span class="ps-item-icon">' + esc(p.icon || '📄') + '</span>' +
      '<span class="ps-item-name">' + esc(p.title) + '</span>' +
      '<span class="ps-item-count">' + count + '</span>' +
      '</div>';
  }).join('');
  menu.querySelectorAll('.ps-item').forEach(el => {
    el.onclick = () => {
      S.activePageId = el.dataset.page;
      sessionStorage.setItem('fs_cms_page', el.dataset.page);
      S.editingItemId = null;
      S.editingZone = null;
      closePageSwitcher();
      renderAll();
      document.getElementById('canvas').scrollTop = 0;
    };
  });
}
function togglePageSwitcher(e) {
  e?.stopPropagation();
  const menu = document.getElementById('ps-menu');
  const trig = document.getElementById('ps-trigger');
  const open = !menu.classList.contains('show');
  menu.classList.toggle('show', open);
  trig.classList.toggle('open', open);
}
function closePageSwitcher() {
  document.getElementById('ps-menu').classList.remove('show');
  document.getElementById('ps-trigger').classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.page-switcher')) closePageSwitcher();
  if (!e.target.closest('.ctx') && !e.target.closest('[data-ctx]')) closeCtx();
});


/* ══════════════════════════════════════════════════════════════════
   CANVAS RENDER (main view)
══════════════════════════════════════════════════════════════════ */
function renderCanvas() {
  const page = S.pages.find(p => p.id === S.activePageId);
  const inner = document.getElementById('canvas-inner');
  if (!page) { inner.innerHTML = '<div class="empty">No page selected.</div>'; return; }

  const sections = S.sections.filter(s => s.page_id === page.id).sort((a,b) => a.order_idx - b.order_idx);
  const tmpl = TEMPLATES[page.template] || TEMPLATES.hero_with_sections;
  const settings = page.settings || {};

  let html = '';

  /* PAGE HEADER */
  html += '<div class="pg-head">';
  html +=   '<div class="pg-eyebrow">' + esc(tmpl.label) + ' · ' + sections.length + ' section' + (sections.length===1?'':'s') + '</div>';
  html +=   '<h1 class="pg-title">' +
              '<span class="edt title-style" contenteditable="plaintext-only" data-patch="page:'+page.id+':icon" data-placeholder="🏠" data-empty="'+(page.icon?'0':'1')+'">' + esc(page.icon||'') + '</span> ' +
              '<span class="edt title-style" contenteditable="plaintext-only" data-patch="page:'+page.id+':title">' + esc(page.title) + '</span>' +
            '</h1>';
  html +=   '<div class="pg-meta">URL slug: <code>/' + esc(page.slug) + '</code></div>';
  html += '</div>';

  /* PAGE SETTINGS ZONE (hero + template) */
  html += renderPageZone(page, settings);

  /* SECTIONS */
  sections.forEach(s => { html += renderSectionCard(s); });

  /* ADD SECTION BUTTON */
  html += '<button class="btn-add" onclick="openAddSectionModal(\''+page.id+'\')">＋ Add Section</button>';

  inner.innerHTML = html;
  bindCanvas();
}

/* ── Page-level Zone (hero + template) ── */
function renderPageZone(page, settings) {
  const isEditing = S.editingZone === 'page';
  const heroFields = [
    {k:'hero_eyebrow', l:'Hero Eyebrow'},
    {k:'hero_title', l:'Hero Title', html:true, hint:'Use &lt;em&gt;...&lt;/em&gt; for italic flame. Use &lt;br&gt; for line break.'},
    {k:'hero_subtitle', l:'Hero Subtitle'},
    {k:'hero_lead', l:'Hero Lead', textarea:true},
    {k:'header_subtitle', l:'Header Subtitle (menu only)'},
  ];
  const knownKeys = ['hero_eyebrow','hero_title','hero_subtitle','hero_lead','header_subtitle'];

  let html = '<div class="zone ' + (isEditing?'editing':'') + '" data-zone="page">';
  html += '<div class="zone-label">';
  html +=   '<span class="zone-label-l">Page Settings · Hero · Template</span>';
  html +=   '<div class="zone-actions">';
  html +=     '<button class="zone-act" onclick="openZoneEditor(\'page\')" title="Expand editor">⚙</button>';
  html +=     '<button class="zone-act" data-ctx="page:'+page.id+'" onclick="openCtxMenu(event, \'page\', \''+page.id+'\')" title="More">⋮</button>';
  html +=   '</div>';
  html += '</div>';

  // Fields grid
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 22px">';
  html += '<div>';
  html +=   '<div class="editor-section-head">Slug & Template</div>';
  html +=   fieldHtml('slug', 'URL Slug', page.slug, {hint:'Lowercase, hyphens only'}, 'page:'+page.id+':slug');
  html +=   '<div class="field"><div class="fl"><span class="fl-l">Template</span></div>' +
            '<select class="fi" data-patch="page:'+page.id+':template">' +
              Object.entries(TEMPLATES).map(([k,t]) => '<option value="'+k+'"' + (page.template===k?' selected':'') + '>' + t.label + '</option>').join('') +
            '</select></div>';
  html += '</div>';

  html += '<div>';
  html +=   '<div class="editor-section-head">Hero Content</div>';
  heroFields.forEach(f => {
    if (settings[f.k] !== undefined || ['hero_title','hero_eyebrow'].includes(f.k)) {
      html += fieldHtml(f.k, f.l, settings[f.k]||'', {textarea:f.textarea, html:f.html, hint:f.hint}, 'page_settings:'+page.id+':'+f.k);
    }
  });
  html += '</div>';
  html += '</div>';

  // Custom page settings
  const customKeys = Object.keys(settings).filter(k => !knownKeys.includes(k));
  if (customKeys.length) {
    html += '<div class="editor-section-head" style="margin-top:16px">Custom Fields</div>';
    customKeys.forEach(k => {
      const val = settings[k];
      html += fieldHtml(k, k, val, {textarea: typeof val === 'string' && val.length > 80}, 'page_settings:'+page.id+':'+k, true);
    });
  }
  html += '<button class="btn-add inline" onclick="openAddCustomField(\'page\',\''+page.id+'\')">＋ Custom Page Field</button>';

  html += '</div>';
  return html;
}

/* ══════════════════════════════════════════════════════════════════
   SECTION CARD
══════════════════════════════════════════════════════════════════ */
function renderSectionCard(s) {
  const kind = KINDS[s.kind] || KINDS.items_grid;
  const items = S.items.filter(it => it.section_id === s.id).sort((a,b) => a.order_idx - b.order_idx);
  const isEditingZone = S.editingZone === 'section:'+s.id;
  const settings = s.settings || {};

  let html = '<div class="sec ' + (isEditingZone?'editing':'') + '" data-section="'+s.id+'">';

  /* SECTION HEADER */
  html += '<div class="sec-head">';
  html += '<div class="sec-eyebrow">' + esc(kind.label) + ' · ' + items.length + ' item' + (items.length===1?'':'s') + '</div>';
  html += '<div class="sec-head-row">';
  html +=   '<span class="sec-icon edt" contenteditable="plaintext-only" data-patch="section:'+s.id+':icon" data-placeholder="▦" data-empty="'+(s.icon?'0':'1')+'">' + esc(s.icon||'') + '</span>';
  html +=   '<div style="flex:1;min-width:0">';
  html +=     '<h2 class="sec-title edt" contenteditable="plaintext-only" data-patch="section:'+s.id+':title">' + esc(s.title) + '</h2>';
  if (s.subtitle || isEditingZone) {
    html +=   '<div class="sec-sub edt" contenteditable="plaintext-only" data-patch="section:'+s.id+':subtitle" data-placeholder="add subtitle..." data-empty="'+(s.subtitle?'0':'1')+'">' + esc(s.subtitle||'') + '</div>';
  }
  html +=   '</div>';
  html +=   '<div class="sec-acts">';
  html +=     '<button class="sec-act" onclick="openZoneEditor(\'section\',\''+s.id+'\')" title="Settings">⚙</button>';
  html +=     '<button class="sec-act" data-ctx="section:'+s.id+'" onclick="openCtxMenu(event, \'section\', \''+s.id+'\')" title="More">⋮</button>';
  html +=   '</div>';
  html += '</div>';
  html += '</div>';

  /* SECTION BODY */
  html += '<div class="sec-body">';

  // Expanded settings panel (when editing zone)
  if (isEditingZone) {
    html += '<div style="background:var(--raised);border:1px solid var(--border2);border-radius:var(--rd-sm);padding:14px;margin-bottom:14px">';
    html += '<div class="editor-section-head">Section Settings</div>';

    // Kind selector
    html += '<div class="field"><div class="fl"><span class="fl-l">Section Kind (renders as)</span></div>' +
            '<select class="fi" data-patch="section:'+s.id+':kind">' +
              Object.entries(KINDS).map(([k,kd]) => '<option value="'+k+'"' + (s.kind===k?' selected':'') + '>' + kd.label + ' — ' + kd.desc + '</option>').join('') +
            '</select></div>';

    // Kind-specific settings
    if (kind.settingsFields && kind.settingsFields.length) {
      kind.settingsFields.forEach(f => {
        html += fieldHtml(f.key, f.label, settings[f.key]||'', {textarea:f.textarea, html:f.html, hint:f.hint, type:f.type, long:f.long}, 'section_settings:'+s.id+':'+f.key);
      });
      // Custom settings
      const known = kind.settingsFields.map(f => f.key);
      Object.keys(settings).forEach(k => {
        if (!known.includes(k)) {
          const val = settings[k];
          const isLong = typeof val === 'string' && (val.length > 80 || val.includes('\n'));
          html += fieldHtml(k, k, val, {textarea:isLong}, 'section_settings:'+s.id+':'+k, true);
        }
      });
    }
    html += '<button class="btn-add inline" onclick="openAddCustomField(\'section\',\''+s.id+'\')">＋ Custom Section Field</button>';
    html += '</div>';
  }

  // Items list
  if (kind.defaultItemFields.length > 0) {
    if (items.length === 0) {
      html += '<div class="empty" style="padding:20px 12px"><span class="empty-icon">📋</span>No items yet</div>';
    } else {
      items.forEach((it, idx) => { html += renderItemRow(it, idx, items.length, kind, s); });
    }
    html += '<button class="btn-add inline" onclick="addItem(\''+s.id+'\')">＋ Add Item</button>';
  }

  html += '</div></div>';
  return html;
}


/* ══════════════════════════════════════════════════════════════════
   ITEM ROW + INLINE EDITOR
══════════════════════════════════════════════════════════════════ */
function renderItemRow(it, idx, total, kind, section) {
  const data = it.data || {};
  const name = data.name || data.title || '(unnamed)';
  const img = data.img || data.image;
  const price = data.price;
  const priceDisplay = (price != null && price !== '') ? '$' + Number(price).toFixed(2) : '';
  const isEditing = S.editingItemId === it.id;
  const hasImg = data.img !== undefined || data.image !== undefined;

  let html = '<div class="item' + (isEditing?' editing':'') + (!it.visible?' hidden-flag':'') + '" data-item="'+it.id+'">';
  html += '<span class="item-drag" title="Drag to reorder">⋮⋮</span>';
  html += '<span class="item-idx">'+(idx+1)+'</span>';
  if (hasImg) {
    html += '<div class="item-thumb" onclick="event.stopPropagation();openImagePicker(\''+it.id+'\')">' +
            (img ? '<img src="'+escA(img)+'" onerror="this.outerHTML=\'<span class=item-thumb-ph>📷</span>\'">' : '<span class="item-thumb-ph">📷</span>') +
            '<span class="item-thumb-overlay">EDIT</span></div>';
  }
  html += '<div class="item-body">';
  html +=   '<div class="item-name">' + esc(name) + '</div>';
  if (data.desc) html += '<div class="item-desc">' + esc(data.desc) + '</div>';
  html += '</div>';
  if (priceDisplay) html += '<span class="item-price">' + priceDisplay + '</span>';
  html += '<div class="item-acts">';
  html +=   '<button class="item-act" data-act="move-up" data-id="'+it.id+'"' + (idx===0?' disabled':'') + ' title="Up">▲</button>';
  html +=   '<button class="item-act" data-act="move-dn" data-id="'+it.id+'"' + (idx===total-1?' disabled':'') + ' title="Down">▼</button>';
  html +=   '<button class="item-act" data-ctx="item:'+it.id+'" onclick="event.stopPropagation();openCtxMenu(event, \'item\', \''+it.id+'\')" title="More">⋮</button>';
  html += '</div>';
  html += '</div>';

  // Inline editor (shows when this item is selected)
  if (isEditing) {
    html += renderItemInlineEditor(it, kind);
  }

  return html;
}

function renderItemInlineEditor(it, kind) {
  const data = it.data || {};
  let html = '<div class="item-editor" data-item-editor="'+it.id+'">';

  // Visibility toggle
  html += '<div class="cbx-row" style="margin-bottom:12px">' +
          '<div class="cbx ' + (it.visible?'on':'') + '" data-patch="item:'+it.id+':visible" data-cbx="1"></div>' +
          '<span class="cbx-lbl">' + (it.visible?'Visible on site':'Hidden from site') + '</span></div>';

  // Kind-default fields in a smart grid
  const fields = kind.defaultItemFields;
  const usedKeys = new Set();
  html += '<div>';
  fields.forEach(f => {
    usedKeys.add(f.key);
    html += fieldHtml(f.key, f.label, data[f.key], f, 'item_data:'+it.id+':'+f.key);
  });
  html += '</div>';

  // Custom fields
  const customKeys = Object.keys(data).filter(k => !usedKeys.has(k));
  if (customKeys.length) {
    html += '<div class="editor-section-head" style="margin-top:10px">Custom Fields</div>';
    customKeys.forEach(k => {
      const val = data[k];
      let type = 'text';
      if (typeof val === 'boolean') type = 'boolean';
      else if (typeof val === 'number') type = 'number';
      else if (typeof val === 'string' && (val.length > 80 || val.includes('\n'))) type = 'textarea';
      html += fieldHtml(k, k, val, {type}, 'item_data:'+it.id+':'+k, true);
    });
  }

  html += '<button class="btn-add inline" onclick="openAddCustomField(\'item\',\''+it.id+'\')">＋ Custom Field</button>';
  html += '</div>';
  return html;
}

/* ══════════════════════════════════════════════════════════════════
   FIELD RENDERING
══════════════════════════════════════════════════════════════════ */
function fieldHtml(key, label, value, opts, patchPath, isCustom) {
  opts = opts || {};
  const type = opts.type || (opts.textarea ? 'textarea' : 'text');
  const dirty = S.dirty.has(patchPath) ? ' dirty' : '';
  const custom = isCustom ? ' custom' : '';
  let inp = '';

  if (type === 'boolean') {
    const on = value === true || value === 'true';
    inp = '<div class="cbx-row"><div class="cbx ' + (on?'on':'') + '" data-patch="'+patchPath+'" data-cbx="1"></div>' +
          '<span class="cbx-lbl">' + (on?'Yes':'No') + '</span></div>';
  } else if (type === 'select') {
    inp = '<select class="fi" data-patch="'+patchPath+'">' +
          (opts.options||[]).map(o => '<option value="'+escA(o)+'"' + (value===o?' selected':'') + '>' + esc(o||'—') + '</option>').join('') +
          '</select>';
  } else if (type === 'textarea' || opts.html) {
    const cls = 'fi fi-ta' + (opts.long?' long':'') + (opts.html?' html':'');
    inp = '<textarea class="'+cls+'" data-patch="'+patchPath+'">' + esc(value==null?'':value) + '</textarea>';
  } else if (type === 'url' && (key === 'img' || key === 'image')) {
    inp = '<div class="img-field">' +
          '<input class="fi" type="url" data-patch="'+patchPath+'" value="'+escA(value||'')+'" placeholder="https://...">' +
          '<div class="img-preview">' + (value ? '<img src="'+escA(value)+'" onerror="this.outerHTML=\'<span class=img-ph>📷</span>\'">' : '<span class="img-ph">📷</span>') + '</div>' +
          '</div>';
  } else {
    const t = type === 'number' ? 'number' : (type === 'url' ? 'url' : (type === 'email' ? 'email' : (type === 'tel' ? 'tel' : 'text')));
    inp = '<input class="fi" type="'+t+'" ' + (t==='number'?'step="0.01"':'') + ' data-patch="'+patchPath+'" value="'+escA(value==null?'':value)+'">';
  }

  const badge = isCustom ? '<em>Custom</em>' : '';
  const meta = isCustom ? '<div class="fl-meta"><button class="fl-mb del" onclick="removeCustomField(\''+patchPath+'\')" title="Remove field">✕</button></div>' : '';
  const hint = opts.hint ? '<div class="fhint">' + opts.hint + '</div>' : '';

  return '<div class="field'+dirty+custom+'" data-field-key="'+patchPath+'">' +
         '<div class="fl"><span class="fl-l">'+esc(label)+badge+'</span>'+meta+'</div>' +
         inp + hint + '</div>';
}


/* ══════════════════════════════════════════════════════════════════
   BIND CANVAS EVENTS
══════════════════════════════════════════════════════════════════ */
function bindCanvas() {
  const root = document.getElementById('canvas-inner');

  // Click on item row → toggle inline editor
  root.querySelectorAll('.item').forEach(el => {
    el.onclick = e => {
      if (e.target.closest('.item-act, .item-thumb, .item-editor, .edt, .fi, .cbx')) return;
      const id = el.dataset.item;
      S.editingItemId = S.editingItemId === id ? null : id;
      renderCanvas();
    };
  });

  // Inline edit via contenteditable (.edt)
  root.querySelectorAll('.edt[contenteditable]').forEach(el => {
    el.onfocus = () => {
      el.classList.add('editing');
      el.dataset.originalValue = el.textContent;
    };
    el.onblur = () => {
      el.classList.remove('editing');
      const newVal = el.textContent.trim();
      if (newVal !== el.dataset.originalValue) {
        handleEdit(el.dataset.patch, newVal);
      }
      if (!newVal && el.dataset.placeholder) {
        el.dataset.empty = '1';
      } else {
        el.dataset.empty = '0';
      }
    };
    el.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') { el.textContent = el.dataset.originalValue || ''; el.blur(); }
    };
  });

  // Item reorder buttons
  root.querySelectorAll('.item-act').forEach(el => {
    if (el.dataset.act === 'move-up' || el.dataset.act === 'move-dn') {
      el.onclick = e => {
        e.stopPropagation();
        if (el.disabled) return;
        moveItem(el.dataset.id, el.dataset.act === 'move-up' ? -1 : 1);
      };
    }
  });

  // Inputs inside inline editor, zone editor
  root.querySelectorAll('input[data-patch],textarea[data-patch],select[data-patch]').forEach(el => {
    el.addEventListener('input', () => handleEdit(el.dataset.patch, el.value));
    el.addEventListener('change', () => handleEdit(el.dataset.patch, el.value));
  });
  root.querySelectorAll('.cbx[data-cbx]').forEach(cb => {
    cb.onclick = e => {
      e.stopPropagation();
      const cur = cb.classList.contains('on');
      cb.classList.toggle('on', !cur);
      const lbl = cb.nextElementSibling;
      if (lbl && lbl.classList.contains('cbx-lbl')) {
        const path = cb.dataset.patch || '';
        if (path.includes('item:') && path.endsWith(':visible')) lbl.textContent = !cur ? 'Visible on site' : 'Hidden from site';
        else lbl.textContent = !cur ? 'Yes' : 'No';
      }
      handleEdit(cb.dataset.patch, !cur);
    };
  });
}

/* ══════════════════════════════════════════════════════════════════
   HANDLE EDIT (inline or form)
══════════════════════════════════════════════════════════════════ */
function handleEdit(patchPath, newValue) {
  const [scope, id, key] = patchPath.split(':');
  const rec = findRec(scope, id);
  if (!rec) return;

  // Snapshot original for discard (only first time)
  if (!(patchPath in S.dirtySnapshot)) {
    S.dirtySnapshot[patchPath] = getValueAt(scope, id, key);
  }

  // Apply
  if (scope === 'page') rec[key] = newValue;
  else if (scope === 'section') rec[key] = newValue;
  else if (scope === 'item' && key === 'visible') rec[key] = !!newValue;
  else if (scope === 'item') rec[key] = newValue;
  else if (scope === 'page_settings')    { rec.settings = {...(rec.settings||{}), [key]: newValue}; }
  else if (scope === 'section_settings') { rec.settings = {...(rec.settings||{}), [key]: newValue}; }
  else if (scope === 'item_data') {
    const v = (key === 'price' || key === 'priceLg') ? (newValue === '' ? null : Number(newValue))
            : (typeof newValue === 'boolean' ? newValue : newValue);
    rec.data = {...(rec.data||{}), [key]: v};
  }

  S.dirty.add(patchPath);
  updateSaveState();
  queueSave();

  // Visual dirty marker
  const fieldEl = document.querySelector('[data-field-key="'+cssEsc(patchPath)+'"]');
  if (fieldEl) fieldEl.classList.add('dirty');

  // Live DOM updates without full re-render
  liveUpdate(scope, id, key, newValue);
}

function getValueAt(scope, id, key) {
  const rec = findRec(scope, id);
  if (!rec) return undefined;
  if (scope === 'page' || scope === 'section' || scope === 'item') return rec[key];
  if (scope === 'page_settings' || scope === 'section_settings') return (rec.settings||{})[key];
  if (scope === 'item_data') return (rec.data||{})[key];
}

function liveUpdate(scope, id, key, newValue) {
  // Update tab dropdown if page title/icon changed
  if (scope === 'page' && (key === 'title' || key === 'icon')) {
    renderPageSwitcher();
  }
  // Update section header title when typed
  if (scope === 'section' && key === 'title') {
    const el = document.querySelector('[data-section="'+id+'"] .sec-title');
    // Don't overwrite an actively-editing contenteditable
    if (el && !el.classList.contains('editing')) el.textContent = newValue;
  }
  // Update item name
  if (scope === 'item_data' && (key === 'name' || key === 'title')) {
    const nameEl = document.querySelector('[data-item="'+id+'"] .item-name');
    if (nameEl) nameEl.textContent = newValue || '(unnamed)';
  }
  // Update item price
  if (scope === 'item_data' && key === 'price') {
    const priceEl = document.querySelector('[data-item="'+id+'"] .item-price');
    const it = S.items.find(x => x.id === id);
    const disp = (it?.data?.price != null && it.data.price !== '') ? '$' + Number(it.data.price).toFixed(2) : '';
    if (priceEl) priceEl.textContent = disp;
    else if (disp) {
      // Need to insert — just re-render this one item
      const wrap = document.querySelector('[data-item="'+id+'"]');
      if (wrap) setTimeout(() => renderCanvas(), 0);
    }
  }
  // Image preview in field
  if (scope === 'item_data' && (key === 'img' || key === 'image')) {
    const fieldEl = document.querySelector('[data-field-key="item_data:'+id+':'+key+'"] .img-preview');
    if (fieldEl) fieldEl.innerHTML = newValue ? '<img src="'+escA(newValue)+'" onerror="this.outerHTML=\'<span class=img-ph>📷</span>\'">' : '<span class="img-ph">📷</span>';
    // Also update thumbnail in item row
    const thumb = document.querySelector('[data-item="'+id+'"] .item-thumb');
    if (thumb) {
      const overlay = thumb.querySelector('.item-thumb-overlay');
      thumb.innerHTML = (newValue ? '<img src="'+escA(newValue)+'" onerror="this.outerHTML=\'<span class=item-thumb-ph>📷</span>\'">' : '<span class="item-thumb-ph">📷</span>') + (overlay?overlay.outerHTML:'<span class="item-thumb-overlay">EDIT</span>');
    }
  }
}

function findRec(scope, id) {
  if (scope === 'page' || scope === 'page_settings') return S.pages.find(x => x.id === id);
  if (scope === 'section' || scope === 'section_settings') return S.sections.find(x => x.id === id);
  if (scope === 'item' || scope === 'item_data') return S.items.find(x => x.id === id);
  return null;
}

function updateSaveState() {
  const n = S.dirty.size;
  if (n > 0) setSave('', n + ' unsaved');
  else setSave('saved', 'All saved');
  // Save bar
  const bar = document.getElementById('savebar');
  bar.classList.toggle('show', n > 0);
  document.getElementById('savebar-count').textContent = n + ' unsaved change' + (n===1?'':'s');
}

/* ══════════════════════════════════════════════════════════════════
   DEBOUNCED SAVE
══════════════════════════════════════════════════════════════════ */
function queueSave() {
  if (S.saveTimer) clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(() => flushSaves(false), 1500);
}

async function flushSaves(manual) {
  if (S.dirty.size === 0) return;
  setSave('saving','Saving...');
  const pageSet = new Set(), sectionSet = new Set(), itemSet = new Set();
  for (const path of S.dirty) {
    const [scope, id] = path.split(':');
    if (scope.startsWith('page')) pageSet.add(id);
    else if (scope.startsWith('section')) sectionSet.add(id);
    else if (scope.startsWith('item')) itemSet.add(id);
  }
  try {
    const promises = [];
    for (const id of pageSet) {
      const r = S.pages.find(x=>x.id===id);
      if (r) promises.push(sbUpdate('pages', id, { title:r.title, slug:r.slug, icon:r.icon, template:r.template, settings:r.settings, order_idx:r.order_idx }));
    }
    for (const id of sectionSet) {
      const r = S.sections.find(x=>x.id===id);
      if (r) promises.push(sbUpdate('sections', id, { title:r.title, subtitle:r.subtitle, icon:r.icon, slug:r.slug, kind:r.kind, settings:r.settings, order_idx:r.order_idx }));
    }
    for (const id of itemSet) {
      const r = S.items.find(x=>x.id===id);
      if (r) promises.push(sbUpdate('items', id, { data:r.data, visible:r.visible, order_idx:r.order_idx }));
    }
    await Promise.all(promises);
    S.dirty.clear();
    S.dirtySnapshot = {};
    document.querySelectorAll('.field.dirty').forEach(el => el.classList.remove('dirty'));
    setSave('saved', 'Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    document.getElementById('savebar').classList.remove('show');
    if (manual) toast('Saved ✓','ok');
  } catch (err) {
    console.error(err);
    setSave('err', 'Save failed');
    toast('Save failed: ' + err.message, 'err');
  }
}

function discardDirty() {
  if (S.dirty.size === 0) return;
  if (!confirm('Discard all unsaved changes?')) return;
  // Restore from snapshot
  for (const [patchPath, origVal] of Object.entries(S.dirtySnapshot)) {
    const [scope, id, key] = patchPath.split(':');
    const rec = findRec(scope, id);
    if (!rec) continue;
    if (scope === 'page' || scope === 'section' || scope === 'item') rec[key] = origVal;
    else if (scope === 'page_settings' || scope === 'section_settings') rec.settings = {...(rec.settings||{}), [key]: origVal};
    else if (scope === 'item_data') rec.data = {...(rec.data||{}), [key]: origVal};
  }
  S.dirty.clear();
  S.dirtySnapshot = {};
  renderAll();
  updateSaveState();
  toast('Changes discarded', 'info');
}


/* ══════════════════════════════════════════════════════════════════
   CONTEXT MENU (⋮ button popup)
══════════════════════════════════════════════════════════════════ */
function openCtxMenu(e, type, id) {
  e.stopPropagation();
  const ctx = document.getElementById('ctx');
  const rec = findRec(type, id);
  const name = rec ? (rec.title || rec.data?.name || rec.data?.title || 'Item') : '';

  let items = [];
  if (type === 'page') {
    items = [
      { icon:'⚙', label:'Settings & Hero', action:() => openZoneEditor('page') },
      { icon:'⎘', label:'Duplicate Page', action:() => duplicateNode('page', id) },
    ];
  } else if (type === 'section') {
    items = [
      { icon:'⚙', label:'Section Settings', action:() => openZoneEditor('section', id) },
      { icon:'✎', label:'Rename', action:() => openRenameModal('section', id) },
      { icon:'⎘', label:'Duplicate', action:() => duplicateNode('section', id) },
      { sep:true },
      { icon:'✕', label:'Delete Section', danger:true, action:() => confirmDelete('section', id) },
    ];
  } else if (type === 'item') {
    const it = S.items.find(x=>x.id===id);
    items = [
      { icon:'✎', label:it?.visible?'Mark as Hidden':'Mark as Visible', action:() => { toggleItemVisible(id); closeCtx(); } },
      { icon:'＋', label:'Add Custom Field', action:() => openAddCustomField('item', id) },
      { icon:'⎘', label:'Duplicate Item', action:() => duplicateNode('item', id) },
      { sep:true },
      { icon:'✕', label:'Delete Item', danger:true, action:() => confirmDelete('item', id) },
    ];
  }

  let html = '<div class="ctx-hdr">' + esc(name) + '</div>';
  items.forEach((it, i) => {
    if (it.sep) { html += '<div class="ctx-sep"></div>'; return; }
    html += '<div class="ctx-item' + (it.danger?' danger':'') + '" data-ctx-idx="'+i+'">' +
            '<span class="ctx-icon">'+it.icon+'</span>'+esc(it.label)+'</div>';
  });
  ctx.innerHTML = html;
  ctx.classList.add('show');

  // Position near click
  const btn = e.currentTarget;
  const r = btn.getBoundingClientRect();
  const ctxW = ctx.offsetWidth, ctxH = ctx.offsetHeight;
  let left = r.right - ctxW, top = r.bottom + 4;
  if (left < 8) left = 8;
  if (left + ctxW > window.innerWidth - 8) left = window.innerWidth - ctxW - 8;
  if (top + ctxH > window.innerHeight - 8) top = r.top - ctxH - 4;
  ctx.style.left = left + 'px';
  ctx.style.top = top + 'px';

  // Bind items
  ctx.querySelectorAll('.ctx-item').forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const idx = Number(el.dataset.ctxIdx);
      items[idx]?.action?.();
      closeCtx();
    };
  });
}
function closeCtx() {
  const ctx = document.getElementById('ctx');
  ctx.classList.remove('show');
}

async function toggleItemVisible(id) {
  const it = S.items.find(x=>x.id===id);
  if (!it) return;
  try {
    await sbUpdate('items', id, { visible: !it.visible });
    it.visible = !it.visible;
    renderCanvas();
    toast(it.visible ? 'Item visible' : 'Item hidden', 'ok');

async function submitAddSection(pageId) {
  const title = document.getElementById('m-title').value.trim();
  const kind  = document.getElementById('m-kind').value;
  const icon  = document.getElementById('m-icon').value.trim();
  if (!title) return toast('Title required', 'err');
  try {
    const maxOrder = Math.max(0, ...S.sections.filter(s=>s.page_id===pageId).map(s=>s.order_idx||0));
    const rows = await sbInsert('sections', { page_id: pageId, title, kind, icon: icon||null, slug: slugify(title), order_idx: maxOrder+1, settings:{} });
    closeModal();
    await reloadAll();
    renderAll();
    toast('Section created ✓','ok');
    setTimeout(() => {
      const el = document.querySelector('[data-section="'+rows[0].id+'"]');
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 100);
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function addItem(sectionId) {
  try {
    const s = S.sections.find(x=>x.id===sectionId);
    const kind = KINDS[s?.kind] || KINDS.items_grid;
    const data = {};
    kind.defaultItemFields.forEach(f => {
      if (f.type === 'boolean') data[f.key] = false;
      else if (f.type === 'number') data[f.key] = null;
      else data[f.key] = '';
    });
    if (data.name !== undefined) data.name = 'New Item';
    else if (data.title !== undefined) data.title = 'New Item';
    const maxOrder = Math.max(0, ...S.items.filter(it=>it.section_id===sectionId).map(it=>it.order_idx||0));
    const rows = await sbInsert('items', { section_id: sectionId, data, order_idx: maxOrder+1, visible: true });
    await reloadAll();
    S.editingItemId = rows[0].id;
    renderCanvas();
    toast('Item added ✓','ok');
    setTimeout(() => {
      const el = document.querySelector('[data-item="'+rows[0].id+'"]');
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 100);
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function duplicateNode(type, id) {
  try {
    if (type === 'page') {
      const p = S.pages.find(x=>x.id===id);
      if (!p) return;
      const maxOrder = Math.max(0, ...S.pages.map(x=>x.order_idx||0));
      const newP = await sbInsert('pages', { title: p.title+' (copy)', slug: p.slug+'-copy-'+Date.now().toString(36), icon: p.icon, template: p.template, settings: p.settings, order_idx: maxOrder+1 });
      for (const s of S.sections.filter(x=>x.page_id===id)) {
        const newS = await sbInsert('sections', { page_id: newP[0].id, title: s.title, subtitle: s.subtitle, icon: s.icon, slug: s.slug, kind: s.kind, settings: s.settings, order_idx: s.order_idx });
        for (const it of S.items.filter(x=>x.section_id===s.id)) {
          await sbInsert('items', { section_id: newS[0].id, data: it.data, visible: it.visible, order_idx: it.order_idx });
        }
      }
      await reloadAll();
      S.activePageId = newP[0].id;
      renderAll();
    } else if (type === 'section') {
      const s = S.sections.find(x=>x.id===id);
      if (!s) return;
      const maxOrder = Math.max(0, ...S.sections.filter(x=>x.page_id===s.page_id).map(x=>x.order_idx||0));
      const newS = await sbInsert('sections', { page_id: s.page_id, title: s.title+' (copy)', subtitle: s.subtitle, icon: s.icon, slug: (s.slug||'')+'-copy', kind: s.kind, settings: s.settings, order_idx: maxOrder+1 });
      for (const it of S.items.filter(x=>x.section_id===id)) {
        await sbInsert('items', { section_id: newS[0].id, data: it.data, visible: it.visible, order_idx: it.order_idx });
      }
      await reloadAll();
      renderCanvas();
    } else if (type === 'item') {
      const it = S.items.find(x=>x.id===id);
      if (!it) return;
      const maxOrder = Math.max(0, ...S.items.filter(x=>x.section_id===it.section_id).map(x=>x.order_idx||0));
      const newIt = await sbInsert('items', { section_id: it.section_id, data: {...it.data}, visible: it.visible, order_idx: maxOrder+1 });
      await reloadAll();
      S.editingItemId = newIt[0].id;
      renderCanvas();
    }
    toast('Duplicated ✓','ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function confirmDelete(type, id) {
  const rec = findRec(type, id);
  const name = rec ? (rec.title || rec.data?.name || rec.data?.title || 'this') : 'this';
  const label = type === 'page' ? 'page (and all sections + items)'
              : type === 'section' ? 'section (and all items)'
              : 'item';
  openModal(
    '<h3>Delete <em>'+esc(name)+'</em>?</h3>' +
    '<p>This removes the '+label+' permanently. Cannot be undone.</p>' +
    '<div class="modal-btns">' +
      '<button class="tb-btn" onclick="closeModal()">Cancel</button>' +
      '<button class="tb-btn primary" style="background:linear-gradient(135deg,#a02010,#c04800)" onclick="doDelete(\''+type+'\',\''+id+'\')">Delete</button>' +
    '</div>'
  );
}
async function doDelete(type, id) {
  try {
    const table = type === 'page' ? 'pages' : type === 'section' ? 'sections' : 'items';
    await sbDelete(table, id);
    closeModal();
    await reloadAll();
    if (type === 'page' && S.activePageId === id) S.activePageId = S.pages[0]?.id || null;
    if (type === 'item' && S.editingItemId === id) S.editingItemId = null;
    renderAll();
    toast('Deleted ✓','ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function openRenameModal(type, id) {
  const rec = findRec(type, id);
  if (!rec) return;
  const cur = rec.title || rec.data?.name || rec.data?.title || '';
  openModal(
    '<h3>Rename</h3>' +
    '<div class="modal-row"><label>New Title</label><input class="fi" id="m-title" value="'+escA(cur)+'"></div>' +
    '<div class="modal-btns">' +
      '<button class="tb-btn" onclick="closeModal()">Cancel</button>' +
      '<button class="tb-btn primary" onclick="submitRename(\''+type+'\',\''+id+'\')">Save</button>' +
    '</div>'
  );
  setTimeout(() => { const el=document.getElementById('m-title'); el.focus(); el.select(); }, 80);
}
async function submitRename(type, id) {
  const newTitle = document.getElementById('m-title').value.trim();
  if (!newTitle) return toast('Title required', 'err');
  try {
    if (type === 'page') await sbUpdate('pages', id, { title: newTitle });
    else if (type === 'section') await sbUpdate('sections', id, { title: newTitle });
    else if (type === 'item') {
      const it = S.items.find(x=>x.id===id);
      const newData = {...it.data};
      if (newData.name !== undefined) newData.name = newTitle;
      else newData.title = newTitle;
      await sbUpdate('items', id, { data: newData });
    }
    closeModal();
    await reloadAll();
    renderAll();
    toast('Renamed ✓','ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function moveItem(id, delta) {
  const it = S.items.find(x=>x.id===id);
  if (!it) return;
  const siblings = S.items.filter(x=>x.section_id===it.section_id).sort((a,b)=>a.order_idx-b.order_idx);
  const idx = siblings.findIndex(x=>x.id===id);
  const target = idx + delta;
  if (target < 0 || target >= siblings.length) return;
  try {
    const other = siblings[target];
    await sbUpdate('items', id, { order_idx: other.order_idx });
    await sbUpdate('items', other.id, { order_idx: it.order_idx });
    await reloadAll();
    renderCanvas();
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function openAddCustomField(scope, id) {
  openModal(
    '<h3>Add <em>Custom Field</em></h3>' +
    '<p>Add any field to this '+scope+'. Letters, numbers, underscores only.</p>' +
    '<div class="modal-row"><label>Field Name</label><input class="fi" id="m-key" placeholder="e.g. spice_level"></div>' +
    '<div class="modal-row"><label>Type</label><select class="fi" id="m-type">' +
      '<option value="text">Short Text</option>' +
      '<option value="textarea">Long Text</option>' +
      '<option value="number">Number</option>' +
      '<option value="url">URL / Image</option>' +
      '<option value="boolean">Yes / No</option>' +
    '</select></div>' +
    '<div class="modal-btns">' +
      '<button class="tb-btn" onclick="closeModal()">Cancel</button>' +
      '<button class="tb-btn primary" onclick="submitAddCustomField(\''+scope+'\',\''+id+'\')">Add Field</button>' +
    '</div>'
  );
  setTimeout(() => document.getElementById('m-key').focus(), 80);
}
async function submitAddCustomField(scope, id) {
  const key = document.getElementById('m-key').value.trim().replace(/\s+/g,'_');
  const type = document.getElementById('m-type').value;
  if (!key) return toast('Field name required', 'err');
  if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(key)) return toast('Letters/numbers/underscores', 'err');
  const defaultVal = type === 'boolean' ? false : type === 'number' ? null : '';
  try {
    if (scope === 'page') {
      const p = S.pages.find(x=>x.id===id);
      if ((p.settings||{})[key] !== undefined) return toast('Field already exists', 'err');
      await sbUpdate('pages', id, { settings: {...(p.settings||{}), [key]: defaultVal} });
    } else if (scope === 'section') {
      const s = S.sections.find(x=>x.id===id);
      if ((s.settings||{})[key] !== undefined) return toast('Field already exists', 'err');
      await sbUpdate('sections', id, { settings: {...(s.settings||{}), [key]: defaultVal} });
    } else if (scope === 'item') {
      const it = S.items.find(x=>x.id===id);
      if ((it.data||{})[key] !== undefined) return toast('Field already exists', 'err');
      await sbUpdate('items', id, { data: {...(it.data||{}), [key]: defaultVal} });
    }
    closeModal();
    await reloadAll();
    renderCanvas();
    toast('Field added ✓','ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function removeCustomField(patchPath) {
  const [scope, id, key] = patchPath.split(':');
  if (!confirm('Remove the "'+key+'" field? Its value will be lost.')) return;
  try {
    if (scope === 'page_settings') {
      const p = S.pages.find(x=>x.id===id);
      const ns = {...(p.settings||{})}; delete ns[key];
      await sbUpdate('pages', id, { settings: ns });
    } else if (scope === 'section_settings') {
      const s = S.sections.find(x=>x.id===id);
      const ns = {...(s.settings||{})}; delete ns[key];
      await sbUpdate('sections', id, { settings: ns });
    } else if (scope === 'item_data') {
      const it = S.items.find(x=>x.id===id);
      const nd = {...(it.data||{})}; delete nd[key];
      await sbUpdate('items', id, { data: nd });
    }
    await reloadAll();
    renderCanvas();
    toast('Field removed', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}


/* ══════════════════════════════════════════════════════════════════
   COMMAND PALETTE (⌘K)
══════════════════════════════════════════════════════════════════ */
function openCmdk() {
  const bg = document.getElementById('cmdk-bg');
  bg.classList.add('show');
  const input = document.getElementById('cmdk-input');
  input.value = '';
  renderCmdkList('');
  setTimeout(() => input.focus(), 50);
  input.oninput = () => renderCmdkList(input.value);
  input.onkeydown = e => {
    const items = document.querySelectorAll('.cmdk-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); S.cmdkSel = Math.min(items.length-1, S.cmdkSel+1); updateCmdkSel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); S.cmdkSel = Math.max(0, S.cmdkSel-1); updateCmdkSel(); }
    else if (e.key === 'Enter') { e.preventDefault(); items[S.cmdkSel]?.click(); }
    else if (e.key === 'Escape') closeCmdk();
  };
}
function closeCmdk() {
  document.getElementById('cmdk-bg').classList.remove('show');
}
function renderCmdkList(q) {
  const list = document.getElementById('cmdk-list');
  const Q = q.toLowerCase();
  const results = [];
  S.pages.forEach(p => {
    if (!Q || p.title.toLowerCase().includes(Q)) results.push({ kind:'Page', icon:p.icon||'📄', title:p.title, crumb:'Page', action:() => { S.activePageId = p.id; sessionStorage.setItem('fs_cms_page', p.id); renderAll(); } });
  });
  S.sections.forEach(s => {
    const p = S.pages.find(x => x.id === s.page_id);
    if (!Q || s.title.toLowerCase().includes(Q)) results.push({ kind:'Section', icon:s.icon||KINDS[s.kind]?.icon||'▦', title:s.title, crumb:(p?.title||'')+' · Section', action:() => {
      S.activePageId = s.page_id; sessionStorage.setItem('fs_cms_page', s.page_id);
      renderAll();
      setTimeout(() => {
        const el = document.querySelector('[data-section="'+s.id+'"]');
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
      }, 100);
    }});
  });
  S.items.forEach(it => {
    const name = it.data?.name || it.data?.title || '';
    if (!name) return;
    if (Q && !name.toLowerCase().includes(Q)) return;
    const s = S.sections.find(x => x.id === it.section_id);
    const p = s ? S.pages.find(x => x.id === s.page_id) : null;
    results.push({ kind:'Item', icon:it.data?.img ? '🖼️' : '·', title:name, crumb:(p?.title||'')+' · '+(s?.title||''), action:() => {
      S.activePageId = s.page_id; sessionStorage.setItem('fs_cms_page', s.page_id);
      S.editingItemId = it.id;
      renderAll();
      setTimeout(() => {
        const el = document.querySelector('[data-item="'+it.id+'"]');
        if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
      }, 100);
    }});
  });

  if (!results.length) {
    list.innerHTML = '<div class="empty" style="padding:30px 10px">No results</div>';
    S.cmdkSel = -1;
    return;
  }
  list.innerHTML = results.slice(0, 30).map((r, i) =>
    '<div class="cmdk-item ' + (i===0?'sel':'') + '" data-cmdk-idx="'+i+'">' +
      '<span class="cmdk-icon">'+esc(r.icon)+'</span>' +
      '<div class="cmdk-body">' +
        '<div class="cmdk-title">'+esc(r.title)+'</div>' +
        '<div class="cmdk-crumb">'+esc(r.crumb)+'</div>' +
      '</div>' +
      '<span class="cmdk-kind">'+r.kind+'</span>' +
    '</div>'
  ).join('');
  S.cmdkSel = 0;
  list.querySelectorAll('.cmdk-item').forEach((el, i) => {
    el.onclick = () => { results[i]?.action?.(); closeCmdk(); };
    el.onmouseenter = () => { S.cmdkSel = i; updateCmdkSel(); };
  });
}
function updateCmdkSel() {
  document.querySelectorAll('.cmdk-item').forEach((el, i) => el.classList.toggle('sel', i === S.cmdkSel));
  const sel = document.querySelector('.cmdk-item.sel');
  if (sel) sel.scrollIntoView({ block:'nearest' });
}

/* ══════════════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════════════ */
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════════
   GLOBAL KEYBOARD
══════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (!S.authed) return;
  // ⌘K / Ctrl+K — command palette
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    openCmdk();
    return;
  }
  // ⌘S / Ctrl+S — save now
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    flushSaves(true);
    return;
  }
  // Escape — close things
  if (e.key === 'Escape') {
    if (document.getElementById('cmdk-bg').classList.contains('show')) return closeCmdk();
    if (document.getElementById('modal-bg').classList.contains('show')) return closeModal();
    closeCtx();
    if (S.editingItemId) { S.editingItemId = null; renderCanvas(); }
    if (S.editingZone) { S.editingZone = null; renderCanvas(); }
  }
});

/* ══════════════════════════════════════════════════════════════════
   WARN ON UNSAVED + INIT
══════════════════════════════════════════════════════════════════ */
window.addEventListener('beforeunload', e => {
  if (S.dirty.size > 0) { e.preventDefault(); e.returnValue = 'Unsaved changes.'; return e.returnValue; }
});

buildPinPad();
if (sessionStorage.getItem('fs_cms_auth') === '1') {
  S.authed = true;
  bootApp();
}
</script>
