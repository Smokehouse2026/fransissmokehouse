<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Francis — Renderer Test</title>
<link rel="stylesheet" href="render.css">
<style>
  body { margin: 0; background: #090704; }
  #test-bar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(22,14,6,.95);
    border-bottom: 1px solid rgba(196,160,112,.22);
    padding: 8px 14px;
    z-index: 100;
    display: flex; align-items: center; gap: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(196,160,112,.72);
    overflow-x: auto;
  }
  #test-bar strong { color: #f08820; }
  #test-bar button {
    background: transparent; border: 1px solid rgba(196,160,112,.22);
    color: rgba(196,160,112,.72);
    font-family: inherit; font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
    white-space: nowrap;
  }
  #test-bar button:hover { border-color: #f08820; color: #f08820; }
  #test-bar button.active { background: rgba(192,72,0,.2); border-color: #f08820; color: #f08820; }
  #fs-root { padding-top: 44px; }
</style>
</head>
<body>

<div id="test-bar">
  <strong>Renderer Test ·</strong>
  <button data-slug="home">Home</button>
  <button data-slug="menu">Menu</button>
  <button data-slug="market">Market</button>
  <button data-slug="gift">Gift Cards</button>
  <button data-slug="find">Find Us</button>
  <button data-slug="cater">Catering</button>
  <button data-slug="about">About</button>
</div>

<div id="fs-root"></div>

<script src="render.js"></script>
<script>
  async function load(slug) {
    document.querySelectorAll('#test-bar button').forEach(b =>
      b.classList.toggle('active', b.dataset.slug === slug));
    history.replaceState(null, '', '?page=' + slug);
    await window.FrancisRender.mount({
      root: '#fs-root',
      pageSlug: slug,
      editMode: false,
    });
  }

  document.querySelectorAll('#test-bar button').forEach(btn => {
    btn.onclick = () => load(btn.dataset.slug);
  });

  const initSlug = new URLSearchParams(location.search).get('page') || 'home';
  load(initSlug);
</script>
</body>
</html>
