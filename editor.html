<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Francis CMS · The Francis Smokehouse</title>
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#090704;--deep:#120d07;--surface:#1a1108;--card:#22160a;
  --border:rgba(196,160,112,.12);
  --border-str:rgba(196,160,112,.24);
  --ember:#c04800;--fire:#e06010;--flame:#f08820;--glow:#f5a830;
  --cream:#f5e8cc;--parch:#e8d4a8;--sand:#c4a070;--mid:#7a5830;--lo:#8a6840;
  --text:var(--cream);
  --text2:rgba(196,160,112,.72);
  --text3:rgba(196,160,112,.44);
  --ember-bg:rgba(192,72,0,.14);
  --danger:#ff6a3a;
  --success:#9ad060;
  --serif:'Playfair Display',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --rd:12px;--rd-sm:8px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--body);font-weight:400;-webkit-tap-highlight-color:transparent;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.028'/%3E%3C/svg%3E");}

/* ══════════════════════════════════
   TOAST
══════════════════════════════════ */
#toastBox{position:fixed;top:16px;right:16px;z-index:100000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{pointer-events:auto;padding:11px 18px;border-radius:var(--rd-sm);font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;backdrop-filter:blur(12px);animation:tIn .3s ease, tOut .4s 2.6s ease forwards;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:340px;}
.toast.ok{background:rgba(30,60,40,.92);border:1px solid rgba(154,208,96,.22);color:var(--success);}
.toast.err{background:rgba(60,20,10,.92);border:1px solid rgba(255,106,58,.25);color:var(--danger);}
.toast.info{background:rgba(30,20,10,.92);border:1px solid var(--border-str);color:var(--cream);}
@keyframes tIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{to{opacity:0;transform:translateX(40px)}}

/* ══════════════════════════════════
   PIN SCREEN
══════════════════════════════════ */
#pin-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,#1e1510,#0a0806 50%,#050404);transition:opacity .4s;}
#pin-screen.gone{opacity:0;pointer-events:none;}
.pin-box{max-width:420px;width:100%;text-align:center;}
.pin-brand{font-family:var(--serif);font-weight:700;font-size:clamp(22px,3vw,30px);color:var(--cream);margin-bottom:4px;letter-spacing:.01em;}
.pin-brand em{font-style:italic;color:var(--flame);font-weight:400;}
.pin-sub{font-family:var(--cond);font-weight:500;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(196,160,112,.38);margin-bottom:44px;}
.pin-title{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;color:var(--cream);line-height:1;margin-bottom:14px;}
.pin-title em{font-style:italic;font-weight:400;color:var(--flame);}
.pin-instruction{font-family:var(--body);font-weight:300;font-size:14px;color:rgba(196,160,112,.55);margin-bottom:32px;line-height:1.6;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(196,160,112,.3);transition:all .2s;}
.pin-dot.filled{background:var(--flame);border-color:var(--flame);box-shadow:0 0 12px rgba(240,136,32,.5);}
.pin-dot.error{background:var(--ember);border-color:var(--ember);animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;}
.pin-btn{aspect-ratio:1.2;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--cream);background:rgba(22,14,6,.75);border:1px solid rgba(196,160,112,.15);border-radius:8px;cursor:pointer;transition:all .2s;}
.pin-btn:hover,.pin-btn:active{border-color:rgba(240,136,32,.4);background:rgba(192,72,0,.12);color:var(--flame);transform:scale(1.03);}
.pin-btn.del{font-size:20px;color:rgba(196,160,112,.6);}
.pin-btn.submit{background:linear-gradient(135deg,var(--ember),var(--fire));border-color:var(--fire);color:#fff;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.15em;}
.pin-msg{font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-top:18px;height:16px;opacity:0;transition:opacity .25s;}
.pin-msg.show{opacity:1;}

/* ══════════════════════════════════
   APP SHELL
══════════════════════════════════ */
#app{display:none;position:fixed;inset:0;z-index:5;background:var(--void);flex-direction:column;}
#app.on{display:flex;}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--deep);flex-shrink:0;min-height:58px;}
.tb-brand{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--cream);letter-spacing:.01em;white-space:nowrap;}
.tb-brand em{font-style:italic;color:var(--flame);font-weight:400;}
.tb-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.tb-role{font-family:var(--cond);font-weight:700;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--flame);padding:4px 10px;border:1px solid rgba(240,136,32,.28);border-radius:100px;flex-shrink:0;}

.tb-save{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto;}
.tb-save .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.tb-save.saving{color:var(--flame);}
.tb-save.saving .dot{animation:pulse 1s ease-in-out infinite;}
.tb-save.saved{color:var(--success);}
.tb-save.err{color:var(--danger);}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

.tb-btn{padding:8px 14px;border-radius:var(--rd-sm);border:1px solid var(--border-str);background:rgba(22,14,6,.65);color:var(--text2);font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .18s;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;}
.tb-btn:hover{background:rgba(192,72,0,.12);border-color:rgba(240,136,32,.4);color:var(--flame);}
.tb-btn.lock:hover{border-color:rgba(255,106,58,.4);color:var(--danger);}
.tb-btn.primary{background:linear-gradient(135deg,var(--ember),var(--fire));border:none;color:#fff;font-weight:800;box-shadow:0 3px 14px rgba(192,72,0,.35);}
.tb-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,72,0,.5);}

/* TAB STRIP */
.tabstrip{display:flex;align-items:center;gap:4px;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabstrip::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:var(--rd-sm);border:1px solid transparent;background:transparent;color:var(--text2);font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:7px;flex-shrink:0;}
.tab:hover{background:rgba(255,255,255,.03);color:var(--cream);}
.tab.active{background:var(--ember-bg);color:var(--flame);border-color:rgba(240,136,32,.22);}
.tab-icon{font-size:14px;filter:drop-shadow(0 0 4px rgba(240,136,32,.3));}
.tab-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:rgba(0,0,0,.3);color:var(--text3);}
.tab.active .tab-badge{background:rgba(240,136,32,.2);color:var(--flame);}
.tab-add{padding:7px 12px;border-radius:var(--rd-sm);border:1px dashed var(--border-str);background:transparent;color:var(--text3);font-size:14px;cursor:pointer;transition:all .15s;flex-shrink:0;margin-left:4px;}
.tab-add:hover{border-color:var(--flame);color:var(--flame);background:rgba(192,72,0,.06);}

/* BODY */
.body{flex:1;display:flex;min-height:0;overflow:hidden;}
.scrollarea{flex:1;overflow-y:auto;overflow-x:hidden;padding:clamp(16px,2.5vw,28px) clamp(14px,2.5vw,32px) 60px;}
.scrollarea::-webkit-scrollbar{width:8px;}
.scrollarea::-webkit-scrollbar-thumb{background:rgba(196,160,112,.15);border-radius:4px;}
.scrollarea::-webkit-scrollbar-track{background:transparent;}

/* PAGE HEADER */
.page-head{max-width:1100px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border);}
.ph-left{flex:1;min-width:0;}
.ph-eyebrow{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--flame);opacity:.8;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.ph-eyebrow::before{content:'';width:14px;height:1px;background:currentColor;}
.ph-title{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;line-height:1;color:var(--cream);}
.ph-title em{font-style:italic;color:var(--flame);font-weight:400;}
.ph-sub{font-family:var(--body);font-weight:300;font-size:13.5px;color:var(--text3);margin-top:8px;line-height:1.55;max-width:760px;}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}

/* PAGE-LEVEL SETTINGS CARD */
.settings-card{max-width:1100px;margin:0 auto 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rd);overflow:hidden;}
.sc-head{padding:12px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none;transition:background .15s;}
.sc-head:hover{background:rgba(255,255,255,.025);}
.sc-arrow{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.settings-card.open .sc-arrow{transform:rotate(90deg);color:var(--flame);}
.sc-title{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);flex:1;}
.sc-badge{font-size:9px;font-weight:700;letter-spacing:.12em;padding:3px 9px;border-radius:100px;background:var(--ember-bg);color:var(--flame);text-transform:uppercase;}
.sc-body{display:none;padding:0 18px 18px;}
.settings-card.open .sc-body{display:block;}

/* ACCORDION SECTIONS */
.sections-wrap{max-width:1100px;margin:0 auto;}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rd);margin-bottom:10px;overflow:hidden;transition:border-color .2s;}
.section-card.open{border-color:var(--border-str);}
.sh{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s;}
.sh:hover{background:rgba(255,255,255,.025);}
.sh-arrow{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.section-card.open .sh-arrow{transform:rotate(90deg);color:var(--flame);}
.sh-icon{font-size:16px;flex-shrink:0;filter:drop-shadow(0 0 4px rgba(240,136,32,.25));}
.sh-title{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--cream);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1;}
.sh-meta{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);white-space:nowrap;}
.sh-count{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--ember-bg);color:var(--flame);font-family:var(--cond);letter-spacing:.08em;}
.sh-acts{display:flex;gap:3px;opacity:0;transition:opacity .2s;flex-shrink:0;}
.sh:hover .sh-acts, .section-card.open .sh-acts{opacity:1;}
.sh-act{width:26px;height:26px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--text3);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.sh-act:hover{background:rgba(196,160,112,.1);color:var(--flame);border-color:var(--border);}
.sh-act.danger:hover{color:var(--danger);border-color:rgba(255,106,58,.3);}

.sb{display:none;padding:4px 18px 18px;border-top:1px solid var(--border);background:rgba(9,7,4,.28);}
.section-card.open .sb{display:block;}

/* SECTION SETTINGS SUBSECTION */
.sb-part{padding-top:16px;}
.sb-part-title{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sb-part-title::before{content:'';width:14px;height:1px;background:currentColor;}

/* FIELDS */
.field{margin-bottom:11px;}
.fl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;}
.fl-l{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);}
.fl-l em{color:var(--glow);font-style:normal;font-weight:700;margin-left:6px;font-size:9px;}
.fl-meta{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.field:hover .fl-meta, .field:focus-within .fl-meta{opacity:1;}
.fl-mb{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--text3);font-size:10px;cursor:pointer;transition:all .15s;}
.fl-mb:hover{background:rgba(196,160,112,.1);color:var(--flame);}
.fl-mb.del:hover{color:var(--danger);}

.fi{width:100%;font-family:var(--body);font-weight:400;font-size:14px;color:var(--cream);background:rgba(9,7,4,.55);border:1px solid rgba(196,160,112,.1);border-radius:6px;padding:9px 12px;outline:none;transition:border-color .18s, box-shadow .18s;-webkit-appearance:none;line-height:1.5;}
.fi:focus{border-color:rgba(240,136,32,.5);box-shadow:0 0 0 2px rgba(192,72,0,.1);}
.fi-ta{resize:vertical;min-height:68px;line-height:1.6;}
.fi-ta.long{min-height:110px;}
.fi-ta.html{font-family:var(--mono);font-size:12.5px;}
select.fi{cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23f08820' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;appearance:none;}
select.fi option{background:#1a1108;color:var(--cream);}
.fhint{font-family:var(--body);font-weight:300;font-size:11.5px;color:var(--text3);margin-top:5px;line-height:1.5;}
.fhint code{font-family:var(--mono);font-size:10.5px;color:var(--flame);background:rgba(192,72,0,.1);padding:1px 5px;border-radius:2px;}

.field.dirty .fi{border-left:3px solid var(--flame);}
.field.custom .fi{border-left:3px solid var(--glow);}

.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:640px){.fr,.fr3{grid-template-columns:1fr;}}

/* IMAGE FIELD */
.img-field{display:flex;gap:10px;align-items:flex-start;}
.img-field .fi{flex:1;}
.img-preview{width:60px;height:60px;border-radius:6px;background:rgba(9,7,4,.7);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.img-preview img{width:100%;height:100%;object-fit:cover;}
.img-ph{font-size:18px;opacity:.3;}

/* CHECKBOX */
.cbx-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.cbx{width:18px;height:18px;border-radius:4px;border:1.5px solid rgba(196,160,112,.3);background:rgba(9,7,4,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;}
.cbx.on{background:var(--fire);border-color:var(--fire);}
.cbx.on::after{content:'✓';color:#fff;font-weight:700;font-size:12px;}
.cbx-lbl{font-family:var(--body);font-weight:400;font-size:13px;color:var(--text);cursor:pointer;}

/* ITEMS */
.items-ctrl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
.items-count{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);}

.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--rd-sm);margin-bottom:8px;overflow:hidden;transition:border-color .18s;}
.item.open{border-color:var(--border-str);}
.ih{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .15s;}
.ih:hover{background:rgba(255,255,255,.03);}
.ih-arrow{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.item.open .ih-arrow{transform:rotate(90deg);color:var(--flame);}
.ih-idx{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--text3);min-width:22px;}
.ih-thumb{width:34px;height:34px;border-radius:5px;background:rgba(9,7,4,.6);border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ih-thumb img{width:100%;height:100%;object-fit:cover;}
.ih-thumb-ph{font-size:13px;opacity:.3;}
.ih-body{flex:1;min-width:0;}
.ih-name{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--cream);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ih-sub{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.1em;color:var(--text3);margin-top:2px;}
.ih-price{font-family:var(--cond);font-weight:800;font-size:14px;color:var(--glow);letter-spacing:.02em;white-space:nowrap;flex-shrink:0;}
.ih-acts{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s;}
.ih:hover .ih-acts, .item.open .ih-acts{opacity:1;}
.ih-act{width:24px;height:24px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ih-act:hover{background:rgba(196,160,112,.1);color:var(--flame);border-color:var(--border);}
.ih-act.danger:hover{color:var(--danger);border-color:rgba(255,106,58,.3);}
.ih-act:disabled{opacity:.3;cursor:not-allowed;}

.ib{display:none;padding:4px 14px 14px;background:rgba(9,7,4,.28);border-top:1px solid var(--border);}
.item.open .ib{display:block;}
.ib-part{padding-top:12px;}

/* ADD BUTTONS */
.btn-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--flame);background:transparent;border:1px dashed rgba(240,136,32,.3);border-radius:var(--rd-sm);cursor:pointer;transition:all .18s;margin-top:8px;}
.btn-add:hover{background:rgba(192,72,0,.07);border-style:solid;border-color:var(--flame);}

.empty{text-align:center;padding:34px 20px;color:var(--text3);font-family:var(--body);font-weight:300;font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.4;}

/* WELCOME */
.welcome{max-width:640px;margin:40px auto;padding:0 20px;text-align:center;}
.welcome-icon{font-size:50px;margin-bottom:18px;filter:drop-shadow(0 0 20px rgba(240,136,32,.35));}
.welcome h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;color:var(--cream);margin-bottom:10px;line-height:1;}

/* CONN PILL */
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:600;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--lo);padding:5px 10px;border-radius:100px;background:rgba(0,0,0,.25);flex-shrink:0;}
.conn-dot{width:5px;height:5px;border-radius:50%;background:var(--lo);}
.conn-pill.ok{color:var(--success);}
.conn-pill.ok .conn-dot{background:var(--success);box-shadow:0 0 6px var(--success);}
.conn-pill.err{color:var(--danger);}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .22s;}
.modal-bg.show{opacity:1;pointer-events:all;}
.modal{background:var(--card);border:1px solid var(--border-str);border-radius:var(--rd);padding:clamp(20px,3vh,28px) clamp(20px,4vw,30px);max-width:460px;width:100%;max-height:86vh;overflow-y:auto;transform:translateY(12px) scale(.98);transition:transform .28s cubic-bezier(.16,1,.3,1);box-shadow:0 20px 50px rgba(0,0,0,.55);}
.modal-bg.show .modal{transform:translateY(0) scale(1);}
.modal h3{font-family:var(--serif);font-weight:800;font-size:21px;color:var(--cream);letter-spacing:-.01em;margin-bottom:6px;}
.modal h3 em{font-style:italic;color:var(--flame);font-weight:400;}
.modal p{font-family:var(--body);font-weight:300;font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:18px;}
.modal-row{margin-bottom:12px;}
.modal-row label{display:block;font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

/* MOBILE */

}

<script>
/* ══════════════════════════════════════════════════════════════════
   CONFIG

const KINDS = {

const TEMPLATES = {
  home_nav:           { label:'Home / Landing' },
  hero_with_sections: { label:'Hero + Sections' },

};

/* ══════════════════════════════════════════════════════════════════
   SUPABASE HELPERS
══════════════════════════════════════════════════════════════════ */
const sbHeaders = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
};
async function sbSelect(table, qs='') {
  const url = SB_URL + '/rest/v1/' + table + (qs || '?select=*');
  const r = await fetch(url, { headers: sbHeaders });
  if (!r.ok) throw new Error(table + ' GET ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbInsert(table, row) {
  const r = await fetch(SB_URL + '/rest/v1/' + table, {
    method:'POST', headers:{...sbHeaders, 'Prefer':'return=representation'},
    body: JSON.stringify(Array.isArray(row) ? row : [row])
  });
  if (!r.ok) throw new Error(table + ' POST ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbUpdate(table, id, patch) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method:'PATCH', headers:{...sbHeaders, 'Prefer':'return=representation'},
    body: JSON.stringify(patch)
  });
  if (!r.ok) throw new Error(table + ' PATCH ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbDelete(table, id) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method:'DELETE', headers: sbHeaders
  });
  if (!r.ok) throw new Error(table + ' DELETE ' + r.status);
}

/* ══════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════ */
const S = {
  authed: false,
  pin: '',
  pages: [],
  sections: [],
  items: [],
  settings: {},
  activePageId: null,
  openSections: new Set(),  // section ids currently expanded
  openItems: new Set(),     // item ids currently expanded
  openPageSettings: false,
  dirty: new Set(),         // patch paths pending save
  saveTimer: null,
};

/* UTILS */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slugify = s => (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50);
function cssEsc(s){return window.CSS?.escape ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g,'\\$&');}

function toast(msg, kind='info') {
  const tb = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  tb.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function setConn(state, txt) {
  const p = document.getElementById('conn-pill');
  p.className = 'conn-pill ' + state;
  document.getElementById('conn-text').textContent = txt;
}
function setSave(state, txt) {
  const e = document.getElementById('tb-save');
  e.className = 'tb-save ' + (state||'');
  document.getElementById('tb-save-txt').textContent = txt;
}


/* ══════════════════════════════════════════════════════════════════
   PIN
══════════════════════════════════════════════════════════════════ */
function buildPinPad() {
  const pad = document.getElementById('pin-pad');
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','submit'];
  pad.innerHTML = keys.map(k => {
    if (k === 'del') return '<button class="pin-btn del" data-v="del">⌫</button>';
    if (k === 'submit') return '<button class="pin-btn submit" data-v="submit">Enter</button>';
    return '<button class="pin-btn" data-v="'+k+'">'+k+'</button>';
  }).join('');
  pad.querySelectorAll('.pin-btn').forEach(b => { b.onclick = () => onPinKey(b.dataset.v); });
  document.addEventListener('keydown', e => {
    if (S.authed) return;
    if (/^[0-9]$/.test(e.key)) onPinKey(e.key);
    else if (e.key === 'Backspace') onPinKey('del');
    else if (e.key === 'Enter') onPinKey('submit');
  });
}
function onPinKey(k) {
  const dots = document.querySelectorAll('.pin-dot');
  if (k === 'del') S.pin = S.pin.slice(0,-1);
  else if (k === 'submit') { if (S.pin.length < 4) return flashPinErr(); return tryLogin(); }
  else if (S.pin.length < 6) S.pin += k;
  dots.forEach((d,i) => d.classList.toggle('filled', i < S.pin.length));
  if (S.pin.length === 6) setTimeout(tryLogin, 120);
}
function flashPinErr(msg) {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach(d => d.classList.add('error'));
  const m = document.getElementById('pin-msg');
  if (msg) m.textContent = msg;
  m.classList.add('show');
  setTimeout(() => { dots.forEach(d=>d.classList.remove('error','filled')); m.classList.remove('show'); S.pin=''; }, 900);
}
async function tryLogin() {
  try {
    const rows = await sbSelect('cms_settings', '?select=*&key=eq.editor_pin');
    if (!rows || !rows.length) return flashPinErr('No PIN set in DB.');
    let pinVal = rows[0].value;
    if (typeof pinVal === 'string') pinVal = pinVal.replace(/^"|"$/g,'');
    if (S.pin !== String(pinVal)) return flashPinErr();
    S.authed = true;
    sessionStorage.setItem('fs_cms_auth','1');
    await bootApp();
  } catch (err) {
    console.error(err);
    flashPinErr('Connection error.');
  }
}
function logout() {
  sessionStorage.removeItem('fs_cms_auth');
  location.reload();
}

/* ══════════════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════════════ */
async function bootApp() {
  try {
    setConn('ok', 'Loading...');
    await reloadAll();
    document.getElementById('pin-screen').classList.add('gone');
    setTimeout(() => {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('app').classList.add('on');
    }, 380);
    if (S.pages.length && !S.activePageId) S.activePageId = S.pages[0].id;
    renderTabs();
    renderView();
    setConn('ok','Connected');
  } catch (err) {
    console.error(err);
    setConn('err','Error');
    toast('Failed to load: ' + err.message, 'err');
  }
}
async function reloadAll() {
  const [pages, sections, items, settings] = await Promise.all([
    sbSelect('pages', '?select=*&order=order_idx.asc'),
    sbSelect('sections', '?select=*&order=order_idx.asc'),
    sbSelect('items', '?select=*&order=order_idx.asc'),
    sbSelect('cms_settings'),
  ]);
  S.pages = pages;
  S.sections = sections;
  S.items = items;
  S.settings = {};
  settings.forEach(r => { S.settings[r.key] = r.value; });
}

/* ══════════════════════════════════════════════════════════════════
   TABS
══════════════════════════════════════════════════════════════════ */
function renderTabs() {
  const strip = document.getElementById('tabstrip');
  if (!S.pages.length) {
    strip.innerHTML = '<button class="tab-add" onclick="openAddPageModal()">＋ First Page</button>';
    return;
  }
  let html = S.pages.map(p => {
    const count = S.sections.filter(s => s.page_id === p.id).length;
    const active = S.activePageId === p.id;
    return '<button class="tab' + (active?' active':'') + '" data-page="' + p.id + '">' +
      '<span class="tab-icon">' + esc(p.icon || '📄') + '</span>' +
      '<span>' + esc(p.title) + '</span>' +
      '<span class="tab-badge">' + count + '</span>' +
      '</button>';
  }).join('');
  html += '<button class="tab-add" onclick="openAddPageModal()" title="Add page">＋</button>';
  strip.innerHTML = html;
  strip.querySelectorAll('.tab[data-page]').forEach(t => {
    t.onclick = () => {
      S.activePageId = t.dataset.page;
      S.openSections.clear();
      S.openItems.clear();
      S.openPageSettings = false;
      renderTabs();
      renderView();
      document.getElementById('scroll').scrollTop = 0;
    };
  });
}


/* ══════════════════════════════════════════════════════════════════
   VIEW (main body)
══════════════════════════════════════════════════════════════════ */
function renderView() {
  const v = document.getElementById('view');
  if (!S.pages.length) {
    v.innerHTML = '<div class="welcome">' +
      '<div class="welcome-icon">🔥</div>' +
      '<h1>Welcome to Francis <em>CMS</em></h1>' +
      '<p>No pages yet. Click "＋ First Page" above to get started.</p></div>';
    return;
  }
  if (!S.activePageId) { S.activePageId = S.pages[0].id; }
  const page = S.pages.find(p => p.id === S.activePageId);
  if (!page) { S.activePageId = S.pages[0]?.id; return renderView(); }

  const sections = S.sections.filter(s => s.page_id === page.id).sort((a,b)=>a.order_idx-b.order_idx);
  const tmpl = TEMPLATES[page.template] || TEMPLATES.hero_with_sections;

  let html = '';
  // PAGE HEADER
  html += '<div class="page-head"><div class="ph-left">';
  html +=   '<div class="ph-eyebrow">' + esc(tmpl.label) + ' · ' + sections.length + ' section' + (sections.length===1?'':'s') + '</div>';
  html +=   '<h1 class="ph-title">' + esc(page.icon||'') + ' ' + esc(page.title) + '</h1>';
  html +=   '<p class="ph-sub">URL slug: <code style="font-family:var(--mono);font-size:12px;color:var(--flame)">/' + esc(page.slug) + '</code></p>';
  html += '</div><div class="ph-actions">';
  html +=   '<button class="tb-btn" onclick="openRenameModal(\'page\',\'' + page.id + '\')">✎ Rename</button>';
  html +=   '<button class="tb-btn" onclick="duplicateNode(\'page\',\'' + page.id + '\')">⎘ Duplicate</button>';
  html +=   '<button class="tb-btn" style="color:var(--danger);border-color:rgba(255,106,58,.3)" onclick="confirmDelete(\'page\',\'' + page.id + '\')">✕ Delete</button>';
  html += '</div></div>';

  // PAGE SETTINGS CARD (collapsible)
  html += renderPageSettings(page);

  // SECTIONS LIST
  html += '<div class="sections-wrap">';
  if (sections.length === 0) {
    html += '<div class="empty"><div class="empty-icon">📭</div>No sections on this page yet.<br>Click the button below to add the first one.</div>';
  } else {
    sections.forEach(s => { html += renderSection(s); });
  }
  html += '<button class="btn-add" onclick="openAddSectionModal(\'' + page.id + '\')">＋ Add Section</button>';
  html += '</div>';

  v.innerHTML = html;
  bindAll();
}

/* PAGE SETTINGS CARD */
function renderPageSettings(page) {
  const s = page.settings || {};
  const known = ['hero_eyebrow','hero_title','hero_subtitle','hero_lead','header_subtitle'];
  const isOpen = S.openPageSettings;
  let html = '<div class="settings-card' + (isOpen?' open':'') + '" id="page-settings">';
  html += '<div class="sc-head" onclick="togglePageSettings()">';
  html +=   '<span class="sc-arrow">▸</span>';
  html +=   '<span class="sc-title">Page Settings · Title, Slug, Template, Hero</span>';
  html +=   '<span class="sc-badge">Page</span>';
  html += '</div>';
  html += '<div class="sc-body">';
  html += '<div class="fr">';
  html +=   fieldHtml('title', 'Page Title', page.title, {}, 'page:'+page.id+':title');
  html +=   fieldHtml('icon', 'Icon (emoji)', page.icon||'', {}, 'page:'+page.id+':icon');
  html += '</div>';
  html += fieldHtml('slug', 'URL Slug', page.slug, {hint:'Lowercase, hyphens only. Changes the page URL.'}, 'page:'+page.id+':slug');
  html += '<div class="field"><div class="fl"><span class="fl-l">Page Template</span></div>';
  html += '<select class="fi" data-patch="page:'+page.id+':template">' +
          Object.entries(TEMPLATES).map(([k,t]) =>
            '<option value="'+k+'"' + (page.template===k?' selected':'') + '>' + t.label + '</option>'
          ).join('') + '</select>';
  html += '<div class="fhint">Controls the overall page layout on the live site.</div></div>';

  html += '<div class="sb-part-title" style="margin-top:14px">Hero / Header Fields</div>';
  const heroFields = [
    {k:'hero_eyebrow', l:'Hero Eyebrow'},
    {k:'hero_title', l:'Hero Title', html:true, hint:'Use <em>...</em> for italic flame color. Use &lt;br&gt; for line break.'},
    {k:'hero_subtitle', l:'Hero Subtitle'},
    {k:'hero_lead', l:'Hero Lead Paragraph', textarea:true},
    {k:'header_subtitle', l:'Header Subtitle (menu only)'},
  ];
  heroFields.forEach(f => {
    html += fieldHtml(f.k, f.l, s[f.k]||'', {textarea:f.textarea, html:f.html, hint:f.hint}, 'page_settings:'+page.id+':'+f.k);
  });

  // Custom page settings (anything not in known list)
  const customKeys = Object.keys(s).filter(k => !known.includes(k));
  if (customKeys.length) {
    html += '<div class="sb-part-title" style="margin-top:14px">Custom Fields</div>';
    customKeys.forEach(k => {
      const val = s[k];
      html += fieldHtml(k, k, val, {textarea: typeof val === 'string' && val.length > 80}, 'page_settings:'+page.id+':'+k, true);
    });
  }
  html += '<button class="btn-add" onclick="openAddCustomField(\'page\',\''+page.id+'\')">＋ Add Custom Page Field</button>';
  html += '</div></div>';
  return html;
}

function togglePageSettings() {
  S.openPageSettings = !S.openPageSettings;
  const card = document.getElementById('page-settings');
  if (card) card.classList.toggle('open', S.openPageSettings);
}


/* ══════════════════════════════════════════════════════════════════
   SECTION ACCORDION
══════════════════════════════════════════════════════════════════ */
function renderSection(s) {
  const kind = KINDS[s.kind] || KINDS.items_grid;
  const items = S.items.filter(it => it.section_id === s.id).sort((a,b)=>a.order_idx-b.order_idx);
  const isOpen = S.openSections.has(s.id);
  const settings = s.settings || {};

  let html = '<div class="section-card' + (isOpen?' open':'') + '" data-section="'+s.id+'">';

  // HEADER
  html += '<div class="sh" data-toggle="'+s.id+'">';
  html +=   '<span class="sh-arrow">▸</span>';
  html +=   '<span class="sh-icon">' + esc(s.icon || kind.icon) + '</span>';
  html +=   '<div style="flex:1;min-width:0"><div class="sh-title">' + esc(s.title) + '</div>';
  html +=   '<div class="sh-meta">' + esc(kind.label) + '</div></div>';
  html +=   '<span class="sh-count">' + items.length + ' item' + (items.length===1?'':'s') + '</span>';
  html +=   '<span class="sh-acts">';
  html +=     '<button class="sh-act" data-act="rename-section" data-id="'+s.id+'" title="Rename">✎</button>';
  html +=     '<button class="sh-act" data-act="dup-section" data-id="'+s.id+'" title="Duplicate">⎘</button>';
  html +=     '<button class="sh-act danger" data-act="del-section" data-id="'+s.id+'" title="Delete">✕</button>';
  html +=   '</span>';
  html += '</div>';

  // BODY
  html += '<div class="sb">';

  // PART 1 — section meta (title, subtitle, icon, kind)
  html += '<div class="sb-part"><div class="sb-part-title">Section Details</div>';
  html += '<div class="fr">';
  html +=   fieldHtml('title', 'Title', s.title, {}, 'section:'+s.id+':title');
  html +=   fieldHtml('icon', 'Icon (emoji)', s.icon||'', {}, 'section:'+s.id+':icon');
  html += '</div>';
  html += fieldHtml('subtitle', 'Subtitle', s.subtitle||'', {}, 'section:'+s.id+':subtitle');
  html += '<div class="field"><div class="fl"><span class="fl-l">Kind (layout style)</span></div>';
  html += '<select class="fi" data-patch="section:'+s.id+':kind">' +
          Object.entries(KINDS).map(([k,kd]) =>
            '<option value="'+k+'"' + (s.kind===k?' selected':'') + '>' + kd.label + ' — ' + kd.desc + '</option>'
          ).join('') + '</select></div>';
  html += '</div>';

  // PART 2 — kind-specific settings (eyebrow, subtitle, body, etc.)
  if (kind.settingsFields && kind.settingsFields.length) {
    html += '<div class="sb-part"><div class="sb-part-title">' + esc(kind.label) + ' Settings</div>';
    kind.settingsFields.forEach(f => {
      html += fieldHtml(f.key, f.label, settings[f.key]||'', {
        textarea: f.textarea, html: f.html, hint: f.hint, type: f.type, long: f.long
      }, 'section_settings:'+s.id+':'+f.key);
    });
    // Custom section settings
    const knownKeys = kind.settingsFields.map(f => f.key);
    Object.keys(settings).forEach(k => {
      if (!knownKeys.includes(k)) {
        const val = settings[k];
        const isLong = typeof val === 'string' && (val.length > 80 || val.includes('\n'));
        html += fieldHtml(k, k, val, {textarea: isLong}, 'section_settings:'+s.id+':'+k, true);
      }
    });
    html += '<button class="btn-add" onclick="openAddCustomField(\'section\',\''+s.id+'\')">＋ Add Custom Section Field</button>';
    html += '</div>';
  }

  // PART 3 — items list
  if (kind.defaultItemFields.length > 0) {
    html += '<div class="sb-part"><div class="sb-part-title">Items in this Section</div>';
    if (items.length === 0) {
      html += '<div class="empty" style="padding:20px 14px"><div class="empty-icon">📋</div>No items yet. Click "Add Item" to create the first.</div>';
    } else {
      items.forEach((it, idx) => { html += renderItem(it, idx, items.length, kind); });
    }
    html += '<button class="btn-add" onclick="addItem(\''+s.id+'\')">＋ Add Item</button>';
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

/* ══════════════════════════════════════════════════════════════════
   ITEM ACCORDION
══════════════════════════════════════════════════════════════════ */
function renderItem(it, idx, total, kind) {
  const data = it.data || {};
  const name = data.name || data.title || '(unnamed)';
  const img = data.img || data.image;
  const price = data.price;
  const priceDisplay = price != null && price !== '' ? '$' + Number(price).toFixed(2) : '';
  const isOpen = S.openItems.has(it.id);
  const subtitle = data.icon ? esc(data.icon) + ' · ' + esc(kind.label) : esc(kind.label);

  let html = '<div class="item' + (isOpen?' open':'') + '" data-item="'+it.id+'">';

  // HEADER
  html += '<div class="ih" data-toggle-item="'+it.id+'">';
  html +=   '<span class="ih-arrow">▸</span>';
  html +=   '<span class="ih-idx">#'+(idx+1)+'</span>';
  html +=   '<span class="ih-thumb">' + (img ? '<img src="'+escA(img)+'" onerror="this.outerHTML=\'<span class=ih-thumb-ph>📷</span>\'">' : '<span class="ih-thumb-ph">·</span>') + '</span>';
  html +=   '<div class="ih-body"><div class="ih-name">' + esc(name) + '</div>' +
            (data.note || data.badge ? '<div class="ih-sub">' + esc(data.badge || data.note) + '</div>' : '') +
            '</div>';
  if (priceDisplay) html += '<span class="ih-price">' + priceDisplay + '</span>';
  html +=   '<span class="ih-acts">';
  html +=     '<button class="ih-act" data-act="move-up" data-id="'+it.id+'"' + (idx===0?' disabled':'') + ' title="Move up">▲</button>';
  html +=     '<button class="ih-act" data-act="move-dn" data-id="'+it.id+'"' + (idx===total-1?' disabled':'') + ' title="Move down">▼</button>';
  html +=     '<button class="ih-act" data-act="dup-item" data-id="'+it.id+'" title="Duplicate">⎘</button>';
  html +=     '<button class="ih-act danger" data-act="del-item" data-id="'+it.id+'" title="Delete">✕</button>';
  html +=   '</span>';
  html += '</div>';

  // BODY
  html += '<div class="ib"><div class="ib-part">';

  // Visibility
  html += '<div class="cbx-row" style="margin-bottom:10px">' +
          '<div class="cbx ' + (it.visible?'on':'') + '" data-patch="item:'+it.id+':visible" data-cbx="1"></div>' +
          '<span class="cbx-lbl">' + (it.visible?'Visible on site':'Hidden from site') + '</span></div>';

  // Kind-default fields
  const usedKeys = new Set();
  kind.defaultItemFields.forEach(f => {
    usedKeys.add(f.key);
    html += fieldHtml(f.key, f.label, data[f.key], f, 'item_data:'+it.id+':'+f.key);
  });

  // Custom fields (keys in data that aren't in defaults)
  Object.keys(data).forEach(k => {
    if (!usedKeys.has(k)) {
      const val = data[k];
      let type = 'text';
      if (typeof val === 'boolean') type = 'boolean';
      else if (typeof val === 'number') type = 'number';
      else if (typeof val === 'string' && (val.length > 80 || val.includes('\n'))) type = 'textarea';
      html += fieldHtml(k, k, val, {type}, 'item_data:'+it.id+':'+k, true);
    }
  });

  html += '<button class="btn-add" onclick="openAddCustomField(\'item\',\''+it.id+'\')">＋ Add Custom Field</button>';
  html += '</div></div></div>';
  return html;
}


/* ══════════════════════════════════════════════════════════════════
   FIELD HTML
══════════════════════════════════════════════════════════════════ */
function fieldHtml(key, label, value, opts, patchPath, isCustom) {
  opts = opts || {};
  const type = opts.type || (opts.textarea ? 'textarea' : 'text');
  const dirty = S.dirty.has(patchPath) ? ' dirty' : '';
  const custom = isCustom ? ' custom' : '';
  let inp = '';

  if (type === 'boolean') {
    const on = value === true || value === 'true';
    inp = '<div class="cbx-row"><div class="cbx ' + (on?'on':'') + '" data-patch="'+patchPath+'" data-cbx="1"></div>' +
          '<span class="cbx-lbl">' + (on?'Yes':'No') + '</span></div>';
  } else if (type === 'select') {
    inp = '<select class="fi" data-patch="'+patchPath+'">' +
          (opts.options||[]).map(o =>
            '<option value="'+escA(o)+'"' + (value===o?' selected':'') + '>' + esc(o||'—') + '</option>'
          ).join('') + '</select>';
  } else if (type === 'textarea' || opts.html) {
    const cls = 'fi fi-ta' + (opts.long?' long':'') + (opts.html?' html':'');
    inp = '<textarea class="'+cls+'" data-patch="'+patchPath+'">' + esc(value==null?'':value) + '</textarea>';
  } else if (type === 'url' && (key === 'img' || key === 'image')) {
    inp = '<div class="img-field">' +
          '<input class="fi" type="url" data-patch="'+patchPath+'" value="'+escA(value||'')+'" placeholder="https://...">' +
          '<div class="img-preview">' + (value ? '<img src="'+escA(value)+'" onerror="this.outerHTML=\'<span class=img-ph>📷</span>\'">' : '<span class="img-ph">📷</span>') + '</div>' +
          '</div>';
  } else {
    const t = type === 'number' ? 'number' : (type === 'url' ? 'url' : (type === 'email' ? 'email' : (type === 'tel' ? 'tel' : 'text')));
    inp = '<input class="fi" type="'+t+'" ' + (t==='number'?'step="0.01"':'') + ' data-patch="'+patchPath+'" value="'+escA(value==null?'':value)+'">';
  }

  const badge = isCustom ? '<em>Custom</em>' : '';
  const meta = isCustom ? '<div class="fl-meta"><button class="fl-mb del" onclick="removeCustomField(\''+patchPath+'\')" title="Remove field">✕</button></div>' : '';
  const hint = opts.hint ? '<div class="fhint">' + opts.hint + '</div>' : '';

  return '<div class="field'+dirty+custom+'" data-field-key="'+patchPath+'">' +
         '<div class="fl"><span class="fl-l">'+esc(label)+badge+'</span>'+meta+'</div>' +
         inp + hint + '</div>';
}

/* ══════════════════════════════════════════════════════════════════
   EVENT BINDING
══════════════════════════════════════════════════════════════════ */
function bindAll() {
  const v = document.getElementById('view');
  // Section toggle
  v.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = e => {
      if (e.target.closest('.sh-act')) return; // don't toggle on action buttons
      const id = el.dataset.toggle;
      if (S.openSections.has(id)) S.openSections.delete(id);
      else S.openSections.add(id);
      renderView();
    };
  });
  // Item toggle
  v.querySelectorAll('[data-toggle-item]').forEach(el => {
    el.onclick = e => {
      if (e.target.closest('.ih-act')) return;
      const id = el.dataset.toggleItem;
      if (S.openItems.has(id)) S.openItems.delete(id);
      else S.openItems.add(id);
      renderView();
    };
  });
  // Section actions
  v.querySelectorAll('.sh-act').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const id = el.dataset.id;
      const act = el.dataset.act;
      if (act === 'rename-section') openRenameModal('section', id);
      else if (act === 'dup-section') duplicateNode('section', id);
      else if (act === 'del-section') confirmDelete('section', id);
    };
  });
  // Item actions
  v.querySelectorAll('.ih-act').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      if (el.disabled) return;
      const id = el.dataset.id;
      const act = el.dataset.act;
      if (act === 'move-up') moveItem(id, -1);
      else if (act === 'move-dn') moveItem(id, 1);
      else if (act === 'dup-item') duplicateNode('item', id);
      else if (act === 'del-item') confirmDelete('item', id);
    };
  });
  // Field inputs
  v.querySelectorAll('input[data-patch],textarea[data-patch],select[data-patch]').forEach(el => {
    el.addEventListener('input', () => handleEdit(el.dataset.patch, el.value));
    el.addEventListener('change', () => handleEdit(el.dataset.patch, el.value));
  });
  // Checkbox
  v.querySelectorAll('.cbx[data-cbx]').forEach(cb => {
    cb.onclick = () => {
      const cur = cb.classList.contains('on');
      cb.classList.toggle('on', !cur);
      const lbl = cb.nextElementSibling;
      if (lbl && lbl.classList.contains('cbx-lbl')) {
        // figure out what label to show based on context
        const path = cb.dataset.patch;
        if (path && path.includes('item:') && path.endsWith(':visible')) lbl.textContent = !cur ? 'Visible on site' : 'Hidden from site';
        else lbl.textContent = !cur ? 'Yes' : 'No';
      }
      handleEdit(cb.dataset.patch, !cur);
    };
  });
  // Restore page settings card open-state
  if (S.openPageSettings) document.getElementById('page-settings')?.classList.add('open');
}

function handleEdit(patchPath, newValue) {
  const [scope, id, key] = patchPath.split(':');
  const rec = findRec(scope, id);
  if (!rec) return;

  if (scope === 'page') rec[key] = newValue;
  else if (scope === 'section') rec[key] = newValue;
  else if (scope === 'item' && key === 'visible') rec[key] = !!newValue;
  else if (scope === 'item') rec[key] = newValue;
  else if (scope === 'page_settings')    { rec.settings = {...(rec.settings||{}), [key]: newValue}; }
  else if (scope === 'section_settings') { rec.settings = {...(rec.settings||{}), [key]: newValue}; }
  else if (scope === 'item_data') {
    const v = (key === 'price' || key === 'priceLg') ? (newValue === '' ? null : Number(newValue))
            : (typeof newValue === 'boolean' ? newValue : newValue);
    rec.data = {...(rec.data||{}), [key]: v};
  }

  S.dirty.add(patchPath);
  updateSaveState();
  queueSave();

  // Mark field visually dirty
  const el = document.querySelector('[data-field-key="'+cssEsc(patchPath)+'"]');
  if (el) el.classList.add('dirty');

  // Tab counts + titles that need re-render on text changes
  const isTitleEdit = (scope === 'page' && key === 'title') ||
                     (scope === 'page' && key === 'icon') ||
                     (scope === 'section' && key === 'title') ||
                     (scope === 'item_data' && (key === 'name' || key === 'title'));
  if (scope === 'page' && (key === 'title' || key === 'icon')) renderTabs();
  // Lightweight DOM updates for section/item titles without full rerender
  if (scope === 'section' && key === 'title') {
    const card = document.querySelector('[data-section="'+id+'"] .sh-title');
    if (card) card.textContent = newValue;
  }
  if (scope === 'item_data' && (key === 'name' || key === 'title')) {
    const card = document.querySelector('[data-item="'+id+'"] .ih-name');
    if (card) card.textContent = newValue || '(unnamed)';
  }
}

function findRec(scope, id) {
  if (scope === 'page' || scope === 'page_settings') return S.pages.find(x => x.id === id);
  if (scope === 'section' || scope === 'section_settings') return S.sections.find(x => x.id === id);
  if (scope === 'item' || scope === 'item_data') return S.items.find(x => x.id === id);
  return null;
}

function updateSaveState() {
  if (S.dirty.size > 0) setSave('', S.dirty.size + ' unsaved');
  else setSave('saved', 'All saved');
}

/* ══════════════════════════════════════════════════════════════════
   DEBOUNCED SAVE
══════════════════════════════════════════════════════════════════ */
function queueSave() {
  if (S.saveTimer) clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(flushSaves, 1500);
}
async function flushSaves() {
  if (S.dirty.size === 0) return;
  setSave('saving','Saving...');
  const pageSet = new Set();
  const sectionSet = new Set();
  const itemSet = new Set();
  for (const path of S.dirty) {
    const [scope, id] = path.split(':');
    if (scope.startsWith('page')) pageSet.add(id);
    else if (scope.startsWith('section')) sectionSet.add(id);
    else if (scope.startsWith('item')) itemSet.add(id);
  }
  try {
    const promises = [];
    for (const id of pageSet) {
      const r = S.pages.find(x=>x.id===id);
      if (r) promises.push(sbUpdate('pages', id, {
        title: r.title, slug: r.slug, icon: r.icon, template: r.template, settings: r.settings, order_idx: r.order_idx
      }));
    }
    for (const id of sectionSet) {
      const r = S.sections.find(x=>x.id===id);
      if (r) promises.push(sbUpdate('sections', id, {
        title: r.title, subtitle: r.subtitle, icon: r.icon, slug: r.slug, kind: r.kind, settings: r.settings, order_idx: r.order_idx
      }));
    }
    for (const id of itemSet) {
      const r = S.items.find(x=>x.id===id);
      if (r) promises.push(sbUpdate('items', id, {
        data: r.data, visible: r.visible, order_idx: r.order_idx
      }));
    }
    await Promise.all(promises);
    S.dirty.clear();
    document.querySelectorAll('.field.dirty').forEach(el => el.classList.remove('dirty'));
    setSave('saved', 'Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  } catch (err) {
    console.error(err);
    setSave('err', 'Save failed');
    toast('Save failed: ' + err.message, 'err');
  }
}


/* ══════════════════════════════════════════════════════════════════
   CRUD — ADD/DUP/DELETE/RENAME
══════════════════════════════════════════════════════════════════ */
function openAddPageModal() {
  openModal(
    '<h3>Add <em>Page</em></h3>' +
    '<p>Create a new page for the site. You can add sections and items after.</p>' +
    '<div class="modal-row"><label>Page Title</label><input class="fi" id="m-title" placeholder="e.g. Specials Archive"></div>' +
    '<div class="modal-row"><label>URL Slug</label><input class="fi" id="m-slug" placeholder="auto-generated from title"></div>' +
    '<div class="modal-row"><label>Icon (emoji)</label><input class="fi" id="m-icon" value="📄"></div>' +
    '<div class="modal-row"><label>Template</label><select class="fi" id="m-tmpl">' +
      Object.entries(TEMPLATES).map(([k,t])=>'<option value="'+k+'">'+t.label+'</option>').join('') +
    '</select></div>' +
    '<div class="modal-btns"><button class="tb-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="tb-btn primary" onclick="submitAddPage()">Create Page</button></div>'
  );
  setTimeout(() => {
    const t = document.getElementById('m-title');
    t.focus();
    t.addEventListener('input', e => {
      document.getElementById('m-slug').value = slugify(e.target.value);
    });
  }, 80);
}
async function submitAddPage() {
  const title = document.getElementById('m-title').value.trim();
  const slug  = document.getElementById('m-slug').value.trim() || slugify(title);
  const icon  = document.getElementById('m-icon').value.trim() || '📄';
  const template = document.getElementById('m-tmpl').value;
  if (!title) return toast('Title required', 'err');
  try {
    const maxOrder = Math.max(0, ...S.pages.map(p => p.order_idx || 0));
    const rows = await sbInsert('pages', { title, slug, icon, template, order_idx: maxOrder+1, settings: {} });
    closeModal();
    await reloadAll();
    S.activePageId = rows[0].id;
    renderTabs();
    renderView();
    toast('Page created ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function openAddSectionModal(pageId) {
  openModal(
    '<h3>Add <em>Section</em></h3>' +
    '<p>Sections are the building blocks of a page — menu categories, review lists, step guides, etc.</p>' +
    '<div class="modal-row"><label>Section Title</label><input class="fi" id="m-title" placeholder="e.g. Seasonal Menu"></div>' +
    '<div class="modal-row"><label>Kind (what it renders as)</label><select class="fi" id="m-kind">' +
      Object.entries(KINDS).map(([k,kd])=>'<option value="'+k+'">'+kd.label+' — '+kd.desc+'</option>').join('') +
    '</select></div>' +
    '<div class="modal-row"><label>Icon (optional emoji)</label><input class="fi" id="m-icon" placeholder="Leave blank for default"></div>' +
    '<div class="modal-btns"><button class="tb-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="tb-btn primary" onclick="submitAddSection(\''+pageId+'\')">Create Section</button></div>'
  );
  setTimeout(() => document.getElementById('m-title').focus(), 80);
}
async function submitAddSection(pageId) {
  const title = document.getElementById('m-title').value.trim();
  const kind  = document.getElementById('m-kind').value;
  const icon  = document.getElementById('m-icon').value.trim();
  if (!title) return toast('Title required', 'err');
  try {
    const maxOrder = Math.max(0, ...S.sections.filter(s=>s.page_id===pageId).map(s=>s.order_idx||0));
    const rows = await sbInsert('sections', { page_id: pageId, title, kind, icon: icon||null, slug: slugify(title), order_idx: maxOrder+1, settings:{} });
    closeModal();
    await reloadAll();
    renderTabs();
    S.openSections.add(rows[0].id);
    renderView();
    toast('Section created ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function addItem(sectionId) {
  try {
    const s = S.sections.find(x=>x.id===sectionId);
    const kind = KINDS[s?.kind] || KINDS.items_grid;
    const data = {};
    kind.defaultItemFields.forEach(f => {
      if (f.type === 'boolean') data[f.key] = false;
      else if (f.type === 'number') data[f.key] = null;
      else data[f.key] = '';
    });
    if (data.name !== undefined) data.name = 'New Item';
    else if (data.title !== undefined) data.title = 'New Item';
    const maxOrder = Math.max(0, ...S.items.filter(it=>it.section_id===sectionId).map(it=>it.order_idx||0));
    const rows = await sbInsert('items', { section_id: sectionId, data, order_idx: maxOrder+1, visible: true });
    await reloadAll();
    S.openSections.add(sectionId);
    S.openItems.add(rows[0].id);
    renderView();
    toast('Item added ✓', 'ok');
    // Scroll to new item
    setTimeout(() => {
      const el = document.querySelector('[data-item="'+rows[0].id+'"]');
      if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 120);
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function duplicateNode(type, id) {
  try {
    if (type === 'page') {
      const p = S.pages.find(x=>x.id===id);
      if (!p) return;
      const maxOrder = Math.max(0, ...S.pages.map(x=>x.order_idx||0));
      const newP = await sbInsert('pages', { title: p.title+' (copy)', slug: p.slug+'-copy-'+Date.now().toString(36), icon: p.icon, template: p.template, settings: p.settings, order_idx: maxOrder+1 });
      for (const s of S.sections.filter(x=>x.page_id===id)) {
        const newS = await sbInsert('sections', { page_id: newP[0].id, title: s.title, subtitle: s.subtitle, icon: s.icon, slug: s.slug, kind: s.kind, settings: s.settings, order_idx: s.order_idx });
        for (const it of S.items.filter(x=>x.section_id===s.id)) {
          await sbInsert('items', { section_id: newS[0].id, data: it.data, visible: it.visible, order_idx: it.order_idx });
        }
      }
      await reloadAll();
      S.activePageId = newP[0].id;
      renderTabs();
      renderView();
    } else if (type === 'section') {
      const s = S.sections.find(x=>x.id===id);
      if (!s) return;
      const maxOrder = Math.max(0, ...S.sections.filter(x=>x.page_id===s.page_id).map(x=>x.order_idx||0));
      const newS = await sbInsert('sections', { page_id: s.page_id, title: s.title+' (copy)', subtitle: s.subtitle, icon: s.icon, slug: (s.slug||'')+'-copy', kind: s.kind, settings: s.settings, order_idx: maxOrder+1 });
      for (const it of S.items.filter(x=>x.section_id===id)) {
        await sbInsert('items', { section_id: newS[0].id, data: it.data, visible: it.visible, order_idx: it.order_idx });
      }
      await reloadAll();
      S.openSections.add(newS[0].id);
      renderView();
    } else if (type === 'item') {
      const it = S.items.find(x=>x.id===id);
      if (!it) return;
      const maxOrder = Math.max(0, ...S.items.filter(x=>x.section_id===it.section_id).map(x=>x.order_idx||0));
      const newIt = await sbInsert('items', { section_id: it.section_id, data: {...it.data}, visible: it.visible, order_idx: maxOrder+1 });
      await reloadAll();
      S.openItems.add(newIt[0].id);
      renderView();
    }
    toast('Duplicated ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function confirmDelete(type, id) {
  const rec = findRec(type, id);
  const name = rec ? (rec.title || rec.data?.name || rec.data?.title || 'this') : 'this';
  const label = type === 'page' ? 'page (and all sections + items)'
              : type === 'section' ? 'section (and all items)'
              : 'item';
  openModal(
    '<h3>Delete <em>'+esc(name)+'</em>?</h3>' +
    '<p>This removes the ' + label + ' permanently. Cannot be undone.</p>' +
    '<div class="modal-btns"><button class="tb-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="tb-btn primary" style="background:linear-gradient(135deg,#a02010,#c04800)" onclick="doDelete(\''+type+'\',\''+id+'\')">Delete</button></div>'
  );
}
async function doDelete(type, id) {
  try {
    const table = type === 'page' ? 'pages' : type === 'section' ? 'sections' : 'items';
    await sbDelete(table, id);
    closeModal();
    await reloadAll();
    if (type === 'page' && S.activePageId === id) {
      S.activePageId = S.pages[0]?.id || null;
    }
    renderTabs();
    renderView();
    toast('Deleted ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function openRenameModal(type, id) {
  const rec = findRec(type, id);
  if (!rec) return;
  const cur = rec.title || rec.data?.name || rec.data?.title || '';
  openModal(
    '<h3>Rename</h3>' +
    '<div class="modal-row"><label>New Title</label><input class="fi" id="m-title" value="'+escA(cur)+'"></div>' +
    '<div class="modal-btns"><button class="tb-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="tb-btn primary" onclick="submitRename(\''+type+'\',\''+id+'\')">Save</button></div>'
  );
  setTimeout(() => { const el=document.getElementById('m-title'); el.focus(); el.select(); }, 80);
}
async function submitRename(type, id) {
  const newTitle = document.getElementById('m-title').value.trim();
  if (!newTitle) return toast('Title required', 'err');
  try {
    if (type === 'page') await sbUpdate('pages', id, { title: newTitle });
    else if (type === 'section') await sbUpdate('sections', id, { title: newTitle });
    else if (type === 'item') {
      const it = S.items.find(x=>x.id===id);
      const newData = {...it.data};
      if (newData.name !== undefined) newData.name = newTitle;
      else newData.title = newTitle;
      await sbUpdate('items', id, { data: newData });
    }
    closeModal();
    await reloadAll();
    renderTabs();
    renderView();
    toast('Renamed ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function moveItem(id, delta) {
  const it = S.items.find(x=>x.id===id);
  if (!it) return;
  const siblings = S.items.filter(x=>x.section_id===it.section_id).sort((a,b)=>a.order_idx-b.order_idx);
  const idx = siblings.findIndex(x=>x.id===id);
  const target = idx + delta;
  if (target < 0 || target >= siblings.length) return;
  try {
    const other = siblings[target];
    await sbUpdate('items', id, { order_idx: other.order_idx });
    await sbUpdate('items', other.id, { order_idx: it.order_idx });
    await reloadAll();
    renderView();
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

/* CUSTOM FIELDS */
function openAddCustomField(scope, id) {
  openModal(
    '<h3>Add <em>Custom Field</em></h3>' +
    '<p>Add any field you want to this '+scope+'. Field name: letters, numbers, underscores only.</p>' +
    '<div class="modal-row"><label>Field Name (key)</label><input class="fi" id="m-key" placeholder="e.g. spice_level"></div>' +
    '<div class="modal-row"><label>Field Type</label><select class="fi" id="m-type">' +
      '<option value="text">Short Text</option>' +
      '<option value="textarea">Long Text</option>' +
      '<option value="number">Number</option>' +
      '<option value="url">URL / Image</option>' +
      '<option value="boolean">Yes / No</option>' +
    '</select></div>' +
    '<div class="modal-btns"><button class="tb-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="tb-btn primary" onclick="submitAddCustomField(\''+scope+'\',\''+id+'\')">Add Field</button></div>'
  );
  setTimeout(() => document.getElementById('m-key').focus(), 80);
}
async function submitAddCustomField(scope, id) {
  const key = document.getElementById('m-key').value.trim().replace(/\s+/g,'_');
  const type = document.getElementById('m-type').value;
  if (!key) return toast('Field name required', 'err');
  if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(key)) return toast('Letters/numbers/underscores, start with letter', 'err');
  const defaultVal = type === 'boolean' ? false : type === 'number' ? null : '';
  try {
    if (scope === 'page') {
      const p = S.pages.find(x=>x.id===id);
      if ((p.settings||{})[key] !== undefined) return toast('Field already exists', 'err');
      await sbUpdate('pages', id, { settings: {...(p.settings||{}), [key]: defaultVal} });
    } else if (scope === 'section') {
      const s = S.sections.find(x=>x.id===id);
      if ((s.settings||{})[key] !== undefined) return toast('Field already exists', 'err');
      await sbUpdate('sections', id, { settings: {...(s.settings||{}), [key]: defaultVal} });
    } else if (scope === 'item') {
      const it = S.items.find(x=>x.id===id);
      if ((it.data||{})[key] !== undefined) return toast('Field already exists', 'err');
      await sbUpdate('items', id, { data: {...(it.data||{}), [key]: defaultVal} });
    }
    closeModal();
    await reloadAll();
    renderView();
    toast('Field added ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function removeCustomField(patchPath) {
  const [scope, id, key] = patchPath.split(':');
  if (!confirm('Remove the "'+key+'" field? Its value will be lost.')) return;
  try {
    if (scope === 'page_settings') {
      const p = S.pages.find(x=>x.id===id);
      const ns = {...(p.settings||{})}; delete ns[key];
      await sbUpdate('pages', id, { settings: ns });
    } else if (scope === 'section_settings') {
      const s = S.sections.find(x=>x.id===id);
      const ns = {...(s.settings||{})}; delete ns[key];
      await sbUpdate('sections', id, { settings: ns });
    } else if (scope === 'item_data') {
      const it = S.items.find(x=>x.id===id);
      const nd = {...(it.data||{})}; delete nd[key];
      await sbUpdate('items', id, { data: nd });
    }
    await reloadAll();
    renderView();
    toast('Field removed', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

/* ══════════════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════════════ */
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* WARN ON UNSAVED */
window.addEventListener('beforeunload', e => {
  if (S.dirty.size > 0) { e.preventDefault(); e.returnValue = 'Unsaved changes.'; return e.returnValue; }
});

/* INIT */
buildPinPad();
if (sessionStorage.getItem('fs_cms_auth') === '1') {
  S.authed = true;
  bootApp();
}
</script>
