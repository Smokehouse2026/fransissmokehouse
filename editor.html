<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Francis CMS · The Francis Smokehouse</title>
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#090704;--deep:#120d07;--coal:#1a1108;--ash:#2c1f0e;
  --ember:#c04800;--fire:#e06010;--flame:#f08820;--glow:#f5a830;
  --cream:#f5e8cc;--parch:#e8d4a8;--sand:#c4a070;--mid:#7a5830;
  --lo:#8a6840;
  --serif:'Playfair Display',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --panel:rgba(22,14,6,.92);
  --panel2:rgba(14,9,4,.88);
  --panel3:rgba(26,15,5,.95);
  --border:rgba(196,160,112,.14);
  --border-str:rgba(196,160,112,.28);
  --border2:rgba(240,136,32,.42);
  --ok:#90e060;
}
html,body{height:100%;background:var(--void);color:var(--cream);font-family:var(--body);font-weight:300;overflow:hidden;-webkit-tap-highlight-color:transparent;}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.028'/%3E%3C/svg%3E");}

/* ══════════════════════════════════
   PIN SCREEN
══════════════════════════════════ */
#pin-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(9,7,4,.98);transition:opacity .4s;}
#pin-screen.gone{opacity:0;pointer-events:none;}
.pin-box{max-width:420px;width:100%;text-align:center;}
.pin-brand{font-family:var(--serif);font-weight:700;font-size:clamp(22px,3vw,30px);color:var(--cream);margin-bottom:4px;letter-spacing:.01em;}
.pin-brand em{font-style:italic;color:var(--flame);font-weight:400;}
.pin-sub{font-family:var(--cond);font-weight:500;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(196,160,112,.38);margin-bottom:44px;}
.pin-title{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;color:var(--cream);line-height:1;margin-bottom:14px;}
.pin-title em{font-style:italic;font-weight:400;color:var(--flame);}
.pin-instruction{font-family:var(--body);font-weight:300;font-size:14px;color:rgba(196,160,112,.55);margin-bottom:32px;line-height:1.6;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:28px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(196,160,112,.3);transition:all .2s;}
.pin-dot.filled{background:var(--flame);border-color:var(--flame);box-shadow:0 0 12px rgba(240,136,32,.5);}
.pin-dot.error{background:var(--ember);border-color:var(--ember);animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;}
.pin-btn{aspect-ratio:1.2;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--cream);background:rgba(22,14,6,.75);border:1px solid rgba(196,160,112,.15);border-radius:8px;cursor:pointer;transition:all .2s;}
.pin-btn:hover,.pin-btn:active{border-color:rgba(240,136,32,.4);background:rgba(192,72,0,.12);color:var(--flame);transform:scale(1.03);}
.pin-btn.del{font-size:20px;color:rgba(196,160,112,.6);}
.pin-btn.submit{background:linear-gradient(135deg,var(--ember),var(--fire));border-color:var(--fire);color:#fff;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.15em;}
.pin-msg{font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-top:18px;height:16px;opacity:0;transition:opacity .25s;}
.pin-msg.show{opacity:1;}

/* ══════════════════════════════════
   APP LAYOUT
══════════════════════════════════ */
#app{display:none;height:100vh;flex-direction:column;position:relative;z-index:1;}
#app.on{display:flex;}

/* TOP BAR */
#topbar{flex-shrink:0;height:56px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:16px;position:relative;z-index:10;}
.tb-brand{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--cream);letter-spacing:.01em;}
.tb-brand em{font-style:italic;color:var(--flame);font-weight:400;}
.tb-role{font-family:var(--cond);font-weight:600;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--flame);padding:4px 10px;border:1px solid rgba(240,136,32,.28);border-radius:100px;}
.tb-crumbs{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(196,160,112,.5);overflow:hidden;white-space:nowrap;min-width:0;}
.tb-crumb{transition:color .2s;}
.tb-crumb.link{cursor:pointer;}
.tb-crumb.link:hover{color:var(--flame);}
.tb-crumb.cur{color:var(--cream);font-weight:600;}
.tb-sep{color:rgba(196,160,112,.2);font-size:9px;}
.tb-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tb-btn{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:rgba(22,14,6,.6);color:rgba(196,160,112,.65);transition:all .2s;display:flex;align-items:center;gap:6px;}
.tb-btn:hover{border-color:var(--border2);color:var(--flame);}
.tb-btn.primary{background:linear-gradient(90deg,var(--ember),var(--fire));border-color:var(--fire);color:#fff;font-weight:700;box-shadow:0 3px 12px rgba(192,72,0,.3);}
.tb-btn.primary:hover{box-shadow:0 6px 20px rgba(192,72,0,.5);transform:translateY(-1px);}
.tb-btn.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.tb-save-ind{font-family:var(--cond);font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(196,160,112,.4);display:flex;align-items:center;gap:6px;}
.tb-save-ind .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.tb-save-ind.saving{color:var(--flame);}
.tb-save-ind.saving .dot{animation:pulse 1s ease-in-out infinite;}
.tb-save-ind.saved{color:var(--ok);}
.tb-save-ind.error{color:var(--ember);}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* MAIN WORKSPACE */
#workspace{flex:1;display:flex;min-height:0;}

/* LEFT TREE RAIL */
#tree{width:clamp(260px,22vw,320px);flex-shrink:0;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.tree-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.tree-hdr-lbl{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(196,160,112,.5);}
.tree-hdr-add{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:rgba(192,72,0,.08);color:var(--flame);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.tree-hdr-add:hover{background:rgba(192,72,0,.2);border-color:var(--fire);}

.tree-body{flex:1;overflow-y:auto;padding:8px 0 16px;}
.tree-body::-webkit-scrollbar{width:6px;}
.tree-body::-webkit-scrollbar-thumb{background:rgba(196,160,112,.15);border-radius:3px;}

.tree-node{user-select:none;}
.tree-row{display:flex;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;transition:background .15s,color .15s;position:relative;border-left:2px solid transparent;}
.tree-row:hover{background:rgba(192,72,0,.06);}
.tree-row.active{background:rgba(192,72,0,.14);border-left-color:var(--fire);}
.tree-row.drag-over{background:rgba(240,136,32,.2);border-top:2px solid var(--flame);}

.tree-caret{width:14px;font-size:9px;color:rgba(196,160,112,.35);transition:transform .15s;flex-shrink:0;text-align:center;}
.tree-caret.open{transform:rotate(90deg);color:var(--flame);}
.tree-caret.empty{visibility:hidden;}

.tree-icon{flex-shrink:0;font-size:13px;filter:drop-shadow(0 0 3px rgba(240,136,32,.2));}
.tree-label{flex:1;min-width:0;font-family:var(--body);font-weight:400;font-size:13px;color:rgba(196,160,112,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tree-row.active .tree-label{color:var(--cream);font-weight:500;}
.tree-actions{display:none;gap:2px;flex-shrink:0;}
.tree-row:hover .tree-actions, .tree-row.active .tree-actions{display:flex;}
.tree-act{width:20px;height:20px;border-radius:3px;border:none;background:transparent;color:rgba(196,160,112,.4);font-size:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.tree-act:hover{background:rgba(196,160,112,.12);color:var(--flame);}
.tree-act.dangerous:hover{background:rgba(192,72,0,.2);color:var(--ember);}

.tree-level-1{padding-left:12px;}
.tree-level-2{padding-left:30px;}
.tree-level-3{padding-left:50px;}
.tree-level-3 .tree-label{font-size:12px;color:rgba(196,160,112,.6);}

.tree-children{display:none;}
.tree-children.open{display:block;}

.tree-add-btn{display:flex;align-items:center;gap:6px;width:calc(100% - 20px);margin:4px 10px;padding:5px 10px;font-family:var(--cond);font-weight:500;font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:transparent;border:1px dashed rgba(196,160,112,.2);border-radius:4px;color:rgba(196,160,112,.4);cursor:pointer;transition:all .2s;}
.tree-add-btn:hover{border-color:var(--flame);color:var(--flame);background:rgba(192,72,0,.05);}
.tree-add-level-2{margin-left:26px;width:calc(100% - 36px);}
.tree-add-level-3{margin-left:46px;width:calc(100% - 56px);}

.tree-empty{padding:28px 16px;text-align:center;font-family:var(--cond);font-size:11px;letter-spacing:.16em;color:rgba(196,160,112,.3);}

.tree-footer{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.conn-pill{display:flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:500;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--lo);}
.conn-dot{width:5px;height:5px;border-radius:50%;background:var(--lo);}
.conn-pill.ok{color:var(--ok);}
.conn-pill.ok .conn-dot{background:var(--ok);box-shadow:0 0 6px var(--ok);}
.conn-pill.err{color:var(--ember);}
.conn-pill.err .conn-dot{background:var(--ember);}
.tree-logout{font-family:var(--cond);font-weight:600;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,160,112,.4);background:none;border:1px solid var(--border);padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .2s;}
.tree-logout:hover{border-color:var(--ember);color:var(--ember);}

/* MIDDLE EDITOR PANE */
#editor{flex:1;min-width:0;overflow-y:auto;padding:clamp(18px,3vw,36px);}
#editor::-webkit-scrollbar{width:8px;}
#editor::-webkit-scrollbar-thumb{background:rgba(196,160,112,.15);border-radius:4px;}

.welcome{max-width:620px;margin:40px auto;text-align:center;padding:0 20px;}
.welcome-icon{font-size:48px;margin-bottom:16px;filter:drop-shadow(0 0 18px rgba(240,136,32,.3));}
.welcome h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;color:var(--cream);margin-bottom:10px;line-height:1;}
.welcome h1 em{font-style:italic;font-weight:400;color:var(--flame);}
.welcome p{font-family:var(--body);font-weight:300;font-size:14px;color:rgba(196,160,112,.55);line-height:1.7;margin-bottom:24px;}
.welcome-tips{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px 22px;}
.welcome-tips h3{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--flame);margin-bottom:12px;}
.welcome-tips ul{list-style:none;display:flex;flex-direction:column;gap:8px;}
.welcome-tips li{font-family:var(--body);font-weight:300;font-size:13px;color:rgba(196,160,112,.6);line-height:1.55;display:flex;gap:10px;}
.welcome-tips li::before{content:'→';color:var(--flame);flex-shrink:0;}

.ed-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--border);}
.ed-title-row{flex:1;min-width:0;}
.ed-kind{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--flame);opacity:.8;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.ed-kind::before{content:'';width:16px;height:1px;background:currentColor;}
.ed-title{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3vw,32px);letter-spacing:-.02em;line-height:1.1;color:var(--cream);}
.ed-title em{font-style:italic;color:var(--flame);font-weight:400;}
.ed-subtitle{font-family:var(--body);font-weight:300;font-size:13px;color:rgba(196,160,112,.45);margin-top:5px;line-height:1.55;}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}

.fields{display:flex;flex-direction:column;gap:12px;max-width:880px;}
.field{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:14px 16px;transition:border-color .2s;position:relative;}
.field:focus-within{border-color:var(--border2);}
.field.dirty{border-left:3px solid var(--flame);}
.field.custom{border-left:3px solid var(--glow);}

.f-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
.f-label-l{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,160,112,.5);}
.f-label-l em{color:var(--glow);font-style:normal;font-weight:700;margin-left:6px;}
.f-meta{display:flex;gap:4px;opacity:0;transition:opacity .2s;}
.field:hover .f-meta, .field:focus-within .f-meta{opacity:1;}
.f-meta-btn{width:20px;height:20px;border-radius:3px;border:none;background:transparent;color:rgba(196,160,112,.4);font-size:10px;cursor:pointer;transition:all .15s;}
.f-meta-btn:hover{background:rgba(196,160,112,.1);color:var(--flame);}
.f-meta-btn.del:hover{color:var(--ember);}

.field input[type="text"],.field input[type="number"],.field input[type="email"],.field input[type="tel"],.field input[type="url"],.field textarea,.field select{
  width:100%;font-family:var(--body);font-weight:400;font-size:14px;color:var(--cream);
  background:rgba(9,7,4,.7);border:1px solid rgba(196,160,112,.12);border-radius:4px;
  padding:9px 12px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;line-height:1.5;
}
.field select{cursor:pointer;}
.field select option{background:#1a1108;color:var(--cream);}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(240,136,32,.5);box-shadow:0 0 0 2px rgba(192,72,0,.12);}
.field textarea{resize:vertical;min-height:72px;line-height:1.65;}
.field textarea.long{min-height:120px;}
.field textarea.html{font-family:var(--mono);font-size:12.5px;}
.f-hint{font-family:var(--body);font-weight:300;font-size:11px;color:rgba(196,160,112,.35);margin-top:5px;line-height:1.5;}
.f-hint code{font-family:var(--mono);font-size:10.5px;color:var(--flame);background:rgba(192,72,0,.1);padding:1px 4px;border-radius:2px;}

.cbx-wrap{display:flex;align-items:center;gap:10px;padding:4px 0;}
.cbx{width:18px;height:18px;border-radius:3px;border:1.5px solid rgba(196,160,112,.3);background:rgba(9,7,4,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.cbx.on{background:var(--fire);border-color:var(--fire);}
.cbx.on::after{content:'✓';color:#fff;font-weight:700;font-size:12px;}
.cbx-label{font-family:var(--body);font-weight:400;font-size:13px;color:var(--cream);cursor:pointer;}

.img-field{display:flex;gap:10px;align-items:flex-start;}
.img-field input{flex:1;}
.img-preview{width:70px;height:70px;border-radius:4px;background:rgba(9,7,4,.7);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.img-preview img{width:100%;height:100%;object-fit:cover;}
.img-preview-empty{font-size:18px;opacity:.3;}

/* ADD CUSTOM FIELD */
.add-field-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin-top:8px;font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--flame);background:transparent;border:1px dashed rgba(240,136,32,.3);border-radius:6px;cursor:pointer;transition:all .2s;}
.add-field-btn:hover{background:rgba(192,72,0,.08);border-style:solid;border-color:var(--flame);}

/* ITEMS LIST (when editing a section) */
.items-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
.items-lbl{font-family:var(--cond);font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(196,160,112,.55);}
.items-list{display:flex;flex-direction:column;gap:8px;}
.item-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .2s;}
.item-row:hover{border-color:var(--border2);background:var(--panel3);}
.item-idx{font-family:var(--mono);font-weight:500;font-size:11px;color:rgba(196,160,112,.35);min-width:26px;}
.item-thumb{width:36px;height:36px;border-radius:4px;background:rgba(9,7,4,.6);border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.item-thumb img{width:100%;height:100%;object-fit:cover;}
.item-thumb-ph{font-size:14px;opacity:.3;}
.item-info{flex:1;min-width:0;}
.item-name{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;}
.item-meta{font-family:var(--cond);font-size:10px;letter-spacing:.08em;color:rgba(196,160,112,.4);margin-top:2px;}
.item-arrow{color:rgba(196,160,112,.3);font-size:14px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-bg.show{opacity:1;pointer-events:all;}
.modal{background:var(--panel);border:1px solid var(--border-str);border-radius:10px;padding:clamp(20px,3vh,30px) clamp(20px,4vw,32px);max-width:460px;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(14px) scale(.98);transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-bg.show .modal{transform:translateY(0) scale(1);}
.modal-title{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--cream);letter-spacing:-.01em;margin-bottom:6px;}
.modal-title em{font-style:italic;color:var(--flame);font-weight:400;}
.modal-sub{font-family:var(--body);font-weight:300;font-size:13px;color:rgba(196,160,112,.5);line-height:1.6;margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,160,112,.5);margin-bottom:5px;}
.modal-field input,.modal-field select{width:100%;font-family:var(--body);font-weight:400;font-size:14px;color:var(--cream);background:rgba(9,7,4,.7);border:1px solid rgba(196,160,112,.15);border-radius:4px;padding:9px 12px;outline:none;-webkit-appearance:none;}

/* ══════════════════════════════════════════════════════════════════
   SUPABASE HELPERS
══════════════════════════════════════════════════════════════════ */
const sbHeaders = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
};
async function sbSelect(table, qs='') {
  const url = SB_URL + '/rest/v1/' + table + (qs || '?select=*');
  const r = await fetch(url, { headers: sbHeaders });
  if (!r.ok) throw new Error(table + ' select: ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbInsert(table, row) {
  const r = await fetch(SB_URL + '/rest/v1/' + table, {
    method:'POST', headers:{...sbHeaders, 'Prefer':'return=representation'},
    body: JSON.stringify(Array.isArray(row) ? row : [row])
  });
  if (!r.ok) throw new Error(table + ' insert: ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbUpdate(table, id, patch) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method:'PATCH', headers:{...sbHeaders, 'Prefer':'return=representation'},
    body: JSON.stringify(patch)
  });
  if (!r.ok) throw new Error(table + ' update: ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbUpsertSetting(key, value) {
  const r = await fetch(SB_URL + '/rest/v1/cms_settings', {
    method:'POST',
    headers:{...sbHeaders, 'Prefer':'return=representation,resolution=merge-duplicates'},
    body: JSON.stringify([{key, value}])
  });
  if (!r.ok) throw new Error('settings upsert: ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbDelete(table, id) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method:'DELETE', headers: sbHeaders
  });
  if (!r.ok) throw new Error(table + ' delete: ' + r.status + ' ' + await r.text());
}

/* ══════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════ */
const S = {
  authed: false,
  pin: '',
  pages: [],
  sections: [],   // flat list
  items: [],      // flat list
  settings: {},   // {key: value}
  selection: null,  // {type: 'page'|'section'|'item', id}
  expanded: new Set(), // expanded tree node ids (page+section)
  dirty: new Set(),   // record ids with unsaved edits
  pendingSaves: {},   // id → patch object
  autoSaveTimer: null,
};

/* UTILITIES */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg, kind) {
  const t = document.getElementById('toast');
  document.getElementById('toast-txt').textContent = msg;
  t.className = kind || '';
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 2800);
}
function setConn(state, txt) {
  const p = document.getElementById('conn-pill');
  p.className = 'conn-pill ' + state;
  document.getElementById('conn-text').textContent = txt;
}
function setSaveInd(state, txt) {
  const e = document.getElementById('save-ind');
  e.className = 'tb-save-ind ' + (state||'');
  document.getElementById('save-ind-text').textContent = txt;
}


/* ══════════════════════════════════════════════════════════════════
   PIN FLOW
══════════════════════════════════════════════════════════════════ */
function buildPinPad() {
  const pad = document.getElementById('pin-pad');
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','submit'];
  pad.innerHTML = keys.map(k => {
    if (k === 'del') return '<button class="pin-btn del" data-v="del">⌫</button>';
    if (k === 'submit') return '<button class="pin-btn submit" data-v="submit">Enter</button>';
    return '<button class="pin-btn" data-v="'+k+'">'+k+'</button>';
  }).join('');
  pad.querySelectorAll('.pin-btn').forEach(b => { b.onclick = () => onPinKey(b.dataset.v); });
  document.addEventListener('keydown', e => {
    if (S.authed) return;
    if (/^[0-9]$/.test(e.key)) onPinKey(e.key);
    else if (e.key === 'Backspace') onPinKey('del');
    else if (e.key === 'Enter') onPinKey('submit');
  });
}
function onPinKey(k) {
  const dots = document.querySelectorAll('.pin-dot');
  if (k === 'del') S.pin = S.pin.slice(0,-1);
  else if (k === 'submit') { if (S.pin.length < 4) return flashPinErr(); return tryLogin(); }
  else if (S.pin.length < 6) S.pin += k;
  dots.forEach((d,i) => d.classList.toggle('filled', i < S.pin.length));
  if (S.pin.length === 6) setTimeout(tryLogin, 120);
}
function flashPinErr(msg) {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach(d => d.classList.add('error'));
  const m = document.getElementById('pin-msg');
  if (msg) m.textContent = msg;
  m.classList.add('show');
  setTimeout(() => { dots.forEach(d=>d.classList.remove('error','filled')); m.classList.remove('show'); S.pin=''; }, 900);
}
async function tryLogin() {
  try {
    const rows = await sbSelect('cms_settings', '?select=*&key=eq.editor_pin');
    if (!rows || !rows.length) return flashPinErr('No PIN set in DB.');
    const pinVal = typeof rows[0].value === 'string' ? rows[0].value : rows[0].value;
    const pinStr = typeof pinVal === 'string' ? pinVal : JSON.parse(JSON.stringify(pinVal));
    if (S.pin !== String(pinStr).replace(/^"|"$/g,'')) return flashPinErr();
    S.authed = true;
    sessionStorage.setItem('fs_cms_auth','1');
    await bootApp();
  } catch (err) {
    console.error(err);
    flashPinErr('Connection error.');
  }
}
function logout() {
  sessionStorage.removeItem('fs_cms_auth');
  location.reload();
}

/* ══════════════════════════════════════════════════════════════════
   BOOT & DATA LOAD
══════════════════════════════════════════════════════════════════ */
async function bootApp() {
  try {
    setConn('ok','Loading...');
    await reloadAll();
    document.getElementById('pin-screen').classList.add('gone');
    setTimeout(() => {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('app').classList.add('on');
    }, 380);
    renderTree();
    renderWelcome();
    setConn('ok','Connected');
  } catch (err) {
    console.error(err);
    setConn('err','Error');
    toast('Failed to load: ' + err.message, 'err');
  }
}

async function reloadAll() {
  const [pages, sections, items, settings] = await Promise.all([
    sbSelect('pages', '?select=*&order=order_idx.asc'),
    sbSelect('sections', '?select=*&order=order_idx.asc'),
    sbSelect('items', '?select=*&order=order_idx.asc'),
    sbSelect('cms_settings'),
  ]);
  S.pages = pages;
  S.sections = sections;
  S.items = items;
  S.settings = {};
  settings.forEach(r => { S.settings[r.key] = r.value; });
}


/* ══════════════════════════════════════════════════════════════════
   TREE RENDERING
══════════════════════════════════════════════════════════════════ */
function renderTree() {
  const body = document.getElementById('tree-body');
  if (!S.pages.length) {
    body.innerHTML = '<div class="tree-empty">No pages yet. Click <strong>+</strong> above to add one.</div>';
    return;
  }
  let html = '';
  S.pages.forEach(p => {
    const pageSections = S.sections.filter(s => s.page_id === p.id);
    const isOpen = S.expanded.has('page:'+p.id);
    const isActive = S.selection?.type==='page' && S.selection.id===p.id;
    html += '<div class="tree-node" data-page-id="'+p.id+'">';
    html +=   '<div class="tree-row tree-level-1' + (isActive?' active':'') + '" data-select="page:'+p.id+'">';
    html +=     '<span class="tree-caret ' + (pageSections.length ? (isOpen?'open':'') : 'empty') + '" data-toggle="page:'+p.id+'">▸</span>';
    html +=     '<span class="tree-icon">' + esc(p.icon||'📄') + '</span>';
    html +=     '<span class="tree-label">' + esc(p.title) + '</span>';
    html +=     '<span class="tree-actions">';
    html +=       '<button class="tree-act" data-rename="page:'+p.id+'" title="Rename">✎</button>';
    html +=       '<button class="tree-act" data-dup="page:'+p.id+'" title="Duplicate">⎘</button>';
    html +=       '<button class="tree-act dangerous" data-del="page:'+p.id+'" title="Delete">✕</button>';
    html +=     '</span>';
    html +=   '</div>';
    html +=   '<div class="tree-children' + (isOpen?' open':'') + '">';
    pageSections.forEach(s => {
      const sectionItems = S.items.filter(it => it.section_id === s.id);
      const sOpen = S.expanded.has('section:'+s.id);
      const sActive = S.selection?.type==='section' && S.selection.id===s.id;
      html += '<div class="tree-node" data-section-id="'+s.id+'">';
      html +=   '<div class="tree-row tree-level-2' + (sActive?' active':'') + '" data-select="section:'+s.id+'">';
      html +=     '<span class="tree-caret ' + (sectionItems.length ? (sOpen?'open':'') : 'empty') + '" data-toggle="section:'+s.id+'">▸</span>';
      html +=     '<span class="tree-icon">' + esc(s.icon || kindIcon(s.kind)) + '</span>';
      html +=     '<span class="tree-label">' + esc(s.title) + '</span>';
      html +=     '<span class="tree-actions">';
      html +=       '<button class="tree-act" data-rename="section:'+s.id+'" title="Rename">✎</button>';
      html +=       '<button class="tree-act" data-dup="section:'+s.id+'" title="Duplicate">⎘</button>';
      html +=       '<button class="tree-act dangerous" data-del="section:'+s.id+'" title="Delete">✕</button>';
      html +=     '</span>';
      html +=   '</div>';
      html +=   '<div class="tree-children' + (sOpen?' open':'') + '">';
      sectionItems.forEach(it => {
        const iActive = S.selection?.type==='item' && S.selection.id===it.id;
        const name = it.data?.name || it.data?.title || '(unnamed)';
        html += '<div class="tree-row tree-level-3' + (iActive?' active':'') + '" data-select="item:'+it.id+'">';
        html +=   '<span class="tree-caret empty"></span>';
        html +=   '<span class="tree-icon">·</span>';
        html +=   '<span class="tree-label">' + esc(name) + '</span>';
        html +=   '<span class="tree-actions">';
        html +=     '<button class="tree-act" data-dup="item:'+it.id+'" title="Duplicate">⎘</button>';
        html +=     '<button class="tree-act dangerous" data-del="item:'+it.id+'" title="Delete">✕</button>';
        html +=   '</span>';
        html += '</div>';
      });
      html +=     '<button class="tree-add-btn tree-add-level-3" data-add-item="'+s.id+'">＋ Item</button>';
      html +=   '</div>';
      html += '</div>';
    });
    html +=     '<button class="tree-add-btn tree-add-level-2" data-add-section="'+p.id+'">＋ Section</button>';
    html +=   '</div>';
    html += '</div>';
  });
  body.innerHTML = html;
  bindTreeEvents();
}

function kindIcon(kind) {
  return {
    items_grid:'▦', steps:'▤', stats:'#', quote_list:'❝',
    value_list:'❖', rich_text:'¶', contact_form:'✉'
  }[kind] || '·';
}

function bindTreeEvents() {
  const body = document.getElementById('tree-body');
  body.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const key = el.dataset.toggle;
      if (S.expanded.has(key)) S.expanded.delete(key);
      else S.expanded.add(key);
      renderTree();
    };
  });
  body.querySelectorAll('[data-select]').forEach(el => {
    el.onclick = () => {
      const [type, id] = el.dataset.select.split(':');
      selectNode(type, id);
    };
  });
  body.querySelectorAll('[data-rename]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const [type,id] = el.dataset.rename.split(':'); openRenameModal(type, id); };
  });
  body.querySelectorAll('[data-dup]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const [type,id] = el.dataset.dup.split(':'); duplicateNode(type, id); };
  });
  body.querySelectorAll('[data-del]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const [type,id] = el.dataset.del.split(':'); confirmDelete(type, id); };
  });
  body.querySelectorAll('[data-add-section]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); openAddSectionModal(el.dataset.addSection); };
  });
  body.querySelectorAll('[data-add-item]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); addItem(el.dataset.addItem); };
  });
}

function selectNode(type, id) {
  S.selection = {type, id};
  // auto-expand parents
  if (type === 'section') {
    const s = S.sections.find(x=>x.id===id);
    if (s) S.expanded.add('page:'+s.page_id);
  } else if (type === 'item') {
    const it = S.items.find(x=>x.id===id);
    if (it) {
      const s = S.sections.find(x=>x.id===it.section_id);
      if (s) { S.expanded.add('page:'+s.page_id); S.expanded.add('section:'+s.id); }
    }
  }
  closeMobTree();
  renderTree();
  renderEditor();
}


/* ══════════════════════════════════════════════════════════════════
   EDITOR RENDERING

function renderWelcome() {
  document.getElementById('editor-body').innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">🔥</div>
      <h1>Francis <em>CMS</em></h1>
      <p>Full control over every word, price, photo, section, and page on the live site. Pick something from the tree on the left — or add a new page to get started.</p>
      <div class="welcome-tips">
        <h3>Quick Tour</h3>
        <ul>
          <li>Click any page, section, or item in the tree to edit it</li>
          <li>Hover tree rows to see Rename / Duplicate / Delete buttons</li>
          <li>The ＋ buttons add new pages, sections, or items at each level</li>
          <li>Every item has an "Add Custom Field" button — put anything you want on it</li>
          <li>Changes auto-save 1.5 seconds after you stop typing</li>
        </ul>
      </div>
    </div>`;
  renderCrumbs();
}

function renderCrumbs() {
  const c = document.getElementById('crumbs');
  if (!S.selection) { c.innerHTML = '<span class="tb-crumb cur">Francis CMS</span>'; return; }
  const {type, id} = S.selection;
  let parts = ['<span class="tb-crumb link" onclick="S.selection=null;renderTree();renderWelcome()">All Pages</span>'];
  if (type === 'page') {
    const p = S.pages.find(x=>x.id===id);
    if (p) parts.push('<span class="tb-sep">›</span><span class="tb-crumb cur">'+esc(p.title)+'</span>');
  } else if (type === 'section') {
    const s = S.sections.find(x=>x.id===id);
    const p = s ? S.pages.find(x=>x.id===s.page_id) : null;
    if (p) parts.push('<span class="tb-sep">›</span><span class="tb-crumb link" onclick="selectNode(\'page\',\''+p.id+'\')">'+esc(p.title)+'</span>');
    if (s) parts.push('<span class="tb-sep">›</span><span class="tb-crumb cur">'+esc(s.title)+'</span>');
  } else if (type === 'item') {
    const it = S.items.find(x=>x.id===id);
    const s = it ? S.sections.find(x=>x.id===it.section_id) : null;
    const p = s ? S.pages.find(x=>x.id===s.page_id) : null;
    if (p) parts.push('<span class="tb-sep">›</span><span class="tb-crumb link" onclick="selectNode(\'page\',\''+p.id+'\')">'+esc(p.title)+'</span>');
    if (s) parts.push('<span class="tb-sep">›</span><span class="tb-crumb link" onclick="selectNode(\'section\',\''+s.id+'\')">'+esc(s.title)+'</span>');
    if (it) parts.push('<span class="tb-sep">›</span><span class="tb-crumb cur">'+esc(it.data?.name||it.data?.title||'Item')+'</span>');
  }
  c.innerHTML = parts.join('');
}

function renderEditor() {
  renderCrumbs();
  if (!S.selection) { renderWelcome(); return; }
  const {type, id} = S.selection;
  const body = document.getElementById('editor-body');
  if (type === 'page')    body.innerHTML = renderPageEditor(id);
  if (type === 'section') body.innerHTML = renderSectionEditor(id);
  if (type === 'item')    body.innerHTML = renderItemEditor(id);
  bindEditorEvents();
}

/* ══════════════════════════════════════════════════════════════════
   PAGE EDITOR
══════════════════════════════════════════════════════════════════ */
function renderPageEditor(id) {
  const p = S.pages.find(x=>x.id===id);
  if (!p) return '<div class="welcome">Page not found.</div>';
  const sections = S.sections.filter(s=>s.page_id===id);
  const tmpl = TEMPLATES[p.template] || TEMPLATES.hero_with_sections;
  const settings = p.settings || {};
  let html = '';
  html += '<div class="ed-header">';
  html +=   '<div class="ed-title-row">';
  html +=     '<div class="ed-kind">Page · ' + tmpl.label + '</div>';
  html +=     '<h1 class="ed-title">' + esc(p.icon) + ' ' + esc(p.title) + '</h1>';
  html +=     '<div class="ed-subtitle">Slug: <code>/' + esc(p.slug) + '</code> · ' + sections.length + ' section' + (sections.length===1?'':'s') + '</div>';
  html +=   '</div>';
  html += '</div>';

  // Page-level settings (editable)
  html += '<div class="fields">';
  html +=   fieldHtml('title', 'Page Title', p.title, {type:'text'}, 'page:'+id+':title');
  html +=   fieldHtml('slug',  'URL Slug',    p.slug,  {type:'text', hint:'e.g. "menu", "about". Lowercase, no spaces.'}, 'page:'+id+':slug');
  html +=   fieldHtml('icon',  'Icon (emoji)', p.icon, {type:'text'}, 'page:'+id+':icon');
  html +=   '<div class="field"><div class="f-label"><span class="f-label-l">Template</span></div>' +
           '<select data-patch="page:'+id+':template">' +
           Object.entries(TEMPLATES).map(([k,t]) =>
             '<option value="'+k+'"' + (p.template===k?' selected':'') + '>' + t.label + ' — ' + t.desc + '</option>'
           ).join('') + '</select></div>';

  // Template-specific settings (stored in settings jsonb)
  const tmplSettings = [
    {key:'hero_eyebrow', label:'Hero Eyebrow'},
    {key:'hero_title',   label:'Hero Title', html:true},
    {key:'hero_subtitle',label:'Hero Subtitle'},
    {key:'hero_lead',    label:'Hero Lead Paragraph', textarea:true},
    {key:'header_subtitle', label:'Header Subtitle'},
  ];
  tmplSettings.forEach(f => {
    if (settings[f.key] !== undefined || f.key.startsWith('hero_')) {
      html += fieldHtml(f.key, f.label, settings[f.key]||'', f, 'page_settings:'+id+':'+f.key);
    }
  });
  html += '</div>';

  // Sections list
  html += '<div class="items-bar" style="margin-top:24px"><div class="items-lbl">Sections on this page</div><button class="tb-btn primary" onclick="openAddSectionModal(\''+id+'\')">＋ Add Section</button></div>';
  if (sections.length) {
    html += '<div class="items-list">';
    sections.forEach((s,i) => {
      const itemCount = S.items.filter(it=>it.section_id===s.id).length;
      html += '<div class="item-row" onclick="selectNode(\'section\',\''+s.id+'\')">';
      html +=   '<span class="item-idx">'+(i+1)+'</span>';
      html +=   '<span class="item-thumb"><span class="item-thumb-ph">'+esc(s.icon||kindIcon(s.kind))+'</span></span>';
      html +=   '<div class="item-info"><div class="item-name">'+esc(s.title)+'</div><div class="item-meta">'+KINDS[s.kind]?.label+' · '+itemCount+' item'+(itemCount===1?'':'s')+'</div></div>';

/* ══════════════════════════════════════════════════════════════════
   SECTION EDITOR
══════════════════════════════════════════════════════════════════ */
function renderSectionEditor(id) {
  const s = S.sections.find(x=>x.id===id);
  if (!s) return '<div class="welcome">Section not found.</div>';
  const kind = KINDS[s.kind] || KINDS.items_grid;
  const settings = s.settings || {};
  const items = S.items.filter(it=>it.section_id===id).sort((a,b)=>a.order_idx-b.order_idx);

  let html = '';
  html += '<div class="ed-header">';
  html +=   '<div class="ed-title-row">';
  html +=     '<div class="ed-kind">Section · ' + kind.label + '</div>';
  html +=     '<h1 class="ed-title">' + esc(s.icon||kindIcon(s.kind)) + ' ' + esc(s.title) + '</h1>';
  html +=     '<div class="ed-subtitle">' + esc(kind.desc) + '</div>';
  html +=   '</div>';
  html += '</div>';

  // Core section fields
  html += '<div class="fields">';
  html += fieldHtml('title',    'Section Title',    s.title,    {type:'text'}, 'section:'+id+':title');
  html += fieldHtml('subtitle', 'Subtitle',         s.subtitle||'', {type:'text'}, 'section:'+id+':subtitle');
  html += fieldHtml('icon',     'Icon (emoji)',     s.icon||'', {type:'text'}, 'section:'+id+':icon');
  html += fieldHtml('slug',     'URL Slug',         s.slug||'', {type:'text', hint:'Auto-generated from title if blank'}, 'section:'+id+':slug');
  // Kind selector
  html += '<div class="field"><div class="f-label"><span class="f-label-l">Kind</span></div>' +
           '<select data-patch="section:'+id+':kind">' +
           Object.entries(KINDS).map(([k,kd]) =>
             '<option value="'+k+'"' + (s.kind===k?' selected':'') + '>' + kd.label + ' — ' + kd.desc + '</option>'
           ).join('') + '</select>' +
           '<div class="f-hint">Changing the kind keeps items but they may show different fields.</div></div>';
  html += '</div>';

  // Kind-specific settings
  if (kind.settingsFields && kind.settingsFields.length) {
    html += '<div class="items-bar" style="margin-top:24px"><div class="items-lbl">' + kind.label + ' Settings</div></div>';
    html += '<div class="fields">';
    kind.settingsFields.forEach(f => {
      html += fieldHtml(f.key, f.label, settings[f.key]||'', f, 'section_settings:'+id+':'+f.key);
    });
    // Add custom setting field
    html += '<button class="add-field-btn" onclick="openAddCustomField(\'section\',\''+id+'\')">＋ Add Custom Field</button>';
    // Render custom settings fields (not in settingsFields list)
    Object.keys(settings).forEach(key => {
      if (!kind.settingsFields.find(f=>f.key===key)) {
        html += fieldHtml(key, key, settings[key], {type:'textarea'}, 'section_settings:'+id+':'+key, true);
      }
    });
    html += '</div>';
  }

  // Items list
  html += '<div class="items-bar" style="margin-top:24px"><div class="items-lbl">' + items.length + ' item' + (items.length===1?'':'s') + '</div><button class="tb-btn primary" onclick="addItem(\''+id+'\')">＋ Add Item</button></div>';
  if (items.length) {
    html += '<div class="items-list">';
    items.forEach((it,i) => {
      const name = it.data?.name || it.data?.title || '(unnamed)';
      const img = it.data?.img || it.data?.image;
      const price = it.data?.price;
      const meta = price != null ? '$'+Number(price).toFixed(2) : (it.data?.badge || '');
      html += '<div class="item-row" onclick="selectNode(\'item\',\''+it.id+'\')">';
      html +=   '<span class="item-idx">#'+(i+1)+'</span>';
      html +=   '<span class="item-thumb">'+(img?'<img src="'+escA(img)+'" onerror="this.outerHTML=\'<span class=item-thumb-ph>📷</span>\'">':'<span class="item-thumb-ph">·</span>')+'</span>';
      html +=   '<div class="item-info"><div class="item-name">'+esc(name)+'</div>'+(meta?'<div class="item-meta">'+esc(meta)+'</div>':'')+'</div>';
      html +=   '<button class="tree-act" onclick="event.stopPropagation();moveItem(\''+it.id+'\',-1)" title="Up" style="display:flex">▲</button>';
      html +=   '<button class="tree-act" onclick="event.stopPropagation();moveItem(\''+it.id+'\',1)" title="Down" style="display:flex">▼</button>';
      html +=   '<span class="item-arrow">›</span>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="welcome-tips" style="margin-top:10px;max-width:none"><h3>No items yet</h3><ul><li>Click "Add Item" above to create the first one</li></ul></div>';
  }
  return html;
}

/* ══════════════════════════════════════════════════════════════════
   ITEM EDITOR
══════════════════════════════════════════════════════════════════ */
function renderItemEditor(id) {
  const it = S.items.find(x=>x.id===id);
  if (!it) return '<div class="welcome">Item not found.</div>';
  const s = S.sections.find(x=>x.id===it.section_id);
  const kind = KINDS[s?.kind] || KINDS.items_grid;
  const data = it.data || {};
  const name = data.name || data.title || 'Item';

  let html = '';
  html += '<div class="ed-header">';
  html +=   '<div class="ed-title-row">';
  html +=     '<div class="ed-kind">Item · in ' + esc(s?.title||'') + '</div>';
  html +=     '<h1 class="ed-title">' + esc(name) + '</h1>';
  html +=   '</div>';
  html +=   '<div class="ed-actions">';
  html +=     '<button class="tb-btn" onclick="duplicateNode(\'item\',\''+id+'\')">⎘ Duplicate</button>';
  html +=     '<button class="tb-btn" style="color:var(--ember);border-color:rgba(192,72,0,.3)" onclick="confirmDelete(\'item\',\''+id+'\')">✕ Delete</button>';
  html +=   '</div>';
  html += '</div>';

  // Visibility toggle
  html += '<div class="fields">';
  html += '<div class="field"><div class="f-label"><span class="f-label-l">Visible on Site</span></div>' +
          '<div class="cbx-wrap"><div class="cbx ' + (it.visible?'on':'') + '" data-patch="item:'+id+':visible" data-cbx="1"></div>' +
          '<span class="cbx-label">' + (it.visible?'Yes — showing on site':'Hidden') + '</span></div></div>';

  // Kind-default fields
  const usedKeys = new Set();
  kind.defaultItemFields.forEach(f => {
    usedKeys.add(f.key);
    html += fieldHtml(f.key, f.label, data[f.key], f, 'item_data:'+id+':'+f.key);
  });

  // Custom fields — any data keys not in defaults
  Object.keys(data).forEach(key => {
    if (!usedKeys.has(key)) {
      const val = data[key];
      const isBool = typeof val === 'boolean';
      const isNum = typeof val === 'number';
      const isLong = typeof val === 'string' && (val.length > 80 || val.includes('\n'));
      const type = isBool?'boolean':(isNum?'number':(isLong?'textarea':'text'));
      html += fieldHtml(key, key, val, {type}, 'item_data:'+id+':'+key, true);
    }
  });

  html += '<button class="add-field-btn" onclick="openAddCustomField(\'item\',\''+id+'\')">＋ Add Custom Field</button>';
  html += '</div>';

  return html;
}

/* ══════════════════════════════════════════════════════════════════
   FIELD HTML GENERATION
══════════════════════════════════════════════════════════════════ */
function fieldHtml(key, label, value, opts, patchPath, isCustom) {
  opts = opts || {};
  const type = opts.type || (opts.textarea ? 'textarea' : (opts.html ? 'textarea' : 'text'));
  const dirtyClass = S.dirty.has(patchPath) ? ' dirty' : '';
  const customClass = isCustom ? ' custom' : '';
  let input = '';

  if (type === 'boolean') {
    const on = value === true || value === 'true';
    input = '<div class="cbx-wrap"><div class="cbx ' + (on?'on':'') + '" data-patch="'+patchPath+'" data-cbx="1"></div>' +
            '<span class="cbx-label">' + (on?'On':'Off') + '</span></div>';
  } else if (type === 'select') {
    input = '<select data-patch="'+patchPath+'">' +
            (opts.options||[]).map(o => '<option value="'+escA(o)+'"'+(value===o?' selected':'')+'>'+esc(o||'—')+'</option>').join('') +
            '</select>';
  } else if (type === 'textarea') {
    input = '<textarea class="' + (opts.long?'long':'') + (opts.html?' html':'') + '" data-patch="'+patchPath+'">'+esc(value==null?'':value)+'</textarea>';
  } else if (type === 'url' && (key === 'img' || key === 'image')) {
    input = '<div class="img-field">' +
            '<input type="url" data-patch="'+patchPath+'" value="'+escA(value||'')+'" placeholder="https://...">' +
            '<div class="img-preview">' + (value?'<img src="'+escA(value)+'" onerror="this.outerHTML=\'<span class=img-preview-empty>📷</span>\'">':'<span class="img-preview-empty">📷</span>') + '</div>' +
            '</div>';
  } else {
    const inputType = type==='number'?'number':(type==='url'?'url':(type==='email'?'email':(type==='tel'?'tel':'text')));
    input = '<input type="'+inputType+'" ' + (inputType==='number'?'step="0.01"':'') + ' data-patch="'+patchPath+'" value="'+escA(value==null?'':value)+'">';
  }

  const customBadge = isCustom ? '<em>Custom</em>' : '';
  const metaBtns = isCustom ? '<div class="f-meta"><button class="f-meta-btn del" onclick="removeCustomField(\''+patchPath+'\')" title="Remove this field">✕</button></div>' : '';
  const hint = opts.hint ? '<div class="f-hint">' + opts.hint + '</div>' : '';

  return '<div class="field'+dirtyClass+customClass+'" data-field-key="'+patchPath+'">' +
         '<div class="f-label"><span class="f-label-l">' + esc(label) + customBadge + '</span>' + metaBtns + '</div>' +
         input + hint + '</div>';
}


/* ══════════════════════════════════════════════════════════════════
   EDITOR EVENT BINDING — inputs → markDirty
══════════════════════════════════════════════════════════════════ */
function bindEditorEvents() {
  const body = document.getElementById('editor-body');
  body.querySelectorAll('input[data-patch],textarea[data-patch],select[data-patch]').forEach(el => {
    el.addEventListener('input', () => handleFieldEdit(el.dataset.patch, el.value));
    el.addEventListener('change', () => handleFieldEdit(el.dataset.patch, el.value));
  });
  body.querySelectorAll('.cbx[data-cbx]').forEach(cb => {
    cb.onclick = () => {
      const cur = cb.classList.contains('on');
      cb.classList.toggle('on', !cur);
      if (cb.nextElementSibling && cb.nextElementSibling.classList.contains('cbx-label')) {
        cb.nextElementSibling.textContent = !cur ? 'On' : 'Off';
      }
      handleFieldEdit(cb.dataset.patch, !cur);
    };
  });
}

function handleFieldEdit(patchPath, newValue) {
  // patchPath is like "page:<id>:title" or "section_settings:<id>:eyebrow" or "item_data:<id>:name"
  const [scope, id, key] = patchPath.split(':');
  const rec = findRecord(scope, id);
  if (!rec) return;

  // Apply in-memory
  if (scope === 'page') rec[key] = coerceValue(newValue, key);
  else if (scope === 'section') rec[key] = coerceValue(newValue, key);
  else if (scope === 'item') {
    if (key === 'visible') rec[key] = !!newValue;
    else rec[key] = coerceValue(newValue, key);
  }
  else if (scope === 'page_settings')    { rec.settings = {...(rec.settings||{}), [key]: newValue}; }
  else if (scope === 'section_settings') { rec.settings = {...(rec.settings||{}), [key]: newValue}; }
  else if (scope === 'item_data')        {
    const v = (key==='price'||key==='priceLg') ? (newValue===''?null:Number(newValue))
            : (typeof newValue === 'boolean' ? newValue : newValue);
    rec.data = {...(rec.data||{}), [key]: v};
  }

  // Queue the save
  S.dirty.add(patchPath);
  queueDebouncedSave();
  updateSaveIndicator();

  // Mark field dirty visually
  const fieldEl = document.querySelector('[data-field-key="'+cssEscape(patchPath)+'"]');
  if (fieldEl) fieldEl.classList.add('dirty');

  // If title/name changed, re-render tree to reflect
  if ((scope==='page' && key==='title') || (scope==='section' && key==='title') ||
      (scope==='item_data' && (key==='name'||key==='title'))) {
    renderTree();
    renderCrumbs();
  }
}

function coerceValue(v, key) {
  if (typeof v === 'boolean') return v;
  if (v === '' || v == null) return v === '' ? '' : v;
  return v;
}

function findRecord(scope, id) {
  if (scope === 'page' || scope === 'page_settings') return S.pages.find(x=>x.id===id);
  if (scope === 'section' || scope === 'section_settings') return S.sections.find(x=>x.id===id);
  if (scope === 'item' || scope === 'item_data') return S.items.find(x=>x.id===id);
  return null;
}

function cssEscape(s) {
  return window.CSS?.escape ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
}

function updateSaveIndicator() {
  if (S.dirty.size > 0) setSaveInd('', S.dirty.size + ' unsaved');
  else setSaveInd('saved', 'All saved');
}

/* ══════════════════════════════════════════════════════════════════
   DEBOUNCED SAVE
══════════════════════════════════════════════════════════════════ */
function queueDebouncedSave() {
  if (S.autoSaveTimer) clearTimeout(S.autoSaveTimer);
  S.autoSaveTimer = setTimeout(flushSaves, 1500);
}

async function flushSaves() {
  if (S.dirty.size === 0) return;
  setSaveInd('saving', 'Saving...');

  // Group patches per record
  const pagePatches = {};     // id → {field:val}
  const sectionPatches = {};
  const itemPatches = {};

  for (const path of S.dirty) {
    const [scope, id] = path.split(':');
    let tgt, key;
    if (scope.startsWith('page')) { tgt = pagePatches; key = 'pages'; }
    else if (scope.startsWith('section')) { tgt = sectionPatches; key = 'sections'; }
    else if (scope.startsWith('item')) { tgt = itemPatches; key = 'items'; }
    if (!tgt[id]) tgt[id] = {};
    const rec = findRecord(scope, id);
    if (!rec) continue;
    // Rebuild the whole record state since we edit in-place
    if (scope === 'page' || scope === 'page_settings') {
      tgt[id] = { title: rec.title, slug: rec.slug, icon: rec.icon, template: rec.template, settings: rec.settings, order_idx: rec.order_idx };
    } else if (scope === 'section' || scope === 'section_settings') {
      tgt[id] = { title: rec.title, subtitle: rec.subtitle, icon: rec.icon, slug: rec.slug, kind: rec.kind, settings: rec.settings, order_idx: rec.order_idx };
    } else if (scope === 'item' || scope === 'item_data') {
      tgt[id] = { data: rec.data, visible: rec.visible, order_idx: rec.order_idx };
    }
  }

  try {
    const promises = [];
    for (const [id, patch] of Object.entries(pagePatches))    promises.push(sbUpdate('pages', id, patch));
    for (const [id, patch] of Object.entries(sectionPatches)) promises.push(sbUpdate('sections', id, patch));
    for (const [id, patch] of Object.entries(itemPatches))    promises.push(sbUpdate('items', id, patch));
    await Promise.all(promises);
    S.dirty.clear();
    document.querySelectorAll('.field.dirty').forEach(el => el.classList.remove('dirty'));
    setSaveInd('saved', 'Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  } catch (err) {
    console.error(err);
    setSaveInd('error', 'Save failed');
    toast('Save failed: ' + err.message, 'err');
  }
}


/* ══════════════════════════════════════════════════════════════════
   CRUD — ADD/DUPLICATE/DELETE/RENAME  pages/sections/items
══════════════════════════════════════════════════════════════════ */
function openAddPageModal() {
  openModal('<div class="modal-title">Add <em>Page</em></div>' +
    '<div class="modal-sub">Create a new page for the site. You can add sections and items after.</div>' +
    '<div class="modal-field"><label>Page Title</label><input id="m-title" placeholder="e.g. Specials Archive"></div>' +
    '<div class="modal-field"><label>URL Slug</label><input id="m-slug" placeholder="e.g. specials-archive"></div>' +
    '<div class="modal-field"><label>Icon (emoji)</label><input id="m-icon" value="📄"></div>' +
    '<div class="modal-field"><label>Template</label><select id="m-tmpl">' +
      Object.entries(TEMPLATES).map(([k,t])=>'<option value="'+k+'">'+t.label+'</option>').join('') +
    '</select></div>' +
    '<div class="modal-btns"><button class="modal-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="modal-btn primary" onclick="submitAddPage()">Create Page</button></div>');
  setTimeout(()=>document.getElementById('m-title').focus(), 80);
  document.getElementById('m-title').addEventListener('input', e => {
    document.getElementById('m-slug').value = slugify(e.target.value);
  });
}
async function submitAddPage() {
  const title = document.getElementById('m-title').value.trim();
  const slug  = document.getElementById('m-slug').value.trim() || slugify(title);
  const icon  = document.getElementById('m-icon').value.trim() || '📄';
  const template = document.getElementById('m-tmpl').value;
  if (!title) return toast('Title required', 'err');
  try {
    const maxOrder = Math.max(0, ...S.pages.map(p=>p.order_idx||0));
    const rows = await sbInsert('pages', { title, slug, icon, template, order_idx: maxOrder+1, settings: {} });
    closeModal();
    await reloadAll();
    selectNode('page', rows[0].id);
    toast('Page created ✓', 'ok');
  } catch (err) {
    toast('Error: ' + err.message, 'err');
  }
}

function openAddSectionModal(pageId) {
  openModal('<div class="modal-title">Add <em>Section</em></div>' +
    '<div class="modal-sub">Sections are the building blocks of a page — menu categories, review lists, step guides, etc.</div>' +
    '<div class="modal-field"><label>Section Title</label><input id="m-title" placeholder="e.g. Seasonal Menu"></div>' +
    '<div class="modal-field"><label>Section Kind</label><select id="m-kind">' +
      Object.entries(KINDS).map(([k,kd])=>'<option value="'+k+'">'+kd.label+' — '+kd.desc+'</option>').join('') +
    '</select></div>' +
    '<div class="modal-field"><label>Icon (optional emoji)</label><input id="m-icon" placeholder="Leave blank for default"></div>' +
    '<div class="modal-btns"><button class="modal-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="modal-btn primary" onclick="submitAddSection(\''+pageId+'\')">Create Section</button></div>');
  setTimeout(()=>document.getElementById('m-title').focus(), 80);
}
async function submitAddSection(pageId) {
  const title = document.getElementById('m-title').value.trim();
  const kind  = document.getElementById('m-kind').value;
  const icon  = document.getElementById('m-icon').value.trim();
  if (!title) return toast('Title required', 'err');
  try {
    const maxOrder = Math.max(0, ...S.sections.filter(s=>s.page_id===pageId).map(s=>s.order_idx||0));
    const rows = await sbInsert('sections', { page_id: pageId, title, kind, icon: icon||null, slug: slugify(title), order_idx: maxOrder+1, settings:{} });
    closeModal();
    S.expanded.add('page:'+pageId);
    await reloadAll();
    selectNode('section', rows[0].id);
    toast('Section created ✓', 'ok');
  } catch (err) {
    toast('Error: ' + err.message, 'err');
  }
}

async function addItem(sectionId) {
  try {
    const s = S.sections.find(x=>x.id===sectionId);
    const kind = KINDS[s?.kind] || KINDS.items_grid;
    const data = {};
    kind.defaultItemFields.forEach(f => {
      if (f.type === 'boolean') data[f.key] = false;
      else if (f.type === 'number') data[f.key] = null;
      else data[f.key] = '';
    });
    if (data.name !== undefined) data.name = 'New Item';
    else if (data.title !== undefined) data.title = 'New Item';
    const maxOrder = Math.max(0, ...S.items.filter(it=>it.section_id===sectionId).map(it=>it.order_idx||0));
    const rows = await sbInsert('items', { section_id: sectionId, data, order_idx: maxOrder+1, visible: true });
    S.expanded.add('section:'+sectionId);
    await reloadAll();
    selectNode('item', rows[0].id);
    toast('Item created ✓', 'ok');
  } catch (err) {
    toast('Error: ' + err.message, 'err');
  }
}

async function duplicateNode(type, id) {
  try {
    if (type === 'page') {
      const p = S.pages.find(x=>x.id===id);
      if (!p) return;
      const maxOrder = Math.max(0, ...S.pages.map(x=>x.order_idx||0));
      const newP = await sbInsert('pages', { title: p.title+' (copy)', slug: p.slug+'-copy-'+Date.now().toString(36), icon: p.icon, template: p.template, settings: p.settings, order_idx: maxOrder+1 });
      // copy sections
      for (const s of S.sections.filter(x=>x.page_id===id)) {
        const newS = await sbInsert('sections', { page_id: newP[0].id, title: s.title, subtitle: s.subtitle, icon: s.icon, slug: s.slug, kind: s.kind, settings: s.settings, order_idx: s.order_idx });
        for (const it of S.items.filter(x=>x.section_id===s.id)) {
          await sbInsert('items', { section_id: newS[0].id, data: it.data, visible: it.visible, order_idx: it.order_idx });
        }
      }
      await reloadAll(); selectNode('page', newP[0].id);
    } else if (type === 'section') {
      const s = S.sections.find(x=>x.id===id);
      if (!s) return;
      const maxOrder = Math.max(0, ...S.sections.filter(x=>x.page_id===s.page_id).map(x=>x.order_idx||0));
      const newS = await sbInsert('sections', { page_id: s.page_id, title: s.title+' (copy)', subtitle: s.subtitle, icon: s.icon, slug: (s.slug||'')+'-copy', kind: s.kind, settings: s.settings, order_idx: maxOrder+1 });
      for (const it of S.items.filter(x=>x.section_id===id)) {
        await sbInsert('items', { section_id: newS[0].id, data: it.data, visible: it.visible, order_idx: it.order_idx });
      }
      await reloadAll(); selectNode('section', newS[0].id);
    } else if (type === 'item') {
      const it = S.items.find(x=>x.id===id);
      if (!it) return;
      const maxOrder = Math.max(0, ...S.items.filter(x=>x.section_id===it.section_id).map(x=>x.order_idx||0));
      const newIt = await sbInsert('items', { section_id: it.section_id, data: {...it.data}, visible: it.visible, order_idx: maxOrder+1 });
      await reloadAll(); selectNode('item', newIt[0].id);
    }
    toast('Duplicated ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function confirmDelete(type, id) {
  const label = type === 'page' ? 'page (and all its sections and items)'
              : type === 'section' ? 'section (and all its items)'
              : 'item';
  const rec = findRecord(type, id);
  const name = rec ? (rec.title || rec.data?.name || rec.data?.title || 'this') : 'this';
  openModal('<div class="modal-title">Delete <em>'+esc(name)+'</em>?</div>' +
    '<div class="modal-sub">This removes the '+label+' permanently. Cannot be undone.</div>' +
    '<div class="modal-btns"><button class="modal-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="modal-btn primary" style="background:linear-gradient(90deg,#a02010,#c04800);border-color:#c04800" onclick="doDelete(\''+type+'\',\''+id+'\')">Delete</button></div>');
}
async function doDelete(type, id) {
  try {
    const table = type === 'page' ? 'pages' : type === 'section' ? 'sections' : 'items';
    await sbDelete(table, id);
    closeModal();
    if (S.selection?.id === id) S.selection = null;
    await reloadAll();
    renderTree();
    S.selection ? renderEditor() : renderWelcome();
    toast('Deleted ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

function openRenameModal(type, id) {
  const rec = findRecord(type, id);
  if (!rec) return;
  const currentTitle = rec.title || rec.data?.name || rec.data?.title || '';
  openModal('<div class="modal-title">Rename</div>' +
    '<div class="modal-field"><label>New Title</label><input id="m-title" value="'+escA(currentTitle)+'"></div>' +
    '<div class="modal-btns"><button class="modal-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="modal-btn primary" onclick="submitRename(\''+type+'\',\''+id+'\')">Save</button></div>');
  setTimeout(()=>{ const el=document.getElementById('m-title'); el.focus(); el.select(); }, 80);
}
async function submitRename(type, id) {
  const newTitle = document.getElementById('m-title').value.trim();
  if (!newTitle) return toast('Title required', 'err');
  try {
    if (type === 'page')    await sbUpdate('pages', id, { title: newTitle });
    if (type === 'section') await sbUpdate('sections', id, { title: newTitle });
    if (type === 'item') {
      const it = S.items.find(x=>x.id===id);
      const newData = {...it.data};
      if (newData.name !== undefined) newData.name = newTitle;
      else newData.title = newTitle;
      await sbUpdate('items', id, { data: newData });
    }
    closeModal();
    await reloadAll();
    renderTree();
    if (S.selection?.id === id) renderEditor();
    toast('Renamed ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function moveItem(id, delta) {
  const it = S.items.find(x=>x.id===id);
  if (!it) return;
  const siblings = S.items.filter(x=>x.section_id===it.section_id).sort((a,b)=>a.order_idx-b.order_idx);
  const idx = siblings.findIndex(x=>x.id===id);
  const target = idx + delta;
  if (target < 0 || target >= siblings.length) return;
  try {
    const other = siblings[target];
    await sbUpdate('items', id, { order_idx: other.order_idx });
    await sbUpdate('items', other.id, { order_idx: it.order_idx });
    await reloadAll();
    if (S.selection?.type==='section') renderEditor();
    else renderTree();
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

/* CUSTOM FIELD ADD/REMOVE */
function openAddCustomField(scope, id) {
  openModal('<div class="modal-title">Add <em>Custom Field</em></div>' +
    '<div class="modal-sub">Add a new field to this ' + scope + '. Field names should be simple — letters, numbers, underscores.</div>' +
    '<div class="modal-field"><label>Field Name (key)</label><input id="m-key" placeholder="e.g. spice_level"></div>' +
    '<div class="modal-field"><label>Field Type</label><select id="m-type">' +
      '<option value="text">Short Text</option>' +
      '<option value="textarea">Long Text</option>' +
      '<option value="number">Number</option>' +
      '<option value="url">URL / Image</option>' +
      '<option value="boolean">Yes / No</option>' +
    '</select></div>' +
    '<div class="modal-btns"><button class="modal-btn" onclick="closeModal()">Cancel</button>' +
    '<button class="modal-btn primary" onclick="submitAddCustomField(\''+scope+'\',\''+id+'\')">Add Field</button></div>');
  setTimeout(()=>document.getElementById('m-key').focus(), 80);
}
async function submitAddCustomField(scope, id) {
  const key = document.getElementById('m-key').value.trim().replace(/\s+/g,'_');
  const type = document.getElementById('m-type').value;
  if (!key) return toast('Field name required', 'err');
  if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(key)) return toast('Use letters/numbers/underscores, start with letter', 'err');
  const defaultVal = type === 'boolean' ? false : type === 'number' ? null : '';
  try {
    if (scope === 'section') {
      const s = S.sections.find(x=>x.id===id);
      if (!s) return;
      if ((s.settings||{})[key] !== undefined) return toast('Field exists', 'err');
      const newSettings = {...(s.settings||{}), [key]: defaultVal};
      await sbUpdate('sections', id, { settings: newSettings });
    } else if (scope === 'item') {
      const it = S.items.find(x=>x.id===id);
      if (!it) return;
      if ((it.data||{})[key] !== undefined) return toast('Field exists', 'err');
      const newData = {...(it.data||{}), [key]: defaultVal};
      await sbUpdate('items', id, { data: newData });
    }
    closeModal();
    await reloadAll();
    renderEditor();
    toast('Field added ✓', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

async function removeCustomField(patchPath) {
  const [scope, id, key] = patchPath.split(':');
  if (!confirm('Remove the "'+key+'" field? Its value will be lost.')) return;
  try {
    if (scope === 'section_settings') {
      const s = S.sections.find(x=>x.id===id);
      const newSettings = {...(s.settings||{})};
      delete newSettings[key];
      await sbUpdate('sections', id, { settings: newSettings });
    } else if (scope === 'item_data') {
      const it = S.items.find(x=>x.id===id);
      const newData = {...(it.data||{})};
      delete newData[key];
      await sbUpdate('items', id, { data: newData });
    }
    await reloadAll();
    renderEditor();
    toast('Field removed', 'ok');
  } catch (err) { toast('Error: ' + err.message, 'err'); }
}

/* ══════════════════════════════════════════════════════════════════
   MODAL + UTILITIES
══════════════════════════════════════════════════════════════════ */
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function slugify(s) {
  return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50);
}

function toggleMobTree() {
  document.getElementById('tree').classList.toggle('mob-open');
}
function closeMobTree() {
  document.getElementById('tree').classList.remove('mob-open');
}

/* WARN ON UNSAVED */
window.addEventListener('beforeunload', e => {
  if (S.dirty.size > 0) { e.preventDefault(); e.returnValue = 'Unsaved changes.'; return e.returnValue; }
});

buildPinPad();

  S.authed = true;
  bootApp();
