<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>The Francis Smokehouse — St. Francisville, LA</title>
<meta name="description" content="The Francis Smokehouse & Specialty Meats. Slow-smoked BBQ in St. Francisville, Louisiana.">
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="theme-color" content="#0a0604">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;min-width:0;min-height:0}
:root{
  --void:#0a0604;
  --cream:#fbf0dc;--paper:#fdf6e8;
  --sand:#c4a882;--leather:#7a5c38;
  --ember:#d45200;--fire:#ed6e14;--flame:#ff9930;--glow:#ffc24a;
  --serif:'DM Serif Display',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--void);color:var(--cream);-webkit-tap-highlight-color:transparent}
body{font-family:var(--cond);position:fixed;inset:0}

body::after{content:'';position:fixed;inset:0;z-index:100;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");mix-blend-mode:overlay}
#heat{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 55% at 50% 100%,rgba(255,153,48,.28) 0%,rgba(212,82,0,.12) 35%,transparent 65%),radial-gradient(ellipse 55% 35% at 15% 85%,rgba(237,110,20,.18) 0%,transparent 70%),radial-gradient(ellipse 55% 35% at 85% 85%,rgba(255,153,48,.14) 0%,transparent 70%),linear-gradient(180deg,#0d0805 0%,#1a0e07 50%,#2b1a0b 100%)}
#emberCanvas{position:fixed;inset:0;z-index:1;pointer-events:none}
#smokeCanvas{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.65}

/* ═══ PAGE ═══ */
.page{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  padding:max(16px,3vh) max(16px,3vw);
  gap:max(20px,3vh);
  overflow:hidden;
}

/* ═══ HEADER ═══ */
.header{
  text-align:center;
  flex-shrink:0;
}
.eyebrow{
  font-family:var(--cond);font-weight:600;
  font-size:clamp(9px,1vw,11px);
  letter-spacing:.5em;text-transform:uppercase;
  color:rgba(220,190,148,.82);
  margin-bottom:max(8px,1.2vh);
  display:flex;align-items:center;justify-content:center;gap:max(10px,1.5vw);
}
.eyebrow::before,.eyebrow::after{content:'';width:clamp(24px,4vw,52px);height:1px;background:linear-gradient(90deg,transparent,rgba(220,190,148,.85))}
.eyebrow::after{background:linear-gradient(90deg,rgba(220,190,148,.85),transparent)}

.title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(34px,6.5vw,84px);
  letter-spacing:-.015em;line-height:.95;
  color:var(--cream);
}
.title em{font-style:italic;color:var(--flame)}

.subtitle{
  font-family:var(--cond);font-weight:500;
  font-size:clamp(11px,1.2vw,14px);
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(196,168,130,.78);
  margin-top:max(8px,1.2vh);
}

/* ═══ NAV GRID ═══ */
.nav{
  flex:1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:max(10px,1.4vw);
  min-height:0;
}

/* ═══ NAV BUTTON ═══ */
.nav-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-decoration:none;color:inherit;
  background:linear-gradient(180deg,rgba(31,20,9,.6),rgba(15,9,5,.85));
  border:1.5px solid rgba(220,190,148,.42);
  padding:max(16px,2vh) max(14px,1.5vw);
  overflow:hidden;cursor:pointer;
  transition:all .35s var(--ease);
  min-height:0;
  gap:max(4px,0.6vh);
}
.nav-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(212,82,0,.18),rgba(255,153,48,.05));
  opacity:0;transition:opacity .35s var(--ease);
  pointer-events:none;
}
.nav-btn::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--flame),var(--glow),var(--flame),transparent);
  transform:scaleX(0);transform-origin:center;
  transition:transform .5s var(--ease);
}
.nav-btn:hover{
  border-color:var(--flame);
  box-shadow:0 8px 30px rgba(212,82,0,.3),0 0 60px rgba(255,153,48,.08);
  transform:translateY(-3px);
}
.nav-btn:hover::before{opacity:1}
.nav-btn:hover::after{transform:scaleX(1)}

/* Featured catering button — visually prominent so no one misses it */
.nav-btn.featured{
  background:linear-gradient(180deg,rgba(212,82,0,.22),rgba(31,20,9,.85) 60%,rgba(122,26,10,.18));
  border-color:rgba(255,153,48,.55);
  box-shadow:0 0 30px rgba(212,82,0,.15) inset, 0 4px 20px rgba(212,82,0,.18);
}
.nav-btn.featured::before{opacity:.4}
.nav-btn.featured::after{transform:scaleX(.6);opacity:.6}
.nav-btn.featured:hover{border-color:var(--glow);box-shadow:0 10px 40px rgba(255,153,48,.4),0 0 80px rgba(255,194,74,.12)}
.nav-btn.featured:hover::after{transform:scaleX(1);opacity:1}
.nav-btn.featured .nav-btn-sub{color:var(--flame);font-weight:700}

.nav-btn-name{
  position:relative;z-index:1;
  font-family:var(--serif);font-weight:400;
  font-size:clamp(22px,3.5vw,46px);
  letter-spacing:-.01em;line-height:1;
  color:var(--cream);
  transition:color .3s,text-shadow .4s;
}
.nav-btn-name em{font-style:italic;color:var(--flame)}
.nav-btn:hover .nav-btn-name{text-shadow:0 0 30px rgba(255,153,48,.3)}

/* Image-backed nav buttons (when an image URL is set) */
.nav-btn.has-image{
  background-image:var(--card-bg);
  background-size:cover;
  background-position:center;
  background-color:#000;
}
.nav-btn.has-image::before{
  /* Dark gradient overlay so text stays readable on any image */
  background:linear-gradient(180deg,rgba(10,6,3,.25) 0%,rgba(10,6,3,.55) 55%,rgba(10,6,3,.88) 100%);
  opacity:1;
  z-index:1;
}
.nav-btn.has-image .nav-btn-name,
.nav-btn.has-image .nav-btn-sub{
  position:relative;z-index:2;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.nav-btn.has-image:hover{box-shadow:0 8px 32px rgba(212,82,0,.35),0 0 0 1px rgba(255,153,48,.4) inset}

.nav-btn-sub{
  position:relative;z-index:1;
  font-family:var(--cond);font-weight:500;
  font-size:clamp(9px,0.95vw,11px);
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(220,190,148,.78);
  transition:color .3s;
}
.nav-btn:hover .nav-btn-sub{color:var(--flame)}

/* ═══ FOOTER ═══ */
.footer{
  flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;
  padding-top:max(8px,1vh);
  border-top:1px solid rgba(220,190,148,.22);
  gap:14px;flex-wrap:wrap;
  font-family:var(--cond);font-size:clamp(9px,0.9vw,11px);
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(220,190,148,.82);
}
.footer-info{display:flex;align-items:center;gap:max(12px,2vw);flex-wrap:wrap}
.footer-info a{color:rgba(235,205,160,.95);text-decoration:none;transition:color .25s;font-weight:600}
.footer-info a:hover{color:var(--flame)}
.footer-info .dot{color:rgba(196,168,130,.4)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 7px var(--glow);animation:pulse 1.6s ease-in-out infinite;margin-right:6px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.status{color:var(--flame);font-weight:700}
.status.closed{color:rgba(196,168,130,.72)}
.status.closed .live-dot{background:rgba(196,168,130,.62);box-shadow:none;animation:none}
.credit a{color:rgba(255,153,48,.45);text-decoration:none}
.credit a:hover{color:var(--flame)}

/* ═══ ENTRANCE ═══ */
.header{animation:fadeUp .9s .1s var(--ease) both}
.nav-btn:nth-child(1){animation:fadeUp .8s .35s var(--ease) both}
.nav-btn:nth-child(2){animation:fadeUp .8s .42s var(--ease) both}
.nav-btn:nth-child(3){animation:fadeUp .8s .49s var(--ease) both}
.nav-btn:nth-child(4){animation:fadeUp .8s .56s var(--ease) both}
.nav-btn:nth-child(5){animation:fadeUp .8s .63s var(--ease) both}
.nav-btn:nth-child(6){animation:fadeUp .8s .7s var(--ease) both}
.footer{animation:fadeUp .8s .85s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ═══ RESPONSIVE ═══ */

/* Tablet — 3x2 stays */

/* Phone portrait — 2x3 */
@media (max-width:680px){
  .page{padding:14px 12px;gap:14px}
  .eyebrow{font-size:8px;letter-spacing:.35em;margin-bottom:6px}
  .title{font-size:clamp(26px,8vw,38px)}
  .subtitle{font-size:10px;letter-spacing:.22em;margin-top:6px}
  .nav{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
  .nav-btn{padding:10px 12px;gap:3px}
  .nav-btn-name{font-size:clamp(20px,6.5vw,28px)}
  .nav-btn-sub{font-size:9px;letter-spacing:.2em}
  .footer{font-size:8px;letter-spacing:.14em;padding-top:6px;gap:8px;justify-content:center}
  .footer-info{gap:10px;justify-content:center}
  .credit{display:none}
}

/* Very short screens — drop subtitle, eyebrow */
@media (max-height:600px){
  .page{gap:14px;padding:12px 14px}
  .subtitle{display:none}
}
@media (max-height:520px){
  .eyebrow{display:none}
  .title{font-size:clamp(22px,5vw,36px)}
  .nav-btn-sub{display:none}
}

/* Mobile landscape — keep 3x2 */
@media (max-height:500px) and (min-width:600px){
  .nav{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
  .nav-btn-name{font-size:clamp(18px,3vw,28px)}
}

@media (hover:none){
  .nav-btn:active{transform:scale(.98);border-color:var(--flame)}
  .nav-btn:active::before{opacity:1}
  .nav-btn:active::after{transform:scaleX(1)}
  .nav-btn:active .nav-btn-sub{color:var(--flame)}
}
</style>
</head>
<body>
<div id="heat"></div>
<canvas id="emberCanvas"></canvas>
<canvas id="smokeCanvas"></canvas>

<div class="page">

  <header class="header">
    <div class="eyebrow" id="eyebrow">St. Francisville · Louisiana</div>

<!-- Hidden editor trigger — tap top-left 18×18 corner 3 times to open editor -->
<div id="editor-trigger" style="position:fixed;top:0;left:0;width:18px;height:18px;z-index:9999;cursor:default" title=""></div>

<script src="supabase.js"></script>
<script>
/* ═══ HOMEPAGE: load editor settings from Supabase and apply ═══ */
(async function loadAndApplyHomepage(){
  if (typeof loadHomepage !== 'function') {
    console.warn('[homepage] supabase.js not loaded — using static defaults from HTML');
    return;
  }
  let data;
  try { data = await loadHomepage(); }
  catch (e) { console.warn('[homepage] load failed, using defaults:', e); return; }
  console.log('[homepage] loaded data:', data);
  console.log('[homepage] cards images:', data.cards?.map(c => ({label: c.label, image: c.image || '(none)'})));

  // Apply theme via CSS variable overrides
  const r = document.documentElement.style;
  if (data.theme) {
    if (data.theme.bg)      r.setProperty('--void', data.theme.bg);
    if (data.theme.text)    { r.setProperty('--cream', data.theme.text); r.setProperty('--paper', data.theme.text); }
    if (data.theme.eyebrow) r.setProperty('--sand', data.theme.eyebrow);
    if (data.theme.ember)   r.setProperty('--ember', data.theme.ember);
    if (data.theme.fire)    r.setProperty('--fire',  data.theme.fire);
    if (data.theme.flame)   r.setProperty('--flame', data.theme.flame);
    if (data.theme.glow)    r.setProperty('--glow',  data.theme.glow);
  }

  // Identity
  if (data.eyebrow) document.getElementById('eyebrow').textContent = data.eyebrow;
  if (data.title || data.title_em) {
    const t = document.getElementById('title');
    t.innerHTML = `${escapeHtml(data.title||'')} <em>${escapeHtml(data.title_em||'')}</em>`;
  }
  if (data.tagline) document.getElementById('tagline').innerHTML = data.tagline;

  // Footer
  if (data.footer) {
    if (data.footer.phone) {
      const fp = document.getElementById('footer-phone');
      fp.textContent = data.footer.phone;
      fp.href = 'tel:' + data.footer.phone.replace(/\D/g,'');
    }
    if (data.footer.facebook) document.getElementById('footer-facebook').href = data.footer.facebook;
  }

  // Nav cards — replace entirely
  if (Array.isArray(data.cards) && data.cards.length) {
    const nav = document.getElementById('nav-grid');
    console.log('[homepage] rendering', data.cards.length, 'cards');
    nav.innerHTML = data.cards.map(c => {
      const hasImage = !!c.image;
      const featCls  = c.featured ? ' featured' : '';
      const imgCls   = hasImage ? ' has-image' : '';
      const styleAttr = hasImage ? ` style="--card-bg:url('${escapeAttr(c.image)}')"` : '';
      if (hasImage) console.log('[homepage] card', c.label, '→ image:', c.image);
      const label = renderLabel(c.label||'');
      return `<a href="${escapeAttr(c.href||'#')}" class="nav-btn${featCls}${imgCls}"${styleAttr}>
        <span class="nav-btn-name">${label}</span>
        <span class="nav-btn-sub">${escapeHtml(c.sub||'')}</span>
      </a>`;
    }).join('');
  } else {
    console.warn('[homepage] no cards in data, keeping static fallback HTML');
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
  function escapeAttr(s){ return escapeHtml(s); }
  // Allow a single *...* pair in the label to render as italic emphasis
  function renderLabel(s){
    const safe = escapeHtml(s);
    return safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
})();
</script>

<script>
(function(){
  let taps = 0, timer;
  const el = document.getElementById('editor-trigger');
  el.addEventListener('click', () => {
    taps++;
    clearTimeout(timer);
    timer = setTimeout(() => { taps = 0; }, 1200);
    if (taps >= 3) {
      taps = 0;
      location.href = 'Pages/editor.html';
    }
  });
})();
</script>

<script>
const emCv=document.getElementById('emberCanvas'),ex=emCv.getContext('2d');
const smCv=document.getElementById('smokeCanvas'),sx=smCv.getContext('2d');
let W,H;
function resize(){W=emCv.width=smCv.width=innerWidth;H=emCv.height=smCv.height=innerHeight}
resize();addEventListener('resize',resize);

const mkEm=()=>({x:Math.random(),y:1.02+Math.random()*.05,vx:(Math.random()-.5)*.0025,vy:-.0035-Math.random()*.007,r:.4+Math.random()*1.4,life:1,decay:.003+Math.random()*.005,h:14+Math.random()*22,sway:(Math.random()-.5)*.0008});
const embers=Array.from({length:32},mkEm);
const mkSm=()=>({x:.1+Math.random()*.8,y:1.05+Math.random()*.05,vx:(Math.random()-.5)*.00025,vy:-.0005-Math.random()*.0005,r:30+Math.random()*55,a:0,ta:.01+Math.random()*.015,gr:.05+Math.random()*.035,wb:Math.random()*Math.PI*2,ws:.003+Math.random()*.005});
const smoke=Array.from({length:9},mkSm);

function loop(){
  ex.clearRect(0,0,W,H);
  for(let i=0;i<embers.length;i++){
    const e=embers[i];
    e.x+=e.vx+e.sway;e.y+=e.vy;e.life-=e.decay;
    if(e.life<=0||e.y<-.02){embers[i]=mkEm();continue}
    ex.beginPath();ex.arc(e.x*W,e.y*H,e.r,0,Math.PI*2);
    ex.fillStyle=`hsla(${e.h},100%,${58+e.life*32}%,${e.life*.92})`;
    ex.shadowBlur=10;ex.shadowColor=`hsla(${e.h},100%,62%,${e.life*.65})`;
    ex.fill();ex.shadowBlur=0;
  }
  sx.clearRect(0,0,W,H);
  for(const s of smoke){
    s.wb+=s.ws;s.x+=s.vx+Math.sin(s.wb)*.0002;s.y+=s.vy;s.r+=s.gr;
    s.a=s.a<s.ta?s.a+.0014:Math.max(0,s.a-.001);
    if(s.y<-.2||s.a<=0){Object.assign(s,mkSm());continue}
    const g=sx.createRadialGradient(s.x*W,s.y*H,0,s.x*W,s.y*H,s.r);
    g.addColorStop(0,`rgba(120,75,38,${s.a*1.1})`);g.addColorStop(.5,`rgba(82,52,28,${s.a*.5})`);g.addColorStop(1,'transparent');
    sx.fillStyle=g;sx.beginPath();sx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);sx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

function updateStatus(){
  const now=new Date();
  const day=now.getDay();
  const totalMin=now.getHours()*60+now.getMinutes();
  let open=false;
  if(day===0){open=totalMin>=600&&totalMin<900}
  else{open=totalMin>=600&&totalMin<1080}
  const el=document.getElementById('status');
  if(open){el.classList.remove('closed');el.innerHTML='<span class="live-dot"></span>Open Now'}
  else{el.classList.add('closed');el.innerHTML='<span class="live-dot"></span>Closed'}
}
updateStatus();setInterval(updateStatus,60000);
</script>
