<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>The Francis Smokehouse — St. Francisville, LA</title>
<meta name="description" content="The Francis Smokehouse & Specialty Meats. Slow-smoked BBQ in St. Francisville, Louisiana.">
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="theme-color" content="#0a0604">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;min-width:0;min-height:0}
:root{
  --void:#0a0604;
  --cream:#f5edda;--paper:#faf3e3;
  --sand:#c4a882;--leather:#7a5c38;
  --ember:#c04a00;--fire:#e06510;--flame:#f08c28;--glow:#f5b040;
  --serif:'DM Serif Display',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--void);color:var(--cream);-webkit-tap-highlight-color:transparent}
body{font-family:var(--cond);position:fixed;inset:0}

body::after{content:'';position:fixed;inset:0;z-index:100;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");mix-blend-mode:overlay}
#heat{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 50% at 50% 100%,rgba(192,74,0,.18) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 15% 85%,rgba(122,28,10,.1) 0%,transparent 70%),linear-gradient(180deg,#0a0604 0%,#150c06 50%,#231509 100%)}
#emberCanvas{position:fixed;inset:0;z-index:1;pointer-events:none}
#smokeCanvas{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.5}

/* ═══ PAGE ═══ */
.page{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  padding:max(16px,3vh) max(16px,3vw);
  gap:max(20px,3vh);
  overflow:hidden;
}

/* ═══ HEADER ═══ */
.header{
  text-align:center;
  flex-shrink:0;
}
.eyebrow{
  font-family:var(--cond);font-weight:600;
  font-size:clamp(9px,1vw,11px);
  letter-spacing:.5em;text-transform:uppercase;
  color:rgba(196,168,130,.68);
  margin-bottom:max(8px,1.2vh);
  display:flex;align-items:center;justify-content:center;gap:max(10px,1.5vw);
}
.eyebrow::before,.eyebrow::after{content:'';width:clamp(24px,4vw,52px);height:1px;background:linear-gradient(90deg,transparent,rgba(196,168,130,.72))}
.eyebrow::after{background:linear-gradient(90deg,rgba(196,168,130,.72),transparent)}

.title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(34px,6.5vw,84px);
  letter-spacing:-.015em;line-height:.95;
  color:var(--cream);
}
.title em{font-style:italic;color:var(--flame)}

.subtitle{
  font-family:var(--cond);font-weight:500;
  font-size:clamp(11px,1.2vw,14px);
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(196,168,130,.78);
  margin-top:max(8px,1.2vh);
}

/* ═══ NAV GRID ═══ */
.nav{
  flex:1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:max(10px,1.4vw);
  min-height:0;
}

/* ═══ NAV BUTTON ═══ */
.nav-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-decoration:none;color:inherit;
  background:linear-gradient(180deg,rgba(31,20,9,.6),rgba(15,9,5,.85));
  border:1.5px solid rgba(196,168,130,.32);
  padding:max(16px,2vh) max(14px,1.5vw);
  overflow:hidden;cursor:pointer;
  transition:all .35s var(--ease);
  min-height:0;
  gap:max(4px,0.6vh);
}
.nav-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(192,74,0,.18),rgba(240,140,40,.05));
  opacity:0;transition:opacity .35s var(--ease);
  pointer-events:none;
}
.nav-btn::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--flame),var(--glow),var(--flame),transparent);
  transform:scaleX(0);transform-origin:center;
  transition:transform .5s var(--ease);
}
.nav-btn:hover{
  border-color:var(--flame);
  box-shadow:0 8px 30px rgba(192,74,0,.3),0 0 60px rgba(240,140,40,.08);
  transform:translateY(-3px);
}
.nav-btn:hover::before{opacity:1}
.nav-btn:hover::after{transform:scaleX(1)}

/* Featured catering button — visually prominent so no one misses it */
.nav-btn.featured{
  background:linear-gradient(180deg,rgba(192,74,0,.22),rgba(31,20,9,.85) 60%,rgba(122,26,10,.18));
  border-color:rgba(240,140,40,.55);
  box-shadow:0 0 30px rgba(192,74,0,.15) inset, 0 4px 20px rgba(192,74,0,.18);
}
.nav-btn.featured::before{opacity:.4}
.nav-btn.featured::after{transform:scaleX(.6);opacity:.6}
.nav-btn.featured:hover{border-color:var(--glow);box-shadow:0 10px 40px rgba(240,140,40,.4),0 0 80px rgba(245,176,64,.12)}
.nav-btn.featured:hover::after{transform:scaleX(1);opacity:1}
.nav-btn.featured .nav-btn-sub{color:var(--flame);font-weight:700}

.nav-btn-name{
  position:relative;z-index:1;
  font-family:var(--serif);font-weight:400;
  font-size:clamp(22px,3.5vw,46px);
  letter-spacing:-.01em;line-height:1;
  color:var(--cream);
  transition:color .3s,text-shadow .4s;
}
.nav-btn-name em{font-style:italic;color:var(--flame)}
.nav-btn:hover .nav-btn-name{text-shadow:0 0 30px rgba(240,140,40,.3)}

.nav-btn-sub{
  position:relative;z-index:1;
  font-family:var(--cond);font-weight:500;
  font-size:clamp(9px,0.95vw,11px);
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(196,168,130,.68);
  transition:color .3s;
}
.nav-btn:hover .nav-btn-sub{color:var(--flame)}

/* ═══ FOOTER ═══ */
.footer{
  flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;
  padding-top:max(8px,1vh);
  border-top:1px solid rgba(196,168,130,.15);
  gap:14px;flex-wrap:wrap;
  font-family:var(--cond);font-size:clamp(9px,0.9vw,11px);
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(196,168,130,.72);
}
.footer-info{display:flex;align-items:center;gap:max(12px,2vw);flex-wrap:wrap}
.footer-info a{color:rgba(196,168,130,.88);text-decoration:none;transition:color .25s;font-weight:600}
.footer-info a:hover{color:var(--flame)}
.footer-info .dot{color:rgba(196,168,130,.4)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 7px var(--glow);animation:pulse 1.6s ease-in-out infinite;margin-right:6px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.status{color:var(--flame);font-weight:700}
.status.closed{color:rgba(196,168,130,.72)}
.status.closed .live-dot{background:rgba(196,168,130,.62);box-shadow:none;animation:none}
.credit a{color:rgba(240,140,40,.45);text-decoration:none}
.credit a:hover{color:var(--flame)}

/* ═══ ENTRANCE ═══ */
.header{animation:fadeUp .9s .1s var(--ease) both}
.nav-btn:nth-child(1){animation:fadeUp .8s .35s var(--ease) both}
.nav-btn:nth-child(2){animation:fadeUp .8s .42s var(--ease) both}
.nav-btn:nth-child(3){animation:fadeUp .8s .49s var(--ease) both}
.nav-btn:nth-child(4){animation:fadeUp .8s .56s var(--ease) both}
.nav-btn:nth-child(5){animation:fadeUp .8s .63s var(--ease) both}
.nav-btn:nth-child(6){animation:fadeUp .8s .7s var(--ease) both}
.footer{animation:fadeUp .8s .85s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ═══ RESPONSIVE ═══ */

/* Tablet — 3x2 stays */

/* Phone portrait — 2x3 */
@media (max-width:680px){
  .page{padding:14px 12px;gap:14px}
  .eyebrow{font-size:8px;letter-spacing:.35em;margin-bottom:6px}
  .title{font-size:clamp(26px,8vw,38px)}
  .subtitle{font-size:10px;letter-spacing:.22em;margin-top:6px}
  .nav{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
  .nav-btn{padding:10px 12px;gap:3px}
  .nav-btn-name{font-size:clamp(20px,6.5vw,28px)}
  .nav-btn-sub{font-size:9px;letter-spacing:.2em}
  .footer{font-size:8px;letter-spacing:.14em;padding-top:6px;gap:8px;justify-content:center}
  .footer-info{gap:10px;justify-content:center}
  .credit{display:none}
}

/* Very short screens — drop subtitle, eyebrow */
@media (max-height:600px){
  .page{gap:14px;padding:12px 14px}
  .subtitle{display:none}
}
@media (max-height:520px){
  .eyebrow{display:none}
  .title{font-size:clamp(22px,5vw,36px)}
  .nav-btn-sub{display:none}
}

/* Mobile landscape — keep 3x2 */
@media (max-height:500px) and (min-width:600px){
  .nav{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
  .nav-btn-name{font-size:clamp(18px,3vw,28px)}
}

@media (hover:none){
  .nav-btn:active{transform:scale(.98);border-color:var(--flame)}
  .nav-btn:active::before{opacity:1}
  .nav-btn:active::after{transform:scaleX(1)}
  .nav-btn:active .nav-btn-sub{color:var(--flame)}
}
</style>
</head>
<body>
<div id="heat"></div>
<canvas id="emberCanvas"></canvas>
<canvas id="smokeCanvas"></canvas>

<div class="page">

  <header class="header">
    <div class="eyebrow">St. Francisville · Louisiana</div>
    <h1 class="title">The Francis <em>Smokehouse</em></h1>
    <div class="subtitle">&amp; Specialty Meats</div>
  </header>

  <nav class="nav">
    <a href="menu.html" class="nav-btn">
      <span class="nav-btn-name">Menu</span>
      <span class="nav-btn-sub">BBQ &amp; Po-boys</span>
    </a>
    <a href="menu.html#specials" class="nav-btn">
      <span class="nav-btn-name">Daily <em>Special</em></span>
      <span class="nav-btn-sub">Posted at 6am</span>
    </a>
    <a href="market.html" class="nav-btn">
      <span class="nav-btn-name">Market</span>
      <span class="nav-btn-sub">Smokehouse Market</span>
    </a>
    <a href="catering.html" class="nav-btn featured">
      <span class="nav-btn-name">Catering</span>
      <span class="nav-btn-sub">Book Your Event →</span>
    </a>
    <a href="about.html" class="nav-btn">
      <span class="nav-btn-name">About</span>
      <span class="nav-btn-sub">Since 2015</span>
    </a>
    <a href="findus.html" class="nav-btn">
      <span class="nav-btn-name">Find <em>Us</em></span>
      <span class="nav-btn-sub">6779 US Hwy 61</span>
    </a>
  </nav>

  <footer class="footer">
    <div class="footer-info">
      <span class="status" id="status"><span class="live-dot"></span>Open Now</span>
      <span class="dot">·</span>
      <a href="tel:+12252455046">(225) 245-5046</a>
      <span class="dot">·</span>
      <a href="giftcards.html">Gift Cards</a>
      <span class="dot">·</span>
      <a href="https://www.facebook.com/1547733028788117/" target="_blank">Facebook</a>
    </div>
    <div class="credit">© 2025 · <a href="https://northstardigitalllc.com" target="_blank">NorthStar Digital</a></div>
  </footer>

</div>

<script>
const emCv=document.getElementById('emberCanvas'),ex=emCv.getContext('2d');
const smCv=document.getElementById('smokeCanvas'),sx=smCv.getContext('2d');
let W,H;
function resize(){W=emCv.width=smCv.width=innerWidth;H=emCv.height=smCv.height=innerHeight}
resize();addEventListener('resize',resize);

const mkEm=()=>({x:Math.random(),y:1.02+Math.random()*.05,vx:(Math.random()-.5)*.0025,vy:-.0035-Math.random()*.007,r:.4+Math.random()*1.4,life:1,decay:.003+Math.random()*.005,h:14+Math.random()*22,sway:(Math.random()-.5)*.0008});
const embers=Array.from({length:22},mkEm);
const mkSm=()=>({x:.1+Math.random()*.8,y:1.05+Math.random()*.05,vx:(Math.random()-.5)*.00025,vy:-.0005-Math.random()*.0005,r:30+Math.random()*55,a:0,ta:.01+Math.random()*.015,gr:.05+Math.random()*.035,wb:Math.random()*Math.PI*2,ws:.003+Math.random()*.005});
const smoke=Array.from({length:9},mkSm);

function loop(){
  ex.clearRect(0,0,W,H);
  for(let i=0;i<embers.length;i++){
    const e=embers[i];
    e.x+=e.vx+e.sway;e.y+=e.vy;e.life-=e.decay;
    if(e.life<=0||e.y<-.02){embers[i]=mkEm();continue}
    ex.beginPath();ex.arc(e.x*W,e.y*H,e.r,0,Math.PI*2);
    ex.fillStyle=`hsla(${e.h},100%,${52+e.life*32}%,${e.life*.78})`;
    ex.shadowBlur=6;ex.shadowColor=`hsla(${e.h},100%,58%,${e.life*.45})`;
    ex.fill();ex.shadowBlur=0;
  }
  sx.clearRect(0,0,W,H);
  for(const s of smoke){
    s.wb+=s.ws;s.x+=s.vx+Math.sin(s.wb)*.0002;s.y+=s.vy;s.r+=s.gr;
    s.a=s.a<s.ta?s.a+.0014:Math.max(0,s.a-.001);
    if(s.y<-.2||s.a<=0){Object.assign(s,mkSm());continue}
    const g=sx.createRadialGradient(s.x*W,s.y*H,0,s.x*W,s.y*H,s.r);
    g.addColorStop(0,`rgba(78,54,32,${s.a})`);g.addColorStop(.5,`rgba(58,38,22,${s.a*.4})`);g.addColorStop(1,'transparent');
    sx.fillStyle=g;sx.beginPath();sx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);sx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

function updateStatus(){
  const now=new Date();
  const day=now.getDay();
  const totalMin=now.getHours()*60+now.getMinutes();
  let open=false;
  if(day===0){open=totalMin>=600&&totalMin<900}
  else{open=totalMin>=600&&totalMin<1080}
  const el=document.getElementById('status');
  if(open){el.classList.remove('closed');el.innerHTML='<span class="live-dot"></span>Open Now'}
  else{el.classList.add('closed');el.innerHTML='<span class="live-dot"></span>Closed'}
}
updateStatus();setInterval(updateStatus,60000);
</script>
</body>
</html>
