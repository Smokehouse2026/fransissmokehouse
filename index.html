<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu — The Francis Smokehouse</title>
<meta name="description" content="Full menu for The Francis Smokehouse. BBQ plates, po-boys, burgers, fried chicken and more.">
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="theme-color" content="#252d2f">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Permanent+Marker&family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --board:#354042;--board-light:#3d4849;--board-dark:#2a3234;
  --chalk:#d4d0c8;--chalk-dim:rgba(212,208,200,.5);--chalk-faint:rgba(212,208,200,.2);
  --green:#6ddb7a;--pink:#e87cb0;--yellow:#e8d44d;--cyan:#5ec4d4;--orange:#e8943a;
  --bright:#eceae4;--frame:#b8bcb8;
  --hand:'Caveat',cursive;--block:'Permanent Marker',cursive;
  --cond:'Barlow Condensed',sans-serif;--serif:'Playfair Display',serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1e1f}
body{display:flex;align-items:center;justify-content:center;padding:clamp(6px,1.2vw,16px)}

/* ═══════ BOARD FRAME ═══════ */
#board{
  width:100%;height:100%;max-width:1600px;
  display:grid;grid-template-rows:auto 1fr;
  background:var(--board);border-radius:4px;overflow:hidden;position:relative;
  box-shadow:
    inset 0 1px 8px rgba(0,0,0,.3),inset 0 -1px 6px rgba(0,0,0,.2),
    0 0 0 clamp(5px,.8vw,10px) var(--frame),
    0 0 0 clamp(7px,1vw,13px) #969a96,
    0 6px 30px rgba(0,0,0,.45);
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"),
    radial-gradient(ellipse at 25% 20%,rgba(212,208,200,.025),transparent 50%),
    radial-gradient(ellipse at 75% 60%,rgba(212,208,200,.02),transparent 40%),
    linear-gradient(175deg,#3d4849 0%,#354042 35%,#303a3c 65%,#2a3234 100%);
}

/* ═══════ TOP BAR ═══════ */
#topbar{
  display:flex;align-items:center;
  padding:clamp(8px,1.2vh,14px) clamp(12px,2vw,24px);
  border-bottom:2px solid var(--chalk-faint);
  gap:clamp(8px,1.5vw,18px);
  flex-shrink:0;position:relative;z-index:10;
}
.top-back{
  font-family:var(--cond);font-weight:500;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-faint);
  text-decoration:none;transition:color .3s;flex-shrink:0;
}
.top-back:hover{color:var(--chalk)}
.top-brand{
  flex:1;text-align:center;
  font-family:var(--serif);font-weight:900;
  font-size:clamp(14px,2.2vw,26px);color:var(--bright);
  letter-spacing:.02em;
  text-shadow:1px 1px 0 rgba(0,0,0,.3);
}
.top-brand em{font-style:italic;font-weight:400;color:var(--chalk-dim);font-size:.65em}
.top-info{
  font-family:var(--cond);font-weight:400;font-size:clamp(9px,1vw,12px);
  letter-spacing:.1em;color:var(--chalk-faint);flex-shrink:0;
  text-align:right;
}

/* ═══════ MAIN AREA ═══════ */
#main{display:grid;grid-template-columns:auto 1fr;height:100%;min-height:0;overflow:hidden}

/* ═══════ CATEGORY SIDEBAR ═══════ */
#cats{
  display:flex;flex-direction:column;
  border-right:1px solid var(--chalk-faint);
  padding:clamp(6px,1vh,12px) 0;
  overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;width:clamp(110px,14vw,180px);
}
#cats::-webkit-scrollbar{display:none}
.cat-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:clamp(10px,1.4vh,16px) clamp(8px,1vw,14px);
  border:none;background:none;cursor:pointer;
  border-left:3px solid transparent;
  transition:all .3s;text-align:center;
}
.cat-btn:hover{background:rgba(212,208,200,.03)}
.cat-btn.active{
  background:rgba(212,208,200,.05);
  border-left-color:var(--active-color,var(--chalk));
}
.cat-icon{font-size:clamp(20px,2.8vw,30px);line-height:1}
.cat-label{
  font-family:var(--cond);font-weight:700;
  font-size:clamp(9px,1vw,12px);letter-spacing:.12em;
  text-transform:uppercase;color:var(--chalk-dim);
  transition:color .3s;line-height:1.2;
}
.cat-btn.active .cat-label{color:var(--bright)}
.cat-btn:hover .cat-label{color:var(--chalk)}

/* ═══════ CONTENT AREA ═══════ */
#content{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}

/* Section header */
#sec-header{
  flex-shrink:0;display:flex;align-items:center;
  padding:clamp(10px,1.5vh,18px) clamp(14px,2.5vw,30px);
  gap:clamp(8px,1.2vw,16px);
  border-bottom:1px solid var(--chalk-faint);
  min-height:0;
}
#sec-icon{font-size:clamp(22px,3vw,34px)}
#sec-title{
  font-family:var(--cond);font-weight:800;
  font-size:clamp(20px,3vw,34px);letter-spacing:.12em;
  text-transform:uppercase;color:var(--bright);
  text-shadow:1px 1px 0 rgba(0,0,0,.25);
  transition:color .4s;
}
#sec-subtitle{
  font-family:var(--cond);font-weight:400;
  font-size:clamp(10px,1.1vw,14px);letter-spacing:.1em;
  text-transform:uppercase;color:var(--chalk-dim);
  margin-left:auto;
}

/* ═══════ ITEM GRID ═══════ */
#items-wrap{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:clamp(10px,1.8vh,20px) clamp(14px,2.5vw,30px);
  scrollbar-width:thin;scrollbar-color:rgba(212,208,200,.15) transparent;
}
#items-wrap::-webkit-scrollbar{width:4px}
#items-wrap::-webkit-scrollbar-thumb{background:rgba(212,208,200,.15);border-radius:2px}
#items-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(160px,18vw,240px),1fr));
  gap:clamp(10px,1.5vw,18px);
}

/* ═══════ ITEM CARD ═══════ */
.item-card{
  position:relative;border-radius:6px;overflow:hidden;
  background:var(--board-dark);cursor:pointer;
  border:1px solid rgba(212,208,200,.06);
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s;
  opacity:0;animation:cardIn .4s ease forwards;
}
.item-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 1px rgba(212,208,200,.1);
  border-color:rgba(212,208,200,.12);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Photo area */
.card-img{
  width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
  filter:brightness(.88) contrast(1.05) saturate(1.1);
  transition:filter .35s,transform .5s;
  background:var(--board-dark);
}
.item-card:hover .card-img{
  filter:brightness(.95) contrast(1.08) saturate(1.15);
  transform:scale(1.05);
}
/* Gradient overlay on photo */
.card-img-wrap{
  position:relative;overflow:hidden;
}
.card-img-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(42,50,52,.95) 0%,rgba(42,50,52,.3) 40%,transparent 70%);
  pointer-events:none;
}
/* Fallback when no image */
.card-img-placeholder{
  width:100%;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--board-dark),var(--board));
  font-size:clamp(32px,4vw,48px);
}

/* Text overlay */
.card-body{
  position:absolute;bottom:0;left:0;right:0;
  padding:clamp(8px,1.2vw,14px);
  z-index:2;
}
.card-name{
  font-family:var(--cond);font-weight:700;
  font-size:clamp(13px,1.4vw,17px);letter-spacing:.06em;
  text-transform:uppercase;color:var(--bright);
  line-height:1.2;
  text-shadow:0 1px 4px rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.3);
}
.card-note{
  font-family:var(--hand);font-size:clamp(11px,1.1vw,14px);
  color:var(--chalk-dim);margin-top:1px;
}
.card-price{
  font-family:var(--cond);font-weight:800;
  font-size:clamp(16px,1.8vw,22px);
  margin-top:2px;letter-spacing:.02em;
  text-shadow:0 0 12px currentColor;
  transition:transform .3s;
}
.item-card:hover .card-price{transform:scale(1.06)}
.card-price-sm{
  font-family:var(--cond);font-weight:500;
  font-size:clamp(10px,1vw,12px);
  color:var(--chalk-dim);letter-spacing:.04em;
}

/* ═══════ SPECIAL BANNER (top of first category) ═══════ */
.special-banner{
  grid-column:1/-1;
  display:flex;align-items:center;gap:clamp(12px,2vw,20px);
  padding:clamp(12px,1.5vh,18px) clamp(14px,2vw,22px);
  border:2px solid var(--orange);border-radius:6px;
  background:rgba(232,148,58,.05);
  animation:specialPulse 3s ease-in-out infinite;
}
@keyframes specialPulse{
  0%,100%{box-shadow:inset 0 0 15px rgba(232,148,58,.04)}
  50%{box-shadow:inset 0 0 25px rgba(232,148,58,.08)}
}
.special-img{
  width:clamp(70px,10vw,120px);height:clamp(70px,10vw,120px);
  border-radius:4px;object-fit:cover;flex-shrink:0;
  border:1px solid rgba(232,148,58,.2);
  filter:brightness(.9) saturate(1.1);
}
.special-body{flex:1;min-width:0}
.special-tag{
  font-family:var(--cond);font-weight:800;font-size:clamp(9px,1vw,12px);
  letter-spacing:.25em;text-transform:uppercase;color:var(--orange);
}
.special-name{
  font-family:var(--hand);font-weight:700;
  font-size:clamp(20px,2.8vw,30px);color:var(--bright);line-height:1.1;
}
.special-desc{
  font-family:var(--hand);font-size:clamp(13px,1.3vw,16px);
  color:var(--chalk-dim);margin-top:2px;
}
.special-price{
  font-family:var(--block);font-size:clamp(24px,3.5vw,36px);
  color:var(--green);flex-shrink:0;
  text-shadow:0 0 12px rgba(109,219,122,.2);
}

/* ═══════ MOBILE ═══════ */
@media(max-width:700px){
  #main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #cats{
    flex-direction:row;width:100%;
    border-right:none;border-bottom:1px solid var(--chalk-faint);
    padding:0;overflow-x:auto;
  }
  .cat-btn{
    flex-direction:row;gap:6px;
    padding:clamp(8px,1.2vh,12px) clamp(10px,2vw,16px);
    border-left:none;border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  .cat-btn.active{border-left-color:transparent;border-bottom-color:var(--active-color,var(--chalk))}
  .cat-icon{font-size:18px}
  .cat-label{font-size:10px}
  #sec-header{padding:8px 14px;gap:8px}
  #sec-subtitle{display:none}
  #items-wrap{padding:10px 12px}
  #items-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .special-banner{flex-direction:column;text-align:center}
}

/* ═══════ EXPANDED ITEM VIEW (lightbox) ═══════ */
#lightbox{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(26,30,31,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .35s;
  padding:clamp(16px,3vw,40px);
}
#lightbox.open{opacity:1;pointer-events:all}
#lb-card{
  max-width:500px;width:100%;border-radius:8px;overflow:hidden;
  background:var(--board-dark);
  border:1px solid rgba(212,208,200,.1);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transform:scale(.9) translateY(20px);
  transition:transform .4s cubic-bezier(.22,1,.36,1);
}
#lightbox.open #lb-card{transform:scale(1) translateY(0)}
#lb-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:brightness(.92) contrast(1.05) saturate(1.1)}
#lb-body{padding:clamp(16px,2.5vw,24px)}
#lb-name{
  font-family:var(--cond);font-weight:800;
  font-size:clamp(20px,3vw,28px);letter-spacing:.08em;
  text-transform:uppercase;color:var(--bright);
}
#lb-note{font-family:var(--hand);font-size:16px;color:var(--chalk-dim);margin-top:4px}
#lb-price{
  font-family:var(--block);font-size:clamp(28px,4vw,38px);
  margin-top:8px;text-shadow:0 0 14px currentColor;
}
#lb-close{
  position:absolute;top:clamp(12px,2vh,20px);right:clamp(12px,2vw,20px);
  font-family:var(--cond);font-weight:600;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--chalk-dim);background:rgba(42,50,52,.7);
  border:1px solid var(--chalk-faint);padding:6px 14px;border-radius:3px;
  cursor:pointer;transition:all .25s;backdrop-filter:blur(4px);
}
#lb-close:hover{color:var(--bright);border-color:var(--chalk)}
</style>
</head>
<body>

<div id="board">
  <!-- TOP BAR -->
  <div id="topbar">
    <a class="top-back" href="index.html">← Home</a>
    <div class="top-brand">THE FRANCIS <em>Smokehouse & Specialty Meats</em></div>
    <div class="top-info" id="top-info"></div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="cats"></div>
    <div id="content">
      <div id="sec-header">
        <span id="sec-icon"></span>
        <span id="sec-title"></span>
        <span id="sec-subtitle"></span>
      </div>
      <div id="items-wrap"><div id="items-grid"></div></div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLB(event)">
  <button id="lb-close" onclick="closeLB(event)">✕ Close</button>
  <div id="lb-card">
    <img id="lb-img" src="" alt="">
    <div id="lb-body">
      <div id="lb-name"></div>
      <div id="lb-note"></div>
      <div id="lb-price"></div>
    </div>
  </div>
</div>

<script src="site-data.js"></script>
<script>
var $=function(id){return document.getElementById(id)};
var fmt=function(n){if(n==null)return'Ask';if(n===0)return'Free';return'$'+n.toFixed(2)};

var CAT_ORDER=['bbq_plates','burgers_sandwiches','fried_chicken','salads','sides','combos','by_the_pound','desserts'];
var activeKey=CAT_ORDER[0];

/* ── Top info ── */
if(typeof SITE_INFO!=='undefined'){
  $('top-info').innerHTML=SITE_INFO.phone+'<br>'+SITE_INFO.hours.weekday;
}

/* ── Build category buttons ── */
var catsEl=$('cats');
CAT_ORDER.forEach(function(key){
  var sec=MENU[key];if(!sec)return;
  var btn=document.createElement('button');
  btn.className='cat-btn';
  btn.style.setProperty('--active-color',sec.color||'var(--chalk)');
  btn.innerHTML='<span class="cat-icon">'+sec.icon+'</span><span class="cat-label">'+sec.title+'</span>';
  btn.onclick=function(){switchCat(key)};
  btn.dataset.key=key;
  catsEl.appendChild(btn);
});

/* ── Get special data ── */
function getSpecial(){
  if(typeof SITE_SPECIAL==='undefined')return null;
  if(!SITE_SPECIAL||SITE_SPECIAL.hidden)return null;
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  if(SITE_SPECIAL.date&&SITE_SPECIAL.date!==todayStr())return null;
  return SITE_SPECIAL;
}

/* ═══════ SWITCH CATEGORY ═══════ */
function switchCat(key){
  activeKey=key;
  var sec=MENU[key];if(!sec)return;

  /* Active button */
  document.querySelectorAll('.cat-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.key===key);
  });

  /* Header */
  $('sec-icon').textContent=sec.icon;
  $('sec-title').textContent=sec.title;
  $('sec-title').style.color=sec.color||'var(--bright)';
  $('sec-subtitle').textContent=sec.subtitle||'';

  /* Build item cards */
  var grid=$('items-grid');
  var h='';

  /* Special banner on first category */
  if(key===CAT_ORDER[0]){
    var sp=getSpecial();
    if(sp){
      h+='<div class="special-banner">';
      h+='<img class="special-img" src="'+(sp.image||'')+'" alt="'+sp.name+'" onerror="this.style.display=\'none\'">';
      h+='<div class="special-body">';
      h+='<div class="special-tag">🔥 '+(sp.type||"Today's Special")+'</div>';
      h+='<div class="special-name">'+sp.name+'</div>';
      if(sp.desc)h+='<div class="special-desc">'+sp.desc+'</div>';
      h+='</div>';
      if(sp.price)h+='<div class="special-price">'+sp.price+'</div>';
      h+='</div>';
    }
  }

  /* Item cards */
  sec.items.forEach(function(item,i){
    var priceColor=sec.color||'var(--chalk)';
    var delay=(i*0.05+0.05).toFixed(2);

    h+='<div class="item-card" style="animation-delay:'+delay+'s" onclick="openLB(\''+key+'\','+i+')">';

    /* Image or placeholder */
    if(item.img){
      h+='<div class="card-img-wrap"><img class="card-img" src="'+item.img+'" alt="'+item.name+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=card-img-placeholder>'+sec.icon+'</div>\'"></div>';
    } else {
      h+='<div class="card-img-wrap"><div class="card-img-placeholder">'+sec.icon+'</div></div>';
    }

    /* Text overlay */
    h+='<div class="card-body">';
    h+='<div class="card-name">'+item.name+'</div>';
    if(item.note)h+='<div class="card-note">'+item.note+'</div>';

    /* Price display */
    if(item.priceLg){
      h+='<div class="card-price" style="color:'+priceColor+'">'+fmt(item.price)+' <span class="card-price-sm">sm</span> · '+fmt(item.priceLg)+' <span class="card-price-sm">lg</span></div>';
    } else {
      h+='<div class="card-price" style="color:'+priceColor+'">'+fmt(item.price)+'</div>';
    }

    h+='</div></div>';
  });

  grid.innerHTML=h;
  $('items-wrap').scrollTop=0;
}

/* ═══════ LIGHTBOX ═══════ */
function openLB(catKey,idx){
  var sec=MENU[catKey];if(!sec)return;
  var item=sec.items[idx];if(!item)return;
  var priceColor=sec.color||'var(--chalk)';

  $('lb-img').src=item.img||'';
  $('lb-img').alt=item.name;
  $('lb-img').onerror=function(){this.style.display='none'};
  $('lb-name').textContent=item.name;
  $('lb-note').textContent=item.note||sec.subtitle||'';

  if(item.priceLg){
    $('lb-price').innerHTML=fmt(item.price)+' <span style="font-size:.5em;color:var(--chalk-dim)">sm</span> · '+fmt(item.priceLg)+' <span style="font-size:.5em;color:var(--chalk-dim)">lg</span>';
  } else {
    $('lb-price').textContent=fmt(item.price);
  }
  $('lb-price').style.color=priceColor;

  $('lightbox').classList.add('open');
}
function closeLB(e){
  if(e&&e.target.id!=='lightbox'&&e.target.id!=='lb-close')return;
  $('lightbox').classList.remove('open');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLB({target:{id:'lightbox'}})});

/* ═══════ INIT ═══════ */
switchCat(CAT_ORDER[0]);
</script>
</body>
</html>
