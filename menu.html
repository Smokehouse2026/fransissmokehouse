<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Francis Smokehouse — Ember Chamber Menu</title>
<style>
:root{
  --bg:#090605;
  --bg2:#130b08;
  --steel:#171514;
  --steel2:#231d1a;
  --ash:#2d2622;
  --smoke:#cfc8c2;
  --text:#f6eee8;
  --muted:#bba89b;
  --ember:#ff6a2a;
  --ember2:#ff9a3c;
  --ember3:#ffd27a;
  --line:rgba(255,255,255,.08);
  --glow:rgba(255,106,42,.34);
  --mx:50vw;
  --my:50vh;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 35%, #2a1810 0%, #140b08 22%, #0a0605 52%, #050303 100%);
color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(60rem 40rem at 50% 110%, rgba(255,106,42,.18), transparent 55%),
    radial-gradient(30rem 16rem at 50% 103%, rgba(255,154,60,.15), transparent 60%);
  pointer-events:none;
}
#smoke,#embers,#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.grain,.vignette,.spot{
  position:fixed;inset:0;pointer-events:none
}
.grain{
  opacity:.05;
  background-image:
    radial-gradient(circle at 20% 30%, white 0 1px, transparent 1px),
    radial-gradient(circle at 65% 60%, white 0 1px, transparent 1px),
    radial-gradient(circle at 40% 80%, white 0 1px, transparent 1px);
  background-size:170px 170px, 210px 210px, 190px 190px;
  mix-blend-mode:soft-light;
}
.vignette{
  background:radial-gradient(circle at center, transparent 36%, rgba(0,0,0,.52) 100%);
}
.spot{
  background:
    radial-gradient(22rem 22rem at var(--mx) var(--my), rgba(255,154,60,.10), transparent 55%),
    radial-gradient(34rem 34rem at var(--mx) var(--my), rgba(255,106,42,.05), transparent 70%);
}

.ui{
  position:relative;z-index:2;height:100%;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:18px;
}
.topbar,.bottombar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:12px}
.badge,.chip,.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
}
.badge{
  width:48px;height:48px;border-radius:16px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 72%, rgba(255,154,60,.9), transparent 24%),
    linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
    linear-gradient(180deg, rgba(51,37,29,.95), rgba(19,13,10,.95));
  box-shadow:0 0 26px rgba(255,106,42,.14), inset 0 1px 0 rgba(255,255,255,.08);
}
.badge:before,.badge:after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);border-radius:999px;
}
.badge:before{
  top:8px;width:4px;height:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.95), transparent);
  box-shadow:-8px 4px 0 rgba(255,255,255,.7), 8px -1px 0 rgba(255,255,255,.58);
}
.badge:after{
  bottom:8px;width:24px;height:8px;
  background:radial-gradient(circle at center, rgba(255,154,60,1), transparent 70%);
}
.brand small,.chip small{
  display:block;text-transform:uppercase;letter-spacing:.22em;font-size:.62rem;color:#d7b69b
}
.brand strong{display:block;font-size:1rem}
.chip{
  padding:.72rem .9rem;border-radius:999px;
}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  appearance:none;color:var(--text);padding:.85rem 1rem;border-radius:999px;cursor:pointer;
  font-weight:700;letter-spacing:.03em;
  background:linear-gradient(180deg, rgba(255,154,60,.16), rgba(255,106,42,.08));
  box-shadow:0 14px 36px rgba(255,106,42,.12), inset 0 1px 0 rgba(255,255,255,.08);
}
.btn:hover{transform:translateY(-2px)}

.stage{
  position:relative;display:grid;place-items:center;overflow:hidden
}
.chamber{
  position:relative;
  width:min(1200px,95vw);
  aspect-ratio:1.7/1;
  display:grid;place-items:center;
  filter:drop-shadow(0 30px 90px rgba(0,0,0,.45));
}
.rack{
  position:absolute;inset:2%;
  border-radius:42px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
    linear-gradient(180deg, #231b17, #120c09 35%, #0c0706 100%);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -40px 80px rgba(0,0,0,.5),
    0 30px 70px rgba(0,0,0,.42);
  overflow:hidden;
}
.rack:before{
  content:"";
  position:absolute;left:2.5%;right:2.5%;top:13%;height:12px;border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
  box-shadow:
    0 96px 0 rgba(255,255,255,.04),
    0 192px 0 rgba(255,255,255,.04),
    0 288px 0 rgba(255,255,255,.04);
  opacity:.8
}
.rack:after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:26%;
  background:
    radial-gradient(circle at 50% 120%, rgba(255,154,60,.45), transparent 48%),
    linear-gradient(180deg, rgba(255,106,42,.06), rgba(255,106,42,.14));
  filter:blur(2px);
}
.center-core{
  position:absolute;
  width:min(420px,35vw);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 30%),
    radial-gradient(circle at 50% 60%, rgba(255,154,60,.16), transparent 44%),
    radial-gradient(circle at 50% 50%, rgba(255,106,42,.12), transparent 60%);
  animation:float 7s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ring,.ring2,.ring3{
  position:absolute;border-radius:50%;inset:0;border:1px solid rgba(255,255,255,.08)
}
.ring{animation:spin 18s linear infinite}
.ring2{inset:11%;border-color:rgba(255,154,60,.18);animation:spinR 13s linear infinite}
.ring3{inset:23%;border-color:rgba(255,255,255,.08);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
.coreplate{
  position:absolute;inset:31%;border-radius:50%;
  display:grid;place-items:center;text-align:center;
  border:1px solid rgba(255,255,255,.1);
  background:
    radial-gradient(circle at 50% 45%, rgba(255,154,60,.18), rgba(255,106,42,.06) 42%, rgba(0,0,0,.0) 65%),
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
    rgba(26,18,14,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 34px rgba(255,106,42,.13);
}
.coreplate .mini{font-size:.68rem;letter-spacing:.36em;text-transform:uppercase;color:#ddb79a}
.coreplate .big{margin-top:8px;font-weight:900;letter-spacing:.22em;font-size:clamp(1.1rem,1.8vw,1.35rem)}
.coreplate .glow{
  position:absolute;inset:12%;border-radius:50%;
  border:1px solid rgba(255,154,60,.18);
  animation:pulse 2.8s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(.92);opacity:.6}
  70%{transform:scale(1.14);opacity:0}
  100%{transform:scale(1.14);opacity:0}
}

.card{
  position:absolute;
  width:220px;height:150px;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
    linear-gradient(145deg, rgba(255,154,60,.08), transparent 45%),
    rgba(18,13,11,.78);
  box-shadow:
    0 24px 60px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  cursor:pointer;
  overflow:hidden;
  transition:transform .18s ease,border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.card:hover,.card.active{
  transform:translateY(-8px) scale(1.04);
  border-color:rgba(255,154,60,.34);
  box-shadow:0 0 0 1px rgba(255,154,60,.08), 0 26px 60px rgba(0,0,0,.44), 0 0 30px rgba(255,106,42,.10);
}
.card:before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(120deg, transparent 12%, rgba(255,255,255,.14), transparent 46%);
  transform:translateX(-120%);
  animation:sheen 5s ease-in-out infinite;
}
@keyframes sheen{0%,100%{transform:translateX(-120%)}45%{transform:translateX(130%)}}
.cardui{
  position:relative;z-index:1;width:100%;height:100%;
  padding:14px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left
}
.card small{
  font-size:.62rem;color:#d9b294;letter-spacing:.24em;text-transform:uppercase
}
.card strong{
  font-size:1.12rem;line-height:.92;letter-spacing:.02em
}
.card span{
  font-size:.82rem;color:var(--muted);max-width:14ch;line-height:1.3
}
.card .icon{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  font-size:1.2rem
}
#c1{left:7%;top:16%}
#c2{right:7%;top:16%}
#c3{right:11%;bottom:15%}
#c4{left:11%;bottom:15%}
#c5{left:50%;top:6%;transform:translateX(-50%)}
#c5:hover,#c5.active{transform:translateX(-50%) translateY(-8px) scale(1.04)}

.drawer-wrap{
  position:absolute;left:50%;bottom:5%;
  transform:translateX(-50%);
  width:min(940px,88vw);
  pointer-events:none;
}
.drawer{
  pointer-events:auto;
  min-height:240px;
  border-radius:32px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)),
    radial-gradient(circle at top center, rgba(255,154,60,.10), transparent 36%),
    rgba(16,11,9,.84);
  backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  padding:18px;
  transform:translateY(20px);
  overflow:hidden;
}
.drawer:before{
  content:"";
  position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
}
.drawer-head{
  display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px
}
.drawer small{
  display:block;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:#d9b294;margin-bottom:8px
}
.drawer-title{
  font-size:clamp(1.4rem,4vw,2.6rem);font-weight:900;line-height:.88;letter-spacing:.04em;text-transform:uppercase
}
.drawer-sub{
  color:var(--muted);font-size:.9rem;max-width:30ch;line-height:1.4
}
.items{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px
}
.item{
  border-radius:22px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025)),
    rgba(255,255,255,.025);
  padding:14px;
  min-height:92px;
  display:flex;flex-direction:column;justify-content:space-between
}
.item strong{font-size:1rem;line-height:1.05}
.item em{font-style:normal;color:var(--muted);font-size:.78rem;margin-top:6px}
.item b{font-size:1rem;letter-spacing:.04em;color:#fff}
.bottombar .right{display:flex;gap:10px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(18px) scale(.98);animation:reveal .8s ease forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes reveal{to{opacity:1;transform:none}}

@media (max-width:1100px){
  .chamber{width:96vw;aspect-ratio:1.15/1}
  .center-core{width:min(360px,38vw)}
  .card{width:180px;height:130px}
  .drawer-wrap{width:92vw}
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .ui{padding:12px}
  .chamber{aspect-ratio:1/1.18}
  .card{width:142px;height:110px;border-radius:22px}
  .card strong{font-size:.95rem}
  .card span{display:none}
  #c1{left:4%;top:18%}
  #c2{right:4%;top:18%}
  #c3{right:6%;bottom:24%}
  #c4{left:6%;bottom:24%}
  #c5{top:8%}
  .drawer-wrap{bottom:3%}
}
@media (max-width:620px){
  html,body{overflow:auto}
  .ui{min-height:100dvh}
  .stage{padding:10px 0 230px}
  .chamber{aspect-ratio:1/1.22}
  .center-core{width:250px}
  .card{width:112px;height:96px}
  .cardui{padding:10px}
  .card small{font-size:.5rem}
  .card strong{font-size:.82rem}
  .card .icon{width:34px;height:34px;font-size:1rem}
  .drawer-wrap{width:94vw}
  .drawer{padding:14px}
  .items{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="smoke"></canvas>
<canvas id="embers"></canvas>
<canvas id="sparks"></canvas>
<div class="grain"></div>
<div class="spot"></div>
<div class="vignette"></div>

<div class="ui">
  <div class="topbar reveal">
    <div class="brand">
      <div class="badge"></div>
      <div>
        <small>St. Francisville • Louisiana</small>
        <strong>The Francis Smokehouse</strong>
      </div>
    </div>
    <div class="chips">
      <div class="chip"><small>Mode</small><strong style="font-size:.88rem">Ember Chamber</strong></div>
      <button class="btn" id="ignite">Re-Ignite</button>
    </div>
  </div>

  <main class="stage">
    <div class="chamber reveal d1">
      <div class="rack"></div>

      <div class="center-core" id="core">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="ring3"></div>
        <div class="coreplate">
          <div>
            <div class="mini">Smokehouse Menu</div>
            <div class="big">LIVE FIRE</div>
          </div>
          <div class="glow"></div>
        </div>
      </div>

      <button class="card active" id="c1" data-key="plates">
        <div class="cardui">
          <div class="icon">🥩</div>
          <div>
            <small>Chamber 01</small>
            <strong>Plates</strong>
            <span>ribs • brisket • chicken</span>
          </div>
        </div>
      </button>

      <button class="card" id="c2" data-key="sandwiches">
        <div class="cardui">
          <div class="icon">🍔</div>
          <div>
            <small>Chamber 02</small>
            <strong>Stacks</strong>
            <span>burgers • po-boys</span>
          </div>
        </div>
      </button>

      <button class="card" id="c3" data-key="cajun">
        <div class="cardui">
          <div class="icon">🌶️</div>
          <div>
            <small>Chamber 03</small>
            <strong>Cajun</strong>
            <span>boudin • pies • heat</span>
          </div>
        </div>
      </button>

      <button class="card" id="c4" data-key="desserts">
        <div class="cardui">
          <div class="icon">🍰</div>
          <div>
            <small>Chamber 04</small>
            <strong>Sweet</strong>
            <span>bread pudding • cake</span>
          </div>
        </div>
      </button>

      <button class="card" id="c5" data-key="specials">
        <div class="cardui">
          <div class="icon">🔥</div>
          <div>
            <small>Chamber 05</small>
            <strong>Specials</strong>
            <span>chef drops • feature cuts</span>
          </div>
        </div>
      </button>

      <div class="drawer-wrap reveal d2">
        <section class="drawer">
          <div class="drawer-head">
            <div>
              <small id="kicker">Chamber 01</small>
              <div class="drawer-title" id="title">BBQ Plates</div>
            </div>
            <div class="drawer-sub" id="sub">The smoker doors are open. Pick your firepower.</div>
          </div>
          <div class="items" id="items"></div>
        </section>
      </div>
    </div>
  </main>

  <div class="bottombar reveal d3">
    <div class="chips">
      <div class="chip"><small>Hours</small><strong style="font-size:.88rem">Mon-Sat 10-6 • Sun 10-3</strong></div>
      <div class="chip"><small>Address</small><strong style="font-size:.88rem">6779 US Hwy 61</strong></div>
      <div class="chip"><small>Phone</small><strong style="font-size:.88rem">(225) 245-5046</strong></div>
    </div>
    <div class="right">
      <div class="chip"><small>Interaction</small><strong style="font-size:.88rem">tap a chamber</strong></div>
    </div>
  </div>
</div>

<script>
const data = {
  plates:{
    kicker:"Chamber 01",
    title:"BBQ Plates",
    sub:"The smoker doors are open. Pick your firepower.",
    hue:["#ff6a2a","#ff9a3c"],
    items:[
      ["Full Rack of Ribs","maximum smoke", "$19.99"],
      ["Half Rack of Ribs","smaller blast", "$11.99"],
      ["Brisket Plate","deep bark finish", "$10.99"],
      ["Pulled Pork Plate","soft + smoky", "$9.99"],
      ["Half Chicken Plate","comfort heat", "$9.99"],
      ["Smoked Wings","quick hit", "$7.99"]
    ]
  },
  sandwiches:{
    kicker:"Chamber 02",
    title:"Stacks",
    sub:"Handheld comfort with smoke still on it.",
    hue:["#ff9a3c","#ffd27a"],
    items:[
      ["Hamburger","clean and classic", "$6.99"],
      ["Cheeseburger","melted center", "$7.99"],
      ["Bacon Cheeseburger","extra smoke", "$8.99"],
      ["Pulled Pork Sandwich","pit-made", "$7.99"],
      ["Brisket Sandwich","premium stack", "$8.99"],
      ["Ribeye Po-boy","big swagger", "$10.99"]
    ]
  },
  cajun:{
    kicker:"Chamber 03",
    title:"Cajun Counter",
    sub:"Local heat. Signature bites. No filler.",
    hue:["#ff6a2a","#ff7d3d"],
    items:[
      ["Steamed Boudin","local signal", "Market"],
      ["Boudin Balls","crowd favorite", "Market"],
      ["Pepper Jack Balls","hotter path", "Market"],
      ["Boudin Egg Rolls","unexpected hit", "Market"],
      ["Meat Pies","grab-and-go", "Market"],
      ["Crawfish Pies","regional flex", "Market"]
    ]
  },
  desserts:{
    kicker:"Chamber 04",
    title:"Afterglow",
    sub:"Less smoke. More glow.",
    hue:["#ffb45d","#ffd27a"],
    items:[
      ["Bread Pudding","rich closer", "House"],
      ["Creole Cream Cheesecake","smooth finish", "House"],
      ["Chocolate Cake","dense classic", "House"],
      ["Carrot Cake","spiced sweet", "House"],
      ["Strawberry Shortcake","bright note", "House"],
      ["Miss Mud Pie","premium close", "$7"]
    ]
  },
  specials:{
    kicker:"Chamber 05",
    title:"Live Specials",
    sub:"Where the board changes and the site stays alive.",
    hue:["#ff6a2a","#ffd27a"],
    items:[
      ["Thai Chili Wings","sticky heat", "$16"],
      ["Eggplant Pirogue","seafood stuffing", "$26"],
      ["Blackened Lemon Fish","cream spinach", "$28"],
      ["BBQ Shrimp + Bone-In Chop","big board energy", "$26"],
      ["Salmon + Crab","avocado cream", "$28"],
      ["Chef Drop","whatever breaks the pattern", "Live"]
    ]
  }
};

const itemsEl = document.getElementById('items');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const kickerEl = document.getElementById('kicker');
const buttons = [...document.querySelectorAll('.card')];
const core = document.getElementById('core');

function render(key){
  const d = data[key];
  buttons.forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  kickerEl.textContent = d.kicker;
  titleEl.textContent = d.title;
  subEl.textContent = d.sub;
  itemsEl.innerHTML = d.items.map(i => `
    <div class="item">
      <div>
        <strong>${i[0]}</strong>
        <em>${i[1]}</em>
      </div>
      <b>${i[2]}</b>
    </div>
  `).join('');
  document.documentElement.style.setProperty('--ember', d.hue[0]);
  document.documentElement.style.setProperty('--ember2', d.hue[1]);
  document.querySelectorAll('.btn,.card.active,.coreplate,.badge').forEach(el=>{
    el.style.boxShadow = '';
  });
}
buttons.forEach(b=>b.addEventListener('click',()=>render(b.dataset.key)));
render('plates');

document.getElementById('ignite').addEventListener('click',()=>{
  const keys = Object.keys(data);
  render(keys[Math.floor(Math.random()*keys.length)]);
  emberBoost();
});

window.addEventListener('pointermove', e => {
  document.documentElement.style.setProperty('--mx', e.clientX + 'px');
  document.documentElement.style.setProperty('--my', e.clientY + 'px');
  const x = (e.clientX / innerWidth - .5) * 10;
  const y = (e.clientY / innerHeight - .5) * 8;
  core.style.transform = `translate(${x}px, ${y * .6}px)`;
});

// canvases
const smokeCanvas = document.getElementById('smoke');
const emberCanvas = document.getElementById('embers');
const sparkCanvas = document.getElementById('sparks');
const sctx = smokeCanvas.getContext('2d');
const ectx = emberCanvas.getContext('2d');
const pctx = sparkCanvas.getContext('2d');
let W,H,DPR,smokes=[],embers=[],sparks=[],boost=0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [smokeCanvas, emberCanvas, sparkCanvas].forEach(c=>{
    c.width = W * DPR; c.height = H * DPR;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  sctx.setTransform(DPR,0,0,DPR,0,0);
  ectx.setTransform(DPR,0,0,DPR,0,0);
  pctx.setTransform(DPR,0,0,DPR,0,0);
  resetParticles();
}
function resetParticles(){
  smokes = Array.from({length:Math.max(24, Math.floor(W/60))}, ()=>({
    x: Math.random() * W,
    y: H + Math.random() * H*.4,
    r: 50 + Math.random() * 180,
    vx: -.3 + Math.random()*.6,
    vy: .2 + Math.random()*.45,
    a: .02 + Math.random()*.05
  }));
  embers = Array.from({length:Math.max(60, Math.floor(W/20))}, ()=>spawnEmber(true));
  sparks = Array.from({length:Math.max(35, Math.floor(W/28))}, ()=>spawnSpark(true));
}
function spawnEmber(initial=false){
  return {
    x: Math.random() * W,
    y: initial ? Math.random()*H : H + Math.random()*40,
    r: 1 + Math.random()*3,
    vx: -.6 + Math.random()*1.2,
    vy: -.6 - Math.random()*1.5 - boost*0.12,
    a: .25 + Math.random()*.55
  };
}
function spawnSpark(initial=false){
  return {
    x: W*.5 + (Math.random()-.5)*W*.18,
    y: initial ? H*.78 + Math.random()*H*.18 : H*.92 + Math.random()*20,
    vx: -1.2 + Math.random()*2.4,
    vy: -2.5 - Math.random()*3.5 - boost*0.35,
    len: 8 + Math.random()*18,
    a: .18 + Math.random()*.42
  };
}
function emberBoost(){ boost = 18; }

function drawSmoke(t){
  sctx.clearRect(0,0,W,H);
  for(const p of smokes){
    const g = sctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0, `rgba(220,215,210,${p.a})`);
    g.addColorStop(.45, `rgba(180,180,180,${p.a*.38})`);
    g.addColorStop(1, 'rgba(80,80,80,0)');
    sctx.fillStyle = g;
    sctx.beginPath();
    sctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    sctx.fill();
    p.x += p.vx + Math.sin(t*0.00035 + p.y*0.004)*.25;
    p.y -= p.vy;
    if(p.y < -p.r){
      p.x = Math.random() * W;
      p.y = H + Math.random()*120;
    }
  }
}
function drawEmbers(){
  ectx.clearRect(0,0,W,H);
  for(let i=0;i<embers.length;i++){
    const p = embers[i];
    ectx.beginPath();
    ectx.fillStyle = `rgba(255, ${120 + Math.random()*90}, ${40 + Math.random()*30}, ${p.a})`;
    ectx.shadowBlur = 18;
    ectx.shadowColor = 'rgba(255,106,42,.45)';
    ectx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ectx.fill();
    p.x += p.vx;
    p.y += p.vy;
    if(p.y < -10 || p.x < -20 || p.x > W+20) embers[i] = spawnEmber();
  }
  ectx.shadowBlur = 0;
}
function drawSparks(){
  pctx.clearRect(0,0,W,H);
  for(let i=0;i<sparks.length;i++){
    const p = sparks[i];
    pctx.beginPath();
    pctx.strokeStyle = `rgba(255,${160 + Math.random()*60},${80 + Math.random()*40},${p.a})`;
    pctx.lineWidth = 1.2;
    pctx.moveTo(p.x,p.y);
    pctx.lineTo(p.x - p.vx*2.5, p.y - p.len);
    pctx.stroke();
    p.x += p.vx;
    p.y += p.vy;
    if(p.y < -20 || p.x < -30 || p.x > W+30) sparks[i] = spawnSpark();
  }
}
function loop(t){
  if(boost>0) boost *= .96;
  drawSmoke(t);
  drawEmbers();
  drawSparks();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
