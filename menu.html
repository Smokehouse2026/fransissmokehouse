<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hot Headz Orbit Navigator</title>
  <style>
    :root{
      --bg:#030611;
      --text:#f4fbff;
      --muted:#9fb5cc;
      --cyan:#78ecff;
      --mint:#9effc3;
      --violet:#a089ff;
      --pink:#ff7ad9;
      --line:rgba(255,255,255,.12);
      --panel:rgba(8,14,28,.56);
      --shadow:0 24px 80px rgba(0,0,0,.42);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --orbit-rotation:0deg;
      --count:8;
      --radius:260px;
      --node-size:132px;
      --tilt:62deg;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 15%, rgba(120,236,255,.14), transparent 18%),
        radial-gradient(circle at 82% 15%, rgba(160,137,255,.16), transparent 20%),
        radial-gradient(circle at 50% 85%, rgba(158,255,195,.08), transparent 18%),
        linear-gradient(180deg, #02040a 0%, #040817 45%, #030611 100%);
      color:var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size:36px 36px;
      mask-image:radial-gradient(circle at center, black 28%, transparent 92%);
      opacity:.4;
    }

    body::after{
      content:"";
      position:fixed;
      inset:-10%;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%, rgba(120,236,255,.08), transparent 18%),
        radial-gradient(circle at 60% 45%, rgba(255,122,217,.06), transparent 20%),
        radial-gradient(circle at 42% 58%, rgba(160,137,255,.06), transparent 20%);
      filter:blur(42px);
      animation:drift 14s linear infinite alternate;
    }

    @keyframes drift{
      0%{transform:translate3d(-2%,-1%,0) scale(1)}
      100%{transform:translate3d(2%,1%,0) scale(1.04)}
    }

    .app{
      position:relative;
      width:100vw;
      min-height:100dvh;
      padding:
        calc(18px + var(--safe-top))
        calc(18px + var(--safe-right))
        calc(18px + var(--safe-bottom))
        calc(18px + var(--safe-left));
      display:grid;
      place-items:center;
      isolation:isolate;
    }

    .scene{
      position:relative;
      width:min(900px, 100%);
      height:min(900px, calc(100dvh - 36px - var(--safe-top) - var(--safe-bottom)));
      display:grid;
      place-items:center;
      perspective:1800px;
      user-select:none;
    }

    .glow-aura{
      position:absolute;
      width:min(72vw, 680px);
      height:min(72vw, 680px);
      border-radius:50%;
      background:
        radial-gradient(circle, rgba(120,236,255,.12), transparent 42%),
        radial-gradient(circle at 60% 40%, rgba(160,137,255,.10), transparent 34%),
        radial-gradient(circle at 45% 65%, rgba(255,122,217,.08), transparent 28%);
      filter:blur(18px);
      transform:translateZ(0);
      pointer-events:none;
    }

    .orbit-wrap{
      position:relative;
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      transform-style:preserve-3d;
    }

    .ring-shell{
      position:relative;
      width:min(78vw, 720px);
      height:min(78vw, 720px);
      display:grid;
      place-items:center;
      transform-style:preserve-3d;
    }

    .orbit{
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transform:rotateX(var(--tilt)) rotateZ(var(--orbit-rotation));
      transition:transform 700ms cubic-bezier(.2,.8,.2,1);
      will-change:transform;
    }

    .ring, .ring-two, .ring-three{
      position:absolute;
      inset:0;
      border-radius:50%;
      pointer-events:none;
    }

    .ring{
      border:1px solid rgba(255,255,255,.14);
      box-shadow:
        0 0 42px rgba(120,236,255,.08),
        inset 0 0 32px rgba(120,236,255,.04);
    }

    .ring-two{
      inset:42px;
      border:1px dashed rgba(255,255,255,.14);
      opacity:.9;
    }

    .ring-three{
      inset:82px;
      border:1px solid rgba(255,255,255,.08);
      opacity:.7;
    }

    .axis{
      position:absolute;
      width:2px;
      height:88%;
      background:linear-gradient(180deg, transparent, rgba(255,255,255,.18), transparent);
      left:50%;
      top:6%;
      transform:translateX(-50%);
      opacity:.4;
      pointer-events:none;
    }

    .node{
      position:absolute;
      left:50%;
      top:50%;
      width:var(--node-size);
      height:var(--node-size);
      margin:calc(var(--node-size) / -2);
      border-radius:30px;
      padding:14px;
      cursor:pointer;
      transform-style:preserve-3d;
      display:grid;
      align-content:center;
      justify-items:center;
      text-align:center;
      gap:8px;
      color:var(--text);
      background:
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)),
        rgba(7,13,28,.78);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:
        0 16px 30px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.06);
      backface-visibility:hidden;
      transition:
        transform 700ms cubic-bezier(.2,.8,.2,1),
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .node::before{
      content:"";
      position:absolute;
      inset:auto -18% -22% auto;
      width:120px;
      height:120px;
      border-radius:50%;
      background:radial-gradient(circle, var(--glow, rgba(120,236,255,.16)), transparent 62%);
      filter:blur(8px);
      pointer-events:none;
    }

    .node:hover,
    .node:focus-visible{
      outline:none;
      border-color:rgba(120,236,255,.34);
      box-shadow:
        0 20px 36px rgba(0,0,0,.32),
        0 0 28px rgba(120,236,255,.14),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .node.active{
      background:
        linear-gradient(135deg, rgba(120,236,255,.16), rgba(160,137,255,.18) 58%, rgba(255,122,217,.14)),
        rgba(7,13,28,.84);
      border-color:rgba(120,236,255,.4);
      box-shadow:
        0 22px 40px rgba(0,0,0,.34),
        0 0 34px rgba(120,236,255,.18),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .node .emoji{
      font-size:1.75rem;
      line-height:1;
      filter:drop-shadow(0 0 18px rgba(120,236,255,.24));
    }

    .node strong{
      font-size:.96rem;
      letter-spacing:.02em;
    }

    .node span{
      font-size:.78rem;
      line-height:1.2;
      color:var(--muted);
      max-width:92px;
    }

    .core{
      position:absolute;
      width:200px;
      height:200px;
      border-radius:50%;
      display:grid;
      place-items:center;
      text-align:center;
      padding:26px;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.16), transparent 26%),
        linear-gradient(135deg, rgba(120,236,255,.14), rgba(160,137,255,.16), rgba(255,122,217,.12));
      border:1px solid rgba(255,255,255,.14);
      box-shadow:
        0 0 0 18px rgba(255,255,255,.03),
        0 0 0 36px rgba(255,255,255,.015),
        0 0 58px rgba(120,236,255,.14);
      z-index:3;
      pointer-events:none;
      transform:translateZ(42px);
    }

    .core::before{
      content:"";
      position:absolute;
      inset:18px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      animation:spin 18s linear infinite;
    }

    .core::after{
      content:"";
      position:absolute;
      inset:40px;
      border-radius:50%;
      border:1px dashed rgba(255,255,255,.12);
      animation:spin 24s linear infinite reverse;
    }

    @keyframes spin{
      from{transform:rotate(0)}
      to{transform:rotate(360deg)}
    }

    .core-text{
      position:relative;
      z-index:1;
      display:grid;
      gap:8px;
    }

    .core-text strong{
      font-size:1.1rem;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--cyan);
    }

    .core-text span{
      color:#d9e9f8;
      line-height:1.35;
      font-size:.95rem;
    }

    .controls{
      position:absolute;
      inset:auto auto 16px 50%;
      transform:translateX(-50%);
      display:flex;
      gap:10px;
      z-index:5;
    }

    .ctrl{
      min-width:132px;
      min-height:46px;
      padding:0 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        var(--panel);
      color:var(--text);
      cursor:pointer;
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter:blur(14px);
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .ctrl:hover,
    .ctrl:focus-visible{
      outline:none;
      transform:translateY(-1px);
      border-color:rgba(120,236,255,.34);
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03)),
        rgba(8,14,28,.74);
    }

    .hint{
      position:absolute;
      inset:20px auto auto 50%;
      transform:translateX(-50%);
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(8,14,28,.48);
      color:#dcedfb;
      font-size:.84rem;
      letter-spacing:.02em;
      backdrop-filter:blur(10px);
      z-index:5;
      text-align:center;
      white-space:nowrap;
    }

    @media (max-width: 900px){
      :root{
        --radius:220px;
        --node-size:118px;
      }
      .scene{
        height:min(820px, calc(100dvh - 24px - var(--safe-top) - var(--safe-bottom)));
      }
      .core{
        width:176px;
        height:176px;
      }
      .controls{
        bottom:10px;
      }
    }

    @media (max-width: 640px){
      :root{
        --radius:180px;
        --node-size:96px;
      }
      .ring-shell{
        width:min(96vw, 520px);
        height:min(96vw, 520px);
      }
      .core{
        width:144px;
        height:144px;
        padding:18px;
      }
      .core-text strong{
        font-size:.92rem;
      }
      .core-text span{
        font-size:.82rem;
      }
      .node{
        border-radius:24px;
        padding:10px;
      }
      .node .emoji{
        font-size:1.35rem;
      }
      .node strong{
        font-size:.8rem;
      }
      .node span{
        font-size:.68rem;
        max-width:74px;
      }
      .controls{
        width:100%;
        padding:0 8px;
        gap:8px;
      }
      .ctrl{
        min-width:0;
        flex:1 1 0;
        padding:0 10px;
      }
      .hint{
        font-size:.76rem;
        white-space:normal;
        width:min(90vw, 360px);
      }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation:none !important;
        transition:none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="scene">
      <div class="glow-aura" aria-hidden="true"></div>

      <div class="hint">Tap a tile or use the arrows. The whole orbit rotates together while every tile stays facing forward.</div>

      <div class="orbit-wrap">
        <div class="ring-shell">
          <div class="orbit" id="orbit">
            <div class="ring"></div>
            <div class="ring-two"></div>
            <div class="ring-three"></div>
            <div class="axis"></div>
          </div>

          <div class="core">
            <div class="core-text">
              <strong id="coreTitle">Featured</strong>
              <span id="coreSub">Orbit navigator</span>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="prevBtn" type="button">← Previous</button>
        <button class="ctrl" id="nextBtn" type="button">Next →</button>
      </div>
    </div>
  </main>

  <script>
    const nodes = [
      { id:'featured', label:'Featured', sub:'Top signals', emoji:'✦', glow:'rgba(120,236,255,.18)' },
      { id:'sandwiches', label:'Sandwiches', sub:'Stacked heat', emoji:'🥪', glow:'rgba(255,218,142,.16)' },
      { id:'plates', label:'Plates', sub:'Big comfort', emoji:'🍗', glow:'rgba(255,122,217,.16)' },
      { id:'desserts', label:'Desserts', sub:'Afterglow', emoji:'🍰', glow:'rgba(160,137,255,.18)' },
      { id:'drinks', label:'Drinks', sub:'Cold charge', emoji:'🥤', glow:'rgba(158,255,195,.16)' },
      { id:'specials', label:'Specials', sub:'Limited drop', emoji:'🔥', glow:'rgba(255,122,217,.18)' },
      { id:'combos', label:'Combos', sub:'Built sets', emoji:'⚡', glow:'rgba(120,236,255,.16)' },
      { id:'catering', label:'Catering', sub:'Large orders', emoji:'🚀', glow:'rgba(160,137,255,.16)' }
    ];

    const state = { index: 0 };
    const orbit = document.getElementById('orbit');
    const coreTitle = document.getElementById('coreTitle');
    const coreSub = document.getElementById('coreSub');

    function renderOrbit() {
      orbit.querySelectorAll('.node').forEach(n => n.remove());
      const count = nodes.length;
      document.documentElement.style.setProperty('--count', count);

      nodes.forEach((node, index) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'node' + (index === state.index ? ' active' : '');
        el.style.setProperty('--glow', node.glow);
        el.innerHTML = `
          <div class="emoji">${node.emoji}</div>
          <strong>${node.label}</strong>
          <span>${node.sub}</span>
        `;

        // Position each node around the ring while counter-rotating the card
        // so it stays facing forward even as the whole orbit spins.
        const step = 360 / count;
        const angle = index * step;
        const rotation = state.index * step;
        el.style.transform = `
          rotate(${angle}deg)
          translateY(calc(var(--radius) * -1))
          rotate(${-angle - rotation}deg)
          rotateX(calc(var(--tilt) * -1))
        `;

        el.addEventListener('click', () => {
          state.index = index;
          update();
        });
        orbit.appendChild(el);
      });

      const spin = -(state.index * (360 / count));
      document.documentElement.style.setProperty('--orbit-rotation', `${spin}deg`);

      coreTitle.textContent = nodes[state.index].label;
      coreSub.textContent = nodes[state.index].sub;
    }

    function update() {
      renderOrbit();
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      state.index = (state.index - 1 + nodes.length) % nodes.length;
      update();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      state.index = (state.index + 1) % nodes.length;
      update();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        state.index = (state.index - 1 + nodes.length) % nodes.length;
        update();
      }
      if (e.key === 'ArrowRight') {
        state.index = (state.index + 1) % nodes.length;
        update();
      }
    });

    update();
  </script>
</body>
</html>
