<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>broken brick · wheel of categories</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #2d2d2d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }

        /* main brick wall */
        .brick-wall {
            position: relative;
            width: min(85vmin, 650px);
            height: min(85vmin, 650px);
            background-color: #b53b2c;
            /* brick pattern using layered gradients */
            background-image: 
                linear-gradient(45deg, #6b2e1f 2px, transparent 2px),
                linear-gradient(-45deg, #6b2e1f 2px, transparent 2px),
                repeating-linear-gradient(0deg, #8b4b3a, #8b4b3a 12px, #b53b2c 12px, #b53b2c 24px),
                repeating-linear-gradient(90deg, #6b2e1f, #6b2e1f 2px, #b53b2c 2px, #b53b2c 24px);
            background-size: 48px 48px, 48px 48px, auto auto, auto auto;
            background-blend-mode: overlay;
            border-radius: 12px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,200,150,0.3);
            overflow: visible;
            border: 4px solid #3e2a1f;
        }

        /* the HOLE – broken opening with fragments floating */
        .hole {
            position: absolute;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            background: radial-gradient(circle at 35% 35%, #1e1a16, #040302 90%);
            border-radius: 50%;
            box-shadow: 
                inset 0 0 30px #000000cc,
                0 0 0 8px rgba(60, 40, 25, 0.7),
                0 0 0 12px rgba(40, 25, 10, 0.4);
            overflow: hidden;            /* fragments stay inside the hole */
            z-index: 5;
            backdrop-filter: blur(1px);
            border: 2px solid #543e2b;
        }

        /* brick fragments floating inside the hole */
        .fragment {
            position: absolute;
            background: linear-gradient(145deg, #d35d3a, #964b2e, #6b301e);
            border-radius: 2px 6px 4px 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8), inset 0 1px 3px #ffb08a;
            transform-origin: center;
            pointer-events: none;         /* so they don't block wheel clicks */
            will-change: transform;
            animation: float-toward-center 7s infinite alternate ease-in-out;
            border: 1px solid #ac6c4b;
            opacity: 0.85;
            z-index: 10;
        }

        /* floating animation: gentle drift & rotation, giving illusion of floating toward wheel */
        @keyframes float-toward-center {
            0% {
                transform: translate(var(--x-start), var(--y-start)) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            50% {
                transform: translate(calc(var(--x-start) * 0.3), calc(var(--y-start) * 0.3)) rotate(60deg) scale(0.95);
                opacity: 0.8;
            }
            100% {
                transform: translate(0px, 0px) rotate(120deg) scale(0.9);
                opacity: 0.6;
            }
        }

        /* central wheel container – items arranged in a circle */
        .wheel {
            position: absolute;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            background: rgba(10, 8, 5, 0.5);
            border-radius: 50%;
            backdrop-filter: blur(2px);
            box-shadow: 0 0 0 4px #755e45, 0 0 20px #000000, inset 0 0 20px #ab7e5a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            transition: box-shadow 0.2s;
            border: 2px solid #ac8b6b;
        }

        .wheel:hover {
            box-shadow: 0 0 0 4px #b7926b, 0 0 30px #ffc89c;
        }

        .wheel-items {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .wheel-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            background: #eed7c0;
            color: #2d1d0e;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.7), 0 0 0 2px #573e28, 0 0 0 4px #a17b5b;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
            border: 1px solid #ffddb0;
            pointer-events: auto;
            z-index: 40;
            text-shadow: 0 1px 2px #ffe2b3;
        }

        .wheel-item:hover {
            background: #ffeac2;
            transform: scale(1.15) translateY(-2px);
            box-shadow: 0 8px 12px black, 0 0 0 3px #b8865b;
            color: #311e0e;
            z-index: 100;
        }

        /* info card – appears when an item is clicked */
        .info-card {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 190px;
            background: #fcf3e0;
            border: 6px solid #79553a;
            border-radius: 32px 12px 32px 12px;
            padding: 20px 16px;
            box-shadow: 0 15px 30px black, 0 0 0 6px #503e2b;
            z-index: 200;
            color: #261a0e;
            text-align: center;
            backdrop-filter: blur(4px);
            font-size: 1.2rem;
            pointer-events: auto;
        }

        .info-card h3 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #643f20;
            border-bottom: 3px dashed #b78354;
            padding-bottom: 6px;
        }

        .info-card p {
            font-size: 1.1rem;
            background: #dbb58b;
            padding: 10px 5px;
            border-radius: 40px;
            color: #201508;
            margin: 12px 0;
            border: 2px solid #9e6f46;
        }

        .close-card {
            background: #ab5533;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 8px 16px;
            border-radius: 40px;
            color: #faead3;
            border-bottom: 5px solid #582f1c;
            cursor: pointer;
            transition: 0.1s;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .close-card:hover {
            background: #c57049;
            border-bottom-width: 2px;
            transform: translateY(3px);
        }

        /* little reset button (back to categories) */
        .reset-btn {
            position: absolute;
            bottom: -18%;
            left: 50%;
            transform: translateX(-50%);
            background: #93785c;
            border: 3px solid #2e1d12;
            color: #2f1e0f;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #3d2b1b, 0 8px 12px black;
            transition: 0.07s linear;
            z-index: 50;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .reset-btn:active {
            transform: translateX(-50%) translateY(5px);
            box-shadow: 0 3px 0 #3d2b1b, 0 8px 12px black;
        }

        .reset-btn:hover {
            background: #b39678;
            color: #100a05;
        }

        /* category indicator (tiny) */
        .category-tag {
            position: absolute;
            top: -14%;
            left: 50%;
            transform: translateX(-50%);
            background: #35281b;
            color: #ebc9a4;
            padding: 5px 20px;
            border-radius: 40px;
            font-size: 1rem;
            border: 2px solid #ac8a62;
            white-space: nowrap;
            box-shadow: 0 2px 8px black;
            z-index: 55;
        }
    </style>
</head>
<body>
<div class="brick-wall">
    <!-- the broken hole with floating fragments -->
    <div class="hole" id="hole">
        <!-- fragments will be injected by js -->
    </div>

    <!-- central interactive wheel -->
    <div class="wheel" id="wheelContainer">
        <div class="wheel-items" id="wheelItems"></div>
    </div>

    <!-- info card (hidden by default) -->
    <div class="info-card" id="infoCard">
        <!-- content set dynamically -->
    </div>

    <!-- reset button to go back to main categories -->
    <button class="reset-btn" id="resetBtn">🧱  CATEGORIES  🧱</button>

    <!-- small tag to show current mode (optional) -->
    <div class="category-tag" id="categoryTag">choose a category</div>
</div>

<script>
    (function() {
        // ---------- DATA ----------
        const categories = [
            { name: "🍎 FRUITS", items: ["Apple", "Banana", "Orange"] },
            { name: "🐾 ANIMALS", items: ["Dog", "Cat", "Bird"] },
            { name: "🎨 COLORS", items: ["Red", "Blue", "Green"] }
        ];

        // extra item details (simple placeholder)
        const itemDetails = {
            "Apple": "Crisp and sweet. Great for pies.",
            "Banana": "Rich in potassium. A perfect snack.",
            "Orange": "Citrus burst. Loaded with vitamin C.",
            "Dog": "Loyal companion. Loves to play fetch.",
            "Cat": "Independent and curious. Purrs softly.",
            "Bird": "Colorful feathers. Loves to sing.",
            "Red": "Color of passion and energy.",
            "Blue": "Calm like the ocean and sky.",
            "Green": "Nature's hue, fresh and vibrant."
        };

        // ---------- GLOBALS ----------
        let currentCategory = null;               // selected category object
        const holeElement = document.getElementById('hole');
        const wheelItemsDiv = document.getElementById('wheelItems');
        const infoCard = document.getElementById('infoCard');
        const categoryTag = document.getElementById('categoryTag');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- FRAGMENTS (brick pieces floating inside hole) ----------
        function createFragments(count = 18) {
            for (let i = 0; i < count; i++) {
                const frag = document.createElement('div');
                frag.className = 'fragment';

                // random size between 6px and 22px
                const w = 6 + Math.random() * 16;
                const h = w * (0.6 + Math.random() * 0.6);
                frag.style.width = `${w}px`;
                frag.style.height = `${h}px`;

                // random starting position relative to hole (percentage)
                const posX = 20 + Math.random() * 60; // % left
                const posY = 20 + Math.random() * 60; // % top
                frag.style.left = `${posX}%`;
                frag.style.top = `${posY}%`;

                // set custom properties for animation (start offsets in px relative to its own position)
                // we want floating from far to center: we use translate offsets between -40px and 40px roughly
                const xOffset = (Math.random() * 100 - 50).toFixed(1);
                const yOffset = (Math.random() * 100 - 50).toFixed(1);
                frag.style.setProperty('--x-start', xOffset + 'px');
                frag.style.setProperty('--y-start', yOffset + 'px');

                // random rotation start via animation delay & duration
                frag.style.animationDelay = `${Math.random() * 3}s`;
                frag.style.animationDuration = `${5 + Math.random() * 8}s`;

                // slight variation in color
                const hueShift = Math.random() * 20 - 10;
                frag.style.background = `linear-gradient(145deg, #d87d4a, #9b5535, #5f3320)`;

                holeElement.appendChild(frag);
            }
        }

        // ---------- WHEEL RENDERING ----------
        function renderWheel(itemsArray, clickHandler, isCategoryMode = false) {
            wheelItemsDiv.innerHTML = '';  // clear
            const total = itemsArray.length;
            if (total === 0) return;

            // base radius (distance from center)
            const radius = 70; // percentage relative to wheel container size (60% of hole, so 70 works)

            for (let i = 0; i < total; i++) {
                const angle = (i / total) * 2 * Math.PI; // radians
                // calculate position using transform: rotate + translate
                const x = radius * Math.sin(angle);
                const y = -radius * Math.cos(angle);  // minus so first item at top

                const itemDiv = document.createElement('div');
                itemDiv.className = 'wheel-item';
                itemDiv.textContent = itemsArray[i];
                // store label in dataset
                itemDiv.dataset.label = itemsArray[i];

                // apply transform: start at center (50% 50%) then translate
                itemDiv.style.transform = `translate(-50%, -50%) translate(${x}%, ${y}%)`;
                // small rotation so text is upright (optional)
                // we can also rotate back: but we want text readable, so we cancel rotation
                // we already keep orientation by not adding extra rotate.

                // add click behaviour
                itemDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clickHandler(itemsArray[i], isCategoryMode);
                });

                wheelItemsDiv.appendChild(itemDiv);
            }
        }

        // ---------- HANDLERS ----------
        function handleCategoryClick(categoryName) {
            const category = categories.find(c => c.name === categoryName);
            if (!category) return;

            currentCategory = category;
            categoryTag.textContent = `📁 ${category.name}`;

            // render wheel with items of this category
            renderWheel(category.items, handleItemClick, false);
        }

        function handleItemClick(itemName) {
            // show info card with details
            const detail = itemDetails[itemName] || 'A mysterious brick fragment.';
            infoCard.innerHTML = `
                <h3>${itemName}</h3>
                <p>${detail}</p>
                <button class="close-card" id="closeCardBtn">✕ close ✕</button>
            `;
            infoCard.style.display = 'block';

            // attach close event
            document.getElementById('closeCardBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                infoCard.style.display = 'none';
            });
        }

        // show main categories (initial mode)
        function showMainCategories() {
            currentCategory = null;
            categoryTag.textContent = '⚙️ pick a category';
            const categoryNames = categories.map(c => c.name);
            renderWheel(categoryNames, (label, isCategory) => {
                // this will be called from wheel click
                // label is category name, isCategory true (we don't use that flag)
                handleCategoryClick(label);
            }, true);   // true = category mode (unused but can help)

            // hide info card if open
            infoCard.style.display = 'none';
        }

        // reset button
        resetBtn.addEventListener('click', () => {
            showMainCategories();
        });

        // ---------- INIT ----------
        function init() {
            createFragments(24);            // floating brick pieces
            showMainCategories();            // first wheel = categories

            // click on hole or wheel background does nothing, but fragments have pointer-events none
        }

        init();

        // edge: if info card is open and new wheel item is clicked, we close it automatically 
        // by rendering new wheel, but also hide card
        const originalRender = renderWheel;
        window.renderWheel = function(...args) {
            infoCard.style.display = 'none';
            originalRender(...args);
        };
        // (override safely)
        renderWheel = function(itemsArray, clickHandler, isCategoryMode) {
            infoCard.style.display = 'none';
            originalRender(itemsArray, clickHandler, isCategoryMode);
        };

        // attach the overridden version
        const temp = renderWheel;
        renderWheel = function(...params) {
            infoCard.style.display = 'none';
            return temp(...params);
        };

        // re-assign to the function name (used internally)
        const originalRenderWheel = renderWheel;
        renderWheel = function(a,b,c) {
            infoCard.style.display = 'none';
            return originalRenderWheel(a,b,c);
        };

        // final: ensure showMainCategories uses latest renderWheel
        showMainCategories = function() {
            currentCategory = null;
            categoryTag.textContent = '⚙️ pick a category';
            const categoryNames = categories.map(c => c.name);
            renderWheel(categoryNames, (label) => {
                handleCategoryClick(label);
            });
            infoCard.style.display = 'none';
        };

        // apply again on reset
        resetBtn.onclick = () => {
            showMainCategories();
        };

        // re-init with proper references
        showMainCategories();

        // also handle outside click on infoCard close? Already done in handleItemClick

        // one more: stop propagation from wheel items to avoid weirdness
        document.querySelectorAll('.wheel-item').forEach(el => {
            el.addEventListener('click', (e) => e.stopPropagation());
        });

        // fix for dynamic items: event listener attached inside renderWheel
        // we need to update the renderWheel to attach stopPropagation
        // but we already add click handler inside, but we can also add a global listener
        // improved renderWheel function (redefine)
        const superRender = function(itemsArray, clickHandler) {
            wheelItemsDiv.innerHTML = '';
            const total = itemsArray.length;
            if (total === 0) return;
            const radius = 70;
            for (let i = 0; i < total; i++) {
                const angle = (i / total) * 2 * Math.PI;
                const x = radius * Math.sin(angle);
                const y = -radius * Math.cos(angle);

                const itemDiv = document.createElement('div');
                itemDiv.className = 'wheel-item';
                itemDiv.textContent = itemsArray[i];
                itemDiv.dataset.label = itemsArray[i];
                itemDiv.style.transform = `translate(-50%, -50%) translate(${x}%, ${y}%)`;

                itemDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clickHandler(itemsArray[i]);
                });

                wheelItemsDiv.appendChild(itemDiv);
            }
            infoCard.style.display = 'none';
        };

        // reassign
        renderWheel = superRender;
        showMainCategories = function() {
            currentCategory = null;
            categoryTag.textContent = '⚙️ pick a category';
            const categoryNames = categories.map(c => c.name);
            renderWheel(categoryNames, (label) => {
                handleCategoryClick(label);
            });
            infoCard.style.display = 'none';
        };

        // restart
        showMainCategories();
        resetBtn.onclick = () => { showMainCategories(); };

        // minor: ensure card close button works when newly created
        // already handled inside handleItemClick, fine
    })();
</script>
</body>
</html>
