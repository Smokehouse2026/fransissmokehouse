<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu — The Francis Smokehouse</title>
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="theme-color" content="#252d2f">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Permanent+Marker&family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --board:#354042;--bd3:#2a3234;
  --chalk:#d4d0c8;--cdim:rgba(212,208,200,.5);--cfaint:rgba(212,208,200,.18);
  --green:#6ddb7a;--pink:#e87cb0;--yellow:#e8d44d;--cyan:#5ec4d4;--orange:#e8943a;
  --bright:#eceae4;--frame:#b0b4b0;
  --hand:'Caveat',cursive;--block:'Permanent Marker',cursive;
  --cond:'Barlow Condensed',sans-serif;--serif:'Playfair Display',serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1112}

#board{
  position:fixed;inset:clamp(4px,.7vw,12px);border-radius:3px;overflow:hidden;
  box-shadow:
    inset 0 2px 15px rgba(0,0,0,.4),inset 0 -2px 10px rgba(0,0,0,.25),
    0 0 0 clamp(5px,.7vw,10px) var(--frame),
    0 0 0 clamp(7px,.9vw,13px) #8a8e8a,
    0 8px 40px rgba(0,0,0,.6);
  display:flex;flex-direction:column;background:var(--board);
}

/* The chalk canvas — full background */
#chalk-cv{position:absolute;inset:0;z-index:0}

/* Ember canvas */
#ember-cv{position:absolute;inset:0;z-index:1;pointer-events:none}

/* Grain overlay */
#board::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
}

/* ═══════ UI LAYER — above canvas ═══════ */
#ui{position:relative;z-index:5;display:flex;flex-direction:column;height:100%}

/* Top bar */
#top{
  flex-shrink:0;display:flex;align-items:center;
  padding:clamp(6px,1vh,12px) clamp(10px,1.8vw,22px);
  border-bottom:2px solid var(--cfaint);
  background:rgba(53,64,66,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.t-back{font-family:var(--cond);font-weight:500;font-size:clamp(9px,1vw,12px);letter-spacing:.18em;text-transform:uppercase;color:var(--cfaint);text-decoration:none;transition:color .3s}
.t-back:hover{color:var(--chalk)}
.t-brand{flex:1;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(13px,2vw,24px);color:var(--bright);text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.t-brand i{font-style:italic;font-weight:400;color:var(--cdim);font-size:.6em}
.t-info{font-family:var(--cond);font-weight:400;font-size:clamp(8px,.9vw,11px);color:var(--cfaint);text-align:right;line-height:1.4}

/* Category nav */
#nav{
  flex-shrink:0;display:flex;border-bottom:1px solid var(--cfaint);
  overflow-x:auto;scrollbar-width:none;
  background:rgba(53,64,66,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#nav::-webkit-scrollbar{display:none}
.nb{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:clamp(8px,1.2vh,14px) clamp(6px,1vw,14px);
  background:none;border:none;border-right:1px solid rgba(212,208,200,.06);
  cursor:pointer;transition:background .3s;color:var(--cdim);
  border-bottom:3px solid transparent;
}
.nb:last-child{border-right:none}
.nb:hover{background:rgba(212,208,200,.04)}
.nb.on{background:rgba(212,208,200,.06)}
.nb-icon{font-size:clamp(16px,2.2vw,24px);line-height:1;transition:transform .3s}
.nb:hover .nb-icon{transform:scale(1.15)}
.nb-label{font-family:var(--cond);font-weight:600;font-size:clamp(8px,.9vw,11px);letter-spacing:.1em;text-transform:uppercase;transition:color .3s;text-align:center;line-height:1.15}
.nb.on .nb-label{color:var(--bright)}

/* ═══════ CONTENT AREA — transparent so canvas shows through ═══════ */
#content{flex:1;min-height:0;overflow:hidden;position:relative}

/* Item cards — float over the canvas chalk text */
#cards{
  position:absolute;inset:0;z-index:3;
  overflow-y:auto;overflow-x:hidden;
  padding:clamp(6px,1vh,10px) clamp(10px,1.5vw,20px);
  scrollbar-width:thin;scrollbar-color:rgba(212,208,200,.1) transparent;
}
#cards::-webkit-scrollbar{width:3px}
#cards::-webkit-scrollbar-thumb{background:rgba(212,208,200,.1);border-radius:2px}
#card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(130px,15vw,200px),1fr));
  gap:clamp(8px,1vw,12px);
  padding-top:clamp(4px,.6vh,8px);
}

/* Individual card */
.fc{
  position:relative;border-radius:5px;overflow:hidden;
  background:rgba(42,50,52,.85);cursor:pointer;
  border:1px solid rgba(212,208,200,.06);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  transition:transform .4s var(--ease),box-shadow .4s,border-color .4s;
  opacity:0;transform:scale(.9);
  animation:fcIn .5s var(--ease) forwards;
}
.fc:hover{
  transform:translateY(-4px) scale(1.03);z-index:2;
  box-shadow:0 10px 30px rgba(0,0,0,.5);border-color:rgba(212,208,200,.12);
}
@keyframes fcIn{to{opacity:1;transform:scale(1)}}
.fc-iw{position:relative;overflow:hidden}
.fc-img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;filter:brightness(.82) contrast(1.08) saturate(1.12);transition:filter .4s,transform .6s var(--ease);background:var(--bd3)}
.fc:hover .fc-img{filter:brightness(.92) contrast(1.1) saturate(1.18);transform:scale(1.08)}
.fc-iw::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(42,50,52,.92) 0%,rgba(42,50,52,.4) 35%,transparent 65%);pointer-events:none}
.fc-ph{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bd3),var(--board));font-size:clamp(24px,3vw,32px);opacity:.35}
.fc-body{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:clamp(6px,.8vw,10px)}
.fc-name{font-family:var(--cond);font-weight:700;font-size:clamp(11px,1.1vw,14px);letter-spacing:.05em;text-transform:uppercase;color:var(--bright);line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.fc-price{font-family:var(--block);font-size:clamp(14px,1.5vw,19px);margin-top:2px;text-shadow:0 0 12px currentColor}
.fc-sm{font-family:var(--cond);font-weight:400;font-size:.55em;color:var(--cdim);text-shadow:none}

/* Special card */
.sp-c{
  grid-column:1/-1;display:flex;align-items:center;gap:clamp(10px,1.5vw,16px);
  padding:clamp(8px,1vh,14px) clamp(10px,1.2vw,14px);
  border:2px solid var(--orange);border-radius:5px;
  background:rgba(232,148,58,.06);backdrop-filter:blur(4px);
  animation:spG 3s ease-in-out infinite;cursor:default;
}
@keyframes spG{0%,100%{box-shadow:0 0 12px rgba(232,148,58,.05)}50%{box-shadow:0 0 24px rgba(232,148,58,.12)}}
.sp-img{width:clamp(50px,7vw,80px);aspect-ratio:1;border-radius:3px;object-fit:cover;flex-shrink:0;border:1px solid rgba(232,148,58,.2);filter:brightness(.88) saturate(1.1)}
.sp-body{flex:1;min-width:0}
.sp-tag{font-family:var(--cond);font-weight:800;font-size:clamp(8px,.8vw,10px);letter-spacing:.25em;text-transform:uppercase;color:var(--orange)}
.sp-name{font-family:var(--hand);font-weight:700;font-size:clamp(16px,2vw,24px);color:var(--bright);line-height:1.1}
.sp-desc{font-family:var(--hand);font-size:clamp(11px,1vw,13px);color:var(--cdim);margin-top:1px}
.sp-price{font-family:var(--block);font-size:clamp(18px,2.5vw,28px);color:var(--green);flex-shrink:0;text-shadow:0 0 12px rgba(109,219,122,.15)}

/* ═══════ LIGHTBOX ═══════ */
#lb{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(14,17,18,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s;padding:clamp(16px,3vw,40px)}
#lb.on{opacity:1;pointer-events:all}
#lbc{max-width:480px;width:100%;border-radius:8px;overflow:hidden;background:var(--bd3);border:1px solid rgba(212,208,200,.08);box-shadow:0 24px 70px rgba(0,0,0,.7);transform:scale(.88) translateY(24px);transition:transform .45s var(--ease)}
#lb.on #lbc{transform:scale(1) translateY(0)}
#lb-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:brightness(.9) contrast(1.06) saturate(1.1)}
#lb-b{padding:clamp(14px,2.5vw,22px)}
#lb-n{font-family:var(--cond);font-weight:800;font-size:clamp(20px,3vw,28px);letter-spacing:.08em;text-transform:uppercase;color:var(--bright)}
#lb-nt{font-family:var(--hand);font-size:15px;color:var(--cdim);margin-top:3px}
#lb-p{font-family:var(--block);font-size:clamp(26px,4vw,36px);margin-top:8px;text-shadow:0 0 16px currentColor}
#lb-x{position:absolute;top:clamp(10px,2vh,18px);right:clamp(10px,2vw,18px);font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cdim);background:rgba(42,50,52,.8);border:1px solid var(--cfaint);padding:6px 14px;border-radius:3px;cursor:pointer;transition:all .25s;z-index:210}
#lb-x:hover{color:var(--bright);border-color:var(--chalk)}

@media(max-width:600px){
  .nb{min-width:max-content;padding:8px 10px}
  #card-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
  .sp-c{flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<div id="board">
  <canvas id="chalk-cv"></canvas>
  <canvas id="ember-cv"></canvas>
  <div id="ui">
    <div id="top">
      <a class="t-back" href="index.html">← Home</a>
      <div class="t-brand">THE FRANCIS <i>Smokehouse & Specialty Meats</i></div>
      <div class="t-info" id="t-info"></div>
    </div>
    <div id="nav"></div>
    <div id="content">
      <div id="cards"><div id="card-grid"></div></div>
    </div>
  </div>
</div>
<div id="lb" onclick="xLB(event)"><button id="lb-x" onclick="xLB(event)">✕ Close</button><div id="lbc"><img id="lb-img" src="" alt=""><div id="lb-b"><div id="lb-n"></div><div id="lb-nt"></div><div id="lb-p"></div></div></div></div>

<script src="site-data.js"></script>
<script>
/* Wait for site-data.js to be available */
function bootWhenReady() {
  if (typeof MENU === 'undefined') {
    setTimeout(bootWhenReady, 50);
    return;
  }
  boot();
}
window.addEventListener('load', bootWhenReady);
function boot() {
/* ═══════════════════════════════════════════════════════
   CHALK RENDERING ENGINE
   Draws text onto canvas with realistic chalk texture
   ═══════════════════════════════════════════════════════ */
var chalkCv = document.getElementById('chalk-cv');
var chalkCx = chalkCv.getContext('2d');
var emberCv = document.getElementById('ember-cv');
var emberCx = emberCv.getContext('2d');
var W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  var board = document.getElementById('board');
  W = board.offsetWidth;
  H = board.offsetHeight;
  chalkCv.width = W * dpr;
  chalkCv.height = H * dpr;
  chalkCv.style.width = W + 'px';
  chalkCv.style.height = H + 'px';
  chalkCx.setTransform(dpr, 0, 0, dpr, 0, 0);
  emberCv.width = W * dpr;
  emberCv.height = H * dpr;
  emberCv.style.width = W + 'px';
  emberCv.style.height = H + 'px';
  emberCx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', function() { resize(); if (active) go(active, true); });

/* ── Draw the slate background on canvas ── */
function drawBoard() {
  var g = chalkCx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#3e4a4c');
  g.addColorStop(0.3, '#364244');
  g.addColorStop(0.6, '#313c3e');
  g.addColorStop(1, '#2b3537');
  chalkCx.fillStyle = g;
  chalkCx.fillRect(0, 0, W, H);

  /* Subtle chalk smudge spots */
  for (var i = 0; i < 6; i++) {
    var sx = Math.random() * W, sy = Math.random() * H, sr = 60 + Math.random() * 120;
    var sg = chalkCx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    sg.addColorStop(0, 'rgba(212,208,200,' + (0.01 + Math.random() * 0.02) + ')');
    sg.addColorStop(1, 'transparent');
    chalkCx.fillStyle = sg;
    chalkCx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  }

  /* Chalk dust specks */
  for (var j = 0; j < 40; j++) {
    chalkCx.fillStyle = 'rgba(255,255,255,' + (0.04 + Math.random() * 0.08) + ')';
    chalkCx.fillRect(Math.random() * W, Math.random() * H, 0.5 + Math.random() * 1.5, 0.5 + Math.random() * 1.5);
  }
}

/* ═══════ CHALK TEXT DRAWING ═══════
   This is the magic — renders text character by character
   with chalk texture (gritty, semi-transparent, slightly wobbly)
*/
var chalkQueue = [];
var chalkTimer = null;

function chalkText(text, x, y, opts) {
  opts = opts || {};
  var fontSize = opts.size || 16;
  var color = opts.color || '#d4d0c8';
  var font = opts.font || '700 ' + fontSize + 'px "Barlow Condensed", sans-serif';
  var letterSpacing = opts.spacing || 0;
  var delay = opts.delay || 0;
  var speed = opts.charSpeed || 28;

  /* Parse color to RGB for chalk texture */
  var rgb = parseColor(color);

  return new Promise(function(resolve) {
    var chars = text.split('');
    var cx = x;

    chars.forEach(function(ch, i) {
      chalkQueue.push({
        time: delay + i * speed,
        draw: function() {
          /* Measure char width */
          chalkCx.font = font;
          var m = chalkCx.measureText(ch);
          var cw = m.width + letterSpacing;

          /* Slight random wobble — hand-drawn feel */
          var wobbleY = (Math.random() - 0.5) * 1.2;
          var wobbleR = (Math.random() - 0.5) * 0.015;

          chalkCx.save();
          chalkCx.translate(cx + cw / 2, y + wobbleY);
          chalkCx.rotate(wobbleR);

          /* Draw the character multiple times with slight offsets
             and varying opacity to create chalk texture */
          for (var pass = 0; pass < 3; pass++) {
            var ox = (Math.random() - 0.5) * 0.6;
            var oy = (Math.random() - 0.5) * 0.6;
            var alpha = 0.5 + Math.random() * 0.35;

            chalkCx.font = font;
            chalkCx.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha + ')';
            chalkCx.fillText(ch, -cw / 2 + ox, oy);
          }

          /* Chalk dust particles around the character */
          for (var d = 0; d < 2; d++) {
            var dx = cx + Math.random() * cw;
            var dy = y + (Math.random() - 0.5) * fontSize * 0.8;
            chalkCx.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (0.08 + Math.random() * 0.12) + ')';
            chalkCx.fillRect(dx, dy, 0.5 + Math.random(), 0.5 + Math.random());
          }

          chalkCx.restore();
          cx += cw;
        }
      });
    });

    /* Resolve when last char is drawn */
    chalkQueue.push({
      time: delay + chars.length * speed + 10,
      draw: resolve
    });
  });
}

function parseColor(c) {
  /* Handle named CSS colors and hex */
  var d = document.createElement('div');
  d.style.color = c;
  document.body.appendChild(d);
  var computed = getComputedStyle(d).color;
  document.body.removeChild(d);
  var m = computed.match(/(\d+)/g);
  return { r: +m[0], g: +m[1], b: +m[2] };
}

/* Process the chalk queue — animation loop */
var chalkStart = 0;
function processChalk() {
  if (!chalkQueue.length) { chalkTimer = null; return; }
  if (!chalkStart) chalkStart = performance.now();
  var elapsed = performance.now() - chalkStart;

  while (chalkQueue.length && chalkQueue[0].time <= elapsed) {
    var item = chalkQueue.shift();
    item.draw();
  }

  if (chalkQueue.length) {
    chalkTimer = requestAnimationFrame(processChalk);
  } else {
    chalkTimer = null;
  }
}

function startChalk() {
  chalkStart = 0;
  /* Sort queue by time to handle interleaved items */
  chalkQueue.sort(function(a, b) { return a.time - b.time; });
  if (chalkTimer) cancelAnimationFrame(chalkTimer);
  chalkTimer = requestAnimationFrame(processChalk);
}

function clearChalk() {
  chalkQueue = [];
  chalkStart = 0;
  if (chalkTimer) { cancelAnimationFrame(chalkTimer); chalkTimer = null; }
}

/* eraseBoard is now inline in go() */

/* ═══════ EMBER PARTICLES ═══════ */
function mkE(){return{x:.08+Math.random()*.84,y:1.02+Math.random()*.04,vx:(Math.random()-.5)*.0018,vy:-.003-Math.random()*.006,r:.4+Math.random()*1.2,life:1,decay:.003+Math.random()*.005,h:10+Math.random()*22,tw:(Math.random()-.5)*.0007}}
var EM=[];for(var ei=0;ei<14;ei++)EM.push(mkE());
(function eLoop(){
  emberCx.clearRect(0,0,W,H);
  for(var i=0;i<EM.length;i++){
    var e=EM[i];e.x+=e.vx+e.tw;e.y+=e.vy;e.life-=e.decay;
    if(e.life<=0||e.y<-.02){EM[i]=mkE();continue}
    emberCx.beginPath();emberCx.arc(e.x*W,e.y*H,e.r,0,Math.PI*2);
    emberCx.fillStyle='hsla('+e.h+',100%,'+(50+e.life*36)+'%,'+e.life*.6+')';
    emberCx.shadowBlur=5;emberCx.shadowColor='hsla('+e.h+',100%,55%,'+e.life*.3+')';
    emberCx.fill();emberCx.shadowBlur=0;
  }
  requestAnimationFrame(eLoop);
})();

/* ═══════ DATA + UI ═══════ */
var $=function(id){return document.getElementById(id)};
var fmt=function(n){if(n==null)return'Ask';return n===0?'Free':'$'+n.toFixed(2)};
var CATS=['bbq_plates','burgers_sandwiches','fried_chicken','salads','sides','combos','by_the_pound','desserts'];
var active=null;

if(typeof SITE_INFO!=='undefined'){
  $('t-info').innerHTML=SITE_INFO.phone+'<br>'+SITE_INFO.hours.weekday;
}

/* Nav */
var navEl=$('nav');
CATS.forEach(function(k){
  var s=MENU[k];if(!s)return;
  var b=document.createElement('button');
  b.className='nb';b.dataset.k=k;
  b.innerHTML='<span class="nb-icon">'+s.icon+'</span><span class="nb-label">'+s.title+'</span>';
  b.onclick=function(){go(k)};
  navEl.appendChild(b);
});

/* Special */
function getSP(){
  if(typeof SITE_SPECIAL==='undefined'||!SITE_SPECIAL||SITE_SPECIAL.hidden)return null;
  function ts(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  if(SITE_SPECIAL.date&&SITE_SPECIAL.date!==ts())return null;
  return SITE_SPECIAL;
}

/* ═══════ MAIN SWITCH ═══════ */
function go(k, skipErase) {
  if(active===k && !skipErase) return;
  var prev = active;
  active = k;
  var s = MENU[k]; if(!s) return;

  /* Nav buttons */
  document.querySelectorAll('.nb').forEach(function(b){
    var on = b.dataset.k===k;
    b.classList.toggle('on',on);
    b.querySelector('.nb-label').style.color = on ? s.color : '';
    b.style.borderBottomColor = on ? s.color : 'transparent';
    b.style.background = on ? 'rgba(212,208,200,.06)' : '';
  });

  clearChalk();

  /* Erase delay — if not first load, wait for erase to finish */
  var eraseDelay = 0;
  if (prev !== null && !skipErase) {
    eraseDelay = 450;
    /* Run eraser wipe — redraws the board background with a sweep */
    var eraseStart = performance.now();
    var eraseDur = 400;
    function eraseStep(now) {
      var t = Math.min((now - eraseStart) / eraseDur, 1);
      var e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
      drawBoard();
      /* Subtle smudge trail */
      var ew = W * 0.3;
      var ex = -ew + (W + ew) * e;
      var sg = chalkCx.createLinearGradient(ex - ew * 0.5, 0, ex + ew * 0.3, 0);
      sg.addColorStop(0, 'transparent');
      sg.addColorStop(0.5, 'rgba(212,208,200,0.035)');
      sg.addColorStop(1, 'transparent');
      chalkCx.fillStyle = sg;
      chalkCx.fillRect(ex - ew, 0, ew * 1.5, H);
      if (t < 1) requestAnimationFrame(eraseStep);
      else drawBoard();
    }
    requestAnimationFrame(eraseStep);
  } else {
    drawBoard();
  }

  /* ── Get content area position for chalk drawing ── */
  /* Use a small timeout to ensure layout is computed */
  setTimeout(function() {
    var contentEl = $('content');
    var rect = contentEl.getBoundingClientRect();
    var boardRect = $('board').getBoundingClientRect();
    var startY = rect.top - boardRect.top + 28;
    var startX = rect.left - boardRect.left + 16;
    var maxWidth = rect.width - 32;

    /* ── Chalk write the section title ── */
    var titleSize = Math.min(Math.max(W * 0.025, 16), 28);
    var titleText = s.title.toUpperCase();
    chalkText(titleText, startX, startY, {
      size: titleSize,
      color: s.color,
      font: '800 ' + titleSize + 'px "Barlow Condensed", sans-serif',
      spacing: titleSize * 0.15,
      delay: 0,
      charSpeed: 35
    });

    /* ── Chalk write subtitle ── */
    var subSize = Math.min(Math.max(W * 0.013, 11), 15);
    var subDelay = titleText.length * 35 + 50;
    chalkText(s.subtitle || '', startX, startY + titleSize + 8, {
      size: subSize,
      color: 'rgba(212,208,200,0.4)',
      font: '400 ' + subSize + 'px "Caveat", cursive',
      delay: subDelay,
      charSpeed: 18
    });

    /* ── Chalk write each item name + price ── */
    var itemY = startY + titleSize + subSize + 24;
    var itemSize = Math.min(Math.max(W * 0.012, 11), 14);
    var priceSize = Math.min(Math.max(W * 0.013, 12), 16);
    var lineH = Math.max(itemSize * 1.8, 20);

    /* Two columns */
    var colW = maxWidth / 2 - 10;
    var col2X = startX + colW + 20;
    var halfIdx = Math.ceil(s.items.length / 2);
    var baseItemDelay = subDelay + (s.subtitle||'').length * 18 + 80;

    s.items.forEach(function(item, i) {
      var col = i < halfIdx ? 0 : 1;
      var row = col === 0 ? i : i - halfIdx;
      var ix = col === 0 ? startX : col2X;
      var iy = itemY + row * lineH;
      var itemDelay = baseItemDelay + i * 100;

      /* Item name */
      chalkText('• ' + item.name.toUpperCase(), ix, iy, {
        size: itemSize,
        color: '#d4d0c8',
        font: '600 ' + itemSize + 'px "Barlow Condensed", sans-serif',
        spacing: itemSize * 0.04,
        delay: itemDelay,
        charSpeed: 22
      });

      /* Price */
      var priceTxt = item.priceLg ? fmt(item.price) + ' / ' + fmt(item.priceLg) : fmt(item.price);
      var priceX = ix + colW - priceTxt.length * priceSize * 0.55;
      chalkText(priceTxt, priceX, iy, {
        size: priceSize,
        color: s.color,
        font: '700 ' + priceSize + 'px "Permanent Marker", cursive',
        delay: itemDelay + item.name.length * 12,
        charSpeed: 30
      });
    });

    /* Start processing the chalk queue */
    startChalk();

  }, eraseDelay + 20);

  /* ═══════ BUILD PHOTO CARDS ═══════ */
  setTimeout(function() {
    var grid = $('card-grid');
    var h = '';

    if(k===CATS[0]){
      var sp=getSP();
      if(sp){
        h+='<div class="sp-c">';
        if(sp.image)h+='<img class="sp-img" src="'+sp.image+'" alt="'+sp.name+'" onerror="this.style.display=\'none\'">';
        h+='<div class="sp-body"><div class="sp-tag">🔥 '+(sp.type||"Today's Special")+'</div>';
        h+='<div class="sp-name">'+sp.name+'</div>';
        if(sp.desc)h+='<div class="sp-desc">'+sp.desc+'</div>';
        h+='</div>';
        if(sp.price)h+='<div class="sp-price">'+sp.price+'</div>';
        h+='</div>';
      }
    }

    s.items.forEach(function(item,i){
      var d=(0.3+i*0.08).toFixed(2);
      h+='<div class="fc" style="animation-delay:'+d+'s" onclick="oLB(\''+k+'\','+i+')">';
      if(item.img){
        h+='<div class="fc-iw"><img class="fc-img" src="'+item.img+'" alt="'+item.name+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=fc-ph>'+s.icon+'</div>\'"></div>';
      } else {
        h+='<div class="fc-iw"><div class="fc-ph">'+s.icon+'</div></div>';
      }
      h+='<div class="fc-body"><div class="fc-name">'+item.name+'</div>';
      if(item.priceLg) h+='<div class="fc-price" style="color:'+s.color+'">'+fmt(item.price)+' <span class="fc-sm">sm</span> / '+fmt(item.priceLg)+' <span class="fc-sm">lg</span></div>';
      else h+='<div class="fc-price" style="color:'+s.color+'">'+fmt(item.price)+'</div>';
      h+='</div></div>';
    });

    grid.innerHTML=h;
    $('cards').scrollTop=0;
  }, eraseDelay + 30);
}

/* ═══════ LIGHTBOX ═══════ */
function oLB(k,i){
  var s=MENU[k],item=s.items[i];if(!item)return;
  $('lb-img').src=item.img||'';$('lb-img').alt=item.name;
  $('lb-img').onerror=function(){this.style.display='none'};
  $('lb-img').style.display='';
  $('lb-n').textContent=item.name;
  $('lb-nt').textContent=item.note||s.subtitle||'';
  if(item.priceLg) $('lb-p').innerHTML=fmt(item.price)+' <span style="font-size:.5em;color:var(--cdim)">sm</span> / '+fmt(item.priceLg)+' <span style="font-size:.5em;color:var(--cdim)">lg</span>';
  else $('lb-p').textContent=fmt(item.price);
  $('lb-p').style.color=s.color||'var(--chalk)';
  $('lb').classList.add('on');
}
function xLB(e){if(e&&e.target.id!=='lb'&&e.target.id!=='lb-x')return;$('lb').classList.remove('on')}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')$('lb').classList.remove('on');
  var idx=CATS.indexOf(active);
  if(e.key==='ArrowRight'&&idx<CATS.length-1)go(CATS[idx+1]);
  if(e.key==='ArrowLeft'&&idx>0)go(CATS[idx-1]);
});

/* ═══════ INIT ═══════ */
drawBoard();
go(CATS[0]);
} /* end boot() */
</script>
</body>
</html>
