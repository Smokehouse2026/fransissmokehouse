<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Francis Smokehouse — Compact Menu</title>

<!-- Optional Google font (looks nicer but not required) -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080507;
  --card: rgba(255,255,255,0.04);
  --glass: rgba(255,255,255,0.03);
  --accent: #ff6b00;
  --accent-2:#ffae00;
  --muted:#bdbdbd;
  --gold:#ffd27f;
  --max-width:1180px;
  --gap:8px;
  --tile-h:48px;        /* compact tile height */
  --tile-pad:8px;
  --pop-w:260px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#fff;background:
  radial-gradient(800px 360px at 12% 14%, rgba(255,110,16,0.03), transparent 6%),
  radial-gradient(900px 420px at 88% 82%, rgba(255,110,16,0.02), transparent 6%),
  var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

.container{
  max-width:var(--max-width);margin:14px auto;padding:14px;display:grid;grid-template-columns:1fr 320px;gap:18px;
}

/* header */
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column}
.title{font-family:Cinzel,serif;font-weight:700;font-size:20px;color:var(--gold);letter-spacing:1px}
.subtitle{color:var(--muted);font-size:13px;margin-top:6px}

/* specials strip */
.specials-strip{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);
  box-shadow:0 10px 30px rgba(0,0,0,0.55);
}
.special-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#160700;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 8px 20px rgba(255,110,16,0.14)}
.special-mini{font-size:12px;color:var(--muted);padding:6px 8px;border-radius:8px;background:rgba(255,255,255,0.02);cursor:pointer}
.special-edit{margin-left:auto;display:flex;gap:8px;align-items:center}

/* main layout */
.main{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
.grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:var(--gap);
  align-items:start;
}

/* Tile item compact */
.category{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:4px 0 8px;
}
.cat-title{font-family:Cinzel,serif;color:var(--gold);font-size:13px;font-weight:700}
.cat-count{color:var(--muted);font-size:12px;margin-left:auto}

.tile{
  height:var(--tile-h);
  padding:var(--tile-pad);
  background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
  border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid rgba(255,255,255,0.02);
  cursor:default;position:relative;overflow:visible;
}
.tile .left{display:flex;align-items:center;gap:10px;min-width:0}
.tile .badge{
  width:40px;height:32px;border-radius:6px;background:linear-gradient(135deg,#44220a,#7f3f19);display:grid;place-items:center;font-family:Cinzel,serif;font-size:12px;color:#fff;font-weight:700;flex:0 0 40px}
.tile .name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tile .price{color:var(--accent);font-weight:800;min-width:52px;text-align:right;font-size:13px}
.tile .add{background:transparent;border:1px solid rgba(255,255,255,0.05);color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:800}
.tile:focus-within{outline:2px solid rgba(255,110,16,0.12);box-shadow:0 8px 20px rgba(0,0,0,0.6)}

/* popover */
.pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tile-h) + 8px);width:var(--pop-w);background:linear-gradient(180deg,rgba(0,0,0,0.8),rgba(20,12,8,0.95));border-radius:10px;padding:10px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 12px 40px rgba(0,0,0,0.7);font-size:13px;color:var(--muted);display:none;z-index:40}
.tile.show-pop .pop{display:block}
.pop .desc{color:var(--muted);font-size:13px;margin-top:6px}
.pop .mini{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pop .mini .small{font-size:12px;color:var(--muted)}

/* side panel */
.side{
  position:sticky;top:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);
  height:fit-content;box-shadow:0 8px 30px rgba(0,0,0,0.5)
}
.side .head{display:flex;gap:8px;align-items:center;justify-content:space-between}
.week{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.day{padding:6px 8px;border-radius:10px;background:rgba(255,255,255,0.02);font-weight:700;color:var(--muted);cursor:pointer;border:1px solid rgba(255,255,255,0.03)}
.day.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#160700;box-shadow:0 8px 20px rgba(255,110,16,0.12)}
.todayCard{margin-top:10px;padding:10px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.015),transparent);border:1px solid rgba(255,255,255,0.03)}
.todayCard .title{font-weight:800;color:var(--gold)}
.todayCard .muted{font-size:13px;color:var(--muted);margin-top:6px}
.side .actions{display:flex;gap:8px;margin-top:10px;align-items:center}

/* floating bag */
.bag{
  position:fixed;right:18px;bottom:18px;background:linear-gradient(180deg, rgba(0,0,0,0.6), rgba(10,6,4,0.8));padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);
  display:flex;flex-direction:column;gap:8px;min-width:240px;box-shadow:0 20px 60px rgba(0,0,0,0.7)
}
.bag .title{font-weight:800;color:var(--gold)}
.bag .items{max-height:260px;overflow:auto;padding-right:6px}
.bag .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px dashed rgba(255,255,255,0.03)}
.bag .total{font-weight:900;color:var(--accent);margin-top:8px;text-align:right}
.bag .controls{display:flex;gap:8px;justify-content:space-between;margin-top:8px}

/* compact mode */
.compact .grid{grid-template-columns:repeat(5,1fr)}
.compact .tile{height:44px;padding:6px}
.compact .title{font-size:18px}

/* mobile responsive */
@media(max-width:980px){
  .container{grid-template-columns:1fr; padding:10px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .side{position:relative;top:0}
  .bag{right:10px;left:10px;min-width:auto}
  .compact .grid{grid-template-columns:repeat(3,1fr)}
}

/* print */
@media print{
  body{background:white;color:black}
  .container{max-width:100%;padding:0}
  .side,.bag,.special-edit,.title{display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .tile{height:48px;color:black;background:white;border:1px solid #ccc}
}
</style>
</head>
<body>

<div class="container" id="app" aria-live="polite">

  <!-- header & top strip -->
  <header class="header">
    <div class="brand">
      <div class="title">THE FRANCIS SMOKEHOUSE</div>
      <div class="subtitle">Specialty Meats · 6779 US Hwy 61 · St. Francisville, LA</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;gap:10px;align-items:center">
        <div class="specials-strip" id="specialsStrip" role="region" aria-label="Daily specials">
          <!-- pills inserted here -->
        </div>
        <div class="special-edit" style="margin-left:8px">
          <button id="toggleCompact" title="Toggle compact (more items per row)" class="special-mini" aria-pressed="true">Compact</button>
          <button id="printBtn" class="special-mini" title="Print menu">Print</button>
        </div>
      </div>

      <div style="color:var(--muted);font-size:13px">(225) 245-5046 · Mon–Sat 10–6 · Sun 10–3</div>
    </div>
  </header>

  <!-- main menu -->
  <main class="main" role="main">
    <div class="grid compact" id="grid">
      <!-- We'll render categories & tiles via JS for density -->
    </div>
  </main>

  <!-- side: specials & controls -->
  <aside class="side" role="complementary" aria-label="Daily specials and ordering">
    <div class="head"><div style="font-weight:800">Daily Specials</div><div class="muted small">Editable & saved locally</div></div>
    <div class="week" id="days">
      <!-- days -->
    </div>

    <div class="todayCard" id="todayCard" tabindex="0">
      <div class="title" id="todayTitle"></div>
      <div class="muted" id="todayDesc"></div>
      <div class="actions">
        <button id="addToday" class="special-mini" title="Add today's special">+ Add</button>
        <button id="editSpecial" class="special-mini" title="Edit special">✎ Edit</button>
        <button id="saveToServer" class="special-mini" title="(Optional) Save">↪</button>
      </div>
      <div id="editor" style="display:none;margin-top:8px">
        <textarea id="specialEditor" style="width:100%;min-height:72px;border-radius:8px;padding:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);color:#fff"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="saveSpecial" class="special-mini">Save</button>
          <button id="cancelSpecial" class="special-mini">Cancel</button>
        </div>
      </div>
    </div>

    <div style="margin-top:12px">
      <div style="font-weight:800;margin-bottom:6px">Order</div>
      <div style="font-size:13px;color:var(--muted)">Tap + to add items. Email or copy your order below.</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="emailOrder" class="special-mini">Email</button>
        <button id="copyOrder" class="special-mini">Copy</button>
      </div>
    </div>

  </aside>

  <!-- floating bag -->
  <div class="bag" id="bag" aria-live="polite" aria-atomic="true" role="status">
    <div class="title">Order</div>
    <div class="items" id="bagItems"><div style="color:var(--muted);font-size:13px">No items</div></div>
    <div class="total" id="bagTotal"></div>
    <div class="controls">
      <button id="clearBag" class="special-mini" title="Clear bag">Clear</button>
      <button id="checkout" class="special-mini" title="Email order">Checkout</button>
    </div>
  </div>

</div>

<script>
/* -------------------------
   DATA (concise strings)
   ------------------------- */
const MENU = {
  "BBQ Plates":[
    {id:'rfull',n:'Full Rack Ribs',p:'$19.99',d:'Slow smoked, house glaze.'},
    {id:'rhalf',n:'1/2 Rack Ribs',p:'$11.99',d:'Tender & smoky.'},
    {id:'pp',n:'Pulled Pork',p:'$9.99',d:'House-smoked, tangy sauce.'},
    {id:'brisk',n:'Brisket',p:'$10.99',d:'Smoky tender brisket.'},
    {id:'chhalf',n:'1/2 Chicken',p:'$9.99',d:'Buttermilk brined, smoked.'},
    {id:'wings',n:'Smoked Wings',p:'$7.99',d:'Sweet-thai or buffalo.'}
  ],
  "Burgers & PoBoys":[
    {id:'hamb',n:'Hamburger',p:'$6.99',d:'Smash style.'},
    {id:'chz',n:'Cheeseburger',p:'$7.99',d:'American cheese.'},
    {id:'bcb',n:'Bacon Cheeseburger',p:'$8.99',d:'Smoked bacon.'},
    {id:'ppsand',n:'Pulled Pork Sand.',p:'$7.99',d:'Pile it high.'},
    {id:'brsand',n:'Brisket Sand.',p:'$8.99',d:'Thin sliced.'},
    {id:'ribpo',n:'Ribeye Po-Boy',p:'$10.99',d:'Steak & fixins.'},
    {id:'chsand',n:'Chicken Sand.',p:'$7.99',d:'Crispy or grilled.'},
    {id:'shrimp',n:'Shrimp Po-Boy',p:'$8.99',d:'Lightly breaded.'},
    {id:'cat',n:'Catfish Po-Boy',p:'$8.99',d:'With remoulade.'},
    {id:'craw',n:'Crawfish Po-Boy',p:'$10.99',d:'Tail meat.'}
  ],
  "Sides":[
    {id:'beans',n:'Baked Beans',p:'$2.75/$6.99',d:'Smoky & sweet.'},
    {id:'corn',n:'Corn Pudding',p:'$2.75/$6.99',d:'Buttery favorite.'},
    {id:'potato',n:'Potato Salad',p:'$2.75/$6.99',d:'Creamy.'},
    {id:'slaw',n:'Cole Slaw',p:'$2.75/$6.99',d:'Bright & tangy.'},
    {id:'fries',n:'Fries',p:'$2.75/$6.99',d:'House-cut or sweet.'}
  ],
  "Boudin & Deli":[
    {id:'boudin',n:'Steamed Boudin',p:'Market',d:'Traditional.'},
    {id:'bb',n:'Boudin Balls',p:'Market',d:'Crunchy outside.'},
    {id:'pies',n:'Crawfish/Meat Pies',p:'Market',d:'Golden crust.'},
    {id:'egg',n:'Boudin Egg Roll',p:'Market',d:'Fusion favorite.'}
  ],
  "Desserts":[
    {id:'bp',n:'Bread Pudding',p:'Market',d:'Warm, boozy sauce.'},
    {id:'cc',n:'Creole Cheesecake',p:'Market',d:'Silky.'},
    {id:'cake',n:'Choc/Carrot Cake',p:'Market',d:'House-baked.'},
    {id:'short',n:'Strawberry Shortcake',p:'Market',d:'Seasonal.'}
  ],
  "Weekly Specials":[
    {id:'stw',n:'Sweet Thai Wings',p:'$16',d:'Spicy-sweet.'},
    {id:'eggplant',n:'Eggplant Pirogue',p:'$26',d:'Seafood stuffing.'},
    {id:'jdb',n:'JD Shrimp + Pork Chop',p:'$26',d:'Hearty plate.'},
    {id:'salmon',n:'Grilled Salmon',p:'$28',d:'Crab & avocado.'}
  ]
};

/* -------------------------
   Specials (editable, localStorage)
   ------------------------- */
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEFAULT_SPECIALS = {
  0:{title:'Bread Pudding & Coffee',desc:'Classic bread pudding with bold coffee.'},
  1:{title:'Boudin Balls & Cheesecake',desc:'Spicy boudin, silky cheesecake.'},
  2:{title:'Brisket & Corn Pudding',desc:'Smoky brisket, creamy corn pudding.'},
  3:{title:'Pulled Pork & Potato Salad',desc:'Tangy pork, cool potato salad.'},
  4:{title:'Ribeye Po-Boy & Fries',desc:'Steak po-boy & fries.'},
  5:{title:'Smoked Wings & Thai Dip',desc:'Sweet-spicy wings.'},
  6:{title:'1/2 Chicken & Mac',desc:'Smoked chicken & mac.'}
};
const SPECIALS_KEY = 'francis_specials_v3';
function loadSpecials(){ try{ return JSON.parse(localStorage.getItem(SPECIALS_KEY)) || DEFAULT_SPECIALS }catch(e){return DEFAULT_SPECIALS} }
function saveSpecials(s){ localStorage.setItem(SPECIALS_KEY, JSON.stringify(s)); }

/* -------------------------
   DOM nodes
   ------------------------- */
const grid = document.getElementById('grid');
const specialsStrip = document.getElementById('specialsStrip');
const daysEl = document.getElementById('days');
const todayTitle = document.getElementById('todayTitle');
const todayDesc = document.getElementById('todayDesc');
const editor = document.getElementById('editor');
const specialEditor = document.getElementById('specialEditor');
const bagEl = document.getElementById('bagItems');
const bagTotal = document.getElementById('bagTotal');
const toggleCompact = document.getElementById('toggleCompact');
const printBtn = document.getElementById('printBtn');

/* -------------------------
   State
   ------------------------- */
let compactMode = true;
let bag = [];
let specials = loadSpecials();
let todayIdx = (new Date()).getDay();

/* -------------------------
   Render specials strip
   ------------------------- */
function renderSpecialsStrip(){
  specialsStrip.innerHTML = '';
  const pill = document.createElement('div');
  pill.className = 'special-pill';
  pill.tabIndex = 0;
  pill.setAttribute('role','button');
  pill.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" style="transform:translateY(1px);margin-right:6px"><path fill="#fff" d="M5 12h14M12 5v14" opacity="0.12"/></svg>
    ${DAYS[todayIdx]} • ${specials[todayIdx].title}`;
  pill.title = specials[todayIdx].desc;
  specialsStrip.appendChild(pill);

  // small carousel squares for other days
  for(let i=0;i<7;i++){
    const mini = document.createElement('div');
    mini.className = 'special-mini';
    mini.textContent = DAYS[i];
    mini.tabIndex = 0;
    mini.addEventListener('click',()=>{ setToday(i); });
    specialsStrip.appendChild(mini);
  }
}

/* -------------------------
   Side days bar
   ------------------------- */
function renderDays(){
  daysEl.innerHTML='';
  for(let i=0;i<7;i++){
    const d = document.createElement('div');
    d.className = 'day' + (i===todayIdx ? ' active' : '');
    d.textContent = DAYS[i];
    d.tabIndex = 0;
    d.addEventListener('click', ()=> setToday(i));
    d.addEventListener('keydown', e=>{ if(e.key==='Enter') setToday(i); });
    daysEl.appendChild(d);
  }
  updateTodayCard();
}

/* -------------------------
   Today card
   ------------------------- */
function updateTodayCard(){
  const s = specials[todayIdx];
  todayTitle.textContent = s.title;
  todayDesc.textContent = s.desc;
}

/* -------------------------
   Set today
   ------------------------- */
function setToday(i){
  todayIdx = i;
  renderDays();
  renderSpecialsStrip();
  updateTodayCard();
}

/* -------------------------
   Render menu grid (dense)
   ------------------------- */
function makeBadge(name){
  // first two letters as badge
  const words = name.split(' ');
  const letters = words.slice(0,2).map(w => w[0]).join('').toUpperCase().slice(0,3);
  return letters;
}

function renderGrid(){
  grid.innerHTML = '';
  const categories = Object.keys(MENU);
  categories.forEach(cat=>{
    // category header spans full width
    const head = document.createElement('div');
    head.className = 'category';
    head.innerHTML = `<div class="cat-title">${cat}</div><div class="cat-count" aria-hidden="true">${MENU[cat].length} items</div>`;
    grid.appendChild(head);

    MENU[cat].forEach(item=>{
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.tabIndex = 0;
      tile.setAttribute('role','button');
      tile.innerHTML = `<div class="left">
          <div class="badge" aria-hidden="true">${makeBadge(item.n)}</div>
          <div style="min-width:0">
            <div class="name">${item.n}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="price">${item.p}</div>
          <button class="add" data-id="${item.id}" aria-label="Add ${item.n}">+</button>
        </div>
        <div class="pop" aria-hidden="true"><div class="small" style="font-weight:800;color:var(--gold)">${item.n} · ${item.p}</div><div class="desc">${item.d}</div>
            <div class="mini"><div class="small">Add to order</div><div><button class="add small" data-id="${item.id}">+ Add</button></div></div></div>`;
      grid.appendChild(tile);

      // interactions
      const addBtns = tile.querySelectorAll('.add');
      addBtns.forEach(b=>b.addEventListener('click', e=>{
        e.stopPropagation();
        addToBag(item);
      }));

      // hover/focus pop
      tile.addEventListener('mouseenter', ()=> showPop(tile));
      tile.addEventListener('mouseleave', ()=> hidePop(tile));
      tile.addEventListener('focusin', ()=> showPop(tile));
      tile.addEventListener('focusout', ()=> hidePop(tile));
      tile.addEventListener('click', (e)=>{
        // on click in compact mode: add item. On alt-click or ctrl: show pop
        if(e.altKey || e.ctrlKey || e.metaKey){ togglePop(tile); return; }
        addToBag(item);
      });
      tile.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ addToBag(item); }
        if(e.key===' '){ e.preventDefault(); togglePop(tile); }
      });
    });
  });
}

/* -------------------------
   Popover helpers
   ------------------------- */
function showPop(tile){
  // hide other pops
  document.querySelectorAll('.tile.show-pop').forEach(t=>{ if(t!==tile) t.classList.remove('show-pop');});
  tile.classList.add('show-pop');
}
function hidePop(tile){ tile.classList.remove('show-pop'); }
function togglePop(tile){ tile.classList.toggle('show-pop'); }

/* -------------------------
   Bag operations
   ------------------------- */
function addToBag(item){
  bag.push({id:item.id,name:item.n,price:item.p});
  renderBag();
  flashBag();
}
function renderBag(){
  if(bag.length===0){ bagEl.innerHTML = '<div style="color:var(--muted);font-size:13px">No items</div>'; bagTotal.textContent=''; return; }
  bagEl.innerHTML = '';
  bag.forEach((it,idx)=>{
    const r = document.createElement('div'); r.className='row';
    r.innerHTML = `<div style="max-width:65%">${idx+1}. ${it.name}</div><div style="font-weight:800;color:var(--accent)">${it.price}</div>`;
    bagEl.appendChild(r);
  });
  bagTotal.textContent = calcTotal();
}
function calcTotal(){
  // parse numeric parts when possible
  const nums = bag.map(b=>{
    const num = parseFloat(b.price.replace(/[^\d.]/g,'')); return isNaN(num) ? 0 : num;
  });
  const s = nums.reduce((a,b)=>a+b,0);
  return s>0 ? '$'+s.toFixed(2) : 'Var';
}
function flashBag(){
  const b = document.getElementById('bag');
  b.animate([{transform:'translateY(8px)'},{transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.2,.9,.2,1)'});
}

/* -------------------------
   Specials editing
   ------------------------- */
document.getElementById('editSpecial').addEventListener('click', ()=>{
  editor.style.display = 'block';
  specialEditor.value = specials[todayIdx].title + '\\n' + specials[todayIdx].desc;
  specialEditor.focus();
});
document.getElementById('cancelSpecial').addEventListener('click', ()=>{ editor.style.display='none'; });
document.getElementById('saveSpecial').addEventListener('click', ()=>{
  const val = specialEditor.value.trim().split('\\n');
  const title = val.shift() || 'Special';
  const desc = val.join(' ').trim();
  specials[todayIdx] = {title,desc};
  saveSpecials(specials);
  editor.style.display='none';
  updateTodayCard();
  renderSpecialsStrip();
  renderDays();
});

/* add today's special */
document.getElementById('addToday').addEventListener('click', ()=>{
  const s = specials[todayIdx];
  bag.push({id:'special_'+todayIdx,name:s.title,price:'Market'});
  renderBag(); flashBag();
});

/* email & copy */
document.getElementById('copyOrder').addEventListener('click', ()=>{
  const txt = bag.length? bag.map((b,i)=>`${i+1}. ${b.name} — ${b.price}`).join('\\n') : 'No items';
  navigator.clipboard?.writeText(txt).then(()=>alert('Order copied')).catch(()=>alert('Copy failed'));
});
document.getElementById('emailOrder').addEventListener('click', ()=>{
  const subject = encodeURIComponent('Order — The Francis Smokehouse');
  const body = encodeURIComponent((bag.length? bag.map((b,i)=>`${i+1}. ${b.name} — ${b.price}`).join('\\n') : 'No items') + '\\n\\nCall: (225) 245-5046');
  window.location.href = `mailto:francissmokehouse@att.net?subject=${subject}&body=${body}`;
});

/* clear & checkout */
document.getElementById('clearBag').addEventListener('click', ()=>{ bag=[]; renderBag(); });
document.getElementById('checkout').addEventListener('click', ()=>{ document.getElementById('emailOrder').click(); });

/* toggle compact */
toggleCompact.addEventListener('click', ()=>{
  compactMode = !compactMode;
  const cls = document.querySelector('.grid');
  if(compactMode){ cls.classList.add('compact'); toggleCompact.textContent='Compact'; }
  else { cls.classList.remove('compact'); toggleCompact.textContent='Dense'; }
});

/* print */
printBtn.addEventListener('click', ()=> window.print());

/* keyboard: esc closes pops */
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ document.querySelectorAll('.tile.show-pop').forEach(t=>t.classList.remove('show-pop'));}
});

/* initial render */
renderSpecialsStrip();
renderDays();
renderGrid();
renderBag();
updateTodayCard();

/* Accessibility hint: on mobile, tapping a tile will add; long-press toggles pop implemented via contextmenu */
document.addEventListener('contextmenu', e=>{
  const tile = e.target.closest('.tile');
  if(tile){ e.preventDefault(); togglePop(tile); }
});
</script>

</body>
</html>
