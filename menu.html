<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Francis Smokehouse · Spin Menu</title>
  <meta name="description" content="Mobile-friendly spinning wheel menu for The Francis Smokehouse.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* === base variables (from original) === */
    :root {
      --bg-0: #080706;
      --bg-1: #11100f;
      --bg-2: #181311;
      --bg-3: #231a16;
      --paper: #f7efe4;
      --paper-soft: #d8cbba;
      --gold: #c79a67;
      --gold-2: #e2bc8d;
      --ember: #b64c32;
      --ember-2: #e57a52;
      --wood: #5b3b2b;
      --moss: #5b6650;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --shadow-0: 0 10px 30px rgba(0,0,0,0.22);
      --shadow-1: 0 18px 45px rgba(0,0,0,0.34);
      --shadow-2: 0 28px 70px rgba(0,0,0,0.48);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 30px;
      --radius-xl: 42px;
      --serif: "Playfair Display", serif;
      --sans: "Montserrat", sans-serif;
      --ease: cubic-bezier(.22,1,.36,1);
      --header-h: 70px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--paper);
      background: radial-gradient(circle at 12% 18%, rgba(182,76,50,0.20), transparent 0 26%),
                  radial-gradient(circle at 82% 10%, rgba(199,154,103,0.12), transparent 0 18%),
                  radial-gradient(circle at 65% 78%, rgba(229,122,82,0.12), transparent 0 22%),
                  linear-gradient(180deg, #090807 0%, #110f0d 42%, #0b0908 100%);
      overflow-x: hidden;
    }
    body.menu-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .smoke-stage { position: fixed; inset: 0; z-index: -3; overflow: hidden; pointer-events: none; }
    .smoke-stage::before, .smoke-stage::after {
      content:""; position:absolute; inset:-12%;
      background: radial-gradient(circle at 20% 35%, rgba(255,255,255,0.04), transparent 0 18%),
                  radial-gradient(circle at 48% 22%, rgba(229,122,82,0.08), transparent 0 16%),
                  radial-gradient(circle at 75% 42%, rgba(199,154,103,0.06), transparent 0 16%),
                  radial-gradient(circle at 60% 74%, rgba(255,255,255,0.025), transparent 0 18%);
      filter: blur(44px);
      mix-blend-mode: screen;
      animation: smokeFloatA 22s ease-in-out infinite alternate;
    }
    .smoke-stage::after {
      background: radial-gradient(circle at 16% 72%, rgba(255,255,255,0.03), transparent 0 14%),
                  radial-gradient(circle at 68% 12%, rgba(182,76,50,0.10), transparent 0 15%),
                  radial-gradient(circle at 88% 82%, rgba(199,154,103,0.07), transparent 0 13%);
      filter: blur(68px);
      animation: smokeFloatB 30s ease-in-out infinite alternate;
    }
    .grain-overlay {
      position: fixed; inset:0; z-index:-2; pointer-events:none; mix-blend-mode:soft-light; opacity:.06;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size:4px 4px,4px 4px;
    }
    @keyframes smokeFloatA { 0% { transform:translate3d(0,0,0) scale(1); } 100% { transform:translate3d(-3%, -5%, 0) scale(1.14); } }
    @keyframes smokeFloatB { 0% { transform:translate3d(0,0,0) scale(1); } 100% { transform:translate3d(4%, 3%, 0) scale(1.2); } }
    @keyframes toastIn { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }

    /* === top bar (simplified) === */
    .topbar {
      position: sticky; top:0; z-index:60; min-height:var(--header-h); display:flex; align-items:center;
      backdrop-filter: blur(16px);
      background: linear-gradient(180deg, rgba(10,9,8,0.88), rgba(10,9,8,0.54));
      border-bottom:1px solid var(--line);
    }
    .topbar-inner {
      width: min(1400px, calc(100% - 28px)); margin-inline:auto; display:flex;
      align-items:center; justify-content:space-between; padding:12px 0;
    }
    .brand-kicker { color:var(--gold); text-transform:uppercase; letter-spacing:.35em; font-size:11px; font-weight:700; }
    .brand-title { font-family:var(--serif); font-size:clamp(1.2rem, 1.5vw, 1.55rem); font-weight:800; letter-spacing:.04em; }
    .top-actions { display:flex; gap:10px; }
    .action-btn {
      appearance:none; border:1px solid var(--line-strong); color:var(--paper); background:rgba(255,255,255,0.03);
      border-radius:999px; padding:8px 14px; min-height:40px; display:inline-flex; align-items:center; gap:6px;
      cursor:pointer; transition:transform .22s var(--ease), border-color .22s var(--ease);
    }
    .action-btn:active { transform:scale(0.96); }
    .action-btn.is-ember { background:linear-gradient(135deg, rgba(182,76,50,0.24), rgba(199,154,103,0.12)); border-color:rgba(229,122,82,0.4); }

    /* === main mobile layout === */
    .mobile-menu {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - var(--header-h));
      padding: 16px 12px 20px;
      gap: 20px;
    }
    /* wheel */
    .wheel-container {
      position: relative;
      width: min(380px, 90vw);
      aspect-ratio: 1;
      margin: 0 auto;
      touch-action: none;
      user-select: none;
    }
    .wheel {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
    .wheel-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 130px;
      margin-left: -65px;
      height: 44px;
      line-height: 44px;
      text-align: center;
      background: rgba(20,18,17,0.9);
      backdrop-filter: blur(4px);
      border: 1px solid var(--gold);
      border-radius: 40px;
      color: var(--paper);
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      pointer-events: none; /* touches pass through to the wheel */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    .wheel-marker {
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 24px solid var(--ember-2);
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
      z-index: 10;
      pointer-events: none;
    }
    .selected-category {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold-2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: -10px;
    }

    /* sub-items list */
    .sub-items {
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line-strong);
      border-radius: 28px;
      padding: 16px 12px;
      max-height: 40vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sub-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
    }
    .sub-item:last-child { border-bottom: none; }
    .sub-item-name {
      font-weight: 600;
      font-size: 1rem;
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .sub-item-price {
      color: var(--gold-2);
      font-weight: 700;
      white-space: nowrap;
      font-size: 0.9rem;
    }
    .sub-item-add {
      appearance: none;
      border: 1px solid rgba(229,122,82,0.5);
      background: rgba(182,76,50,0.25);
      color: var(--paper);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .sub-item-add:active {
      background: var(--ember);
      transform: scale(0.95);
    }

    /* plate summary (collapsible drawer at bottom) */
    .plate-drawer-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20,18,17,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      border-radius: 60px;
      padding: 12px 20px;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .plate-drawer-button:active { background: rgba(40,35,32,0.9); }
    .plate-drawer-button .total { font-weight: 800; color: var(--gold-2); font-size: 1.2rem; }
    .drawer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      pointer-events: none;
    }
    .drawer.open {
      display: block;
      pointer-events: all;
    }
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
    }
    .drawer-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(30,27,25,0.98), rgba(15,13,12,0.98));
      border-top-left-radius: 36px;
      border-top-right-radius: 36px;
      border-top: 1px solid var(--gold);
      padding: 24px 20px 30px;
      transform: translateY(100%);
      transition: transform 0.3s var(--ease);
      max-height: 80vh;
      overflow-y: auto;
    }
    .drawer.open .drawer-panel {
      transform: translateY(0);
    }
    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold-2);
    }
    .close-drawer {
      background: none;
      border: none;
      color: var(--paper-soft);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }
    .drawer-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .drawer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line-strong);
    }
    .drawer-item-name { font-weight: 500; }
    .drawer-item-price { color: var(--gold-2); font-weight: 700; }
    .drawer-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.3rem;
      font-weight: 800;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 2px solid var(--gold);
    }
    .drawer-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .drawer-actions button {
      flex: 1 1 auto;
      min-width: 100px;
    }

    /* toast */
    .toast-stack {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 10px;
      z-index: 90;
      width: min(92vw, 320px);
    }
    .toast {
      border-radius: 18px;
      border: 1px solid var(--line-strong);
      background: rgba(14,13,12,0.9);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-1);
      padding: 14px 16px;
      display: grid;
      gap: 4px;
      animation: toastIn .28s var(--ease);
    }
    .toast strong { font-weight: 800; }
    .toast span { color: var(--paper-soft); font-size: .88rem; }

    /* navigation buttons (from original) */
    .nav-btn {
      position: fixed;
      z-index: 1000;
      background: #1e1b1b;
      border: 2px solid #b44b3c;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(180,75,60,0.5);
      transition: all 0.3s;
      backdrop-filter: blur(8px);
    }
    .nav-btn:hover { transform: scale(1.05); border-color: #d97c5a; box-shadow: 0 0 35px #b44b3c; }
    .btn-icon { font-size: 1.8rem; color: #b44b3c; }
    .btn-text { display: flex; flex-direction: column; line-height: 1.2; }
    .btn-text .main { font-weight: 700; font-size: 1rem; letter-spacing: 2px; color: #f8f1e4; }
    .btn-text .sub { font-size: 0.65rem; opacity: 0.7; color: #e5d3b5; text-transform: uppercase; }
    .nav-btn.left-center {
      left: 30px; top: 50%; transform: translateY(-50%);
      flex-direction: column; padding: 1rem 0.5rem; gap: 8px;
    }
    .nav-btn.left-center .btn-text { writing-mode: vertical-rl; text-orientation: upright; }
    .nav-btn.bottom-center {
      bottom: 30px; left: 50%; transform: translateX(-50%);
      flex-direction: row; padding: 0.8rem 1.8rem;
    }
    @media (max-width: 800px) { .nav-btn.left-center { display: none; } }

    /* circular menu overlay (original) */
    .circ-menu-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:2000;
      display:flex; align-items:center; justify-content:center; pointer-events:none;
      background: rgba(0,0,0,0.7); opacity:0; transition:opacity 0.3s ease; backdrop-filter:blur(8px);
    }
    .circ-menu-overlay.open { opacity:1; pointer-events:all; }
    .circular-menu {
      width:360px; height:360px; border-radius:50%; background:transparent;
      border:2px solid #b44b3c; box-shadow:0 0 50px rgba(180,75,60,0.6);
      display:flex; align-items:center; justify-content:center; position:relative;
      transform:scale(0.3); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .circ-menu-overlay.open .circular-menu { transform:scale(1); }
    .center-home {
      width:70px; height:70px; background:#c39a6a; border:3px solid #b44b3c; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.5rem;
      color:#0b0a0a; box-shadow:0 0 30px #b44b3c; cursor:pointer; transition:0.2s; z-index:1001;
    }
    .center-home:hover { background:#b44b3c; color:white; transform:scale(1.05); }
    .menu-item {
      position:absolute; width:60px; height:60px; background:#1e1b1b; border:2px solid #b44b3c;
      border-radius:50%; display:flex; align-items:center; justify-content:center; color:#f8f1e4;
      font-size:0.8rem; font-weight:600; text-transform:uppercase; transition:0.2s; cursor:pointer;
      box-shadow:0 0 15px rgba(0,0,0,0.7); top:50%; left:50%;
      transform: translate(-50%, -50%) rotate(calc(var(--angle) * 1deg)) translateY(-130px) rotate(calc(var(--angle) * -1deg));
      letter-spacing:1px; backdrop-filter:blur(4px);
    }
    .menu-item:hover { background:#b44b3c; color:black; border-color:#c39a6a; width:65px; height:65px; }
  </style>
</head>

  <div class="smoke-stage" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- top bar (simplified) -->

  <!-- main mobile menu -->
  <main class="mobile-menu">

    <div class="wheel-container">

    <div class="selected-category" id="selectedCategory">BBQ Plates</div>

  <div class="drawer" id="plateDrawer">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

      <div class="drawer-head">
        <span>Your Plate</span>
        <button class="close-drawer" id="closeDrawerBtn">&times;</button>
      </div>
      <ul class="drawer-items" id="drawerItems"></ul>
      <div class="drawer-total">
        <span>Total</span>
        <span id="drawerTotal">$0.00</span>
      </div>
      <div class="drawer-actions">
        <button class="action-btn" id="undoBtn">Undo</button>
        <button class="action-btn" id="clearBtn">Clear</button>

  <!-- toast stack -->
  <div class="toast-stack" id="toastStack"></div>

  <!-- original navigation buttons & circular menu (preserved) -->

  <div class="nav-btn bottom-center" id="navBtnBottom">

      <span class="sub">explore pages</span>
    </div>
  </div>
  <div class="circ-menu-overlay" id="circMenuOverlay">
    <div class="circular-menu">
      <div class="center-home" id="homeCenter" data-link="index.html"><i class="fas fa-home"></i></div>

      <div class="menu-item" style="--angle: 60;" data-link="about.html">About</div>

      <div class="menu-item" style="--angle: 180;" data-link="contact.html">Contact</div>

      <div class="menu-item" style="--angle: 300;" data-link="catering.html">Cater</div>

  </div>

      { "category": "Specialty Meats", "name": "Pulled Pork by the Pound", "price": null, "desc": "take-home pulled pork", "tags": ["meat","lb"] },
      { "category": "Specialty Meats", "name": "Steamed Boudin Links", "price": null, "desc": "house boudin links", "tags": ["boudin"] },
      { "category": "Specialty Meats", "name": "Pepper Jack Boudin Balls", "price": null, "desc": "pepper jack stuffed boudin balls", "tags": ["boudin","cheese"] },
      { "category": "Specialty Meats", "name": "Boudin Egg Rolls", "price": null, "desc": "crispy boudin egg rolls", "tags": ["boudin","egg roll"] },
      { "category": "Specialty Meats", "name": "Smoked Turkey", "price": null, "desc": "smoked turkey to go", "tags": ["turkey","smoked"] },
      { "category": "Specialty Meats", "name": "Sausage", "price": null, "desc": "specialty sausage selection", "tags": ["sausage"] },
      { "category": "Desserts", "name": "Bread Pudding", "price": null, "desc": "rich southern bread pudding", "tags": ["dessert"] },
      { "category": "Desserts", "name": "Creole Cream Cheese Cake", "price": null, "desc": "creole cream cheese cake", "tags": ["dessert","cake"] },
      { "category": "Desserts", "name": "Blueberry Cheesecake", "price": null, "desc": "cheesecake with blueberry", "tags": ["dessert","cake"] },
      { "category": "Desserts", "name": "Strawberry Shortcake", "price": null, "desc": "shortcake dessert", "tags": ["dessert"] },
      { "category": "Add-Ons", "name": "Green Peppers", "price": null, "desc": "extra topping", "tags": ["addon"] },
      { "category": "Add-Ons", "name": "American Cheese", "price": null, "desc": "extra cheese", "tags": ["addon","cheese"] },
      { "category": "Add-Ons", "name": "Pepper Jack Cheese", "price": 3.25, "desc": "extra pepper jack", "tags": ["addon","cheese"] },
      { "category": "Add-Ons", "name": "Provolone Cheese", "price": null, "desc": "extra provolone", "tags": ["addon","cheese"] },
      { "category": "Add-Ons", "name": "Mushrooms", "price": null, "desc": "extra mushrooms", "tags": ["addon"] },
      { "category": "Add-Ons", "name": "Cheddar", "price": null, "desc": "extra cheddar", "tags": ["addon","cheese"] },
      { "category": "Add-Ons", "name": "Pack of Buns", "price": null, "desc": "buns for take-home meats", "tags": ["addon"] },
      { "category": "Daily Specials", "name": "Chicken Burger", "price": null, "desc": "posted as daily special", "tags": ["special"] },
      { "category": "Daily Specials", "name": "Daily Special Rotation", "price": null, "desc": "special changes through the week", "tags": ["special"] }
    ];

    const CATEGORIES = [
      "BBQ Plates", "Burgers & Sandwiches", "Po-Boys", "Salads", "Sides",
      "Specialty Meats", "Desserts", "Add-Ons", "Daily Specials"
    ];

    // ==================== STATE ====================
    const state = {
      plate: [],
      removedStack: [],
      currentCategory: "BBQ Plates",
      wheelRotation: 0,
      dragging: false,
      startAngle: 0,
      lastAngle: 0,
      velocity: 0,
      animationFrame: null,
      lastTimestamp: 0
    };

    // ==================== UTILS ====================
    function priceLabel(price) {
      return typeof price === 'number' ? `$${price.toFixed(2)}` : 'In‑store';
    }

    function toast(title, message) {
      const node = document.createElement('div');
      node.className = 'toast';
      node.innerHTML = `<strong>${title}</strong><span>${message}</span>`;
      document.getElementById('toastStack').appendChild(node);
      setTimeout(() => { node.style.opacity = '0'; node.style.transform = 'translateY(8px)'; }, 2000);
      setTimeout(() => node.remove(), 2500);
    }

    function plateTotal() {
      return state.plate.reduce((sum, item) => sum + (typeof item.price === 'number' ? item.price : 0), 0);
    }

    function addItemToPlate(item) {
      const plateItem = { ...item, instanceId: Math.random().toString(36).slice(2, 10) };
      state.plate.push(plateItem);
      state.removedStack = [];
      updatePlateUI();
      toast('Added', `${item.name} added to plate.`);
    }

    function removePlateItem(instanceId) {
      const index = state.plate.findIndex(i => i.instanceId === instanceId);
      if (index === -1) return;
      const [removed] = state.plate.splice(index, 1);
      state.removedStack.push(removed);
      updatePlateUI();
      toast('Removed', `${removed.name} removed.`);
    }

    function undoRemove() {
      const item = state.removedStack.pop();
      if (!item) { toast('Nothing to undo', 'Remove stack empty.'); return; }
      state.plate.push(item);
      updatePlateUI();
      toast('Restored', `${item.name} back on plate.`);
    }

    function clearPlate() {
      if (!state.plate.length) { toast('Plate empty', 'Nothing to clear.'); return; }
      state.removedStack.push(...state.plate);
      state.plate = [];
      updatePlateUI();
      toast('Cleared', 'Plate reset.');
    }

    function copyPlate() {
      const lines = state.plate.length
        ? state.plate.map(i => `- ${i.name} (${priceLabel(i.price)})`)
        : ['- No items'];
      const text = ['The Francis Smokehouse', ...lines, '', `Total: $${plateTotal().toFixed(2)}`].join('\n');
      navigator.clipboard.writeText(text).then(() => toast('Copied', 'Plate summary copied.'));
    }

    function updatePlateUI() {
      // button total
      document.getElementById('plateButtonTotal').textContent = `$${plateTotal().toFixed(2)}`;
      // drawer items
      const drawerList = document.getElementById('drawerItems');
      drawerList.innerHTML = state.plate.map(item => `
        <li class="drawer-item">
          <span class="drawer-item-name">${item.name}</span>
          <span class="drawer-item-price">${priceLabel(item.price)}</span>
        </li>
      `).join('');
      document.getElementById('drawerTotal').textContent = `$${plateTotal().toFixed(2)}`;
    }

    // ==================== WHEEL ====================
    function renderWheel() {
      const wheel = document.getElementById('categoryWheel');
      const angleStep = 360 / CATEGORIES.length;
      wheel.innerHTML = CATEGORIES.map((cat, i) => {
        const angle = i * angleStep;
        return `<div class="wheel-item" style="transform: rotate(${angle}deg) translateY(-140px) rotate(-${angle}deg);">${cat}</div>`;
      }).join('');
    }

    function getAngleFromTouch(clientX, clientY) {
      const rect = document.getElementById('categoryWheel').getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = clientX - centerX;
      const dy = clientY - centerY;
      return Math.atan2(dy, dx) * 180 / Math.PI; // degrees, with 0° pointing right
    }

    function snapToNearestCategory() {
      const angleStep = 360 / CATEGORIES.length;
      // Normalize rotation to 0-360
      let rot = ((state.wheelRotation % 360) + 360) % 360;
      // Find closest category index (we want the one at bottom: bottom corresponds to -90° from right)
      // The marker is at bottom (270° in standard math, but our rotation is applied clockwise positive).
      // We'll simplify: find the index whose angle (categoryAngle) is closest to (rot + 90) mod 360? Let's do robust:
      const targetAngles = CATEGORIES.map((_, i) => (i * angleStep) % 360);
      // The marker is at bottom, which in our wheel coordinate is -90° (270°). The item that appears at bottom is the one whose absolute angle (its position) is closest to (rot + 270) % 360? Actually the wheel rotates, so the item that is at bottom has an absolute world angle = (itemAngle + rot) % 360, and we want that to be 270° (bottom). So we need itemAngle such that (itemAngle + rot) % 360 ≈ 270. => itemAngle ≈ (270 - rot) mod 360.
      const desiredItemAngle = (270 - rot + 360) % 360;
      let bestIdx = 0;
      let bestDiff = 360;
      targetAngles.forEach((angle, idx) => {
        let diff = Math.abs(angle - desiredItemAngle);
        diff = Math.min(diff, 360 - diff);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestIdx = idx;
        }
      });
      const targetRotation = (270 - targetAngles[bestIdx] + 360) % 360; // the rot that puts that item at bottom
      // Now animate to targetRotation
      state.wheelRotation = targetRotation;
      document.getElementById('categoryWheel').style.transform = `rotate(${targetRotation}deg)`;
      state.currentCategory = CATEGORIES[bestIdx];
      document.getElementById('selectedCategory').textContent = state.currentCategory;
      renderSubItems();
    }

    function handleTouchStart(e) {
      e.preventDefault();
      const touch = e.touches[0];
      state.startAngle = getAngleFromTouch(touch.clientX, touch.clientY) - state.wheelRotation;
      state.dragging = true;
      state.velocity = 0;
      state.lastTimestamp = performance.now();
      state.lastAngle = state.wheelRotation;
      cancelAnimationFrame(state.animationFrame);
    }

    function handleTouchMove(e) {
      if (!state.dragging) return;
      e.preventDefault();
      const touch = e.touches[0];
      const currentTouchAngle = getAngleFromTouch(touch.clientX, touch.clientY);
      let newRot = currentTouchAngle - state.startAngle;
      state.wheelRotation = newRot;
      document.getElementById('categoryWheel').style.transform = `rotate(${newRot}deg)`;

      // update velocity
      const now = performance.now();
      const dt = now - state.lastTimestamp;
      if (dt > 10) {
        const delta = newRot - state.lastAngle;
        state.velocity = delta / dt * 16; // normalize to ~60fps step
        state.lastAngle = newRot;
        state.lastTimestamp = now;
      }
    }

    function handleTouchEnd(e) {
      if (!state.dragging) return;
      e.preventDefault();
      state.dragging = false;
      // apply inertia
      const inertia = () => {
        if (Math.abs(state.velocity) < 0.02) {
          snapToNearestCategory();
          return;
        }
        state.wheelRotation += state.velocity;
        state.velocity *= 0.95; // friction
        document.getElementById('categoryWheel').style.transform = `rotate(${state.wheelRotation}deg)`;
        state.animationFrame = requestAnimationFrame(inertia);
      };
      state.animationFrame = requestAnimationFrame(inertia);
    }

    function initWheel() {
      const wheelContainer = document.querySelector('.wheel-container');
      wheelContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
      wheelContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
      wheelContainer.addEventListener('touchend', handleTouchEnd);
      wheelContainer.addEventListener('touchcancel', handleTouchEnd);
      // initial snap
      snapToNearestCategory();
    }

    // ==================== SUB-ITEMS ====================
    function renderSubItems() {
      const items = MENU_DATA.filter(item => item.category === state.currentCategory);
      const container = document.getElementById('subItems');
      container.innerHTML = items.map(item => `
        <div class="sub-item">
          <span class="sub-item-name">${item.name}</span>
          <span class="sub-item-price">${priceLabel(item.price)}</span>
          <button class="sub-item-add" data-add='${item.name}'>Add</button>
        </div>
      `).join('');
      // attach add listeners
      container.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = MENU_DATA.find(i => i.name === btn.dataset.add);
          if (item) addItemToPlate(item);
        });
      });
    }

    // ==================== DRAWER ====================
    function openDrawer() {
      document.getElementById('plateDrawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('plateDrawer').classList.remove('open');
    }

    // ==================== INIT ====================
    window.addEventListener('load', () => {
      renderWheel();
      initWheel();
      renderSubItems();
      updatePlateUI();

      // Drawer
      document.getElementById('openPlateBtn').addEventListener('click', openDrawer);
      document.getElementById('plateDrawerButton').addEventListener('click', openDrawer);
      document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
      document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);

      // Actions
      document.getElementById('undoBtn').addEventListener('click', undoRemove);
      document.getElementById('clearBtn').addEventListener('click', clearPlate);
      document.getElementById('copyBtn').addEventListener('click', copyPlate);
    });

    // ==================== ORIGINAL NAVIGATION (copy-pasted from original) ====================
    (function() {
      const overlay = document.getElementById('circMenuOverlay');
      const leftBtn = document.getElementById('navBtnLeft');
      const bottomBtn = document.getElementById('navBtnBottom');
      const homeCenter = document.getElementById('homeCenter');
      const menuItems = document.querySelectorAll('.menu-item');
      function toggleMenu() { overlay.classList.toggle('open'); }
      if (leftBtn) leftBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleMenu(); });
      if (bottomBtn) bottomBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleMenu(); });
      if (overlay) overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.classList.remove('open'); });
      function navigate(link) { if (link) window.location.href = link; }
      if (homeCenter) homeCenter.addEventListener('click', function() { overlay.classList.remove('open'); navigate(homeCenter.getAttribute('data-link')); });
      menuItems.forEach(item => {
        item.addEventListener('click', function() { overlay.classList.remove('open'); navigate(item.getAttribute('data-link')); });
      });
      const circularMenu = document.querySelector('.circular-menu');
      if (circularMenu) circularMenu.addEventListener('click', function(e) { e.stopPropagation(); });
    })();
  </script>
