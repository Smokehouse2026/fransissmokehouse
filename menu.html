<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline 3D Brick Portal Navigation</title>
  <style>
    :root{
      --bg0:#070707;
      --bg1:#130d0a;
      --bg2:#26160f;
      --mortar:#a58f7d;
      --ui:rgba(245,250,255,.96);
      --ui-muted:rgba(228,236,245,.7);
      --panel:rgba(8,12,20,.74);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 46%, rgba(255,157,87,.06), transparent 16%),
        radial-gradient(circle at 50% 55%, rgba(99,132,255,.08), transparent 28%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 45%, var(--bg0));
      color: white;
    }

    #app {
      position: fixed;
      inset: 0;
      perspective: 1600px;
      perspective-origin: 50% 44%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(255,184,120,.08), transparent 18%),
        radial-gradient(circle at 50% 55%, rgba(99,132,255,.08), transparent 30%);
    }

    .camera {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .18s ease-out;
    }

    .wall-plane {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1800px;
      height: 1100px;
      margin-left: -900px;
      margin-top: -550px;
      transform-style: preserve-3d;
      transform: translateZ(-220px);
      filter: drop-shadow(0 70px 100px rgba(0,0,0,.6));
    }

    .brick-field {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .brick {
      position: absolute;
      width: 138px;
      height: 64px;
      border-radius: 4px;
      background:
        radial-gradient(circle at 24% 28%, rgba(255,255,255,.12), transparent 18%),
        linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,0) 34%, rgba(0,0,0,.09) 74%, rgba(0,0,0,.18)),
        linear-gradient(135deg, var(--b1), var(--b2) 56%, var(--b3));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -12px 20px rgba(0,0,0,.18),
        0 10px 14px rgba(0,0,0,.18);
      border: 1px solid rgba(27,12,7,.28);
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .brick::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(25deg, rgba(255,255,255,.025) 0 2px, transparent 2px 8px),
        radial-gradient(circle at 75% 65%, rgba(0,0,0,.12), transparent 16%),
        radial-gradient(circle at 38% 52%, rgba(0,0,0,.08), transparent 12%),
        radial-gradient(circle at 56% 26%, rgba(255,255,255,.04), transparent 10%);
      mix-blend-mode: overlay;
      opacity: .95;
      pointer-events: none;
    }

    .brick::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 8px 0 10px rgba(255,255,255,.03),
        inset -10px 0 12px rgba(0,0,0,.08),
        inset 0 10px 10px rgba(255,255,255,.03),
        inset 0 -14px 14px rgba(0,0,0,.11);
      pointer-events: none;
    }

    .brick-side {
      position: absolute;
      background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.34));
      transform-origin: top left;
      pointer-events: none;
    }

    .brick-side.right {
      right: -16px;
      top: 2px;
      width: 16px;
      height: 60px;
      transform: rotateY(90deg);
      transform-origin: left center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.2)),
        linear-gradient(180deg, #6a3522, #482216);
    }

    .brick-side.bottom {
      left: 2px;
      bottom: -16px;
      width: 134px;
      height: 16px;
      transform: rotateX(-90deg);
      transform-origin: center top;
      background:
        linear-gradient(90deg, rgba(255,255,255,.04), rgba(0,0,0,.2)),
        linear-gradient(90deg, #6a3522, #482216);
    }

    .mortar-shadow {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 6px, transparent 6px 74px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 6px, transparent 6px 144px);
      opacity: .24;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .portal-shell {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 920px;
      height: 760px;
      margin-left: -460px;
      margin-top: -380px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .depth-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--w);
      height: var(--h);
      margin-left: calc(var(--w) / -2);
      margin-top: calc(var(--h) / -2);
      border-radius: 48% 52% 50% 50% / 42% 43% 57% 58%;
      transform: translateZ(var(--z));
      background:
        radial-gradient(circle at 50% 44%, rgba(255,176,96,.04), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.14)),
        linear-gradient(180deg, #26160f, #140c0a 55%, #09090b);
      box-shadow:
        inset 0 0 0 8px rgba(66,35,22,.65),
        inset 0 0 0 26px rgba(33,17,12,.78),
        inset 0 14px 20px rgba(255,220,160,.03),
        inset 0 -30px 40px rgba(0,0,0,.35),
        0 30px 80px rgba(0,0,0,.45);
    }

    .depth-ring.inner {
      box-shadow:
        inset 0 0 0 8px rgba(22,14,14,.74),
        inset 0 0 0 22px rgba(8,11,16,.92),
        inset 0 0 60px rgba(86,132,255,.03),
        inset 0 0 40px rgba(255,155,86,.03);
      background:
        radial-gradient(circle at 50% 44%, rgba(255,176,96,.03), transparent 42%),
        linear-gradient(180deg, #10131a, #080c13 55%, #030508);
    }

    .portal-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 370px;
      height: 370px;
      margin-left: -185px;
      margin-top: -185px;
      border-radius: 50%;
      transform: translateZ(-760px);
      background:
        radial-gradient(circle, rgba(255,241,220,.98) 0 6%, rgba(255,193,118,.72) 10%, rgba(133,177,255,.18) 24%, rgba(91,133,255,.08) 34%, rgba(0,0,0,0) 56%);
      filter: blur(10px) saturate(1.2);
      mix-blend-mode: screen;
      animation: pulse 4.6s ease-in-out infinite;
    }

    .portal-swirl,
    .portal-swirl-2 {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 460px;
      height: 460px;
      margin-left: -230px;
      margin-top: -230px;
      border-radius: 50%;
      transform: translateZ(-700px);
      opacity: .8;
      filter: blur(6px);
      mix-blend-mode: screen;
    }

    .portal-swirl {
      background:
        conic-gradient(
          from 0deg,
          rgba(255,188,110,0) 0deg,
          rgba(255,188,110,.28) 34deg,
          rgba(125,170,255,.16) 66deg,
          rgba(255,188,110,0) 120deg,
          rgba(255,188,110,.22) 168deg,
          rgba(125,170,255,.10) 212deg,
          rgba(255,188,110,0) 360deg
        );
      animation: spin 16s linear infinite;
    }

    .portal-swirl-2 {
      width: 340px;
      height: 340px;
      margin-left: -170px;
      margin-top: -170px;
      transform: translateZ(-735px);
      background:
        conic-gradient(
          from 180deg,
          rgba(255,188,110,0) 0deg,
          rgba(125,170,255,.20) 60deg,
          rgba(255,188,110,.18) 110deg,
          rgba(255,188,110,0) 180deg,
          rgba(125,170,255,.12) 240deg,
          rgba(255,188,110,.22) 300deg,
          rgba(255,188,110,0) 360deg
        );
      animation: spinReverse 12s linear infinite;
    }

    .mist {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 620px;
      height: 420px;
      margin-left: -310px;
      margin-top: -210px;
      transform: translateZ(-520px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 50%, rgba(255,255,255,.05), transparent 18%),
        radial-gradient(circle at 54% 42%, rgba(138,175,255,.08), transparent 22%),
        radial-gradient(circle at 62% 70%, rgba(255,188,110,.08), transparent 18%);
      filter: blur(18px);
      animation: mistShift 7.5s ease-in-out infinite alternate;
    }

    .rim-chunk {
      position: absolute;
      width: var(--w);
      height: var(--h);
      left: var(--x);
      top: var(--y);
      transform: translateZ(var(--z)) rotate(var(--r));
      border-radius: 4px;
      background:
        linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,0) 34%, rgba(0,0,0,.1) 74%, rgba(0,0,0,.18)),
        linear-gradient(135deg, #986049, #74412c 60%, #4e291b);
      border: 1px solid rgba(28,11,5,.5);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 12px 18px rgba(0,0,0,.3);
      animation: floatPiece var(--d) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .rim-chunk::after {
      content:"";
      position:absolute;
      inset:2px;
      border-radius:2px;
      background: linear-gradient(90deg, rgba(0,0,0,.16), transparent 48%, rgba(255,255,255,.07));
      opacity: .55;
    }

    .ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .title {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      text-align: center;
      text-shadow: 0 12px 30px rgba(0,0,0,.55);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      color: rgba(255,255,255,.68);
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .title h1 {
      margin: 12px 0 6px;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .title p {
      margin: 0;
      color: rgba(255,255,255,.64);
      font-size: 14px;
    }

    .menu-layer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(560px, 86vw);
      height: min(560px, 86vw);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform .18s ease-out, opacity .18s ease-out;
      filter: drop-shadow(0 34px 60px rgba(0,0,0,.45));
    }

    .menu-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 360px;
      height: 360px;
      margin-left: -180px;
      margin-top: -180px;
      border-radius: 50%;
      border: 1px solid rgba(221,233,255,.16);
      background:
        radial-gradient(circle at 50% 48%, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow:
        0 0 60px rgba(93,132,255,.08),
        inset 0 0 28px rgba(255,255,255,.03);
      backdrop-filter: blur(8px);
      animation: spin 28s linear infinite;
    }

    .menu-ring::before,
    .menu-ring::after {
      content:"";
      position:absolute;
      inset:18px;
      border:1px dashed rgba(255,255,255,.08);
      border-radius:50%;
    }

    .menu-ring::after {
      inset:42px;
      border-style: solid;
      opacity: .45;
    }

    .menu-node {
      position: absolute;
      width: 98px;
      height: 98px;
      margin: -49px 0 0 -49px;
      border-radius: 50%;
      border: 1px solid rgba(223,235,255,.18);
      background:
        radial-gradient(circle at 28% 25%, rgba(255,255,255,.17), rgba(255,255,255,.04) 36%, rgba(10,15,23,.9) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 18px 34px rgba(0,0,0,.34),
        0 0 28px rgba(100,140,255,.08);
      color: #f5fbff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .menu-node::before {
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background: radial-gradient(circle, var(--ga), transparent 68%);
      opacity:.65;
    }

    .menu-node:hover {
      transform: scale(1.08);
      border-color: rgba(255,255,255,.28);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        0 24px 42px rgba(0,0,0,.44),
        0 0 40px rgba(100,140,255,.13);
    }

    .menu-node .icon,
    .menu-node .label {
      position: relative;
      z-index: 1;
    }

    .menu-node .icon { font-size: 22px; line-height: 1; }
    .menu-node .label { font-size: 12px; line-height: 1.1; font-weight: 700; padding: 0 8px; }

    .menu-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 156px;
      height: 156px;
      margin-left: -78px;
      margin-top: -78px;
      border-radius: 50%;
      border: 1px solid rgba(226,236,255,.18);
      background:
        radial-gradient(circle at 36% 28%, rgba(255,255,255,.18), rgba(255,255,255,.04) 32%, rgba(4,8,14,.95) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 24px 44px rgba(0,0,0,.46),
        0 0 36px rgba(255,183,91,.08);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      color:rgba(255,255,255,.95);
      pointer-events:none;
    }

    .menu-hub .big {
      font-size: 15px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .menu-hub .small {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255,255,255,.46);
    }

    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(520px, 88vw);
      min-height: 320px;
      transform: translate(-50%, -50%);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
        var(--panel);
      box-shadow:
        0 36px 84px rgba(0,0,0,.45),
        0 0 42px rgba(115,155,255,.08);
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .card .bar {
      height: 7px;
      background: linear-gradient(90deg, #fb923c, #fde68a, #60a5fa);
    }

    .card .body {
      padding: 28px 28px 30px;
      color: white;
    }

    .card .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.58);
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 3vw, 38px);
      line-height: 1.03;
      letter-spacing: -.03em;
    }

    .card p {
      margin: 0;
      color: rgba(235,242,255,.82);
      line-height: 1.78;
      font-size: 15px;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: auto;
    }

    .action {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      padding: 12px 18px;
      background: rgba(16,20,28,.58);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 30px rgba(0,0,0,.3);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .action.primary {
      background: rgba(255,255,255,.93);
      color: #111827;
      border-color: rgba(255,255,255,.42);
    }

    .action:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.28);
      background: rgba(31,39,52,.74);
    }

    .action.primary:hover { background: rgba(255,255,255,.98); }

    .hint {
      position: absolute;
      right: 18px;
      top: 18px;
      width: min(320px, calc(100vw - 36px));
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(8,10,14,.48);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.7);
      font-size: 13px;
      line-height: 1.55;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      pointer-events: none;
    }

    @keyframes pulse {
      0%,100% { transform: translateZ(-760px) scale(1); opacity: .92; }
      50% { transform: translateZ(-760px) scale(1.08); opacity: 1; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }

    @keyframes mistShift {
      from { transform: translateZ(-520px) translateX(-12px) translateY(4px); }
      to { transform: translateZ(-520px) translateX(12px) translateY(-6px); }
    }

    @keyframes floatPiece {
      0%,100% { transform: translateZ(var(--z)) rotate(var(--r)) translate(0,0); }
      25% { transform: translateZ(calc(var(--z) - 8px)) rotate(calc(var(--r) + 4deg)) translate(8px,-10px); }
      50% { transform: translateZ(calc(var(--z) + 6px)) rotate(calc(var(--r) - 5deg)) translate(-8px,8px); }
      75% { transform: translateZ(calc(var(--z) - 4px)) rotate(calc(var(--r) + 2deg)) translate(10px,4px); }
    }

    @media (max-width: 760px) {
      .hint, .title p { display:none; }
      .menu-ring { width: 300px; height: 300px; margin-left: -150px; margin-top: -150px; }
      .menu-node { width: 84px; height: 84px; margin: -42px 0 0 -42px; }
      .menu-node .label { font-size: 11px; }
      .menu-hub { width: 130px; height: 130px; margin-left: -65px; margin-top: -65px; }
      .portal-shell { transform: scale(.86); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="camera" class="camera">
      <div class="wall-plane">
        <div id="brickField" class="brick-field"></div>
        <div class="mortar-shadow"></div>

        <div id="portalShell" class="portal-shell">
          <div class="depth-ring" style="--w:840px;--h:700px;--z:-40px;"></div>
          <div class="depth-ring inner" style="--w:720px;--h:590px;--z:-220px;"></div>
          <div class="depth-ring inner" style="--w:600px;--h:490px;--z:-410px;"></div>
          <div class="depth-ring inner" style="--w:480px;--h:390px;--z:-590px;"></div>
          <div class="mist"></div>
          <div class="portal-core"></div>
          <div class="portal-swirl"></div>
          <div class="portal-swirl-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="ui">
    <div class="title">
      <div class="eyebrow">Offline 3D Portal Wall</div>
      <h1>Break Through the Wall</h1>
      <p>Category wheel, item wheel, and info card centered deep inside the opening.</p>
    </div>

    <div class="hint">This version is fully self-contained with no external libraries, so it should not render as a blank page offline.</div>

    <div id="menuLayer" class="menu-layer"></div>
    <div id="controls" class="controls"></div>
  </div>

  <script>
    const DATA = {
      categories: [
        {
          id: "services",
          label: "Services",
          icon: "🛠",
          glow: "rgba(255,196,119,.34)",
          items: [
            { id: "web-design", label: "Web Design", icon: "🎨", title: "Web Design", description: "Custom layouts, visual systems, and responsive user experiences tailored to your brand." },
            { id: "seo", label: "SEO", icon: "🔎", title: "Search Optimization", description: "On-page strategy, technical improvements, and content structure designed to increase discoverability." },
            { id: "branding", label: "Branding", icon: "✨", title: "Brand Systems", description: "Identity development, messaging alignment, and brand consistency across digital touchpoints." },
            { id: "hosting", label: "Hosting", icon: "🌐", title: "Hosting & Support", description: "Reliable infrastructure, maintenance, monitoring, and long-term site support." }
          ]
        },
        {
          id: "industries",
          label: "Industries",
          icon: "🏗",
          glow: "rgba(146,214,255,.34)",
          items: [
            { id: "construction", label: "Construction", icon: "🏗", title: "Construction", description: "Portfolio-ready presentation for projects, service lines, and trust-building proof points." },
            { id: "medical", label: "Medical", icon: "⚕", title: "Medical", description: "Clear, compliant, patient-friendly information structures with strong calls to action." },
            { id: "legal", label: "Legal", icon: "⚖", title: "Legal", description: "Professional layouts for practice areas, attorney bios, and streamlined lead intake." },
            { id: "retail", label: "Retail", icon: "🛍", title: "Retail", description: "Visual merchandising online with category-led pathways and persuasive product storytelling." }
          ]
        },
        {
          id: "materials",
          label: "Materials",
          icon: "🧱",
          glow: "rgba(255,177,177,.34)",
          items: [
            { id: "brick", label: "Brick", icon: "🧱", title: "Brick Texture", description: "Classic, rugged masonry styling with layered shadows and weathered detail." },
            { id: "stone", label: "Stone", icon: "🪨", title: "Stone Texture", description: "Heavy, carved surfaces with organic edges for a monumental feel." },
            { id: "metal", label: "Metal", icon: "⚙", title: "Metal Texture", description: "Industrial finishes with brushed highlights and cool reflective accents." },
            { id: "glass", label: "Glass", icon: "🔷", title: "Glass Texture", description: "Clean translucent panels with polished light behavior and modern contrast." }
          ]
        }
      ]
    };

    const state = {
      categoryId: null,
      itemId: null,
      mouseX: 0,
      mouseY: 0
    };

    const brickField = document.getElementById("brickField");
    const portalShell = document.getElementById("portalShell");
    const cameraEl = document.getElementById("camera");
    const menuLayer = document.getElementById("menuLayer");
    const controls = document.getElementById("controls");

    function currentCategory() {
      return DATA.categories.find(c => c.id === state.categoryId) || null;
    }

    function currentItem() {
      const c = currentCategory();
      return c ? c.items.find(i => i.id === state.itemId) || null : null;
    }

    function rand(seed) {
      const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function buildBricks() {
      brickField.innerHTML = "";

      const wallW = 1800;
      const wallH = 1100;
      const brickW = 144;
      const brickH = 72;
      const gapX = 6;
      const gapY = 8;
      const holeRx = 360;
      const holeRy = 300;

      let rowIndex = 0;

      for (let y = 0; y < wallH + brickH; y += brickH + gapY) {
        const offset = rowIndex % 2 ? (brickW + gapX) / 2 : 0;

        for (let x = -offset; x < wallW + brickW; x += brickW + gapX) {
          const centerX = x + brickW / 2 - wallW / 2;
          const centerY = y + brickH / 2 - wallH / 2;
          const ellipse = Math.sqrt((centerX * centerX) / (holeRx * holeRx) + (centerY * centerY) / (holeRy * holeRy));
          if (ellipse < 1.06) continue;

          const brick = document.createElement("div");
          brick.className = "brick";

          const hue = 14 + Math.floor(rand(x * 0.02 + y * 0.03) * 8);
          const sat = 38 + Math.floor(rand(x * 0.03 + y * 0.01) * 16);
          const light = 27 + Math.floor(rand(x * 0.04 + y * 0.02) * 10);

          brick.style.setProperty("--b1", `hsl(${hue} ${sat}% ${light + 5}%)`);
          brick.style.setProperty("--b2", `hsl(${hue} ${sat}% ${light}%)`);
          brick.style.setProperty("--b3", `hsl(${hue} ${sat}% ${Math.max(14, light - 8)}%)`);

          const depth = 10 + rand(x * 0.05 + y * 0.06) * 12;
          const rotateX = (rand(x * 0.07 + y * 0.08) - 0.5) * 4;
          const rotateY = (rand(x * 0.09 + y * 0.1) - 0.5) * 5;
          const rotateZ = (rand(x * 0.11 + y * 0.12) - 0.5) * 3;

          brick.style.left = `${x}px`;
          brick.style.top = `${y}px`;
          brick.style.transform = `translateZ(${depth}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;

          const sideR = document.createElement("div");
          sideR.className = "brick-side right";
          const sideB = document.createElement("div");
          sideB.className = "brick-side bottom";
          brick.appendChild(sideR);
          brick.appendChild(sideB);

          brickField.appendChild(brick);
        }

        rowIndex++;
      }

      buildRimChunks();
    }

    function buildRimChunks() {
      const parts = [
        [12,18,74,34,-18,-70],[84,24,62,28,22,-120],[16,72,52,24,14,-90],[78,78,64,30,-24,-150],
        [7,50,56,26,-8,-110],[92,54,46,22,16,-130],[28,10,42,18,-28,-170],[60,87,38,18,18,-200],
        [22,28,26,18,-16,-240],[73,34,30,20,11,-260],[26,82,28,18,-12,-220],[83,70,34,18,24,-280]
      ];

      parts.forEach((p, idx) => {
        const el = document.createElement("div");
        el.className = "rim-chunk";
        el.style.setProperty("--x", p[0] + "%");
        el.style.setProperty("--y", p[1] + "%");
        el.style.setProperty("--w", p[2] + "px");
        el.style.setProperty("--h", p[3] + "px");
        el.style.setProperty("--r", p[4] + "deg");
        el.style.setProperty("--z", p[5] + "px");
        el.style.setProperty("--d", (4.8 + idx * 0.28) + "s");
        el.style.setProperty("--delay", (idx * 0.14) + "s");
        portalShell.appendChild(el);
      });
    }

    function clearMenu() {
      menuLayer.innerHTML = "";
      controls.innerHTML = "";
    }

    function addAction(text, primary, onClick) {
      const btn = document.createElement("button");
      btn.className = "action" + (primary ? " primary" : "");
      btn.textContent = text;
      btn.addEventListener("click", onClick);
      controls.appendChild(btn);
    }

    function polar(angle, radius) {
      return {
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius * 0.82
      };
    }

    function renderWheel(entries, centerLabel, subLabel, glowSource) {
      const ring = document.createElement("div");
      ring.className = "menu-ring";
      menuLayer.appendChild(ring);

      const hub = document.createElement("div");
      hub.className = "menu-hub";
      hub.innerHTML = `<div class="big">${centerLabel}</div><div class="small">${subLabel}</div>`;
      menuLayer.appendChild(hub);

      const radius = Math.min(menuLayer.clientWidth, menuLayer.clientHeight) * 0.33;

      entries.forEach((entry, index) => {
        const angle = (index / entries.length) * Math.PI * 2 - Math.PI / 2;
        const pos = polar(angle, radius);
        const node = document.createElement("div");
        node.className = "menu-node";
        node.style.left = `calc(50% + ${pos.x}px)`;
        node.style.top = `calc(50% + ${pos.y}px)`;
        node.style.setProperty("--ga", (glowSource?.glow || entry.glow || "rgba(255,196,119,.34)"));

        node.innerHTML = `<div class="icon">${entry.icon || "✦"}</div><div class="label">${entry.label}</div>`;

        node.addEventListener("click", () => {
          if (!glowSource) {
            state.categoryId = entry.id;
            state.itemId = null;
          } else {
            state.itemId = entry.id;
          }
          renderUI();
        });

        menuLayer.appendChild(node);
      });
    }

    function renderCard(item) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="bar"></div>
        <div class="body">
          <div class="pill">Selected Item</div>
          <h2>${item.title}</h2>
          <p>${item.description}</p>
        </div>
      `;
      menuLayer.appendChild(card);
    }

    function renderUI() {
      clearMenu();
      const cat = currentCategory();
      const item = currentItem();

      if (!cat) {
        renderWheel(DATA.categories, "Categories", "Choose a Path", null);
        return;
      }

      if (!item) {
        renderWheel(cat.items, cat.label, "Choose an Item", cat);
        addAction("Back to Categories", true, () => {
          state.categoryId = null;
          state.itemId = null;
          renderUI();
        });
        return;
      }

      renderCard(item);
      addAction("Back to " + cat.label, true, () => {
        state.itemId = null;
        renderUI();
      });
      addAction("All Categories", false, () => {
        state.categoryId = null;
        state.itemId = null;
        renderUI();
      });
    }

    function updateCameraTilt() {
      const x = state.mouseX * 7;
      const y = state.mouseY * 5;
      cameraEl.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
      const depthScale = 1 + state.mouseY * 0.04;
      menuLayer.style.transform = `translate(-50%, -50%) scale(${depthScale})`;
    }

    window.addEventListener("mousemove", (e) => {
      state.mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      state.mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      updateCameraTilt();
    });

    window.addEventListener("resize", renderUI);

    buildBricks();
    renderUI();
    updateCameraTilt();
  </script>
</body>
</html>
