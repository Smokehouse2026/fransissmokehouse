<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu — The Francis Smokehouse</title>
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="theme-color" content="#0a0604">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#0a0604;--deep:#120a04;--coal:#1a0e06;
  --ember:#c04a00;--fire:#e06510;--flame:#f08c28;--glow:#f5b040;--white:#faf3e8;
  --smoke:rgba(180,140,100,.06);
  --display:'Playfair Display',Georgia,serif;
  --sans:'Outfit',sans-serif;
  --mono:'DM Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--white)}

/* ═══════ SCENE ═══════ */
#scene{position:fixed;inset:0;display:flex;flex-direction:column}

/* Ember/smoke canvas */
#cv{position:absolute;inset:0;z-index:0}

/* ═══════ TOP BAR ═══════ */
#hdr{
  position:relative;z-index:20;flex-shrink:0;
  display:flex;align-items:center;
  padding:clamp(10px,1.5vh,18px) clamp(14px,2.5vw,28px);
  background:linear-gradient(180deg,rgba(10,6,4,.95) 0%,rgba(10,6,4,.4) 70%,transparent 100%);
}
.h-back{
  font-family:var(--mono);font-weight:400;font-size:10px;
  letter-spacing:.15em;color:rgba(250,243,232,.2);
  text-decoration:none;transition:color .3s;
}
.h-back:hover{color:var(--flame)}
.h-center{
  flex:1;text-align:center;
}
.h-name{
  font-family:var(--display);font-weight:900;
  font-size:clamp(16px,2.5vw,28px);color:var(--white);
  letter-spacing:.02em;
}
.h-name span{
  background:linear-gradient(135deg,var(--flame),var(--glow));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.h-tag{
  font-family:var(--mono);font-weight:300;font-size:clamp(8px,.8vw,10px);
  letter-spacing:.3em;text-transform:uppercase;color:rgba(250,243,232,.15);margin-top:2px;
}
.h-info{
  font-family:var(--mono);font-weight:400;font-size:clamp(8px,.8vw,10px);
  color:rgba(250,243,232,.15);text-align:right;line-height:1.5;letter-spacing:.04em;
}

/* ═══════ CATEGORY BAR — bottom of screen like fire pit coals ═══════ */
#catbar{
  position:relative;z-index:20;flex-shrink:0;
  display:flex;align-items:stretch;
  background:linear-gradient(0deg,rgba(10,6,4,.97) 0%,rgba(10,6,4,.6) 60%,transparent 100%);
  padding:0 clamp(8px,1.5vw,16px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.cb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:clamp(10px,1.4vh,16px) clamp(4px,.8vw,10px);
  background:none;border:none;cursor:pointer;position:relative;
  transition:all .3s;color:rgba(250,243,232,.25);
}
.cb::before{
  content:'';position:absolute;top:0;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg,transparent,var(--ember),transparent);
  transform:scaleX(0);transition:transform .4s var(--ease);border-radius:1px;
}
.cb.on::before{transform:scaleX(1)}
.cb.on{color:var(--glow)}
.cb:hover{color:rgba(250,243,232,.5)}
.cb-icon{font-size:clamp(18px,2.4vw,26px);line-height:1;transition:transform .3s,filter .3s}
.cb.on .cb-icon{transform:scale(1.15);filter:drop-shadow(0 0 8px rgba(240,140,40,.5))}
.cb-label{
  font-family:var(--sans);font-weight:600;
  font-size:clamp(7px,.75vw,10px);letter-spacing:.1em;
  text-transform:uppercase;transition:color .3s;line-height:1.2;text-align:center;
}
/* Ember glow under active tab */
.cb.on::after{
  content:'';position:absolute;bottom:-4px;left:20%;right:20%;height:12px;
  background:radial-gradient(ellipse,rgba(240,140,40,.3),transparent);
  filter:blur(6px);pointer-events:none;
}

/* ═══════ STAGE — where cards live ═══════ */
#stage{
  position:relative;z-index:10;flex:1;min-height:0;
  display:flex;flex-direction:column;overflow:hidden;
  padding:0 clamp(12px,2vw,24px);
}

/* Section header */
#sec{
  flex-shrink:0;
  display:flex;align-items:baseline;gap:clamp(8px,1.2vw,16px);
  padding:clamp(6px,1vh,12px) 0;
  opacity:0;transform:translateY(-12px);
  transition:opacity .5s,transform .5s var(--ease);
}
#sec.in{opacity:1;transform:translateY(0)}
#sec-title{
  font-family:var(--display);font-weight:900;
  font-size:clamp(24px,4vw,48px);letter-spacing:-.01em;
  line-height:1;
  background:linear-gradient(135deg,var(--white) 0%,rgba(250,243,232,.6) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
#sec-sub{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:clamp(12px,1.3vw,17px);color:rgba(250,243,232,.2);
}
#sec-count{
  font-family:var(--mono);font-weight:300;font-size:10px;
  color:rgba(250,243,232,.12);letter-spacing:.15em;margin-left:auto;
}

/* ═══════ CARD GRID ═══════ */
#grid-wrap{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding-bottom:clamp(8px,1.5vh,14px);
  scrollbar-width:thin;scrollbar-color:rgba(240,140,40,.12) transparent;
  mask-image:linear-gradient(180deg,black 85%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,black 85%,transparent 100%);
}
#grid-wrap::-webkit-scrollbar{width:3px}
#grid-wrap::-webkit-scrollbar-thumb{background:rgba(240,140,40,.12);border-radius:2px}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(150px,17vw,220px),1fr));
  gap:clamp(10px,1.3vw,16px);
  padding-top:clamp(4px,.6vh,8px);
}

/* ═══════ CARD — rises from embers ═══════ */
.card{
  position:relative;border-radius:10px;overflow:hidden;
  cursor:pointer;
  background:rgba(18,14,8,.8);
  border:1px solid rgba(240,140,40,.06);
  transition:transform .5s var(--ease),box-shadow .5s;
  /* Rise animation */
  opacity:0;
  transform:translateY(40px) scale(.92);
  animation:rise .6s var(--ease) forwards;
}
.card:hover{
  transform:translateY(-6px) scale(1.02) !important;
  box-shadow:
    0 16px 40px rgba(0,0,0,.6),
    0 0 30px rgba(192,74,0,.12),
    0 0 60px rgba(240,140,40,.06);
  border-color:rgba(240,140,40,.15);
  z-index:5;
}
@keyframes rise{
  0%{opacity:0;transform:translateY(40px) scale(.92)}
  60%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
/* Fall animation for exit */
.card.fall{
  animation:fall .4s ease-in forwards;
}
@keyframes fall{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(30px) scale(.9)}
}

/* Image */
.c-iw{position:relative;overflow:hidden}
.c-img{
  width:100%;aspect-ratio:3/2;object-fit:cover;display:block;
  filter:brightness(.7) contrast(1.1) saturate(1.15);
  transition:filter .5s,transform .7s var(--ease);
  background:var(--coal);
}
.card:hover .c-img{
  filter:brightness(.85) contrast(1.12) saturate(1.2);
  transform:scale(1.08);
}
/* Warm light bleed from behind image */
.c-iw::before{
  content:'';position:absolute;inset:-2px;z-index:-1;
  background:radial-gradient(ellipse at 50% 100%,rgba(192,74,0,.15),transparent 70%);
  opacity:0;transition:opacity .5s;
}
.card:hover .c-iw::before{opacity:1}
/* Bottom gradient */
.c-iw::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(10,6,4,.95) 0%,rgba(10,6,4,.5) 30%,transparent 60%);
  pointer-events:none;
}
/* Placeholder */
.c-ph{
  width:100%;aspect-ratio:3/2;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--coal) 0%,var(--deep) 100%);
  font-size:clamp(28px,3.5vw,40px);opacity:.25;
}

/* Card body */
.c-body{
  padding:clamp(8px,1vw,14px) clamp(10px,1.2vw,14px);
  display:flex;flex-direction:column;gap:3px;
}
.c-name{
  font-family:var(--sans);font-weight:700;
  font-size:clamp(12px,1.15vw,15px);letter-spacing:.03em;
  color:var(--white);line-height:1.25;
}
.c-note{
  font-family:var(--display);font-style:italic;
  font-size:clamp(10px,.9vw,12px);color:rgba(250,243,232,.2);
}
.c-price{
  font-family:var(--sans);font-weight:800;
  font-size:clamp(16px,1.7vw,22px);letter-spacing:-.01em;
  background:linear-gradient(135deg,var(--flame),var(--glow));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(240,140,40,.2));
}
.c-sm{
  font-weight:400;font-size:.55em;
  -webkit-text-fill-color:rgba(250,243,232,.25);
}

/* ═══════ SPECIAL CARD ═══════ */
.sp{
  grid-column:1/-1;
  display:flex;align-items:center;gap:clamp(12px,1.8vw,20px);
  padding:clamp(12px,1.5vh,18px) clamp(14px,1.8vw,20px);
  border-radius:10px;
  background:linear-gradient(135deg,rgba(192,74,0,.1),rgba(240,140,40,.04));
  border:1px solid rgba(240,140,40,.15);
  animation:rise .6s var(--ease) forwards,spPulse 4s 1s ease-in-out infinite;
  opacity:0;
}
@keyframes spPulse{
  0%,100%{box-shadow:0 0 20px rgba(240,140,40,.06),inset 0 0 20px rgba(240,140,40,.02)}
  50%{box-shadow:0 0 40px rgba(240,140,40,.12),inset 0 0 30px rgba(240,140,40,.04)}
}
.sp-img{
  width:clamp(60px,8vw,100px);aspect-ratio:1;border-radius:8px;
  object-fit:cover;flex-shrink:0;
  border:1px solid rgba(240,140,40,.15);
  filter:brightness(.85) saturate(1.15);
}
.sp-body{flex:1;min-width:0}
.sp-tag{
  font-family:var(--mono);font-weight:500;font-size:clamp(8px,.75vw,10px);
  letter-spacing:.2em;text-transform:uppercase;color:var(--flame);
}
.sp-name{
  font-family:var(--display);font-weight:900;
  font-size:clamp(18px,2.5vw,28px);color:var(--white);
  line-height:1.1;margin-top:2px;
}
.sp-desc{
  font-family:var(--display);font-style:italic;
  font-size:clamp(11px,1.1vw,14px);color:rgba(250,243,232,.25);
  margin-top:3px;
}
.sp-price{
  font-family:var(--sans);font-weight:900;
  font-size:clamp(26px,3.5vw,38px);
  background:linear-gradient(135deg,var(--flame),var(--glow));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  flex-shrink:0;
  filter:drop-shadow(0 0 12px rgba(240,140,40,.25));
}

/* ═══════ LIGHTBOX ═══════ */
#lb{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,6,4,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .35s;
  padding:clamp(16px,3vw,40px);
}
#lb.on{opacity:1;pointer-events:all}
#lbc{
  max-width:500px;width:100%;border-radius:14px;overflow:hidden;
  background:rgba(18,14,8,.95);
  border:1px solid rgba(240,140,40,.1);
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(192,74,0,.1);
  transform:scale(.85) translateY(30px);
  transition:transform .5s var(--ease);
}
#lb.on #lbc{transform:scale(1) translateY(0)}
#lb-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:brightness(.85) contrast(1.08) saturate(1.12)}
#lb-b{padding:clamp(18px,3vw,28px)}
#lb-n{font-family:var(--sans);font-weight:800;font-size:clamp(22px,3.5vw,30px);color:var(--white);letter-spacing:.01em}
#lb-nt{font-family:var(--display);font-style:italic;font-size:14px;color:rgba(250,243,232,.25);margin-top:4px}
#lb-p{
  font-family:var(--sans);font-weight:900;font-size:clamp(28px,4.5vw,40px);margin-top:12px;
  background:linear-gradient(135deg,var(--flame),var(--glow));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(240,140,40,.25));
}
#lb-x{
  position:absolute;top:clamp(12px,2vh,20px);right:clamp(12px,2vw,20px);
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:rgba(250,243,232,.3);
  background:rgba(10,6,4,.6);border:1px solid rgba(250,243,232,.08);
  cursor:pointer;transition:all .3s;z-index:510;
  backdrop-filter:blur(8px);
}
#lb-x:hover{color:var(--flame);border-color:rgba(240,140,40,.3);background:rgba(192,74,0,.15)}

/* ═══════ MOBILE ═══════ */
@media(max-width:600px){
  .cb{padding:8px 4px}
  .cb-label{font-size:7px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .sp{flex-direction:column;text-align:center}
  #sec-sub{display:none}
}
</style>
</head>
<body>
<div id="scene">
  <canvas id="cv"></canvas>

  <div id="hdr">
    <a class="h-back" href="index.html">← HOME</a>
    <div class="h-center">
      <div class="h-name">THE FRANCIS <span>SMOKEHOUSE</span></div>
      <div class="h-tag">Specialty Meats · St. Francisville, LA</div>
    </div>
    <div class="h-info" id="h-info"></div>
  </div>

  <div id="stage">
    <div id="sec">
      <span id="sec-title"></span>
      <span id="sec-sub"></span>
      <span id="sec-count"></span>
    </div>
    <div id="grid-wrap"><div id="grid"></div></div>
  </div>

  <div id="catbar"></div>
</div>

<div id="lb" onclick="xLB(event)">
  <button id="lb-x" onclick="xLB(event)">✕</button>
  <div id="lbc"><img id="lb-img" src="" alt=""><div id="lb-b"><div id="lb-n"></div><div id="lb-nt"></div><div id="lb-p"></div></div></div>
</div>

<script src="site-data.js"></script>
<script>
/* ═══════ WAIT FOR DATA ═══════ */
function bootWhenReady(){if(typeof MENU==='undefined'){setTimeout(bootWhenReady,50);return}boot()}
window.addEventListener('load',bootWhenReady);

function boot(){
var $=function(id){return document.getElementById(id)};
var fmt=function(n){if(n==null)return'Ask';return n===0?'—':'$'+n.toFixed(2)};
var CATS=['bbq_plates','burgers_sandwiches','fried_chicken','salads','sides','combos','by_the_pound','desserts'];
var active=null;

/* ═══════ CANVAS — ember glow + smoke ═══════ */
var cv=$('cv'),cx=cv.getContext('2d'),W,H;
function rsz(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;
}
rsz();addEventListener('resize',rsz);

/* Embers */
function mkE(){return{x:.05+Math.random()*.9,y:.95+Math.random()*.08,vx:(Math.random()-.5)*.001,vy:-.002-Math.random()*.005,r:.3+Math.random()*1.4,life:1,decay:.002+Math.random()*.004,h:8+Math.random()*25,tw:(Math.random()-.5)*.0006}}
var EM=[];for(var i=0;i<20;i++)EM.push(mkE());

/* Ambient glow pulse */
var glowPhase=0;

(function render(){
  cx.clearRect(0,0,W,H);
  glowPhase+=.008;

  /* Bottom ember glow */
  var p=.5+.5*Math.sin(glowPhase);
  var g=cx.createRadialGradient(W*.5,H*1.05,0,W*.5,H*1.05,H*.7);
  g.addColorStop(0,'rgba(192,74,0,'+(0.08+p*.04)+')');
  g.addColorStop(.3,'rgba(140,40,0,'+(0.04+p*.02)+')');
  g.addColorStop(.6,'rgba(80,20,0,.02)');
  g.addColorStop(1,'transparent');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);

  /* Side warm vignettes */
  var g2=cx.createRadialGradient(0,H*.6,0,0,H*.6,W*.4);
  g2.addColorStop(0,'rgba(120,50,0,.03)');g2.addColorStop(1,'transparent');
  cx.fillStyle=g2;cx.fillRect(0,0,W,H);
  var g3=cx.createRadialGradient(W,H*.4,0,W,H*.4,W*.4);
  g3.addColorStop(0,'rgba(120,50,0,.02)');g3.addColorStop(1,'transparent');
  cx.fillStyle=g3;cx.fillRect(0,0,W,H);

  /* Ember particles */
  for(var i=0;i<EM.length;i++){
    var e=EM[i];
    e.x+=e.vx+e.tw+Math.sin(glowPhase+i)*.0002;
    e.y+=e.vy;
    e.life-=e.decay;
    if(e.life<=0||e.y<-.05){EM[i]=mkE();continue}
    cx.beginPath();cx.arc(e.x*W,e.y*H,e.r,0,Math.PI*2);
    var bright=50+e.life*40;
    cx.fillStyle='hsla('+e.h+',100%,'+bright+'%,'+e.life*.7+')';
    cx.shadowBlur=8+e.life*6;
    cx.shadowColor='hsla('+e.h+',100%,55%,'+e.life*.4+')';
    cx.fill();
    cx.shadowBlur=0;
  }

  requestAnimationFrame(render);
})();

/* ═══════ INFO ═══════ */
if(typeof SITE_INFO!=='undefined'){
  $('h-info').innerHTML=SITE_INFO.phone+'<br>'+SITE_INFO.hours.weekday;
}

/* ═══════ CATEGORY BAR ═══════ */
var catbar=$('catbar');
CATS.forEach(function(k){
  var s=MENU[k];if(!s)return;
  var b=document.createElement('button');
  b.className='cb';b.dataset.k=k;
  b.innerHTML='<span class="cb-icon">'+s.icon+'</span><span class="cb-label">'+s.title+'</span>';
  b.onclick=function(){go(k)};
  catbar.appendChild(b);
});

/* Special */
function getSP(){
  if(typeof SITE_SPECIAL==='undefined'||!SITE_SPECIAL||SITE_SPECIAL.hidden)return null;
  function ts(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  if(SITE_SPECIAL.date&&SITE_SPECIAL.date!==ts())return null;
  return SITE_SPECIAL;
}

/* ═══════ SWITCH CATEGORY ═══════ */
function go(k){
  if(active===k)return;
  var s=MENU[k];if(!s)return;

  /* Animate old cards falling */
  var oldCards=document.querySelectorAll('.card,.sp');
  var hasPrev=oldCards.length>0;

  if(hasPrev){
    oldCards.forEach(function(c,i){
      c.style.animationDelay=i*0.02+'s';
      c.classList.add('fall');
    });
  }

  var delay=hasPrev?300:0;
  setTimeout(function(){buildSection(k,s)},delay);
  active=k;

  /* Nav state */
  document.querySelectorAll('.cb').forEach(function(b){
    b.classList.toggle('on',b.dataset.k===k);
  });
}

function buildSection(k,s){
  /* Header */
  var sec=$('sec');
  sec.classList.remove('in');
  setTimeout(function(){
    $('sec-title').textContent=s.title;
    $('sec-sub').textContent=s.subtitle||'';
    $('sec-count').textContent=s.items.length+' items';
    sec.classList.add('in');
  },50);

  /* Cards */
  var grid=$('grid');
  var h='';

  /* Special on first cat */
  if(k===CATS[0]){
    var sp=getSP();
    if(sp){
      h+='<div class="sp" style="animation-delay:.05s">';
      if(sp.image)h+='<img class="sp-img" src="'+sp.image+'" alt="'+sp.name+'" onerror="this.style.display=\'none\'">';
      h+='<div class="sp-body"><div class="sp-tag">🔥 '+(sp.type||"Today's Special")+'</div>';
      h+='<div class="sp-name">'+sp.name+'</div>';
      if(sp.desc)h+='<div class="sp-desc">'+sp.desc+'</div>';
      h+='</div>';
      if(sp.price)h+='<div class="sp-price">'+sp.price+'</div>';
      h+='</div>';
    }
  }

  s.items.forEach(function(item,i){
    var d=(0.08+i*0.06).toFixed(2);
    h+='<div class="card" style="animation-delay:'+d+'s" onclick="oLB(\''+k+'\','+i+')" onmousemove="tilt(event,this)" onmouseleave="untilt(this)">';
    if(item.img){
      h+='<div class="c-iw"><img class="c-img" src="'+item.img+'" alt="'+item.name+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=c-ph>'+s.icon+'</div>\'"></div>';
    } else {
      h+='<div class="c-iw"><div class="c-ph">'+s.icon+'</div></div>';
    }
    h+='<div class="c-body"><div class="c-name">'+item.name+'</div>';
    if(item.note)h+='<div class="c-note">'+item.note+'</div>';
    if(item.priceLg){
      h+='<div class="c-price">'+fmt(item.price)+' <span class="c-sm">sm</span> · '+fmt(item.priceLg)+' <span class="c-sm">lg</span></div>';
    } else {
      h+='<div class="c-price">'+fmt(item.price)+'</div>';
    }
    h+='</div></div>';
  });

  grid.innerHTML=h;
  $('grid-wrap').scrollTop=0;
}

/* ═══════ 3D TILT ON HOVER ═══════ */
window.tilt=function(e,el){
  var r=el.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width-.5;
  var y=(e.clientY-r.top)/r.height-.5;
  el.style.transform='translateY(-6px) scale(1.02) perspective(600px) rotateY('+x*8+'deg) rotateX('+(-y*6)+'deg)';
};
window.untilt=function(el){
  el.style.transform='';
};

/* ═══════ LIGHTBOX ═══════ */
window.oLB=function(k,i){
  var s=MENU[k],item=s.items[i];if(!item)return;
  $('lb-img').src=item.img||'';$('lb-img').alt=item.name;
  $('lb-img').onerror=function(){this.style.display='none'};
  $('lb-img').style.display='';
  $('lb-n').textContent=item.name;
  $('lb-nt').textContent=item.note||s.subtitle||'';
  if(item.priceLg) $('lb-p').innerHTML=fmt(item.price)+' <span style="font-size:.45em;-webkit-text-fill-color:rgba(250,243,232,.2)">sm</span> · '+fmt(item.priceLg)+' <span style="font-size:.45em;-webkit-text-fill-color:rgba(250,243,232,.2)">lg</span>';
  else $('lb-p').textContent=fmt(item.price);
  $('lb').classList.add('on');
};
window.xLB=function(e){if(e&&e.target.id!=='lb'&&e.target.id!=='lb-x')return;$('lb').classList.remove('on')};

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')$('lb').classList.remove('on');
  var idx=CATS.indexOf(active);
  if(e.key==='ArrowRight'&&idx<CATS.length-1)go(CATS[idx+1]);
  if(e.key==='ArrowLeft'&&idx>0)go(CATS[idx-1]);
});

/* ═══════ INIT ═══════ */
go(CATS[0]);
} /* end boot */
</script>
