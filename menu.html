<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Wall Navigation</title>
  <style>
    :root{
      --mortar:#9b8778;
      --brick-a:#8a4d34;
      --brick-b:#6d3826;
      --brick-c:#552919;
      --void:#05070b;
      --warm:#ffb56b;
      --warm2:#ff7a2f;
      --ui:#d7e3f2;
      --panel:rgba(10,14,20,.72);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      color:white;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,166,92,.08), transparent 20%),
        linear-gradient(180deg, #28160f 0%, #120c09 100%);
    }

    .scene{
      position:relative;
      width:100vw;
      height:100vh;
      perspective:1600px;
      overflow:hidden;
      isolation:isolate;
    }

    .wall{
      position:absolute;
      inset:-4vh -4vw;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,170,90,.06), transparent 22%),
        linear-gradient(0deg, rgba(0,0,0,.38), rgba(0,0,0,.14));
      filter:saturate(.95) contrast(1.05);
    }

    .brick-layer{
      position:absolute;
      inset:0;
      background:
        linear-gradient(var(--mortar) 0 7px, transparent 7px 88px) 0 0/100% 88px,
        linear-gradient(90deg, var(--mortar) 0 7px, transparent 7px 142px) 0 0/142px 88px,
        linear-gradient(90deg, transparent 0 71px, var(--mortar) 71px 78px, transparent 78px 213px) 0 44px/213px 88px,
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.14)),
        linear-gradient(135deg, var(--brick-a), var(--brick-b) 52%, var(--brick-c));
      box-shadow:
        inset 0 35px 50px rgba(255,255,255,.04),
        inset 0 -80px 120px rgba(0,0,0,.34);
    }
    .brick-layer:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.06), transparent 18%),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,.05), transparent 16%),
        radial-gradient(circle at 40% 70%, rgba(0,0,0,.18), transparent 22%),
        repeating-linear-gradient(25deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px);
      mix-blend-mode:overlay;
      opacity:.65;
      pointer-events:none;
    }

    .portal-wrap{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      transform-style:preserve-3d;
    }

    .opening{
      position:relative;
      width:min(78vw,1120px);
      height:min(72vh,760px);
      transform-style:preserve-3d;
      filter:drop-shadow(0 70px 80px rgba(0,0,0,.8));
    }

    .depth{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      transform-style:preserve-3d;
    }

    .tunnel{
      position:absolute;
      border-radius:46% 54% 50% 50% / 43% 44% 56% 57%;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,160,70,.06), transparent 35%),
        radial-gradient(circle at 50% 50%, #0b1018 0%, #060a10 48%, #020408 76%, #000 100%);
      box-shadow:
        inset 0 0 120px rgba(0,0,0,.9),
        inset 0 0 50px rgba(255,145,60,.04),
        0 0 80px rgba(0,0,0,.7);
    }

    .tunnel.back{
      width:38%;
      height:38%;
      transform:translateZ(-680px);
      filter:blur(1px);
    }
    .tunnel.mid{
      width:56%;
      height:56%;
      transform:translateZ(-420px);
    }
    .tunnel.front{
      width:78%;
      height:78%;
      transform:translateZ(-180px);
    }

    .portal-glow{
      position:absolute;
      width:62%;
      height:62%;
      border-radius:50%;
      transform:translateZ(-460px);
      background:
        radial-gradient(circle,
          rgba(255,214,155,.9) 0%,
          rgba(255,170,80,.5) 8%,
          rgba(104,156,255,.16) 18%,
          rgba(50,110,255,.06) 28%,
          rgba(0,0,0,0) 44%);
      filter:blur(18px) saturate(1.2);
      opacity:.95;
      mix-blend-mode:screen;
      animation:pulse 4.8s ease-in-out infinite;
    }

    .portal-swirl{
      position:absolute;
      width:48%;
      height:48%;
      border-radius:50%;
      transform:translateZ(-520px);
      background:
        conic-gradient(from 0deg,
          rgba(255,183,92,.0),
          rgba(255,183,92,.42),
          rgba(128,168,255,.18),
          rgba(255,183,92,.0),
          rgba(255,183,92,.3),
          rgba(128,168,255,.1),
          rgba(255,183,92,.0));
      filter:blur(14px);
      animation:spin 12s linear infinite;
      opacity:.8;
    }

    .mist{
      position:absolute;
      inset:18% 18%;
      transform:translateZ(-300px);
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 50%, rgba(255,255,255,.06), transparent 18%),
        radial-gradient(circle at 60% 42%, rgba(119,167,255,.08), transparent 22%),
        radial-gradient(circle at 50% 65%, rgba(255,186,120,.08), transparent 20%);
      filter:blur(18px);
      animation:mist 8s ease-in-out infinite alternate;
    }

    .rim{
      position:absolute;
      inset:0;
      pointer-events:none;
      transform-style:preserve-3d;
    }
    .rim:before{
      content:"";
      position:absolute;
      inset:8% 10%;
      border-radius:48% 52% 50% 50% / 42% 43% 57% 58%;
      box-shadow:
        0 0 0 10px rgba(47,22,14,.84),
        0 0 0 22px rgba(70,34,20,.74),
        0 18px 34px rgba(0,0,0,.5),
        inset 0 8px 18px rgba(255,205,155,.07),
        inset 0 -20px 26px rgba(0,0,0,.42);
      background:
        radial-gradient(circle at 50% 46%, rgba(0,0,0,0) 57%, rgba(0,0,0,.28) 64%, rgba(255,176,92,.03) 70%, rgba(0,0,0,0) 74%);
      filter:blur(.3px);
    }

    .debris{
      position:absolute;
      inset:0;
      pointer-events:none;
      transform-style:preserve-3d;
    }
    .chunk{
      position:absolute;
      background:
        linear-gradient(155deg, #996249, #74412c 60%, #552b1b);
      border:1px solid rgba(28,11,5,.6);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 12px 18px rgba(0,0,0,.34);
      border-radius:4px;
      transform-style:preserve-3d;
    }
    .chunk:before{
      content:"";
      position:absolute;
      inset:2px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.14), transparent 48%, rgba(255,255,255,.08) 100%);
      opacity:.55;
      border-radius:2px;
    }

    .menu-stage{
      position:absolute;
      left:50%;
      top:50%;
      width:min(520px,72vw);
      height:min(520px,72vw);
      transform-style:preserve-3d;
      transform:translate3d(-50%,-50%,-380px);
      display:grid;
      place-items:center;
    }

    .wheel-shell{
      position:absolute;
      width:min(360px,58vw);
      height:min(360px,58vw);
      border-radius:50%;
      border:1px solid rgba(219,233,255,.16);
      background:
        radial-gradient(circle at 50% 48%, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:
        0 0 60px rgba(80,120,255,.08),
        inset 0 0 24px rgba(255,255,255,.03);
      backdrop-filter:blur(8px);
    }
    .wheel-shell:before,
    .wheel-shell:after{
      content:"";
      position:absolute;
      inset:18px;
      border:1px dashed rgba(255,255,255,.08);
      border-radius:50%;
    }
    .wheel-shell:after{
      inset:40px;
      border-style:solid;
      opacity:.45;
    }
    .wheel-shell.spin{
      animation:spin 36s linear infinite;
    }

    .node{
      position:absolute;
      width:94px;
      height:94px;
      margin:-47px 0 0 -47px;
      border-radius:50%;
      border:1px solid rgba(216,229,248,.18);
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.12), rgba(255,255,255,.04) 35%, rgba(12,18,28,.88) 100%);
      box-shadow:
        0 18px 35px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.12);
      color:#eef4ff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      text-align:center;
      padding:10px;
      cursor:pointer;
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      backdrop-filter:blur(6px);
    }
    .node:hover{
      transform:scale(1.08);
      box-shadow:
        0 24px 44px rgba(0,0,0,.5),
        0 0 22px rgba(120,160,255,.14);
      border-color:rgba(255,255,255,.28);
    }
    .node .icon{font-size:20px;line-height:1}
    .node .label{font-size:12px;font-weight:600;line-height:1.15}
    .node:after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:var(--glow, radial-gradient(circle, rgba(255,180,90,.2), rgba(0,0,0,0) 65%));
      opacity:0;
      transition:opacity .2s ease;
    }
    .node:hover:after{opacity:1}

    .hub{
      position:absolute;
      width:146px;
      height:146px;
      border-radius:50%;
      background:
        radial-gradient(circle at 40% 30%, rgba(255,255,255,.14), rgba(255,255,255,.04) 28%, rgba(5,10,18,.95) 90%);
      border:1px solid rgba(225,235,248,.18);
      box-shadow:
        0 0 40px rgba(255,195,120,.08),
        inset 0 0 18px rgba(255,255,255,.05);
      display:grid;
      place-items:center;
      text-align:center;
      padding:18px;
    }
    .hub .small{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.28em;
      color:rgba(220,232,248,.54);
      margin-top:6px;
    }
    .hub .big{
      font-size:14px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:#f3f7ff;
    }

    .card{
      width:min(470px,74vw);
      border:1px solid rgba(220,233,247,.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
        var(--panel);
      border-radius:28px;
      box-shadow:
        0 36px 60px rgba(0,0,0,.45),
        0 0 40px rgba(110,150,255,.08);
      overflow:hidden;
      backdrop-filter:blur(12px);
      animation:cardIn .26s ease;
    }
    .card-top{
      height:7px;
      background:linear-gradient(90deg, #fb923c, #fde68a, #60a5fa);
    }
    .card-body{padding:28px}
    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:rgba(230,238,248,.58);
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      margin-bottom:14px;
    }
    .card h2{
      margin:0 0 10px;
      font-size:clamp(28px,3.1vw,38px);
      line-height:1.02;
      letter-spacing:-.03em;
    }
    .card p{
      margin:0;
      color:rgba(230,238,248,.78);
      line-height:1.75;
      font-size:15px;
      white-space:pre-wrap;
    }

    .controls{
      position:absolute;
      left:50%;
      top:8%;
      transform:translateX(-50%) translateZ(-140px);
      display:flex;
      gap:10px;
      z-index:4;
      flex-wrap:wrap;
      justify-content:center;
    }
    .btn{
      border-radius:999px;
      padding:11px 16px;
      font-size:14px;
      font-weight:700;
      border:1px solid rgba(229,238,248,.15);
      cursor:pointer;
      transition:transform .2s ease, background .2s ease;
      backdrop-filter:blur(8px);
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.primary{
      background:rgba(248,250,252,.92);
      color:#111827;
      border-color:rgba(255,255,255,.4);
    }
    .btn.secondary{
      background:rgba(255,255,255,.05);
      color:#eef4ff;
    }

    @keyframes pulse{
      0%,100%{opacity:.8; transform:translateZ(-460px) scale(1)}
      50%{opacity:1; transform:translateZ(-460px) scale(1.08)}
    }
    @keyframes mist{
      from{transform:translateZ(-300px) translateX(-10px) translateY(4px)}
      to{transform:translateZ(-300px) translateX(12px) translateY(-6px)}
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cardIn{
      from{opacity:0; transform:scale(.92)}
      to{opacity:1; transform:scale(1)}
    }

    @media (max-width: 900px){
      .opening{width:min(92vw,1120px);height:min(76vh,760px)}
      .menu-stage{transform:translate3d(-50%,-50%,-320px)}
      .node{width:84px;height:84px;margin:-42px 0 0 -42px}
      .hub{width:128px;height:128px}
    }
    @media (max-width: 640px){
      .menu-stage{transform:translate3d(-50%,-50%,-260px)}
      .node{width:74px;height:74px;margin:-37px 0 0 -37px}
      .node .label{font-size:11px}
      .hub{width:112px;height:112px}
      .card{width:min(88vw,470px)}
      .controls{top:6%}
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="wall">
      <div class="brick-layer"></div>
    </div>

    <div class="portal-wrap">
      <div class="opening">
        <div class="depth">
          <div class="tunnel back"></div>
          <div class="portal-glow"></div>
          <div class="portal-swirl"></div>
          <div class="tunnel mid"></div>
          <div class="mist"></div>
          <div class="tunnel front"></div>
        </div>

        <div class="rim"></div>
        <div class="debris" id="debris"></div>
        <div class="controls" id="controls"></div>
        <div class="menu-stage" id="stage"></div>
      </div>
    </div>
  </div>

  <script>
    const DATA = {
      categories: [
        {
          id: "services",
          label: "Services",
          icon: "🛠",
          glow: "radial-gradient(circle, rgba(255,180,90,.28), rgba(0,0,0,0) 70%)",
          items: [
            { id: "web-design", label: "Web Design", icon: "🎨", title: "Web Design", description: "Custom layouts, visual systems, and responsive experiences tailored to your brand." },
            { id: "seo", label: "SEO", icon: "🔎", title: "Search Optimization", description: "On-page strategy, technical improvements, and content structure designed to increase discoverability." },
            { id: "branding", label: "Branding", icon: "✨", title: "Brand Systems", description: "Identity development, messaging alignment, and brand consistency across digital touchpoints." },
            { id: "hosting", label: "Hosting", icon: "🌐", title: "Hosting & Support", description: "Reliable infrastructure, maintenance, monitoring, and long-term support." }
          ]
        },
        {
          id: "industries",
          label: "Industries",
          icon: "🏗",
          glow: "radial-gradient(circle, rgba(90,170,255,.24), rgba(0,0,0,0) 70%)",
          items: [
            { id: "construction", label: "Construction", icon: "🏗", title: "Construction", description: "Portfolio-ready presentation for projects, service lines, and trust-building proof points." },
            { id: "medical", label: "Medical", icon: "⚕", title: "Medical", description: "Clear, compliant, patient-friendly information structures with strong calls to action." },
            { id: "legal", label: "Legal", icon: "⚖", title: "Legal", description: "Professional layouts for practice areas, attorney bios, and streamlined lead intake." },
            { id: "retail", label: "Retail", icon: "🛍", title: "Retail", description: "Visual merchandising with category-led pathways and persuasive product storytelling." }
          ]
        },
        {
          id: "materials",
          label: "Materials",
          icon: "🧱",
          glow: "radial-gradient(circle, rgba(255,120,120,.22), rgba(0,0,0,0) 70%)",
          items: [
            { id: "brick", label: "Brick", icon: "🧱", title: "Brick Texture", description: "Classic, rugged masonry styling with layered shadows and weathered detail." },
            { id: "stone", label: "Stone", icon: "🪨", title: "Stone Texture", description: "Heavy, carved surfaces with organic edges for a monumental feel." },
            { id: "metal", label: "Metal", icon: "⚙", title: "Metal Texture", description: "Industrial finishes with brushed highlights and cool reflective accents." },
            { id: "glass", label: "Glass", icon: "🔷", title: "Glass Texture", description: "Clean translucent panels with polished light behavior and modern contrast." }
          ]
        }
      ]
    };

    const state = { categoryId: null, itemId: null };

    function selectedCategory(){
      return DATA.categories.find(c => c.id === state.categoryId) || null;
    }
    function selectedItem(){
      const cat = selectedCategory();
      if(!cat) return null;
      return cat.items.find(i => i.id === state.itemId) || null;
    }

    function polar(angle, radius){
      const a = (angle - 90) * Math.PI / 180;
      return { x: Math.cos(a) * radius, y: Math.sin(a) * radius };
    }

    function makeDebris(){
      const debris = document.getElementById("debris");
      const parts = [
        [12,18,74,34,-18,-80],[86,24,62,28,22,-120],[14,74,52,24,14,-90],[78,78,64,30,-24,-150],
        [6,50,56,26,-8,-110],[90,54,46,22,16,-130],[30,10,42,18,-28,-170],[61,87,38,18,18,-200],
        [22,28,26,18,-16,-240],[73,34,30,20,11,-260],[26,82,28,18,-12,-220],[83,70,34,18,24,-280]
      ];
      parts.forEach((p, idx) => {
        const el = document.createElement("div");
        el.className = "chunk";
        el.style.left = p[0] + "%";
        el.style.top = p[1] + "%";
        el.style.width = p[2] + "px";
        el.style.height = p[3] + "px";
        el.style.transform = `translateZ(${p[5]}px) rotate(${p[4]}deg)`;
        el.animate(
          [
            { transform: `translateZ(${p[5]}px) translate(0px,0px) rotate(${p[4]}deg)` },
            { transform: `translateZ(${p[5]}px) translate(${(idx%2?8:-10)}px,${(idx%3? -10:7)}px) rotate(${p[4]+4}deg)` },
            { transform: `translateZ(${p[5]}px) translate(${(idx%2?-9:8)}px,${(idx%3? 8:-7)}px) rotate(${p[4]-5}deg)` },
            { transform: `translateZ(${p[5]}px) translate(0px,0px) rotate(${p[4]}deg)` }
          ],
          { duration: 4800 + idx*260, iterations: Infinity, easing: "ease-in-out" }
        );
        debris.appendChild(el);
      });
    }

    function button(text, type, onClick){
      const b = document.createElement("button");
      b.className = "btn " + type;
      b.textContent = text;
      b.onclick = onClick;
      return b;
    }

    function renderControls(){
      const controls = document.getElementById("controls");
      controls.innerHTML = "";
      const cat = selectedCategory();
      const item = selectedItem();

      if(cat && !item){
        controls.appendChild(button("Back to Categories", "primary", () => {
          state.categoryId = null;
          state.itemId = null;
          render();
        }));
      }
      if(cat && item){
        controls.appendChild(button("Back to " + cat.label, "primary", () => {
          state.itemId = null;
          render();
        }));
        controls.appendChild(button("All Categories", "secondary", () => {
          state.categoryId = null;
          state.itemId = null;
          render();
        }));
      }
    }

    function renderWheel(title, centerLabel, entries, onSelect){
      const stage = document.createElement("div");
      stage.style.position = "relative";
      stage.style.width = "100%";
      stage.style.height = "100%";

      const shell = document.createElement("div");
      shell.className = "wheel-shell spin";
      stage.appendChild(shell);

      const radius = window.innerWidth < 640 ? 130 : window.innerWidth < 900 ? 148 : 178;

      entries.forEach((entry, i) => {
        const pos = polar((360 / entries.length) * i, radius);
        const node = document.createElement("button");
        node.className = "node";
        node.style.left = `calc(50% + ${pos.x}px)`;
        node.style.top = `calc(50% + ${pos.y}px)`;
        node.style.setProperty("--glow", entry.glow || "radial-gradient(circle, rgba(255,180,90,.24), rgba(0,0,0,0) 70%)");
        node.innerHTML = `<div class="icon">${entry.icon || "✦"}</div><div class="label">${entry.label}</div>`;
        node.onclick = () => onSelect(entry.id);
        stage.appendChild(node);
      });

      const hub = document.createElement("div");
      hub.className = "hub";
      hub.innerHTML = `<div class="big">${centerLabel}</div><div class="small">${title}</div>`;
      stage.appendChild(hub);
      return stage;
    }

    function renderCard(item){
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top"></div>
        <div class="card-body">
          <div class="pill">Selected Item</div>
          <h2>${item.title}</h2>
          <p>${item.description}</p>
        </div>
      `;
      return card;
    }

    function render(){
      renderControls();
      const stage = document.getElementById("stage");
      stage.innerHTML = "";
      const cat = selectedCategory();
      const item = selectedItem();

      if(!cat){
        stage.appendChild(renderWheel("Choose a Path", "Categories", DATA.categories, (id) => {
          state.categoryId = id;
          state.itemId = null;
          render();
        }));
      } else if(!item){
        stage.appendChild(renderWheel("Choose an Item", cat.label, cat.items.map(i => ({...i, glow: cat.glow})), (id) => {
          state.itemId = id;
          render();
        }));
      } else {
        stage.appendChild(renderCard(item));
      }
    }

    makeDebris();
    render();
    addEventListener("resize", render);
  </script>
</body>
</html>
