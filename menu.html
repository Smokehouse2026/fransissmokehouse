<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — The Francis Smokehouse</title>
<meta name="description" content="Full menu for The Francis Smokehouse & Specialty Meats. BBQ plates, po-boys, burgers, fried chicken, sides and desserts. St. Francisville, LA.">
<link rel="icon" type="image/png" href="Images/Smokehouselogo.png">
<meta name="theme-color" content="#2d3436">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Permanent+Marker&family=Barlow+Condensed:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --slate:#3b4547;
  --slate-dark:#2e3638;
  --board:#354042;
  --chalk:#d4d0c8;
  --chalk-dim:rgba(212,208,200,.55);
  --chalk-faint:rgba(212,208,200,.25);
  --green:#6ddb7a;
  --pink:#e87cb0;
  --yellow:#e8d44d;
  --cyan:#5ec4d4;
  --orange:#e8943a;
  --white-bright:#eceae4;
  --chalk-hand:'Caveat',cursive;
  --chalk-block:'Permanent Marker',cursive;
  --chalk-cond:'Barlow Condensed',sans-serif;
  --chalk-serif:'Playfair Display',Georgia,serif;
  --frame:#c8ccc8;
}
html{scroll-behavior:smooth;background:#1a1e1f}
body{
  min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(12px,2vw,32px);
  background:#1a1e1f;
}

/* ── THE BOARD ── */
#board{
  position:relative;width:100%;max-width:1200px;
  background:var(--board);border-radius:4px;
  padding:clamp(24px,4vw,56px) clamp(20px,4vw,52px);
  box-shadow:
    inset 0 2px 12px rgba(0,0,0,.35),
    inset 0 -2px 8px rgba(0,0,0,.2),
    0 0 0 clamp(6px,1vw,12px) var(--frame),
    0 0 0 clamp(8px,1.2vw,15px) #a8aca8,
    0 8px 40px rgba(0,0,0,.5),
    0 2px 10px rgba(0,0,0,.3);
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E"),
    radial-gradient(ellipse at 20% 15%, rgba(212,208,200,.03) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 40%, rgba(212,208,200,.02) 0%, transparent 40%),
    radial-gradient(ellipse at 40% 80%, rgba(212,208,200,.025) 0%, transparent 45%),
    linear-gradient(175deg, #3d4849 0%, #354042 30%, #313b3d 60%, #2e3638 100%);
}
#board::before{
  content:'';position:absolute;inset:0;border-radius:4px;
  pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 12% 8%, rgba(255,255,255,.12) 50%, transparent 50%),
    radial-gradient(1px 1px at 45% 22%, rgba(255,255,255,.08) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 78% 15%, rgba(255,255,255,.1) 50%, transparent 50%),
    radial-gradient(1px 1px at 23% 45%, rgba(255,255,255,.07) 50%, transparent 50%),
    radial-gradient(1px 1px at 67% 55%, rgba(255,255,255,.09) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 34% 72%, rgba(255,255,255,.06) 50%, transparent 50%),
    radial-gradient(1px 1px at 88% 68%, rgba(255,255,255,.1) 50%, transparent 50%),
    radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,.08) 50%, transparent 50%),
    radial-gradient(1px 1px at 8% 92%, rgba(255,255,255,.07) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 92% 35%, rgba(255,255,255,.06) 50%, transparent 50%);
}
#board>*{position:relative;z-index:1}

.back-home{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--chalk-cond);font-weight:500;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--chalk-faint);text-decoration:none;
  transition:color .3s;margin-bottom:16px;
}
.back-home:hover{color:var(--chalk)}
.back-home::before{content:'←';font-size:13px}

/* ── HEADER ── */
#board-header{
  text-align:center;
  padding-bottom:clamp(16px,2.5vh,28px);
  margin-bottom:clamp(12px,2vh,20px);
  border-bottom:2px solid var(--chalk-faint);
}
.logo-the{
  font-family:var(--chalk-cond);font-weight:600;
  font-size:clamp(14px,1.8vw,20px);letter-spacing:.35em;
  text-transform:uppercase;color:var(--chalk);display:block;margin-bottom:2px;
}
.logo-francis{
  font-family:var(--chalk-serif);font-weight:900;
  font-size:clamp(38px,7vw,72px);letter-spacing:.03em;
  text-transform:uppercase;color:var(--white-bright);
  line-height:.9;display:block;
  text-shadow:1px 1px 0 rgba(0,0,0,.3),0 0 8px rgba(212,208,200,.08);
}
.logo-sub{
  font-family:var(--chalk-cond);font-weight:500;
  font-size:clamp(10px,1.4vw,15px);letter-spacing:.4em;
  text-transform:uppercase;color:var(--chalk-dim);margin-top:6px;display:block;
}
.logo-info{
  font-family:var(--chalk-hand);font-weight:400;
  font-size:clamp(14px,1.6vw,18px);color:var(--chalk-dim);margin-top:8px;
}

/* ── SPECIAL ── */
#special-box{
  display:none;border:2px solid var(--orange);border-radius:2px;
  padding:clamp(14px,2vw,22px);margin-bottom:clamp(18px,2.5vh,28px);
  background:rgba(232,148,58,.04);
  animation:specialGlow 3s ease-in-out infinite;
}
#special-box.show{display:block}
@keyframes specialGlow{0%,100%{box-shadow:inset 0 0 20px rgba(232,148,58,.03)}50%{box-shadow:inset 0 0 30px rgba(232,148,58,.07)}}
.special-label{
  font-family:var(--chalk-cond);font-weight:800;
  font-size:clamp(14px,2vw,20px);letter-spacing:.15em;
  text-transform:uppercase;color:var(--yellow);text-align:center;margin-bottom:8px;
}
.special-title{
  font-family:var(--chalk-hand);font-weight:700;
  font-size:clamp(26px,4vw,42px);color:var(--white-bright);
  text-align:center;line-height:1.1;
}
.special-price-tag{
  font-family:var(--chalk-block);
  font-size:clamp(22px,3.5vw,36px);color:var(--green);
  text-align:center;margin-top:4px;
  text-shadow:0 0 10px rgba(109,219,122,.12);
}
.special-desc{
  font-family:var(--chalk-hand);font-weight:400;
  font-size:clamp(15px,1.8vw,20px);color:var(--chalk-dim);
  text-align:center;margin-top:6px;line-height:1.4;
}

/* ── GRID ── */
#menu-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:clamp(16px,2.5vw,36px);
}
@media(max-width:900px){#menu-grid{grid-template-columns:1fr 1fr}}
@media(max-width:580px){#menu-grid{grid-template-columns:1fr}}

/* ── SECTION ── */
.chalk-section{margin-bottom:clamp(8px,1.5vh,16px);opacity:0;animation:chalkIn .5s ease forwards}
@keyframes chalkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chalk-section:nth-child(1){animation-delay:.05s}
.chalk-section:nth-child(2){animation-delay:.1s}
.chalk-section:nth-child(3){animation-delay:.15s}
.chalk-section:nth-child(4){animation-delay:.2s}
.chalk-section:nth-child(5){animation-delay:.25s}
.chalk-section:nth-child(6){animation-delay:.3s}
.chalk-section:nth-child(7){animation-delay:.35s}
.chalk-section:nth-child(8){animation-delay:.4s}

.sec-head{
  text-align:center;padding-bottom:6px;
  margin-bottom:clamp(6px,1vh,12px);
  border-bottom:2px solid var(--chalk-faint);position:relative;
}
.sec-head::before{
  content:'';display:block;width:100%;height:2px;
  background:var(--chalk-faint);margin-bottom:8px;
}
.sec-title{
  font-family:var(--chalk-cond);font-weight:800;
  font-size:clamp(16px,2.2vw,22px);letter-spacing:.18em;
  text-transform:uppercase;color:var(--white-bright);
  text-shadow:1px 1px 0 rgba(0,0,0,.25);line-height:1.2;
}
.sec-subtitle{
  font-family:var(--chalk-cond);font-weight:400;
  font-size:clamp(10px,1.1vw,13px);letter-spacing:.08em;
  text-transform:uppercase;color:var(--chalk-dim);margin-top:2px;
}
.sec-note{
  font-family:var(--chalk-hand);font-weight:400;
  font-size:clamp(13px,1.3vw,16px);color:var(--orange);
  text-align:center;margin-bottom:8px;font-style:italic;
}

/* ── Items ── */
.ch-item{display:flex;align-items:baseline;padding:clamp(3px,.5vh,5px) 0;gap:6px}
.ch-bullet{color:var(--chalk-dim);font-size:8px;flex-shrink:0;margin-top:2px;line-height:1}
.ch-name{
  font-family:var(--chalk-cond);font-weight:500;
  font-size:clamp(13px,1.3vw,16px);letter-spacing:.04em;
  text-transform:uppercase;color:var(--chalk);flex:1;line-height:1.3;
}
.ch-price{
  font-family:var(--chalk-cond);font-weight:700;
  font-size:clamp(13px,1.3vw,16px);white-space:nowrap;flex-shrink:0;letter-spacing:.02em;
}
.ch-free{
  font-family:var(--chalk-cond);font-weight:400;
  font-size:clamp(11px,1.1vw,13px);color:var(--chalk-dim);letter-spacing:.06em;
}

/* Price colors */
.price-green{color:var(--green);text-shadow:0 0 8px rgba(109,219,122,.1)}
.price-pink{color:var(--pink);text-shadow:0 0 8px rgba(232,124,176,.1)}
.price-yellow{color:var(--yellow);text-shadow:0 0 8px rgba(232,212,77,.1)}
.price-cyan{color:var(--cyan);text-shadow:0 0 8px rgba(94,196,212,.1)}
.price-orange{color:var(--orange);text-shadow:0 0 8px rgba(232,148,58,.1)}
.price-white{color:var(--chalk)}

/* Section title color variants */
.title-yellow .sec-title{color:var(--yellow)}
.title-pink .sec-title{color:var(--pink)}
.title-cyan .sec-title{color:var(--cyan)}
.title-green .sec-title{color:var(--green)}
.title-orange .sec-title{color:var(--orange)}

/* Multi-column */
.col-head{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.col-head-spacer{flex:1}
.col-label{
  font-family:var(--chalk-cond);font-weight:700;
  font-size:clamp(10px,1.1vw,13px);letter-spacing:.08em;
  text-transform:uppercase;width:clamp(44px,6vw,60px);text-align:right;
}
.col-row{display:flex;align-items:baseline;padding:clamp(3px,.4vh,5px) 0}
.col-row .ch-name{flex:1}
.col-val{
  font-family:var(--chalk-cond);font-weight:600;
  font-size:clamp(12px,1.2vw,15px);width:clamp(44px,6vw,60px);text-align:right;
}

/* Additions grid */
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(10px,1.5vw,18px)}
@media(max-width:580px){.add-grid{grid-template-columns:1fr}}

/* ── FOOTER ── */
#board-footer{
  margin-top:clamp(16px,2.5vh,28px);padding-top:clamp(12px,2vh,20px);
  border-top:2px solid var(--chalk-faint);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;
}
.board-foot-left{
  font-family:var(--chalk-hand);font-weight:400;
  font-size:clamp(14px,1.5vw,18px);color:var(--chalk-dim);line-height:1.5;
}
.board-foot-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cash-note{
  font-family:var(--chalk-hand);font-weight:600;
  font-size:clamp(14px,1.6vw,19px);color:var(--yellow);text-align:right;
}
.board-social{
  font-family:var(--chalk-hand);font-weight:500;
  font-size:clamp(16px,2vw,22px);color:var(--cyan);
  text-decoration:none;transition:color .3s;
}
.board-social:hover{color:var(--white-bright)}

.outer-footer{
  text-align:center;padding:clamp(16px,2.5vh,28px) 20px;
  color:rgba(212,208,200,.2);font-family:var(--chalk-cond);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
}
.outer-footer a{color:rgba(212,208,200,.3);text-decoration:none}
.outer-footer a:hover{color:#fff}
</style>
</head>
<body>

<div id="board">
  <a class="back-home" href="index.html">Home</a>
  <div id="board-header">
    <span class="logo-the">The</span>
    <span class="logo-francis">Francis</span>
    <span class="logo-sub">Smokehouse & Specialty Meats</span>
    <div class="logo-info" id="logo-info"></div>
  </div>
  <div id="special-box">
    <div class="special-label" id="sp-label">— Special of the Day —</div>
    <div class="special-title" id="sp-name"></div>
    <div class="special-price-tag" id="sp-price"></div>
    <div class="special-desc" id="sp-desc"></div>
  </div>
  <div id="menu-grid"></div>
  <div id="board-footer">
    <div class="board-foot-left" id="board-foot-info"></div>
    <div class="board-foot-right">
      <a class="board-social" href="#" id="fb-link">Find us on Facebook</a>
      <div class="cash-note" id="cash-note"></div>
    </div>
  </div>
</div>
<div class="outer-footer"><a href="index.html">© 2025 The Francis Smokehouse & Specialty Meats</a></div>

<script src="site-data.js"></script>
<script>
var COLOR_MAP = {
  bbq_plates:         { price:'price-green',  title:'' },
  burgers_sandwiches: { price:'price-pink',   title:'' },
  fried_chicken:      { price:'price-cyan',   title:'title-cyan' },
  chicken_liver:      { price:'price-orange',  title:'title-orange' },
  salads:             { price:'price-pink',   title:'title-pink' },
  sides:              { price:'price-green',  title:'title-yellow' },
  combos:             { price:'price-yellow', title:'title-yellow' },
  by_the_pound:       { price:'price-green',  title:'' },
  additions:          { price:'price-white',  title:'title-orange' },
  sauces:             { price:'price-green',  title:'' },
  desserts:           { price:'price-pink',   title:'title-yellow' }
};
var COL_LEFT = ['bbq_plates','sides','combos'];
var COL_MID  = ['burgers_sandwiches','additions'];
var COL_RIGHT= ['fried_chicken','chicken_liver','salads','by_the_pound','sauces','desserts'];

var $=function(id){return document.getElementById(id)};
var fmt=function(n){if(n===null||n===undefined)return'';if(n===0)return'';return'$'+n.toFixed(2)};

if(typeof SITE_INFO!=='undefined'){
  $('logo-info').textContent=SITE_INFO.hours.weekday+' · '+SITE_INFO.hours.sunday+' · '+SITE_INFO.phone;
  $('board-foot-info').innerHTML=SITE_INFO.address+'<br>'+SITE_INFO.city+', '+SITE_INFO.state+' '+SITE_INFO.zip+'<br>'+SITE_INFO.phone;
  if(SITE_INFO.cash_discount)$('cash-note').textContent=SITE_INFO.cash_discount;
  if(SITE_INFO.social&&SITE_INFO.social.facebook)$('fb-link').href=SITE_INFO.social.facebook;
}

(function(){
  if(typeof SITE_SPECIAL==='undefined'&&typeof SITE_SPECIALS==='undefined')return;
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  var today=todayStr(),item=null;
  if(typeof SITE_SPECIAL!=='undefined'&&SITE_SPECIAL&&!SITE_SPECIAL.hidden){
    if(!SITE_SPECIAL.date||SITE_SPECIAL.date===today)item=SITE_SPECIAL;
  }
  if(!item&&typeof SITE_SPECIALS!=='undefined'&&Array.isArray(SITE_SPECIALS)){
    for(var i=0;i<SITE_SPECIALS.length;i++){var s=SITE_SPECIALS[i];if(s&&!s.hidden&&(!s.date||s.date===today)){item=s;break}}
  }
  if(item&&item.name){
    $('sp-label').textContent='— '+(item.type||'Special of the Day')+' —';
    $('sp-name').textContent=item.name;
    $('sp-price').textContent=item.price||'';
    $('sp-desc').textContent=item.desc||'';
    $('special-box').classList.add('show');
  }
})();

function buildSection(key){
  if(typeof MENU==='undefined')return'';
  var sec=MENU[key];if(!sec)return'';
  var cm=COLOR_MAP[key]||{price:'price-white',title:''};
  var h='';
  h+='<div class="chalk-section '+cm.title+'">';
  h+='<div class="sec-head">';
  h+='<div class="sec-title">'+sec.title+'</div>';
  if(sec.subtitle)h+='<div class="sec-subtitle">'+sec.subtitle+'</div>';
  h+='</div>';
  if(sec.note)h+='<div class="sec-note">'+sec.note+'</div>';

  if(sec.columns&&sec.items[0]&&sec.items[0].prices){
    var colKeys=sec.columns.map(function(c){return c.toLowerCase()});
    h+='<div class="col-head"><span class="col-head-spacer"></span>';
    sec.columns.forEach(function(col){h+='<span class="col-label '+cm.price+'">'+col+'</span>'});
    h+='</div>';
    sec.items.forEach(function(item){
      h+='<div class="col-row"><span class="ch-bullet">•</span><span class="ch-name">'+item.name+'</span>';
      colKeys.forEach(function(k){var p=item.prices[k];h+='<span class="col-val '+cm.price+'">'+(p!=null?fmt(p):'—')+'</span>'});
      h+='</div>';
    });
  } else if(key==='additions'){
    h+='<div class="add-grid">';
    sec.items.forEach(function(item){
      h+='<div class="ch-item"><span class="ch-bullet">•</span><span class="ch-name">'+item.name+'</span>';
      if(item.note==='Free'||item.price===0)h+='<span class="ch-free">—</span>';
      else h+='<span class="ch-price '+cm.price+'">'+fmt(item.price)+'</span>';
      h+='</div>';
    });
    h+='</div>';
  } else {
    sec.items.forEach(function(item){
      h+='<div class="ch-item"><span class="ch-bullet">•</span><span class="ch-name">'+item.name+'</span>';
      if(item.price===null)h+='<span class="ch-free">Ask</span>';
      else if(item.note==='Free')h+='<span class="ch-free">—</span>';
      else h+='<span class="ch-price '+cm.price+'">'+fmt(item.price)+'</span>';
      h+='</div>';
    });
  }
  h+='</div>';
  return h;
}

var leftHTML='',midHTML='',rightHTML='';
COL_LEFT.forEach(function(k){leftHTML+=buildSection(k)});
COL_MID.forEach(function(k){midHTML+=buildSection(k)});
COL_RIGHT.forEach(function(k){rightHTML+=buildSection(k)});

function render(){
  var w=window.innerWidth;
  if(w<=580){
    $('menu-grid').innerHTML=leftHTML+midHTML+rightHTML;
  } else {
    $('menu-grid').innerHTML=
      '<div class="grid-col">'+leftHTML+'</div>'+
      '<div class="grid-col">'+midHTML+'</div>'+
      '<div class="grid-col">'+rightHTML+'</div>';
  }
}
render();
var lastBp=window.innerWidth<=580?1:window.innerWidth<=900?2:3;
window.addEventListener('resize',function(){
  var bp=window.innerWidth<=580?1:window.innerWidth<=900?2:3;
  if(bp!==lastBp){lastBp=bp;render()}
});
</script>
</body>
</html>
