<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <meta name="description" content="Clean daily menu" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f2eb;--paper:#fffdf9;--ink:#1f1a17;--muted:#6d655f;--line:#e6ddd3;--accent:#8f4a28;--accent-soft:#f4e6dc;--shadow:0 10px 30px rgba(31,26,23,.08);--radius:22px}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    body{padding:24px 14px 80px}.wrap{max-width:960px;margin:0 auto}
    .hero{background:linear-gradient(180deg,#fffdf9,#faf5ef);border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:var(--shadow);text-align:center;margin-bottom:18px}
    h1{font-size:clamp(28px,4vw,42px);line-height:1.05;letter-spacing:-.03em;margin-bottom:10px}
    .sub{color:var(--muted);font-size:15px;line-height:1.6;max-width:720px;margin:0 auto}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 20px}
    .tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 16px;border-radius:999px;font-weight:700;cursor:pointer;transition:.18s ease}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .panel[hidden]{display:none!important}.day-header{text-align:center;margin-bottom:18px}.day-title{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.03em}
    .hours,.status,.note{margin-top:8px;color:var(--muted);line-height:1.6}.status{display:inline-block;padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 12;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    @media(min-width:760px){.card.half{grid-column:span 6}}
    .card h3{font-size:20px;margin-bottom:6px;letter-spacing:-.02em}.card .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800;margin-bottom:10px}
    .list{list-style:none;display:grid;gap:10px;margin-top:10px}.list li{padding:12px 13px;border-radius:16px;background:#faf7f2;border:1px solid #efe7de;line-height:1.5}
    details summary{cursor:pointer;font-weight:700;list-style:none}details summary::-webkit-details-marker{display:none}.desc{margin-top:8px;color:var(--muted);font-size:14px}
    .empty{text-align:center;color:var(--muted);padding:20px;background:#faf7f2;border:1px dashed var(--line);border-radius:18px}.special{background:linear-gradient(180deg,#fff8f2,#fff);border-color:#edd8ca}
    .special-badge{display:inline-block;margin-bottom:10px;background:var(--accent);color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1 id="siteTitle">Menu</h1>
      <p class="sub">A clean, simple menu that reads from <strong>menu-data.html</strong>.</p>
    </section>

    <nav class="tabs" aria-label="Menu tabs">
      <button class="tab active" data-panel="todayPanel">Today</button>
      <button class="tab" data-panel="tomorrowPanel">Tomorrow</button>
      <button class="tab" data-panel="specialPanel">Daily Special</button>
    </nav>

    <section id="todayPanel" class="panel">
      <div class="day-header">
        <div class="day-title" id="todayTitle">Today</div>
        <div class="hours" id="todayHours"></div>
        <div class="status" id="todayStatus"></div>
        <div class="note" id="todayNote"></div>
      </div>
      <div class="grid" id="todayGrid"></div>
    </section>

    <section id="tomorrowPanel" class="panel" hidden>
      <div class="day-header">
        <div class="day-title" id="tomorrowTitle">Tomorrow</div>
        <div class="hours" id="tomorrowHours"></div>
        <div class="status" id="tomorrowStatus"></div>
        <div class="note" id="tomorrowNote"></div>
      </div>
      <div class="grid" id="tomorrowGrid"></div>
    </section>

    <section id="specialPanel" class="panel" hidden>
      <div class="day-header">
        <div class="day-title">Daily Special</div>
        <div class="hours" id="specialDate"></div>
      </div>
      <div class="grid">
        <div class="card special" id="specialCard"></div>
      </div>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    function escapeHtml(str){return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
    function toISODateLocal(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
    function formatDateNice(d){return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
    function parseISODateLocal(iso){const [y,m,d]=String(iso).split("-").map(Number);return new Date(y,(m||1)-1,d||1)}
    function normalizeDateKey(key){const m=String(key||"").trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)return null;return `${m[1]}-${String(Number(m[2])).padStart(2,"0")}-${String(Number(m[3])).padStart(2,"0")}`}
    function normalizeItems(arr){return Array.isArray(arr)?arr.map(x=>String(x||"").trim()).filter(Boolean):[]}
    function normalizeLunchItems(arr){const items=Array.isArray(arr)?arr:[];return items.map(raw=>{if(raw&&typeof raw==="object"){return {name:String(raw.name||"").trim(),desc:String(raw.desc||"").trim()}}const s=String(raw||"").trim();if(!s)return null;return {name:s,desc:""}}).filter(Boolean).filter(x=>x.name)}
    function parseTimeToMinutes(timeStr){if(!timeStr)return null;const m=String(timeStr).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return null;let h=parseInt(m[1],10);const min=parseInt(m[2],10);const ap=m[3].toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;return h*60+min}
    function getBusinessHours(dayName){const lower=String(dayName||"").toLowerCase();const open=lower==="sunday"?"7:00 AM":(lower==="saturday"?"6:00 AM":"5:30 AM");const close=lower==="sunday"?"3:00 PM":"2:00 PM";return {open,close,breakfast:`${open} - 10:30 AM`,lunch:`11:00 AM - ${close}`,crawfish:["thursday","friday","saturday"].includes(lower)?"4:00 PM - 8:00 PM":""}}
    function getServiceStatus(dayName,isoDate){const todayISO=toISODateLocal(new Date());if(isoDate!==todayISO)return `${dayName} schedule`;const h=getBusinessHours(dayName);const now=new Date();const mins=now.getHours()*60+now.getMinutes();const open=parseTimeToMinutes(h.open);const breakfastEnd=10*60+30;const lunchStart=11*60;const close=parseTimeToMinutes(h.close);if(open!=null&&mins<open)return `Closed • Opens at ${h.open}`;if(mins<breakfastEnd)return "Breakfast is being served";if(mins<lunchStart)return "Breakfast is over • Lunch starts at 11:00 AM";if(close!=null&&mins<=close)return "Lunch is being served";return "Closed for today"}
    function getClosure(data,dayName){const c=data?.closures||{};const key=Object.keys(c).find(k=>k.toLowerCase()===String(dayName||"").toLowerCase());return key?c[key]:null}
    function getMenuByDate(data,isoDate){return (data?.menus||{})[isoDate]||null}
    async function fetchHtml(url){const res=await fetch(url,{credentials:"same-origin",cache:"no-store"});if(!res.ok)throw new Error(`Fetch failed ${res.status} at ${url}`);return await res.text()}
    function extractJsonFromHtml(html,label){const doc=new DOMParser().parseFromString(html,"text/html");const script=doc.querySelector("#hh-menu-data");if(!script)throw new Error(`No #hh-menu-data found on ${label}`);const raw=(script.textContent||"").trim();if(!raw)throw new Error(`#hh-menu-data is empty on ${label}`);return JSON.parse(raw)}
    async function readData(){const urls=["menu-data.html","./menu-data.html","/menu-data.html"];let lastErr=null;for(const url of urls){try{const html=await fetchHtml(url);const data=extractJsonFromHtml(html,url);const rawMenus=data?.menus||{};const normalizedMenus={};Object.keys(rawMenus).forEach(k=>{const nk=normalizeDateKey(k);if(nk)normalizedMenus[nk]=rawMenus[k]});data.menus=normalizedMenus;return data}catch(e){lastErr=e}}throw lastErr||new Error("Menu data could not be read from menu-data.html.")}
    function card(title,body,cls="half"){return `<section class="card ${cls}"><div class="eyebrow">Menu Section</div><h3>${escapeHtml(title)}</h3>${body}</section>`}
    function simpleList(items){if(!items.length)return '<div class="empty">Nothing posted yet.</div>';return `<ul class="list">${items.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>`}
    function detailsList(items,fallback){if(!items.length)return '<div class="empty">Nothing posted yet.</div>';return `<ul class="list">${items.map(it=>{if(typeof it==="string")return `<li>${escapeHtml(it)}</li>`;return `<li><details><summary>${escapeHtml(it.name)}</summary><div class="desc">${escapeHtml(it.desc||fallback)}</div></details></li>`}).join("")}</ul>`}
    function renderMenuGrid(el,data,isoDate){const menu=getMenuByDate(data,isoDate)||{};const defaults=data?.defaults||{};const breakfastPlates=normalizeItems(menu.breakfast?.plates??defaults.breakfast?.plates??[]);const breakfastItems=normalizeItems(menu.breakfast?.items??defaults.breakfast?.items??[]);const lunchPlates=normalizeItems(menu.lunch?.plates??defaults.lunch?.plates??[]);const lunchItems=normalizeLunchItems(menu.lunch?.items??defaults.lunch?.items??[]);const drinks=normalizeItems(menu.drinks?.items??defaults.drinks?.items??[]);const desserts=normalizeItems(menu.dessert?.items??defaults.dessert?.items??[]);const saladPricing=normalizeItems(menu.salad?.items??defaults.salad?.items??[]);const lettuce=normalizeItems(menu.salad?.saladBar?.lettuce??defaults.salad?.saladBar?.lettuce??[]);const toppings=normalizeItems(menu.salad?.saladBar?.toppings??defaults.salad?.saladBar?.toppings??[]);const dressing=normalizeItems(menu.salad?.saladBar?.dressing??defaults.salad?.saladBar?.dressing??[]);const crawfishItems=normalizeItems(menu.crawfish?.items??defaults.crawfish?.items??[]);const showCrawfish=menu.crawfish?.show===false?false:crawfishItems.length>0;el.innerHTML=[card("Breakfast Plates",simpleList(breakfastPlates)),card("Breakfast Items",simpleList(breakfastItems)),card("Lunch Plates",simpleList(lunchPlates)),card("Lunch Items",detailsList(lunchItems,data?.settings?.noDescriptionText||"No description for this item.")),card("Drinks",simpleList(drinks)),card("Dessert",simpleList(desserts)),card("Salad Pricing",simpleList(saladPricing)),card("Salad Bar",[lettuce.length?`<div class="section-label">Lettuce</div>${simpleList(lettuce)}`:"",toppings.length?`<div class="section-label">Toppings</div>${simpleList(toppings)}`:"",dressing.length?`<div class="section-label">Dressing</div>${simpleList(dressing)}`:""].join(""),"card"),showCrawfish?card("Crawfish",simpleList(crawfishItems)):""].join("")}
    function renderSpecial(data,isoDate,dayName){const el=$("specialCard");const menu=getMenuByDate(data,isoDate)||{};const lunch=menu?.lunch||{};const title=String(lunch.specialTitle??menu?.specialTitle??"").trim();const desc=String(lunch.specialDesc??menu?.specialDesc??"").trim();const plates=normalizeItems(lunch.plates||[]);const items=normalizeLunchItems(lunch.items||[]);const closure=getClosure(data,dayName);$("specialDate").textContent=`${dayName} • ${formatDateNice(parseISODateLocal(isoDate))}`;if(closure?.closed){el.innerHTML=`<div class="special-badge">Closed</div><div class="empty">${escapeHtml(closure.message||"Closed for the day.")}</div>`;return}if(!title&&!desc&&!plates.length&&!items.length){el.innerHTML='<div class="special-badge">No Special Posted</div><div class="empty">There is no daily special set for this date yet.</div>';return}el.innerHTML=`<div class="special-badge">Daily Special</div><h3 style="font-size:28px;margin-bottom:8px;">${escapeHtml(title||dayName+" Special")}</h3>${desc?`<p class="subline" style="margin-bottom:14px;">${escapeHtml(desc)}</p>`:""}${plates.length?`<div class="section-label">Plates</div>${simpleList(plates)}`:""}${items.length?`<div class="section-label">Included Items</div>${detailsList(items,data?.settings?.noDescriptionText||"No description for this item.")}`:""}`}
    function setupTabs(){const tabs=Array.from(document.querySelectorAll(".tab"));tabs.forEach(tab=>{tab.addEventListener("click",()=>{tabs.forEach(t=>t.classList.toggle("active",t===tab));document.querySelectorAll(".panel").forEach(panel=>{panel.hidden=panel.id!==tab.dataset.panel})})})}
    (async function init(){try{setupTabs();const data=await readData();$("siteTitle").textContent=document.title.replace(/\s[–-].*$/,"")||"Menu";const now=new Date();const todayISO=toISODateLocal(now);const tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);const tomorrowISO=toISODateLocal(tomorrow);const todayDate=parseISODateLocal(todayISO);const tomorrowDate=parseISODateLocal(tomorrowISO);const todayName=todayDate.toLocaleDateString("en-US",{weekday:"long"});const tomorrowName=tomorrowDate.toLocaleDateString("en-US",{weekday:"long"});const todayHours=getBusinessHours(todayName);const tomorrowHours=getBusinessHours(tomorrowName);$("todayTitle").textContent=formatDateNice(todayDate);$("tomorrowTitle").textContent=formatDateNice(tomorrowDate);$("todayHours").textContent=`Hours: ${todayHours.open} – ${todayHours.close} • Breakfast ${todayHours.breakfast} • Lunch ${todayHours.lunch}${todayHours.crawfish?` • Crawfish ${todayHours.crawfish}`:""}`;$("tomorrowHours").textContent=`Hours: ${tomorrowHours.open} – ${tomorrowHours.close} • Breakfast ${tomorrowHours.breakfast} • Lunch ${tomorrowHours.lunch}${tomorrowHours.crawfish?` • Crawfish ${tomorrowHours.crawfish}`:""}`;$("todayStatus").textContent=getServiceStatus(todayName,todayISO);$("tomorrowStatus").textContent=getServiceStatus(tomorrowName,tomorrowISO);$("todayNote").textContent=data?.hours?.note||"";$("tomorrowNote").textContent=data?.hours?.note||"";renderMenuGrid($("todayGrid"),data,todayISO);renderMenuGrid($("tomorrowGrid"),data,tomorrowISO);renderSpecial(data,todayISO,todayName)}catch(e){console.error(e);document.body.innerHTML=`<div style="max-width:760px;margin:40px auto;padding:24px;border-radius:20px;background:#fff;border:1px solid #e6ddd3;font-family:Inter,sans-serif;"><h2 style="margin-bottom:8px;">Menu couldn’t load</h2><p style="color:#6d655f;">${escapeHtml(String(e?.message||e))}</p></div>`}})();
  </script>
</body>
</html>
