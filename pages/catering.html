<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --void:#090704;--deep:#120d07;--coal:#1a1108;
  --ember:#d45200;--fire:#ed6e14;--flame:#ff9930;--glow:#ffc24a;
  --cream:#faedd2;--parch:#e8d4a8;--sand:#c4a070;--mid:#7a5830;
  --serif:'Playfair Display',Georgia,serif;
  --cond:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
}
html{scroll-behavior:smooth;}
body{background:var(--void);color:var(--cream);font-family:var(--body);overflow-x:hidden;cursor:none;-webkit-tap-highlight-color:transparent;}
@media(hover:none){body{cursor:auto;}}

body::before{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.042'/%3E%3C/svg%3E");}

#cv-bg,#cv-smoke,#cv-ember{position:fixed;inset:0;pointer-events:none;}
#cv-bg{z-index:0;}#cv-smoke{z-index:1;}#cv-ember{z-index:2;}
#vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,transparent 30%,rgba(9,7,4,.7) 100%);}

#cursor{position:fixed;z-index:9999;pointer-events:none;top:0;left:0;}
#c-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--flame);
  transform:translate(-50%,-50%);box-shadow:0 0 8px var(--flame),0 0 16px rgba(255,153,48,.25);
  animation:cursor-breathe 2.5s ease-in-out infinite;}
@keyframes cursor-breathe{0%,100%{box-shadow:0 0 6px var(--flame),0 0 12px rgba(255,153,48,.2)}50%{box-shadow:0 0 12px var(--flame),0 0 24px rgba(255,153,48,.4)}}
@media(hover:none){#cursor{display:none;}}

/* HEADER */
#hdr{position:sticky;top:0;z-index:500;display:flex;align-items:center;justify-content:space-between;
  padding:clamp(12px,1.8vh,18px) clamp(20px,5vw,60px);
  background:rgba(9,7,4,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(196,160,112,.09);}
#hdr-brand{font-family:var(--serif);font-weight:700;font-size:clamp(14px,2vw,22px);
  letter-spacing:.01em;color:var(--cream);text-decoration:none;text-shadow:0 0 30px rgba(255,153,48,.15);}
#hdr-brand em{font-style:italic;font-weight:400;color:var(--flame);}
.hdr-sub{font-family:var(--cond);font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:rgba(196,160,112,.45);margin-top:2px;}
#back-btn{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(196,160,112,.68);border:1px solid rgba(196,160,112,.32);
  padding:7px 16px;border-radius:2px;background:none;cursor:none;-webkit-tap-highlight-color:transparent;
  transition:all .3s;text-decoration:none;}
#back-btn:hover{border-color:rgba(255,153,48,.45);color:var(--flame);}

/* ══════════════════════
   HERO
══════════════════════ */
#hero{
  position:relative;z-index:10;
  min-height:90vh;
  display:grid;
  grid-template-columns:1fr;
  align-items:end;
  padding:clamp(60px,10vh,100px) clamp(24px,8vw,120px);
  overflow:hidden;
}
@media(min-width:768px){#hero{grid-template-columns:1fr 1fr;align-items:center;gap:60px;}}

#hero-ghost{
  position:absolute;right:-5%;bottom:0;
  font-family:var(--cond);font-weight:800;
  font-size:clamp(100px,18vw,240px);
  letter-spacing:-.06em;line-height:1;
  color:rgba(212,82,0,.04);pointer-events:none;
  user-select:none;white-space:nowrap;
}

#hero-left{position:relative;z-index:2;}
#hero-eyebrow{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.4em;
  text-transform:uppercase;color:var(--flame);opacity:.75;margin-bottom:clamp(14px,2.5vh,24px);
  display:flex;align-items:center;gap:12px;
  opacity:0;animation:fadeU .7s .3s ease forwards;}
#hero-eyebrow::before{content:'';width:28px;height:1px;background:currentColor;}
#hero-title{font-family:var(--serif);font-weight:900;
  font-size:clamp(44px,9vw,110px);letter-spacing:-.03em;line-height:.92;color:var(--cream);
  text-shadow:0 4px 80px rgba(0,0,0,.9);
  opacity:0;animation:fadeU .8s .5s ease forwards;}
#hero-title em{font-style:italic;font-weight:300;color:var(--flame);display:block;font-size:.65em;}
#hero-rule{width:clamp(50px,8vw,100px);height:2px;
  background:linear-gradient(90deg,var(--ember),var(--flame),transparent);
  margin:clamp(20px,3.5vh,36px) 0;
  opacity:0;animation:fadeU .7s .7s ease forwards;}
#hero-lead{font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(15px,1.7vw,21px);line-height:1.65;color:rgba(196,160,112,.78);max-width:500px;
  opacity:0;animation:fadeU .7s .9s ease forwards;}

/* hero right — contact card */
#hero-right{
  position:relative;z-index:2;
  background:rgba(22,12,4,.85);
  border:1px solid rgba(212,82,0,.3);
  border-radius:8px;
  padding:clamp(24px,4vh,40px) clamp(20px,3vw,36px);
  box-shadow:0 8px 48px rgba(212,82,0,.18),inset 0 1px 0 rgba(255,153,48,.08);
  opacity:0;animation:fadeU .8s 1.1s ease forwards;
  margin-top:clamp(32px,5vh,0px);
}
.hc-label{font-family:var(--cond);font-weight:700;font-size:8px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--flame);opacity:.75;margin-bottom:clamp(14px,2.5vh,20px);
  display:flex;align-items:center;gap:10px;}
.hc-label::before{content:'';width:18px;height:1px;background:currentColor;}
.hc-title{font-family:var(--serif);font-weight:900;font-size:clamp(20px,2.5vw,30px);
  letter-spacing:-.01em;color:var(--cream);margin-bottom:clamp(6px,1.2vh,10px);}
.hc-sub{font-family:var(--body);font-weight:300;font-size:clamp(12px,1.2vw,14px);
  line-height:1.65;color:rgba(196,160,112,.72);margin-bottom:clamp(18px,3vh,28px);}
.hc-contact-row{display:flex;flex-direction:column;gap:10px;margin-bottom:clamp(18px,3vh,26px);}
.hc-row{display:flex;align-items:center;gap:12px;}
.hc-icon{font-size:16px;filter:drop-shadow(0 0 5px rgba(255,153,48,.3));flex-shrink:0;}
.hc-info{display:flex;flex-direction:column;gap:1px;}
.hc-info-label{font-family:var(--cond);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,160,112,.48);}
.hc-info-val{font-family:var(--cond);font-weight:600;font-size:clamp(12px,1.3vw,14px);letter-spacing:.04em;color:rgba(232,212,176,.75);}
.btn-fire{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;text-decoration:none;
  background:linear-gradient(90deg,var(--ember),var(--fire),var(--flame));
  padding:14px 24px;border-radius:2px;border:none;cursor:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 6px 28px rgba(212,82,0,.4);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,letter-spacing .3s;}
.btn-fire:hover,.btn-fire:active{transform:scale(1.04);box-shadow:0 10px 40px rgba(212,82,0,.55);letter-spacing:.26em;}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(196,160,112,.78);text-decoration:none;
  border:1px solid rgba(196,160,112,.34);padding:13px 24px;border-radius:2px;margin-top:8px;
  transition:all .3s;cursor:none;-webkit-tap-highlight-color:transparent;}
.btn-ghost:hover,.btn-ghost:active{border-color:rgba(255,153,48,.4);color:var(--flame);}

/* ══════════════════════
   SECTIONS
══════════════════════ */
#main{position:relative;z-index:10;}

/* section wrap */
.section{
  padding:clamp(60px,10vh,100px) clamp(24px,8vw,120px);
  border-top:1px solid rgba(196,160,112,.07);
  position:relative;overflow:hidden;
}
.section::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(212,82,0,.05),transparent 65%);
}
.sec-inner{max-width:1100px;margin:0 auto;}

.sec-eyebrow{font-family:var(--cond);font-weight:600;font-size:9px;letter-spacing:.35em;
  text-transform:uppercase;color:var(--flame);opacity:.75;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;}
.sec-eyebrow::before{content:'';width:20px;height:1px;background:currentColor;}
.sec-title{font-family:var(--serif);font-weight:900;
  font-size:clamp(28px,5vw,56px);letter-spacing:-.02em;line-height:1;
  color:var(--cream);margin-bottom:clamp(8px,1.5vh,14px);}
.sec-title em{font-style:italic;font-weight:300;color:var(--flame);}
.sec-sub{font-family:var(--body);font-weight:300;font-size:clamp(14px,1.4vw,17px);
  line-height:1.8;color:rgba(196,160,112,.78);max-width:640px;
  margin-bottom:clamp(28px,4.5vh,44px);}
.sec-sub strong{color:var(--parch);font-weight:400;}

/* ── WHAT WE OFFER GRID ── */
.offer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));
  gap:clamp(10px,1.5vw,16px);}
.offer-card{
  background:rgba(22,14,6,.75);border:1px solid rgba(196,160,112,.1);
  border-radius:8px;padding:clamp(18px,2.8vh,28px);
  display:flex;flex-direction:column;gap:10px;
  transition:border-color .35s,transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s;
  position:relative;overflow:hidden;
}
.offer-card::before{content:'';position:absolute;inset:0;border-radius:8px;
  background:radial-gradient(ellipse at 30% 100%,rgba(212,82,0,.08),transparent 60%);
  opacity:0;transition:opacity .4s;pointer-events:none;}
.offer-card:hover{border-color:rgba(255,153,48,.22);transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(212,82,0,.16);}
.offer-card:hover::before{opacity:1;}
.oc-icon{font-size:clamp(26px,3.5vw,36px);filter:drop-shadow(0 0 8px rgba(255,153,48,.3));}
.oc-title{font-family:var(--serif);font-weight:700;font-size:clamp(16px,1.8vw,21px);color:var(--cream);}
.oc-desc{font-family:var(--body);font-weight:300;font-size:clamp(12px,1.1vw,14px);
  line-height:1.65;color:rgba(196,160,112,.7);flex:1;}
.oc-tag{font-family:var(--cond);font-weight:700;font-size:8px;letter-spacing:.15em;
  text-transform:uppercase;padding:3px 10px;border-radius:2px;
  background:rgba(255,153,48,.1);color:var(--flame);border:1px solid rgba(255,153,48,.2);
  align-self:flex-start;}

/* ── MENU OPTIONS ── */
.menu-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));
  gap:clamp(8px,1.2vw,14px);}
.mo-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:clamp(12px,1.8vh,18px);
  background:rgba(18,10,4,.7);border:1px solid rgba(196,160,112,.09);border-radius:6px;
  transition:border-color .3s,background .3s;
}
.mo-item:hover{border-color:rgba(255,153,48,.18);background:rgba(26,14,6,.8);}
.mo-dot{width:6px;height:6px;border-radius:50%;background:var(--ember);
  box-shadow:0 0 6px var(--ember);flex-shrink:0;margin-top:6px;}
.mo-text{display:flex;flex-direction:column;gap:3px;}
.mo-name{font-family:var(--serif);font-weight:700;font-size:clamp(14px,1.5vw,17px);color:rgba(232,212,176,.88);}
.mo-desc{font-family:var(--body);font-weight:300;font-size:clamp(11px,1.1vw,13px);color:rgba(196,160,112,.65);line-height:1.5;}

/* ── HOW IT WORKS STEPS ── */
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));
  gap:clamp(8px,1.2vw,14px);}
.step-item{
  display:flex;flex-direction:column;gap:10px;
  padding:clamp(18px,2.8vh,26px);
  background:rgba(22,14,6,.7);border:1px solid rgba(196,160,112,.1);border-radius:8px;
  position:relative;
  transition:border-color .3s;
}
.step-item:hover{border-color:rgba(255,153,48,.2);}
.step-num{font-family:var(--cond);font-weight:800;font-size:clamp(42px,6vw,64px);
  letter-spacing:-.04em;line-height:1;color:rgba(212,82,0,.15);transition:color .4s;}
.step-item:hover .step-num{color:rgba(255,153,48,.22);}
.step-title{font-family:var(--serif);font-weight:700;font-size:clamp(16px,1.7vw,20px);color:var(--cream);}
.step-desc{font-family:var(--body);font-weight:300;font-size:clamp(12px,1.1vw,14px);
  line-height:1.65;color:rgba(196,160,112,.7);}
/* connector line desktop */
.step-item:not(:last-child)::after{
  content:'→';position:absolute;right:-18px;top:50%;transform:translateY(-50%);
  font-size:16px;color:rgba(212,82,0,.22);
}
@media(max-width:767px){.step-item::after{display:none;}}

/* ── TESTIMONIALS ── */
.testimonials{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));
  gap:clamp(10px,1.5vw,16px);}
.t-card{background:rgba(22,14,6,.7);border:1px solid rgba(196,160,112,.1);border-radius:8px;
  padding:clamp(18px,2.8vh,26px);display:flex;flex-direction:column;gap:12px;
  transition:border-color .35s,transform .35s cubic-bezier(.16,1,.3,1);}
.t-card:hover{border-color:rgba(255,153,48,.2);transform:translateY(-3px);}
.t-stars{color:var(--glow);font-size:12px;letter-spacing:.06em;}
.t-quote{font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(13px,1.3vw,15px);line-height:1.65;color:rgba(196,160,112,.82);flex:1;}
.t-quote::before{content:'\201C';font-size:1.3em;color:var(--ember);line-height:0;vertical-align:-.15em;margin-right:1px;}
.t-quote::after{content:'\201D';font-size:1.3em;color:var(--ember);line-height:0;vertical-align:-.15em;margin-left:1px;}
.t-src{font-family:var(--cond);font-weight:600;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(196,160,112,.45);padding-top:8px;
  border-top:1px solid rgba(196,160,112,.07);}

/* ── BIG CONTACT SECTION ── */
#contact-section{
  position:relative;z-index:10;
  padding:clamp(60px,10vh,100px) clamp(24px,8vw,120px);
  border-top:1px solid rgba(196,160,112,.07);
  text-align:center;
}
#contact-section::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(212,82,0,.09),transparent 65%);}
.ct-title{font-family:var(--serif);font-weight:900;
  font-size:clamp(36px,7vw,80px);letter-spacing:-.03em;line-height:.92;
  color:var(--cream);margin-bottom:clamp(12px,2vh,20px);position:relative;z-index:1;}
.ct-title em{font-style:italic;font-weight:300;color:var(--flame);}
.ct-sub{font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(14px,1.6vw,20px);color:rgba(196,160,112,.65);
  margin-bottom:clamp(28px,4.5vh,48px);position:relative;z-index:1;}
.contact-cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:clamp(28px,4vh,40px);position:relative;z-index:1;}
.cc{display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(22,14,6,.75);border:1px solid rgba(196,160,112,.1);
  border-radius:8px;padding:clamp(18px,2.8vh,28px) clamp(20px,3vw,36px);
  min-width:clamp(160px,20vw,220px);
  transition:border-color .35s,transform .3s cubic-bezier(.16,1,.3,1);}
.cc:hover{border-color:rgba(255,153,48,.25);transform:translateY(-3px);}
.cc-icon{font-size:clamp(24px,3vw,32px);filter:drop-shadow(0 0 8px rgba(255,153,48,.3));}
.cc-label{font-family:var(--cond);font-weight:700;font-size:8px;letter-spacing:.25em;
  text-transform:uppercase;color:rgba(196,160,112,.5);}
.cc-val{font-family:var(--cond);font-weight:600;font-size:clamp(13px,1.4vw,16px);
  letter-spacing:.04em;color:rgba(232,212,176,.75);}
.cc-link{text-decoration:none;cursor:none;}
.cta-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;position:relative;z-index:1;}
.btn-fire-lg{display:inline-flex;align-items:center;gap:10px;
  font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;text-decoration:none;
  background:linear-gradient(90deg,var(--ember),var(--fire),var(--flame));
  padding:16px 36px;border-radius:2px;border:none;cursor:none;-webkit-tap-highlight-color:transparent;

<canvas id="cv-bg"></canvas><canvas id="cv-smoke"></canvas><canvas id="cv-ember"></canvas>

<!-- Page content rendered from Supabase by the script at the bottom -->

  <span class="ftr-t">St. Francisville, LA · (225) 245-5046</span>
</footer>

<script>
/* CANVAS */
const cvBg=document.getElementById('cv-bg'),bx=cvBg.getContext('2d');
const cvSm=document.getElementById('cv-smoke'),sx=cvSm.getContext('2d');
const cvEm=document.getElementById('cv-ember'),ex=cvEm.getContext('2d');
let W=0,H=0;
function rsz(){W=cvBg.width=cvSm.width=cvEm.width=window.innerWidth;H=cvBg.height=cvSm.height=cvEm.height=window.innerHeight;}
rsz();window.addEventListener('resize',rsz);
let bgP=0;
function drawBg(){
  bgP+=.003;const p=.5+.5*Math.sin(bgP);
  const g=bx.createRadialGradient(W*.5,H*.85,0,W*.5,H*.85,W*.9);
  g.addColorStop(0,`rgba(28,16,4,${.8+p*.08})`);g.addColorStop(.35,'rgba(18,12,5,1)');g.addColorStop(1,'rgba(9,7,4,1)');
  bx.fillStyle=g;bx.fillRect(0,0,W,H);
  const g2=bx.createRadialGradient(W*.5,H,0,W*.5,H,W*.55);
  g2.addColorStop(0,`rgba(160,50,0,${.06+p*.04})`);g2.addColorStop(1,'transparent');
  bx.fillStyle=g2;bx.fillRect(0,0,W,H);
}
function mkS(){return{x:.15+Math.random()*.7,y:1.05+Math.random()*.05,vx:(Math.random()-.5)*.0003,vy:-.0006-Math.random()*.0005,r:35+Math.random()*55,a:0,ta:.018+Math.random()*.02,gr:.06+Math.random()*.04,wb:Math.random()*Math.PI*2,ws:.004+Math.random()*.007};}
const SM=Array.from({length:14},mkS);
function drawSmoke(){
  sx.clearRect(0,0,W,H);
  for(const s of SM){
    s.wb+=s.ws;s.x+=s.vx+Math.sin(s.wb)*.00025;s.y+=s.vy;s.r+=s.gr;
    s.a=s.a<s.ta?s.a+.0018:Math.max(0,s.a-.0012);
    if(s.y<-.25||s.a<=0){Object.assign(s,mkS());continue;}
    const g=sx.createRadialGradient(s.x*W,s.y*H,0,s.x*W,s.y*H,s.r);
    g.addColorStop(0,`rgba(90,65,40,${s.a})`);g.addColorStop(.5,`rgba(60,42,25,${s.a*.45})`);g.addColorStop(1,'transparent');
    sx.fillStyle=g;sx.beginPath();sx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);sx.fill();
  }
}
function mkE(){return{x:.1+Math.random()*.8,y:1.02+Math.random()*.04,vx:(Math.random()-.5)*.003,vy:-.004-Math.random()*.008,r:.5+Math.random()*1.6,life:1,decay:.003+Math.random()*.007,h:8+Math.random()*24};}
const EM=Array.from({length:18},mkE);
function drawEmbers(){
  ex.clearRect(0,0,W,H);
  for(let i=0;i<EM.length;i++){
    const e=EM[i];e.x+=e.vx+(Math.random()-.5)*.001;e.y+=e.vy;e.life-=e.decay;
    if(e.life<=0||e.y<-.02){EM[i]=mkE();continue;}
    ex.beginPath();ex.arc(e.x*W,e.y*H,e.r,0,Math.PI*2);
    ex.fillStyle=`hsla(${e.h},100%,${52+e.life*34}%,${e.life*.82})`;
    ex.shadowBlur=8;ex.shadowColor=`hsla(${e.h},100%,58%,${e.life*.5})`;
    ex.fill();ex.shadowBlur=0;
  }
}
(function loop(){drawBg();drawSmoke();drawEmbers();requestAnimationFrame(loop);})();

/* CURSOR */
const cur=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});

/* SCROLL REVEAL */
const IO=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target);}});
},{threshold:.1,rootMargin:'0px 0px -30px 0px'});
document.querySelectorAll('.reveal').forEach(el=>IO.observe(el));

/* STICKY CALL BUTTON — show after user scrolls past hero */
const stickyCall = document.getElementById('sticky-call');
let stickyTicking = false;
function updateStickyCall(){
  if (!stickyCall) return;
  const scrolled = window.scrollY > 400;
  // hide when the big call button at the bottom is in view (no need for sticky too)
  const ctaSection = document.getElementById('cta-section');
  let bigBtnVisible = false;
  if (ctaSection) {
    const rect = ctaSection.getBoundingClientRect();
    bigBtnVisible = rect.top < window.innerHeight - 100 && rect.bottom > 0;
  }
  stickyCall.classList.toggle('show', scrolled && !bigBtnVisible);
}
window.addEventListener('scroll', () => {
  if (!stickyTicking) {
    requestAnimationFrame(() => { updateStickyCall(); stickyTicking = false; });
    stickyTicking = true;
  }
}, {passive: true});
updateStickyCall();

/* BOOT */
window.addEventListener('load',()=>{
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('on')));
});
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   PAGE RENDERER — loads page from Supabase and builds DOM
═══════════════════════════════════════════════════════════ */
const PAGE_ID = 'catering';

function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
/** Convert *word* to <em>word</em> within already-escaped text. */
function emFormat(s){ return escHtml(s).replace(/\*([^*]+)\*/g, '<em>$1</em>'); }

/* ═══════════════════════════════════════════════════════════
   STYLE ENGINE — turns step-based values + colors into CSS vars
═══════════════════════════════════════════════════════════ */
const COLOR_PALETTE = {
  default:  '',                       // no override
  bg:       'var(--void)',
  panel:    'rgba(22,12,4,.85)',
  dark:     '#0a0604',
  text:     'var(--cream)',
  parch:    'var(--parch)',
  sand:     'var(--sand)',
  flame:    'var(--flame)',
  ember:    'var(--ember)',
  glow:     'var(--glow)',
  fire:     'var(--fire)',
  white:    '#ffffff',
  transparent: 'transparent'
};
const SIZE_MAP_TEXT = {
  xs:  'clamp(10px, 0.9vw, 12px)',
  sm:  'clamp(12px, 1.1vw, 14px)',
  md:  'clamp(14px, 1.4vw, 17px)',
  lg:  'clamp(17px, 2vw, 22px)',
  xl:  'clamp(22px, 3vw, 32px)',
  '2xl':'clamp(32px, 5vw, 56px)',
  '3xl':'clamp(44px, 7vw, 80px)',
  '4xl':'clamp(56px, 9vw, 110px)'
};
const PAD_MAP = {
  none:'0', sm:'clamp(20px,3vh,30px)', md:'clamp(40px,6vh,60px)',
  lg:'clamp(60px,10vh,100px)', xl:'clamp(80px,14vh,140px)'
};
const RADIUS_MAP = { none:'0', sm:'4px', md:'8px', lg:'14px', pill:'9999px', circle:'50%' };
const BORDER_MAP = { none:'none', subtle:'1px solid rgba(196,160,112,.18)', strong:'2px solid rgba(196,160,112,.42)' };
const WIDTH_MAP  = { default:'1100px', narrow:'720px', medium:'900px', wide:'1300px', full:'100%' };
const ALIGN_MAP  = { left:'left', center:'center', right:'right' };
const GAP_MAP    = { tight:'8px', normal:'14px', loose:'24px' };

/** Resolve a palette key OR a custom hex/rgba into a CSS color value. */
function resolveColor(v){
  if (!v) return '';
  if (COLOR_PALETTE[v] !== undefined) return COLOR_PALETTE[v];
  return v; // assume raw color value (hex, rgba, etc.)
}

/** Build a CSS variable declaration string from an element style object.
 *  Returns "--fs-text-size:...; --fs-text-color:...;" etc. Used inline on the element. */
function elementStyleVars(style){
  if (!style || typeof style !== 'object') return '';
  const parts = [];
  if (style.size && SIZE_MAP_TEXT[style.size])      parts.push(`--fs-text-size:${SIZE_MAP_TEXT[style.size]}`);
  if (style.color)                                   parts.push(`--fs-text-color:${resolveColor(style.color)}`);
  if (style.align && ALIGN_MAP[style.align])         parts.push(`--fs-text-align:${ALIGN_MAP[style.align]}`);
  if (style.bg)                                      parts.push(`--fs-bg:${resolveColor(style.bg)}`);
  if (style.pad_top   && PAD_MAP[style.pad_top]   !== undefined) parts.push(`--fs-pad-top:${PAD_MAP[style.pad_top]}`);
  if (style.pad_bot   && PAD_MAP[style.pad_bot]   !== undefined) parts.push(`--fs-pad-bot:${PAD_MAP[style.pad_bot]}`);
  if (style.pad_left  && PAD_MAP[style.pad_left]  !== undefined) parts.push(`--fs-pad-left:${PAD_MAP[style.pad_left]}`);
  if (style.pad_right && PAD_MAP[style.pad_right] !== undefined) parts.push(`--fs-pad-right:${PAD_MAP[style.pad_right]}`);
  if (style.radius && RADIUS_MAP[style.radius] !== undefined)   parts.push(`--fs-radius:${RADIUS_MAP[style.radius]}`);
  if (style.border && BORDER_MAP[style.border] !== undefined)   parts.push(`--fs-border:${BORDER_MAP[style.border]}`);
  if (style.max_width && WIDTH_MAP[style.max_width] !== undefined) parts.push(`--fs-max-width:${WIDTH_MAP[style.max_width]}`);
  if (style.gap && GAP_MAP[style.gap] !== undefined)            parts.push(`--fs-gap:${GAP_MAP[style.gap]}`);
  if (style.width_pct)                                          parts.push(`--fs-width:${style.width_pct}%`);
  if (style.height_mode === 'short')      parts.push(`--fs-height:200px`);
  else if (style.height_mode === 'tall')  parts.push(`--fs-height:480px`);
  else if (style.height_mode === 'cover') parts.push(`--fs-height:100vh`);
  return parts.length ? parts.join(';') + ';' : '';
}

/** Inject the CSS that makes the --fs-* variables actually do something. Idempotent. */
function injectStyleEngineCss(){
  if (document.getElementById('fs-style-engine-css')) return;
  const css = `
  [data-style-id]{
    font-size:var(--fs-text-size,inherit);
    color:var(--fs-text-color,inherit);
    text-align:var(--fs-text-align,inherit);
    background:var(--fs-bg,transparent);
    padding-top:var(--fs-pad-top,0);
    padding-bottom:var(--fs-pad-bot,0);
    padding-left:var(--fs-pad-left,0);
    padding-right:var(--fs-pad-right,0);
    border-radius:var(--fs-radius,inherit);
    border:var(--fs-border,initial);
    width:var(--fs-width,auto);
    max-width:var(--fs-max-width,none);
  }
  /* Section-level styling */
  [data-section-style]{
    background:var(--fs-sec-bg,transparent);
    padding-top:var(--fs-sec-pad-top,clamp(60px,10vh,100px));
    padding-bottom:var(--fs-sec-pad-bot,clamp(60px,10vh,100px));
    background-image:var(--fs-sec-bg-image,none);
    background-size:cover;
    background-position:center;
  }
  [data-section-style] .sec-inner{
    max-width:var(--fs-sec-width,1100px);
  }
  /* Section-style overrides for top-divider visibility */
  [data-section-style][data-divider="off"]{border-top:none !important}
  /* Image element width pct + height mode */
  img[data-style-id]{
    width:var(--fs-width,100%);
    height:var(--fs-height,auto);
    object-fit:cover;
  }
  `;
  const s = document.createElement('style');
  s.id = 'fs-style-engine-css';
  s.textContent = css;
  document.head.appendChild(s);
}

/** Build an attribute string `data-style-id="x" style="--fs-...:..."` for an element.
 *  styles object is the section's element_styles. */
function styleAttrs(key, styles){
  const s = styles?.[key];
  const styleStr = elementStyleVars(s);
  return `data-style-id="${key}"${styleStr ? ` style="${styleStr}"` : ''}`;
}

/** Build the section-level style string for the outer <section> element. */
function sectionStyleAttrs(sectionStyle){
  if (!sectionStyle || typeof sectionStyle !== 'object') return 'data-section-style';
  const parts = [];
  if (sectionStyle.bg)        parts.push(`--fs-sec-bg:${resolveColor(sectionStyle.bg)}`);
  if (sectionStyle.bg_image)  parts.push(`--fs-sec-bg-image:url('${String(sectionStyle.bg_image).replace(/'/g,"\\'")}')`);
  if (sectionStyle.padding_top    && PAD_MAP[sectionStyle.padding_top]    !== undefined) parts.push(`--fs-sec-pad-top:${PAD_MAP[sectionStyle.padding_top]}`);
  if (sectionStyle.padding_bottom && PAD_MAP[sectionStyle.padding_bottom] !== undefined) parts.push(`--fs-sec-pad-bot:${PAD_MAP[sectionStyle.padding_bottom]}`);
  if (sectionStyle.width      && WIDTH_MAP[sectionStyle.width]   !== undefined) parts.push(`--fs-sec-width:${WIDTH_MAP[sectionStyle.width]}`);
  const styleStr = parts.length ? ` style="${parts.join(';')}"` : '';
  const divider = sectionStyle.divider_top === false ? ' data-divider="off"' : '';
  return `data-section-style${divider}${styleStr}`;
}

/* ─── Section wrapper — applies section_style to outer <section> ─── */
function renderSection(s, biz){
  const fn = SECTION_RENDERERS[s.type];
  if (!fn) return '';
  // Pass element_styles via __styles on the props (avoids changing renderer signature)
  const propsWithStyles = { ...(s.props || {}), __styles: s.element_styles || {} };
  let html = '';
  try { html = fn(propsWithStyles, biz); } catch(e) { console.error(e); return ''; }
  // Inject section_style attributes onto the outer <section>
  const sa = sectionStyleAttrs(s.section_style);
  html = html.replace(/^(\s*<section)/, `$1 ${sa}`);
  return html;
}

async function renderPage(){
  const root = document.getElementById('page-root');
  if (!root) return;
  let page, biz;
  try {
    [page, biz] = await Promise.all([
      typeof loadPage === 'function' ? loadPage(PAGE_ID) : { sections: [] },
      typeof loadBusiness === 'function' ? loadBusiness() : null
    ]);
  } catch(e) {
    console.error('renderPage failed:', e);
    return;
  }
  const sections = (page.sections || []).filter(s => !s.hidden);
  root.innerHTML = sections.map(s => renderSection(s, biz)).join('');

  if (biz?.phone) {
    const sc = document.getElementById('sticky-call');
    if (sc) sc.href = 'tel:' + biz.phone.replace(/[^0-9+]/g,'');
  }
  if (typeof IntersectionObserver !== 'undefined') {
    const fade = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }});
    }, { threshold: .1, rootMargin: '0px 0px -30px 0px' });
    document.querySelectorAll('.reveal:not(.in)').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) el.classList.add('in');
      else fade.observe(el);
    });
  } else {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  }
}

/* ═══════════════════════════════════════════════════════════
   EDIT MODE — activated via ?edit=1 URL param
   When active: sections become clickable, text becomes editable,
   "+" buttons appear between sections. Talks to the parent editor
   via window.postMessage.
═══════════════════════════════════════════════════════════ */
const IS_EDIT = new URLSearchParams(location.search).get('edit') === '1';

function postToParent(type, payload){
  if (!window.parent || window.parent === window) return;
  try { window.parent.postMessage({ source: 'fs-page-editor', type, payload }, '*'); } catch {}
}

function setupEditMode(){
  // Tag each rendered section with its id from PG_LAST_DATA, in the same order.
  // We render ALL sections in edit mode (hidden ones are just dimmed) so the
  // index aligns 1:1 with the data array.
  const sections = PG_LAST_DATA?.sections || [];
  const sectionEls = document.querySelectorAll('#page-root > section');
  sections.forEach((s, i) => {
    const el = sectionEls[i];
    if (!el) return;
    el.setAttribute('data-section-id', s.id);
    el.setAttribute('data-section-type', s.type);
    // Wrap into an editable shell
    el.classList.add('fs-edit-section');
  });

  injectEditChrome();
  wireEditableText();
  wireSectionInteractions();
}

function injectEditChrome(){
  if (document.getElementById('fs-edit-styles')) return;
  const css = `
    body.fs-edit{cursor:auto !important}
    body.fs-edit #cursor,body.fs-edit #sticky-call{display:none !important}
    .fs-edit-section{position:relative;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s}
    body.fs-edit .fs-edit-section:hover{outline-color:rgba(255,153,48,.5)}
    body.fs-edit .fs-edit-section.selected{outline-color:var(--flame);outline-width:3px;outline-offset:-3px}
    [data-edit]{transition:background .15s,outline .15s}
    body.fs-edit [data-edit]{cursor:text;outline:1px dashed transparent;outline-offset:3px;border-radius:3px}
    body.fs-edit [data-edit]:hover{outline-color:rgba(255,194,74,.4);background:rgba(255,153,48,.05)}
    body.fs-edit [data-edit]:focus{outline:2px solid var(--flame);background:rgba(255,153,48,.08);box-shadow:0 0 0 4px rgba(255,153,48,.15)}

    .fs-edit-section.selected .fs-section-toolbar,.fs-edit-section:hover .fs-section-toolbar{opacity:1;pointer-events:auto}

function wireEditableText(){
  document.querySelectorAll('[data-edit]').forEach(el => {
    const field = el.getAttribute('data-edit');
    el.setAttribute('contenteditable', 'plaintext-only');
    el.spellcheck = false;

    // Special handling for multi-line title fields (title_lines)
    const isLines = (field === 'title_lines');
    if (isLines) {
      // Render as plain text with newlines; on save, split by newline
      // Convert the <br> visualisation to actual newlines for editing
      const html = el.innerHTML;
      el.dataset.editLines = '1';
      el.textContent = html
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<em>([^<]+)<\/em>/g, '*$1*')
        .replace(/<[^>]+>/g, '');
    } else {
      // Strip <em>...</em> back to *...* so the user sees the syntax they typed
      const html = el.innerHTML;
      if (html.includes('<em>')) {
        el.textContent = html.replace(/<em>([^<]+)<\/em>/g, '*$1*').replace(/<[^>]+>/g, '');
        el.dataset.hasEm = '1';
      }
    }

    el.addEventListener('focus', () => {
      const sec = el.closest('.fs-edit-section');
      if (sec) {
        document.querySelectorAll('.fs-edit-section.selected').forEach(s => s.classList.remove('selected'));
        sec.classList.add('selected');
        postToParent('section-selected', { id: sec.dataset.sectionId, type: sec.dataset.sectionType });
      }
      // Also tell parent which specific element is selected, so it can show per-element styling
      document.querySelectorAll('[data-style-id].fs-elem-selected').forEach(e => e.classList.remove('fs-elem-selected'));
      el.classList.add('fs-elem-selected');
      postToParent('element-selected', {
        sectionId: sec?.dataset.sectionId,
        styleId: el.getAttribute('data-style-id') || field
      });
    });

    let saveTimer;
    const commit = () => {
      const sec = el.closest('.fs-edit-section');
      if (!sec) return;
      let value = el.innerText;
      if (isLines) {
        value = value.split(/\n/).map(s => s.trim()).filter(s => s);
      }
      postToParent('field-changed', {
        sectionId: sec.dataset.sectionId,
        field,
        value
      });
    };
    el.addEventListener('input', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(commit, 250);
    });
    el.addEventListener('blur', () => { clearTimeout(saveTimer); commit(); });

    // Enter behavior for non-line fields: prevent newlines
    el.addEventListener('keydown', e => {
      if (!isLines && e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
}

function wireSectionInteractions(){
  document.querySelectorAll('.fs-edit-section').forEach((sec, idx, all) => {
    // Toolbar
    const tb = document.createElement('div');
    tb.className = 'fs-section-toolbar';
    const typeLabel = (sec.dataset.sectionType || '').replace(/_/g,' ');
    tb.innerHTML = `
      <span class="fs-tb-label">${typeLabel}</span>
      <button class="fs-tb-btn" data-act="up"   title="Move up"     ${idx===0?'disabled':''}>↑</button>
      <button class="fs-tb-btn" data-act="down" title="Move down"   ${idx===all.length-1?'disabled':''}>↓</button>
      <button class="fs-tb-btn" data-act="dup"  title="Duplicate">⎘</button>
      <button class="fs-tb-btn" data-act="hide" title="Hide">⊘</button>
      <button class="fs-tb-btn" data-act="props" title="More settings">⚙</button>
      <button class="fs-tb-btn danger" data-act="del" title="Delete">×</button>
    `;
    sec.appendChild(tb);
    tb.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        postToParent('section-action', { id: sec.dataset.sectionId, action: act });
      };
    });

    // Click anywhere on the section selects it
    sec.addEventListener('click', e => {
      // Don't grab editable text clicks
      if (e.target.closest('[data-edit]')) return;
      if (e.target.closest('.fs-tb-btn')) return;
      document.querySelectorAll('.fs-edit-section.selected').forEach(s => s.classList.remove('selected'));
      sec.classList.add('selected');
      postToParent('section-selected', { id: sec.dataset.sectionId, type: sec.dataset.sectionType });
    });
  });

  // Drop zones between sections (and at top + bottom)
  const root = document.getElementById('page-root');
  const sections = Array.from(root.children).filter(c => c.classList.contains('fs-edit-section'));
  sections.forEach((sec, i) => {
    const dz = mkDropZone(i);
    root.insertBefore(dz, sec);
  });
  // Final drop zone after the last section
  root.appendChild(mkDropZone(sections.length));

  // Image element selection — non-text elements with [data-style-id] are clickable
  document.querySelectorAll('img[data-style-id], [data-style-id]:not([data-edit])').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const sec = el.closest('.fs-edit-section');
      if (!sec) return;
      document.querySelectorAll('.fs-edit-section.selected').forEach(s => s.classList.remove('selected'));
      sec.classList.add('selected');
      document.querySelectorAll('[data-style-id].fs-elem-selected').forEach(e => e.classList.remove('fs-elem-selected'));
      el.classList.add('fs-elem-selected');
      postToParent('section-selected', { id: sec.dataset.sectionId, type: sec.dataset.sectionType });
      postToParent('element-selected', {
        sectionId: sec.dataset.sectionId,
        styleId: el.getAttribute('data-style-id')
      });
    });
  });
}

function mkDropZone(index){
  const dz = document.createElement('div');
  dz.className = 'fs-drop-zone';
  dz.innerHTML = `<button class="fs-drop-btn" title="Add section here">+</button>`;
  dz.onclick = () => postToParent('insert-here', { index });
  return dz;
}

/* Listen for messages from the parent editor */
let PG_LAST_DATA = null;
window.addEventListener('message', e => {
  const m = e.data;
  if (!m || m.source !== 'fs-page-editor-parent') return;
  console.log('[edit-iframe] received', m.type, m.payload?.page?.sections?.length, 'sections');
  if (m.type === 'load-page') {
    // Replace the entire page data and re-render
    PG_LAST_DATA = m.payload.page;
    renderFromMessage(m.payload.page, m.payload.business);
  }
});

async function renderFromMessage(page, biz){
  const root = document.getElementById('page-root');
  if (!root) return;
  // In edit mode, render ALL sections including hidden ones, with a "hidden" badge
  const list = page.sections || [];
  root.innerHTML = list.map(s => {
    if (!SECTION_RENDERERS[s.type]) {
      return `<div style="padding:40px;text-align:center;color:#dcbe94;background:rgba(22,12,4,.4);margin:14px 0;border:1px dashed rgba(196,160,112,.25);" class="fs-edit-section" data-section-id="${escHtml(s.id)}" data-section-type="${escHtml(s.type)}">Unknown section type: ${escHtml(s.type)}</div>`;
    }
    let html = renderSection(s, biz);
    if (s.hidden) {
      html = html.replace(/^(\s*<section[^>]*)/, '$1 data-hidden="1"');
    }
    return html;
  }).join('');
  // Mark hidden sections visually
  document.querySelectorAll('[data-hidden="1"]').forEach(el => {
    el.style.opacity = '.4';
    el.style.position = 'relative';
    el.insertAdjacentHTML('afterbegin', '<div style="position:absolute;top:8px;left:8px;background:#1a1108;color:#dcbe94;padding:4px 10px;border:1px solid rgba(220,190,148,.25);border-radius:4px;font-family:var(--cond);font-size:9px;letter-spacing:.2em;text-transform:uppercase;z-index:50">Hidden</div>');
  });
  // Make all .reveal elements visible immediately in edit mode
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  setupEditMode();
  if (biz?.phone) {
    const sc = document.getElementById('sticky-call');
    if (sc) sc.href = 'tel:' + biz.phone.replace(/[^0-9+]/g,'');
  }
}

/* Boot */
injectStyleEngineCss();
injectPageHeaderCss();
injectExtraSectionStyles();
if (IS_EDIT) {
  document.body.classList.add('fs-edit');
  // Show "EDIT MODE" badge
  const badge = document.createElement('div');
  badge.className = 'fs-edit-hidden';
  badge.textContent = 'Edit Mode';
  document.body.appendChild(badge);
  // Notify parent we're ready to receive data
  console.log('[edit-iframe] ready — posting to parent');
  postToParent('ready', { page: PAGE_ID });
} else {
  renderPage();
}
</script>
