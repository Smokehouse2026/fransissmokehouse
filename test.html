<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation System (standalone)</title>
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === root variables (only what the nav needs) === */
    :root {
      --bg: #080606;
      --bg-2: #120d0c;
      --panel: rgba(23,17,16,.64);
      --panel-2: rgba(34,25,23,.68);
      --line: rgba(255,233,209,.09);
      --line-strong: rgba(224,129,93,.34);
      --text: #f8f0e6;
      --muted: #d0b39a;
      --gold: #d7a56d;
      --ember: #b44b3c;
      --ember-2: #e0815d;
      --shadow: 0 28px 80px rgba(0,0,0,.48);
      --serif: 'Playfair Display', serif;
      --sans: 'Montserrat', sans-serif;
      --ease: cubic-bezier(.22,1,.36,1);
      --max: 1360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: linear-gradient(180deg,#090707,#120d0c 35%,#0c0909 100%);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; background: none; border: none; }

    /* === top bar === */
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 1rem 1.25rem;
    }
    .topbar-inner {
      width: min(calc(100% - 4px), 1320px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 0.95rem 1rem;
      border-radius: 30px;
      border: 1px solid rgba(255,233,209,.08);
      background: rgba(12,10,10,.32);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .brand-orb {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, var(--ember), var(--gold), var(--ember-2), var(--ember));
      box-shadow: 0 0 24px rgba(224,129,93,.28);
      position: relative;
    }
    .brand-orb::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #140f0d;
      box-shadow: inset 0 0 12px rgba(224,129,93,.35);
    }
    .brand-copy {
      display: flex; flex-direction: column; line-height: 1;
    }
    .brand-copy strong {
      font-family: var(--serif);
      font-size: 1.2rem;
      letter-spacing: .06em;
    }
    .brand-copy span {
      font-size: .64rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .32em;
      margin-top: .3rem;
    }

    .top-links {
      display: flex;
      justify-content: center;
      gap: .55rem;
      flex-wrap: wrap;
    }
    .top-link {
      padding: .75rem .95rem;
      border-radius: 999px;
      border: 1px solid rgba(255,233,209,.07);
      background: rgba(255,255,255,.03);
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: rgba(248,240,230,.82);
      transition: .22s ease;
      cursor: pointer;
    }
    .top-link:hover {
      background: rgba(180,75,60,.12);
      border-color: rgba(224,129,93,.28);
      transform: translateY(-2px);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .top-phone {
      font-size: .9rem;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      padding: 1rem 1.6rem;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,.03);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .74rem;
      font-weight: 800;
      cursor: pointer;
      transition: .25s ease;
      backdrop-filter: blur(10px);
    }
    .btn:hover {
      transform: translateY(-3px);
      background: rgba(180,75,60,.14);
      box-shadow: 0 16px 30px -20px rgba(180,75,60,.65);
    }
    .btn-primary {
      background: linear-gradient(180deg, rgba(192,88,63,.98), rgba(150,57,44,.98));
      color: #140f0d;
    }
    .btn-primary:hover {
      color: #fff4ea;
      background: linear-gradient(180deg, rgba(220,118,86,.98), rgba(180,75,60,.98));
    }

    /* === floating nav buttons === */
    .nav-btn {
      position: fixed;
      z-index: 1200;
      display: flex;
      align-items: center;
      gap: .7rem;
      background: rgba(30,27,27,.78);
      border: 1px solid rgba(224,129,93,.46);
      color: var(--text);
      box-shadow: 0 0 24px rgba(180,75,60,.32);
      cursor: pointer;
      transition: .25s ease;
      backdrop-filter: blur(10px);
      user-select: none;
    }
    .nav-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 38px rgba(180,75,60,.42);
      border-color: rgba(224,129,93,.7);
    }
    .btn-icon { font-size: 1.4rem; color: var(--ember-2); }
    .btn-text {
      display: flex; flex-direction: column; line-height: 1.12;
    }
    .btn-text .main {
      font-weight: 800;
      font-size: .9rem;
      letter-spacing: .18em;
    }
    .btn-text .sub {
      font-size: .58rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--muted);
      opacity: .8;
    }
    .nav-btn.left-center {
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: column;
      padding: 1rem .55rem;
      border-radius: 999px;
    }
    .nav-btn.left-center .btn-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .nav-btn.left-center .main { letter-spacing: normal; font-size: .8rem; }
    .nav-btn.left-center .sub { margin-top: 4px; }

    .nav-btn.bottom-center {
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: .9rem 1.5rem;
      border-radius: 999px;
    }

    /* === circular menu overlay === */
    .circ-menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .circ-menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .circular-menu {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      position: relative;
      border: 1px solid rgba(224,129,93,.55);
      box-shadow: 0 0 60px rgba(180,75,60,.45);
      background: radial-gradient(circle at center, rgba(180,75,60,.09), rgba(0,0,0,0) 70%);
      transform: scale(.35);
      transition: transform .45s var(--ease);
    }
    .circ-menu-overlay.open .circular-menu {
      transform: scale(1);
    }

    .center-home {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, #fff1de, var(--gold));
      color: #160f0d;
      border: 2px solid var(--ember);
      box-shadow: 0 0 28px rgba(224,129,93,.38);
      cursor: pointer;
      transition: .22s ease;
      z-index: 2;
    }
    .center-home:hover {
      transform: translate(-50%,-50%) scale(1.06);
    }

    .menu-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(22,17,16,.9);
      border: 1px solid rgba(224,129,93,.44);
      color: var(--text);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0,0,0,.65);
      transform:
        translate(-50%,-50%)
        rotate(calc(var(--angle) * 1deg))
        translateY(-132px)
        rotate(calc(var(--angle) * -1deg));
      transition: .22s ease;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .menu-item:hover {
      background: rgba(180,75,60,.94);
      color: #160f0d;
      transform:
        translate(-50%,-50%)
        rotate(calc(var(--angle) * 1deg))
        translateY(-142px)
        rotate(calc(var(--angle) * -1deg))
        scale(1.06);
    }

    /* small responsive adjustments */
    @media (max-width: 860px) {
      .topbar-inner {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .nav-btn.left-center { display: none; }
      .brand, .top-actions { justify-content: center; }
      .top-phone { width: 100%; text-align: center; }
    }
    @media (max-width: 640px) {
      .circular-menu { width: 300px; height: 300px; }
      .menu-item { width: 55px; height: 55px; font-size: .65rem; }
    }

    /* placeholder content to make scrolling possible */
    .dummy-content {
      padding: 200px 20px;
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 3rem;
      line-height: 2;
    }
  </style>
</head>
<body>
  <!-- ========== TOP BAR ========== -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-orb"></div>
        <div class="brand-copy">
          <strong>THE FRANCIS</strong>
          <span>SMOKEHOUSE & MEATS</span>
        </div>
      </div>

      <div class="top-links">
        <button class="top-link js-open-menu">Menu</button>
        <a class="top-link" href="#story">Story</a>
        <a class="top-link" href="#reviews">Reviews</a>
        <a class="top-link" href="#contact">Visit</a>
      </div>

      <div class="top-actions">
        <span class="top-phone"><i class="fas fa-phone-alt"></i> (225) 245-5046</span>
        <button class="btn btn-primary js-open-menu">Smoke Menu</button>
      </div>
    </div>
  </div>

  <!-- ========== FLOATING NAVIGATION BUTTONS ========== -->
  <div class="nav-btn left-center" id="navBtnLeft">
    <i class="fas fa-compass btn-icon"></i>
    <div class="btn-text">
      <span class="main">NAVIGATION</span>
      <span class="sub">explore pages</span>
    </div>
  </div>

  <div class="nav-btn bottom-center" id="navBtnBottom">
    <i class="fas fa-compass btn-icon"></i>
    <div class="btn-text">
      <span class="main">NAVIGATION</span>
      <span class="sub">explore pages</span>
    </div>
  </div>

  <!-- ========== CIRCULAR MENU OVERLAY ========== -->
  <div class="circ-menu-overlay" id="circMenuOverlay">
    <div class="circular-menu">
      <div class="center-home" id="homeCenter" data-link="#"><i class="fas fa-home"></i></div>
      <div class="menu-item" style="--angle: 0;" data-action="menu-layer">Menu</div>
      <div class="menu-item" style="--angle: 60;" data-link="#story">Story</div>
      <div class="menu-item" style="--angle: 120;" data-link="#reviews">Reviews</div>
      <div class="menu-item" style="--angle: 180;" data-link="#contact">Visit</div>
      <div class="menu-item" style="--angle: 240;" data-link="order.html">Order</div>
      <div class="menu-item" style="--angle: 300;" data-link="#contact">Visit</div>
    </div>
  </div>

  <!-- dummy content so you can see scrolling and fixed positioning -->
  <div class="dummy-content">
    <div>↓ scroll down ↓</div>
    <div style="margin-top: 100vh;">↑ scroll up ↑</div>
  </div>

  <script>
    (function() {
      // Get references
      const navBtnLeft = document.getElementById('navBtnLeft');
      const navBtnBottom = document.getElementById('navBtnBottom');
      const circMenuOverlay = document.getElementById('circMenuOverlay');
      const homeCenter = document.getElementById('homeCenter');
      const circleMenuItems = document.querySelectorAll('.menu-item');
      const openButtons = document.querySelectorAll('.js-open-menu');

      // Toggle circular menu
      function toggleCircleNav() {
        circMenuOverlay.classList.toggle('open');
      }

      function closeCircleNav() {
        circMenuOverlay.classList.remove('open');
      }

      // Navigate to link or scroll to section
      function navigateTo(link) {
        if (!link) return;
        if (link === '#') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if (link.startsWith('#')) {
          const target = document.querySelector(link);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          } else {
            // if the target doesn't exist, just scroll to top (or do nothing)
            console.warn('Element not found:', link);
          }
          return;
        }
        // external link
        window.location.href = link;
      }

      // Handle "Menu" action from circular menu (no full menu layer in this demo)
      function handleMenuAction() {
        closeCircleNav();
        alert('Menu layer would open here. (This is a standalone navigation demo.)');
      }

      // Floating buttons
      navBtnLeft.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCircleNav();
      });

      navBtnBottom.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCircleNav();
      });

      // Close overlay when clicking outside
      circMenuOverlay.addEventListener('click', (e) => {
        if (e.target === circMenuOverlay) closeCircleNav();
      });

      // Home button
      homeCenter.addEventListener('click', () => {
        closeCircleNav();
        navigateTo(homeCenter.getAttribute('data-link'));
      });

      // Circular menu items
      circleMenuItems.forEach(item => {
        item.addEventListener('click', () => {
          const action = item.getAttribute('data-action');
          const link = item.getAttribute('data-link');

          if (action === 'menu-layer') {
            handleMenuAction();
            return;
          }

          closeCircleNav();
          navigateTo(link);
        });
      });

      // Top bar buttons that would open the menu layer
      openButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          alert('Menu layer would open here. (Standalone navigation demo.)');
        });
      });

      // Close with Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && circMenuOverlay.classList.contains('open')) {
          closeCircleNav();
        }
      });
    })();
  </script>
</body>
</html>
