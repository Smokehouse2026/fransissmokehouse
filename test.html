<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Navigation (standalone)</title>
  <!-- Font Awesome & Google Fonts (only what the circle uses) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === minimal root variables (only needed for the circle) === */
    :root {
      --text: #f8f0e6;
      --muted: #d0b39a;
      --gold: #d7a56d;
      --ember: #b44b3c;
      --ember-2: #e0815d;
      --ease: cubic-bezier(.22,1,.36,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #090707; /* dark background so the white text is visible */
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    /* === floating nav buttons (the two compasses) === */
    .nav-btn {
      position: fixed;
      z-index: 1200;
      display: flex;
      align-items: center;
      gap: .7rem;
      background: rgba(30,27,27,.78);
      border: 1px solid rgba(224,129,93,.46);
      color: var(--text);
      box-shadow: 0 0 24px rgba(180,75,60,.32);
      cursor: pointer;
      transition: .25s ease;
      backdrop-filter: blur(10px);
      user-select: none;
    }
    .nav-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 38px rgba(180,75,60,.42);
      border-color: rgba(224,129,93,.7);
    }
    .btn-icon { font-size: 1.4rem; color: var(--ember-2); }
    .btn-text {
      display: flex; flex-direction: column; line-height: 1.12;
    }
    .btn-text .main {
      font-weight: 800;
      font-size: .9rem;
      letter-spacing: .18em;
    }
    .btn-text .sub {
      font-size: .58rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--muted);
      opacity: .8;
    }

    /* left button (vertical) */
    .nav-btn.left-center {
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: column;
      padding: 1rem .55rem;
      border-radius: 999px;
    }
    .nav-btn.left-center .btn-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .nav-btn.left-center .main { letter-spacing: normal; font-size: .8rem; }
    .nav-btn.left-center .sub { margin-top: 4px; }

    /* bottom button (horizontal) */
    .nav-btn.bottom-center {
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: .9rem 1.5rem;
      border-radius: 999px;
    }

    /* === circular menu overlay === */
    .circ-menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .circ-menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .circular-menu {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      position: relative;
      border: 1px solid rgba(224,129,93,.55);
      box-shadow: 0 0 60px rgba(180,75,60,.45);
      background: radial-gradient(circle at center, rgba(180,75,60,.09), rgba(0,0,0,0) 70%);
      transform: scale(.35);
      transition: transform .45s var(--ease);
    }
    .circ-menu-overlay.open .circular-menu {
      transform: scale(1);
    }

    .center-home {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, #fff1de, var(--gold));
      color: #160f0d;
      border: 2px solid var(--ember);
      box-shadow: 0 0 28px rgba(224,129,93,.38);
      cursor: pointer;
      transition: .22s ease;
      z-index: 2;
    }
    .center-home:hover {
      transform: translate(-50%,-50%) scale(1.06);
    }

    .menu-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(22,17,16,.9);
      border: 1px solid rgba(224,129,93,.44);
      color: var(--text);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0,0,0,.65);
      transform:
        translate(-50%,-50%)
        rotate(calc(var(--angle) * 1deg))
        translateY(-132px)
        rotate(calc(var(--angle) * -1deg));
      transition: .22s ease;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .menu-item:hover {
      background: rgba(180,75,60,.94);
      color: #160f0d;
      transform:
        translate(-50%,-50%)
        rotate(calc(var(--angle) * 1deg))
        translateY(-142px)
        rotate(calc(var(--angle) * -1deg))
        scale(1.06);
    }

    /* small responsive adjustments */
    @media (max-width: 860px) {
      .nav-btn.left-center { display: none; }
    }
    @media (max-width: 640px) {
      .circular-menu { width: 300px; height: 300px; }
      .menu-item { width: 55px; height: 55px; font-size: .65rem; }
    }

    /* dummy content so you can see scrolling and fixed positioning */
    .dummy {
      height: 200vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.2);
      font-size: 3rem;
    }
  </style>
</head>
<body>
  <!-- ===== TWO FLOATING BUTTONS ===== -->
  <div class="nav-btn left-center" id="navBtnLeft">
    <i class="fas fa-compass btn-icon"></i>
    <div class="btn-text">
      <span class="main">NAVIGATION</span>
      <span class="sub">explore pages</span>
    </div>
  </div>

  <div class="nav-btn bottom-center" id="navBtnBottom">
    <i class="fas fa-compass btn-icon"></i>
    <div class="btn-text">
      <span class="main">NAVIGATION</span>
      <span class="sub">explore pages</span>
    </div>
  </div>

  <!-- ===== CIRCULAR MENU OVERLAY ===== -->
  <div class="circ-menu-overlay" id="circMenuOverlay">
    <div class="circular-menu">
      <div class="center-home" id="homeCenter" data-link="#"><i class="fas fa-home"></i></div>
      <div class="menu-item" style="--angle: 0;" data-action="menu-layer">Menu</div>
      <div class="menu-item" style="--angle: 60;" data-link="#story">Story</div>
      <div class="menu-item" style="--angle: 120;" data-link="#reviews">Reviews</div>
      <div class="menu-item" style="--angle: 180;" data-link="#contact">Visit</div>
      <div class="menu-item" style="--angle: 240;" data-link="order.html">Order</div>
      <div class="menu-item" style="--angle: 300;" data-link="#contact">Visit</div>
    </div>
  </div>

  <!-- dummy tall content to make scrolling possible -->
  <div class="dummy">↓ scroll down & click the compasses ↓</div>

  <script>
    (function() {
      // get references
      const navBtnLeft = document.getElementById('navBtnLeft');
      const navBtnBottom = document.getElementById('navBtnBottom');
      const circMenuOverlay = document.getElementById('circMenuOverlay');
      const homeCenter = document.getElementById('homeCenter');
      const menuItems = document.querySelectorAll('.menu-item');

      // toggle the circular menu
      function toggleCircleNav() {
        circMenuOverlay.classList.toggle('open');
      }

      function closeCircleNav() {
        circMenuOverlay.classList.remove('open');
      }

      // navigate to a link (scroll to section or redirect)
      function navigateTo(link) {
        if (!link) return;
        if (link === '#') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if (link.startsWith('#')) {
          const target = document.querySelector(link);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          } else {
            console.warn('Element not found:', link);
          }
          return;
        }
        // external or relative link
        window.location.href = link;
      }

      // handle "Menu" action – here we just close and alert (no full menu layer in this demo)
      function handleMenuAction() {
        closeCircleNav();
        alert('Menu layer would open. (This is the standalone circle demo.)');
      }

      // add click listeners to floating buttons
      navBtnLeft.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCircleNav();
      });

      navBtnBottom.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCircleNav();
      });

      // close overlay when clicking outside the circular menu
      circMenuOverlay.addEventListener('click', (e) => {
        if (e.target === circMenuOverlay) closeCircleNav();
      });

      // home button
      homeCenter.addEventListener('click', () => {
        closeCircleNav();
        navigateTo(homeCenter.getAttribute('data-link'));
      });

      // circular menu items
      menuItems.forEach(item => {
        item.addEventListener('click', () => {
          const action = item.getAttribute('data-action');
          const link = item.getAttribute('data-link');

          if (action === 'menu-layer') {
            handleMenuAction();
            return;
          }

          closeCircleNav();
          navigateTo(link);
        });
      });

      // close with Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && circMenuOverlay.classList.contains('open')) {
          closeCircleNav();
        }
      });
    })();
  </script>
</body>
</html>
